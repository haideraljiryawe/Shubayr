name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  schema-check:
    name: Validate DB schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shubayr_ci
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Deploy migrations into PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/shubayr_ci?schema=public
        run: npm run prisma:migrate:deploy
      - name: Prove the migrated database matches schema.prisma
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/shubayr_ci?schema=public
        run: npm run prisma:drift-check
      - name: Load RBAC seed
        run: |
          PGPASSWORD=test psql -h localhost -U postgres -d shubayr_ci -v ON_ERROR_STOP=1 -f infra/db/seed_rbac.sql
      - name: Load bootstrap reference into a clean database
        run: |
          PGPASSWORD=test createdb -h localhost -U postgres shubayr_bootstrap
          PGPASSWORD=test psql -h localhost -U postgres -d shubayr_bootstrap -v ON_ERROR_STOP=1 -f infra/db/schema.sql

  detect:
    name: Detect project manifests
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      web: ${{ steps.f.outputs.web }}
      admin: ${{ steps.f.outputs.admin }}
      mobile: ${{ steps.f.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        run: |
          echo "backend=$([ -f backend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "admin=$([ -f admin/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "mobile=$([ -f mobile/pubspec.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/shubayr_ci?schema=public
        run: npx prisma generate
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Test
        working-directory: backend
        run: npm test

  real-data-acceptance:
    name: Real-data acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
      search:
        image: getmeili/meilisearch:v1.9
        env:
          MEILI_MASTER_KEY: masterKey_acceptance
        ports: [ "7700:7700" ]
    env:
      APP_ENV: development
      NODE_ENV: test
      API_PORT: 8000
      DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres?schema=public
      REDIS_URL: redis://localhost:6379
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: masterKey_acceptance
      JWT_SECRET: acceptance_access_secret_at_least_32_chars
      JWT_REFRESH_SECRET: acceptance_refresh_secret_at_least_32_chars
      DEV_OTP: "000000"
      PUBLIC_API_URL: http://localhost:8000/api/v1
      CORS_ORIGINS: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: shubayr-media
      S3_ACCESS_KEY: shubayr
      S3_SECRET_KEY: shubayr_minio_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start S3-compatible object storage
        run: |
          docker run --detach --name shubayr_acceptance_s3 \
            --publish 9000:9000 \
            --env AWS_ACCESS_KEY_ID=shubayr \
            --env AWS_SECRET_ACCESS_KEY=shubayr_minio_secret \
            --env S3_BUCKET=shubayr-media \
            chrislusf/seaweedfs:4.47 mini -dir=/data -s3.port=9000 \
              -master.telemetry=false
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://localhost:9000/ || true)"
            [ "$status" = "403" ] && exit 0
            sleep 1
          done
          docker logs shubayr_acceptance_s3
          exit 1
      - name: Install, generate, and build
        working-directory: backend
        run: |
          npm ci
          npm run prisma:generate
          npm run build
      - name: Prove catalog and COD order real-data acceptance on a disposable database
        working-directory: backend
        # The runner's API writes to the same output, so the file keeps the
        # API's log with the test steps around it.
        run: |
          set -o pipefail
          npm run test:acceptance 2>&1 | tee "$RUNNER_TEMP/acceptance.log"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: acceptance-diagnostics
          path: ${{ runner.temp }}/acceptance.log
          retention-days: 14
          if-no-files-found: ignore

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: web/.nvmrc }
      - name: Node major matches the Dockerfile
        working-directory: web
        run: grep -q "^FROM node:$(cat .nvmrc)-" Dockerfile
      - name: Install & build
        working-directory: web
        env:
          # A production build refuses to run without these (no localhost
          # fallback). The catalog is mocked so the production checks below
          # are hermetic; the image job builds against a real API URL.
          NEXT_PUBLIC_API_URL: https://api.example.test/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3102
          NEXT_PUBLIC_USE_MOCKS: "true"
        run: |
          npm ci
          npm run lint --if-present
          npm run typecheck
          npm run build --if-present
      - name: Generated API types match api/openapi.yaml
        working-directory: web
        run: |
          npm run gen:api
          git diff --exit-code -- src/types/api.d.ts
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Production checks (headers, CSP, SEO, structured data, 404)
        working-directory: web
        run: npm run test:prod
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-prod-playwright
          path: web/test-results
          if-no-files-found: ignore

  # Every hermetic web store suite (playwright.config.ts), each mode in
  # parallel: the default list against mocks, the catalog error pages, the
  # streaming checks and the work/inbox pages against the scripted API.
  web-hermetic:
    name: Web store hermetic (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.web == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [default, errors, streaming, work]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Hermetic suite (${{ matrix.suite }})
        working-directory: web
        env:
          CATALOG_ERROR_TESTS: ${{ matrix.suite == 'errors' && 'true' || '' }}
          CATALOG_STREAMING_TESTS: ${{ matrix.suite == 'streaming' && 'true' || '' }}
          WORK_TESTS: ${{ matrix.suite == 'work' && 'true' || '' }}
        run: npx playwright test --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-hermetic-${{ matrix.suite }}
          path: web/test-results
          if-no-files-found: ignore

  admin:
    name: Web Admin (Next.js)
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.admin == 'true' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shubayr_admin_ci
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: admin/.nvmrc
          cache: npm
          cache-dependency-path: |
            admin/package-lock.json
            backend/package-lock.json
      - name: Node major matches the Dockerfile
        working-directory: admin
        run: grep -q "^FROM node:$(cat .nvmrc)-" Dockerfile
      - name: Install
        working-directory: admin
        run: npm ci
      - name: Lint
        working-directory: admin
        run: npm run lint
      - name: Typecheck
        working-directory: admin
        run: npm run typecheck
      - name: Unit tests
        working-directory: admin
        run: npm test
      - name: Generated API types match api/openapi.yaml
        working-directory: admin
        run: |
          npm run gen:api
          git diff --exit-code -- src/types/api.d.ts
      - name: Build
        working-directory: admin
        run: npm run build
      - name: Start S3-compatible object storage
        run: |
          docker run --detach --name shubayr_admin_s3 --publish 9000:9000 \
            --env AWS_ACCESS_KEY_ID=shubayr \
            --env AWS_SECRET_ACCESS_KEY=shubayr_minio_secret \
            --env S3_BUCKET=shubayr-media \
            chrislusf/seaweedfs:4.47 mini -dir=/data -s3.port=9000 \
              -master.telemetry=false
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://localhost:9000/ || true)"
            [ "$status" = "403" ] && exit 0
            sleep 1
          done
          docker logs shubayr_admin_s3
          exit 1
      - name: Build, migrate, seed and start the API
        working-directory: backend
        env:
          # The API the live suite drives: built from this same commit, migrated
          # and seeded on a disposable database.
          APP_ENV: development
          NODE_ENV: test
          API_PORT: 8000
          DATABASE_URL: postgresql://postgres:test@localhost:5432/shubayr_admin_ci?schema=public
          REDIS_URL: redis://localhost:6379
          MEILI_HOST: http://localhost:7700
          MEILI_MASTER_KEY: masterKey_admin_ci
          JWT_SECRET: admin_ci_access_secret_at_least_32_chars
          # The admin server runs on this runner: the API believes the staff
          # address it forwards (admin/tests/live/forwarding.spec.ts).
          TRUSTED_PROXIES: loopback
          JWT_REFRESH_SECRET: admin_ci_refresh_secret_at_least_32_chars
          DEV_OTP: "000000"
          PUBLIC_API_URL: http://localhost:8000/api/v1
          CORS_ORIGINS: http://localhost:3300
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: shubayr-media
          S3_ACCESS_KEY: shubayr
          S3_SECRET_KEY: shubayr_minio_secret
        run: |
          npm ci
          npm run prisma:generate
          npm run build
          npm run prisma:migrate:deploy
          npm run seed
          nohup node dist/src/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --silent --fail http://localhost:8000/api/v1/settings > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Install Chromium
        working-directory: admin
        run: npx playwright install --with-deps chromium
      - name: Live tests (browser → admin BFF → real API)
        working-directory: admin
        env:
          ADMIN_LIVE_API: http://localhost:8000/api/v1
          # Copied next to the report (test-results/api.log) when the run ends.
          LIVE_API_LOG_FILE: ${{ runner.temp }}/api.log
        run: npm run test:live
      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-live-diagnostics
          # Traces of the failed tests, the report, and the API's log.
          path: |
            admin/test-results
            ${{ runner.temp }}/api.log
          retention-days: 14
          if-no-files-found: ignore

  web-live:
    name: Web store live (browser → real API)
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.web == 'true' && needs.detect.outputs.backend == 'true' }}
    # The store's live suite against an API built from this same commit, so a
    # contract change that breaks the store can't merge green.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shubayr_web_ci
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd="redis-cli ping" --health-interval=10s
          --health-timeout=5s --health-retries=5
      search:
        image: getmeili/meilisearch:v1.9
        env:
          MEILI_MASTER_KEY: masterKey_web_ci
          MEILI_ENV: development
        ports: [ "7700:7700" ]
    env:
      LIVE_API: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            backend/package-lock.json
      - name: Start S3-compatible object storage
        run: |
          docker run --detach --name shubayr_web_s3 --publish 9000:9000 \
            --env AWS_ACCESS_KEY_ID=shubayr \
            --env AWS_SECRET_ACCESS_KEY=shubayr_minio_secret \
            --env S3_BUCKET=shubayr-media \
            chrislusf/seaweedfs:4.47 mini -dir=/data -s3.port=9000 \
              -master.telemetry=false
          for attempt in $(seq 1 30); do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://localhost:9000/ || true)"
            [ "$status" = "403" ] && exit 0
            sleep 1
          done
          docker logs shubayr_web_s3
          exit 1
      - name: Build, migrate, seed and start the API
        working-directory: backend
        env:
          APP_ENV: development
          NODE_ENV: test
          API_PORT: 8000
          DATABASE_URL: postgresql://postgres:test@localhost:5432/shubayr_web_ci?schema=public
          REDIS_URL: redis://localhost:6379
          MEILI_HOST: http://localhost:7700
          MEILI_MASTER_KEY: masterKey_web_ci
          JWT_SECRET: web_ci_access_secret_at_least_32_chars_
          # The workers present themselves as separate clients (X-Forwarded-For,
          # see web/playwright.live.config.ts); trusting this runner lets the
          # per-address rate limit treat them as such.
          TRUSTED_PROXIES: loopback
          JWT_REFRESH_SECRET: web_ci_refresh_secret_at_least_32_chars
          DEV_OTP: "000000"
          PUBLIC_API_URL: http://localhost:8000/api/v1
          CORS_ORIGINS: http://localhost:3100
          S3_ENDPOINT: http://localhost:9000
          S3_REGION: us-east-1
          S3_BUCKET: shubayr-media
          S3_ACCESS_KEY: shubayr
          S3_SECRET_KEY: shubayr_minio_secret
        run: |
          npm ci
          npm run prisma:generate
          npm run build
          npm run prisma:migrate:deploy
          npm run seed
          nohup node dist/src/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            curl --silent --fail http://localhost:8000/api/v1/settings > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Build the store against the live API
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: ${{ env.LIVE_API }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
          NEXT_PUBLIC_USE_MOCKS: "false"
          NEXT_PUBLIC_LIVE_DOMAINS: auth,profile,catalog,banners,cart,checkout,orders,addresses,returns,loyalty,reviews,notifications,wishlist,monitor,deliveries,inbox
          IMAGES_ALLOW_LOCAL_IP: "true"
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Live tests (browser → store → real API)
        working-directory: web
        env:
          PLAYWRIGHT_LIVE_API: ${{ env.LIVE_API }}
          # The test runner stands in for the store's front proxy: the store
          # forwards each worker's address (X-Forwarded-For) on its own API
          # calls, so server renders count against that worker, not the store.
          TRUSTED_FRONT_PROXIES: loopback
          # Copied next to the report (test-results/api.log) when the run ends.
          LIVE_API_LOG_FILE: ${{ runner.temp }}/api.log
        # Four workers, each with its own customer, agent and monitor
        # (web/tests/live-api.ts); store-wide checks run last, alone.
        run: npm run test:live
      - name: API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-live-diagnostics
          # Traces of the failed tests, the report, and the API's log.
          path: |
            web/test-results
            ${{ runner.temp }}/api.log
          retention-days: 14
          if-no-files-found: ignore

  images:
    name: Production images
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.web == 'true' && needs.detect.outputs.admin == 'true' }}
    steps:
      - uses: actions/checkout@v4
      # Google Fonts is unreachable during these builds (both apps self-host
      # Cairo): a build that tried to download a font would fail here.
      - name: Build the web store image
        run: |
          docker build --tag shubayr-web:ci \
            --add-host fonts.googleapis.com:127.0.0.1 --add-host fonts.gstatic.com:127.0.0.1 \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.test/api/v1 \
            --build-arg NEXT_PUBLIC_SITE_URL=https://shop.example.test \
            web
      - name: Build the Web Admin image
        run: |
          docker build --file admin/Dockerfile --target production --tag shubayr-admin:ci \
            --add-host fonts.googleapis.com:127.0.0.1 --add-host fonts.gstatic.com:127.0.0.1 .
      - name: The web image refuses a build without its public URLs
        run: |
          if docker build --target build web > /tmp/refused.log 2>&1; then
            echo "A web build without NEXT_PUBLIC_API_URL/NEXT_PUBLIC_SITE_URL succeeded"; exit 1
          fi
          grep -q "A production build needs" /tmp/refused.log
      - name: Run both images; they become healthy as a non-root user
        run: |
          docker run --detach --name web -p 3000:3000 shubayr-web:ci
          docker run --detach --name admin -p 3200:3200 \
            -e API_URL=https://api.example.test/api/v1 \
            -e ADMIN_ORIGIN=https://admin.example.test shubayr-admin:ci
          for name in web admin; do
            for attempt in $(seq 1 40); do
              status="$(docker inspect --format '{{.State.Health.Status}}' "$name")"
              [ "$status" = "healthy" ] && break
              sleep 3
            done
            echo "$name: $status"
            [ "$status" = "healthy" ] || { docker logs "$name"; exit 1; }
            [ "$(docker exec "$name" id -u)" != "0" ] || { echo "$name runs as root"; exit 1; }
          done
      - name: The images serve the hardened headers
        run: |
          curl --silent --show-error --fail --dump-header /tmp/web.h --output /dev/null http://localhost:3000/robots.txt
          curl --silent --show-error --dump-header /tmp/web-page.h --output /dev/null http://localhost:3000/
          curl --silent --show-error --fail --dump-header /tmp/admin.h --output /dev/null http://localhost:3200/login
          cat /tmp/web-page.h /tmp/admin.h
          grep -qi "^strict-transport-security: max-age" /tmp/web-page.h
          grep -qi "^content-security-policy: .*'nonce-" /tmp/web-page.h
          grep -qi "^x-content-type-options: nosniff" /tmp/web-page.h
          grep -qi "^content-security-policy: .*frame-ancestors 'none'" /tmp/admin.h
          grep -qi "^x-robots-tag: noindex, nofollow" /tmp/admin.h
          grep -qi "^strict-transport-security: max-age" /tmp/admin.h
          curl --silent --fail http://localhost:3000/robots.txt | grep -q "Sitemap: https://shop.example.test/sitemap.xml"
      - name: The admin image refuses to start without its settings
        run: |
          docker run --name admin-unset shubayr-admin:ci > /tmp/unset.log 2>&1 || true
          [ "$(docker inspect --format '{{.State.ExitCode}}' admin-unset)" = "1" ]
          grep -q "API_URL is not set" /tmp/unset.log
      - name: Container logs
        if: failure()
        run: docker logs web; docker logs admin

  # The production kit end to end (docs/deploy/production.md): the stack from
  # docker-compose.prod.yml on a throwaway domain with Caddy's own CA, the
  # first-run bootstrap, the owner's first sign-in and a product with a picture
  # through the Web Admin, the store preview, then a backup restored into a
  # fresh stack and compared.
  production-stack:
    name: Production stack (bootstrap, smoke, backup, restore)
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.backend == 'true' && needs.detect.outputs.web == 'true' && needs.detect.outputs.admin == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Lint the deploy scripts
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 -x -S warning deploy/scripts/*.sh deploy/backup/*.sh
      - name: The compose file is valid with the example settings
        run: docker compose -f docker-compose.prod.yml --env-file .env.production.example --profile tools config --quiet
      - name: Test settings (throwaway domain, Caddy's CA, a local off-server folder)
        run: |
          dir="$RUNNER_TEMP/d3"; mkdir -p "$dir/offsite" "$dir/shots"
          env="$dir/test.env"
          cp .env.production.example "$env"
          set_value() { sed -i "s|^$1=.*|$1=$2|" "$env"; }
          hex() { openssl rand -hex "$1"; }
          set_value SHUBAYR_DOMAIN shubayr.localhost
          set_value ACME_EMAIL ops@shubayr.localhost
          set_value CADDY_TLS "tls internal"
          set_value SHUBAYR_REGISTRY local
          set_value SHUBAYR_TAG ci
          set_value POSTGRES_PASSWORD "$(hex 24)"
          set_value REDIS_PASSWORD "$(hex 24)"
          set_value MEILI_MASTER_KEY "$(hex 24)"
          set_value S3_ACCESS_KEY "shubayr$(hex 4)"
          set_value S3_SECRET_KEY "$(hex 24)"
          set_value JWT_SECRET "$(hex 32)"
          set_value JWT_REFRESH_SECRET "$(hex 32)"
          set_value STORE_PREVIEW_TOKEN "$(hex 24)"
          set_value SMS_GATEWAY_URL https://sms.invalid/otp
          set_value SMS_GATEWAY_TOKEN "$(hex 12)"
          set_value BACKUP_TARGET offsite:/offsite/shubayr-backups
          set_value BACKUP_RCLONE_CONF "$dir/rclone.conf"
          set_value BACKUP_HEARTBEAT_URL http://host.docker.internal:18765/ping
          set_value BACKUP_HEARTBEAT_FAIL_SUFFIX /fail
          echo "OFFSITE_TEST_DIR=$dir/offsite" >> "$env"
          echo "BACKUP_HEARTBEAT_ALLOW_HTTP=true" >> "$env"
          printf '[offsite]\ntype = local\n' > "$dir/rclone.conf"
          python3 -u - <<'PY' > "$dir/heartbeat.log" 2>&1 &
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  print(self.path, flush=True)
                  self.send_response(204)
                  self.end_headers()
              def log_message(self, *args):
                  pass
          HTTPServer(('0.0.0.0', 18765), Handler).serve_forever()
          PY
          echo "HEARTBEAT_LOG=$dir/heartbeat.log" >> "$GITHUB_ENV"
          password="Owner-$(hex 8)-A1!"
          echo "::add-mask::$password"
          {
            echo "SHUBAYR_ENV_FILE=$env"
            echo "SHUBAYR_COMPOSE_EXTRA=deploy/docker-compose.local-test.yml"
            echo "OWNER_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Bootstrap (build the images, migrate, reference data, start)
        run: deploy/scripts/bootstrap.sh --build
      - name: Reference data only, no demo data
        run: |
          source deploy/scripts/lib.sh
          counts="$(dc exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "SELECT (SELECT count(*) FROM users), (SELECT count(*) FROM products), (SELECT count(*) FROM orders), (SELECT count(*) FROM categories), (SELECT count(*) FROM delivery_zones), (SELECT count(*) FROM warehouses), (SELECT count(*) FROM governorates), (SELECT count(*) FROM permission_presets WHERE name = '"'"'super_admin'"'"')"')"
          echo "users|products|orders|categories|zones|warehouses|governorates|super_admin = $counts"
          [ "$counts" = "0|0|0|0|0|0|19|1" ]
      - name: The owner account (and a second run is refused)
        run: |
          deploy/scripts/create-owner.sh --username owner --name "Store owner"
          if deploy/scripts/create-owner.sh --username owner --name "Again" > /tmp/again.log 2>&1; then
            cat /tmp/again.log; echo "a second owner with the same name was accepted"; exit 1
          fi
          cat /tmp/again.log
          grep -q USERNAME_TAKEN /tmp/again.log
      - name: Smoke (HTTPS, first sign-in, product with a picture, store preview)
        working-directory: admin
        run: |
          npm ci
          npx playwright install --with-deps chromium
          preview="$(sed -n 's/^STORE_PREVIEW_TOKEN=//p' "$SHUBAYR_ENV_FILE")"
          node ../deploy/test/smoke.cjs "$PWD/node_modules/playwright" shubayr.localhost owner "$OWNER_PASSWORD" "Owner-Changed-$(openssl rand -hex 6)-B2!" "$preview" "$RUNNER_TEMP/d3/shots"
      - name: www redirects permanently to the bare domain (path and query kept)
        run: |
          set -o pipefail
          resolve=(--resolve www.shubayr.localhost:443:127.0.0.1 --resolve www.shubayr.localhost:80:127.0.0.1)
          headers="$(curl -sk -o /dev/null -D - "${resolve[@]}" 'https://www.shubayr.localhost/privacy?x=1' | tr -d '\r')"
          echo "$headers" | head -n 8
          echo "$headers" | head -n 1 | grep -qE '^HTTP/[0-9.]+ 301'
          echo "$headers" | grep -qix 'location: https://shubayr.localhost/privacy?x=1'
          echo "$headers" | grep -qi '^strict-transport-security: max-age=63072000'
          # Plain http goes to https first, like every other name.
          plain="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "${resolve[@]}" 'http://www.shubayr.localhost/')"
          echo "http: $plain"
          echo "$plain" | grep -qE '^30[18] https://www\.shubayr\.localhost/$'
      - name: Backup, then restore it into a fresh stack and compare
        run: |
          deploy/scripts/test-restore.sh
          grep -q '^/ping$' "$HEARTBEAT_LOG"
          source deploy/scripts/lib.sh
          output="$(dc exec -T \
            -e BACKUP_HEARTBEAT_URL=http://127.0.0.1:1/unreachable \
            -e BACKUP_HEARTBEAT_ALLOW_HTTP=true \
            backup /usr/local/bin/heartbeat.sh success)"
          echo "$output"
          echo "$output" | grep -q 'backup heartbeat failed'
      - name: Only 80 and 443 are published
        run: |
          published="$(docker ps --format '{{.Names}} {{.Ports}}' | grep -E '0\.0\.0\.0:' || true)"
          echo "$published"
          if echo "$published" | grep -v caddy | grep -q .; then echo "a service other than caddy publishes a port"; exit 1; fi
          if echo "$published" | grep -oE '0\.0\.0\.0:[0-9]+' | grep -vE ':(80|443)$'; then echo "a port other than 80/443 is published"; exit 1; fi
      - name: Stack logs
        if: failure()
        run: |
          source deploy/scripts/lib.sh
          dc logs --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-stack-diagnostics
          path: ${{ runner.temp }}/d3/shots
          retention-days: 14
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: |
          source deploy/scripts/lib.sh
          dc down -v --remove-orphans || true

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.mobile == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable' }
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze
      - name: Test Flutter
        working-directory: mobile
        run: flutter test
