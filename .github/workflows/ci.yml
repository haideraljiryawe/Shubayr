name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  schema-check:
    name: Validate DB schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shubayr_ci
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Deploy migrations into PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/shubayr_ci?schema=public
        run: npm run prisma:migrate:deploy
      - name: Load RBAC seed
        run: |
          PGPASSWORD=test psql -h localhost -U postgres -d shubayr_ci -v ON_ERROR_STOP=1 -f infra/db/seed_rbac.sql
      - name: Load bootstrap reference into a clean database
        run: |
          PGPASSWORD=test createdb -h localhost -U postgres shubayr_bootstrap
          PGPASSWORD=test psql -h localhost -U postgres -d shubayr_bootstrap -v ON_ERROR_STOP=1 -f infra/db/schema.sql

  detect:
    name: Detect project manifests
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      web: ${{ steps.f.outputs.web }}
      mobile: ${{ steps.f.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        run: |
          echo "backend=$([ -f backend/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$([ -f web/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "mobile=$([ -f mobile/pubspec.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/shubayr_ci?schema=public
        run: npx prisma generate
      - name: Lint
        working-directory: backend
        run: npm run lint
      - name: Build
        working-directory: backend
        run: npm run build
      - name: Test
        working-directory: backend
        run: npm test

  real-data-acceptance:
    name: Real-data acceptance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shubayr_acceptance
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres" --health-interval=10s
          --health-timeout=5s --health-retries=5
    env:
      APP_ENV: development
      NODE_ENV: test
      API_PORT: 8000
      DATABASE_URL: postgresql://postgres:test@localhost:5432/shubayr_acceptance?schema=public
      REDIS_URL: redis://localhost:6379
      MEILI_HOST: http://localhost:7700
      MEILI_MASTER_KEY: masterKey_acceptance
      JWT_SECRET: acceptance_access_secret_at_least_32_chars
      JWT_REFRESH_SECRET: acceptance_refresh_secret_at_least_32_chars
      DEV_OTP: "000000"
      PUBLIC_API_URL: http://localhost:8000/api/v1
      CORS_ORIGINS: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: shubayr-media
      S3_ACCESS_KEY: shubayr
      S3_SECRET_KEY: shubayr_minio_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start MinIO
        run: |
          docker run --detach --name shubayr_acceptance_minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=shubayr \
            --env MINIO_ROOT_PASSWORD=shubayr_minio_secret \
            quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for attempt in $(seq 1 30); do
            curl --fail --silent http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs shubayr_acceptance_minio
          exit 1
      - name: Install, migrate, seed, and build
        working-directory: backend
        run: |
          npm ci
          npm run prisma:generate
          npm run prisma:migrate:deploy
          npm run seed
          npm run seed
          npm run build
      - name: Prove admin-to-public persistence and RBAC
        working-directory: backend
        run: |
          npm run start:prod > acceptance-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/v1/ready; then
              npm run test:acceptance
              exit $?
            fi
            sleep 1
          done
          cat acceptance-api.log
          exit 1

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install & build
        working-directory: web
        run: |
          npm ci
          npm run lint --if-present
          npm run build --if-present

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.mobile == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: 'stable' }
      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze
      - name: Test Flutter
        working-directory: mobile
        run: flutter test
