name: API contract

on:
  push:
    branches: [ main ]
    paths: [ "api/**" ]
  pull_request:
    paths: [ "api/**" ]

jobs:
  lint-openapi:
    name: Validate openapi.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Validate the OpenAPI contract
        run: |
          pip install openapi-spec-validator pyyaml
          python - <<'PY'
          from openapi_spec_validator import validate
          import yaml
          validate(yaml.safe_load(open('api/openapi.yaml')))
          print("OpenAPI contract is valid.")
          PY

  web-client-contract:
    name: Web API type drift and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Regenerate and reject API type drift
        working-directory: web
        run: |
          npm run gen:api
          git diff --exit-code -- src/types/api.d.ts
      - name: Typecheck web against the contract
        working-directory: web
        run: npm run typecheck

  admin-client-contract:
    name: Admin API type drift and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install admin dependencies
        working-directory: admin
        run: npm ci
      - name: Regenerate and reject API type drift
        working-directory: admin
        run: |
          npm run gen:api
          git diff --exit-code -- src/types/api.d.ts
      - name: Typecheck admin against the contract
        working-directory: admin
        run: npm run typecheck
