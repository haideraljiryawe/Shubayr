# =====================================================================
# Shubayr — Local development stack
# Run:  docker compose up -d
# Services: PostgreSQL, Redis, Meilisearch, Adminer (DB UI), Mailpit,
#           and the NestJS API (once backend/ is scaffolded).
# =====================================================================
name: shubayr

services:
  db:
    image: postgres:16-alpine
    container_name: shubayr_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-shubayr}
      POSTGRES_USER: ${DB_USERNAME:-shubayr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shubayr_secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shubayr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shubayr_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  search:
    image: getmeili/meilisearch:v1.9
    container_name: shubayr_search
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey_dev_only}
      MEILI_ENV: development
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - search_data:/meili_data

  # Keep the legacy service, volume, port, and .env names so existing local
  # S3 endpoints and developer configuration continue to work unchanged.
  minio:
    image: chrislusf/seaweedfs:4.47
    container_name: shubayr_minio
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -s3.port=9000
      - -master.port=9001
      - -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-shubayr}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-shubayr_minio_secret}
      S3_BUCKET: ${S3_BUCKET:-shubayr-media}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:9000/ 2>&1 | grep -q '403 Forbidden'"]
      interval: 5s
      timeout: 5s
      retries: 12

  adminer:
    image: adminer:4
    container_name: shubayr_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit:latest
    container_name: shubayr_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP

  # ------------------------------------------------------------------
  # API — enabled once the NestJS project exists in ./backend
  # (Codex scaffolds it using prompts/BACKEND_CODEX.md). Until then
  # this service will fail to build; that is expected. Comment it out
  # if you want to run only the infrastructure first.
  # ------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: shubayr_api
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      search:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 8000
      DATABASE_URL: postgresql://${DB_USERNAME:-shubayr}:${DB_PASSWORD:-shubayr_secret}@db:5432/${DB_DATABASE:-shubayr}?schema=public
      REDIS_URL: redis://redis:6379
      MEILI_HOST: http://search:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey_dev_only}
      JWT_SECRET: ${JWT_SECRET:-development_access_secret_change_me_123456}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development_refresh_secret_change_me_12345}
      DEV_OTP: ${DEV_OTP:-000000}
      PUBLIC_API_URL: http://localhost:${API_PORT:-8000}/api/v1
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3100}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-shubayr-media}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-shubayr}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-shubayr_minio_secret}
    env_file:
      - path: ./backend/.env
        required: false
    profiles: ["full"]   # start with:  docker compose --profile full up -d

volumes:
  db_data:
  redis_data:
  search_data:
  minio_data:
