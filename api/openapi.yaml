              { type: string, minLength: 3, maxLength: 500 }
            items:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [return_item_id, approved_quantity]
                properties:
                  return_item_id: { type: string, format: uuid }
                  approved_quantity:
                    { type: number, multipleOf: 0.001, minimum: 0 }

