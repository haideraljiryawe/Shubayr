        action: { $ref: "#/components/schemas/BannerAction" }
        is_default: { type: boolean }
        default_priority: { type: integer, minimum: 0 }
        sort_order: { type: integer }
        is_active: { type: boolean }
        effective_status: { type: string, enum: [active, scheduled, expired, disabled], description: "Computed from server time; disabled takes precedence, then scheduled, expired, active." }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    AdminBanner:
      type: object
