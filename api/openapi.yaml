openapi: 3.1.0
info:
  title: Shubayr API
  version: 1.1.0
  description: >
    REST/JSON API contract for Shubayr — an online multi-section store
    (single-owner, white-label). This document is the SHARED CONTRACT between
    the backend (NestJS) and the clients (Next.js web, Flutter mobile/admin).
    It must stay in sync with infra/db/schema.sql. Changing an endpoint's shape
    is a reviewed PR that updates this file first.

    RBAC: staff/admin operations are annotated with `x-permission`, whose value
    is a permission key from infra/db/seed_rbac.sql. The backend enforces the
    permission; a missing permission returns 403.
  license:
    name: Proprietary — Shubayr project
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
tags:
  - name: Auth
  - name: Catalog
  - name: Banners
  - name: Addresses
  - name: Cart
  - name: Wishlist
  - name: Coupons
  - name: Orders
  - name: Reviews
  - name: Loyalty
  - name: Purchasing
  - name: Inventory
  - name: Warehouses
  - name: Fulfilment
  - name: Returns
  - name: Deliveries
  - name: Devices
  - name: Admin

security:
  - bearerAuth: []

paths:
  # ---------------- AUTH ----------------
  /auth/request-otp:
    post:
      tags: [Auth]
      summary: Send an OTP to a phone number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "+9647701234567" }
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  otp_sent: { type: boolean }
        "429": { $ref: "#/components/responses/RateLimited" }
  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify an OTP and issue tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token]
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /me:
    get:
      tags: [Auth]
      summary: Current user profile (includes role & permissions)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------- ADDRESSES ----------------
  /addresses:
    get:
      tags: [Addresses]
      summary: List the current user's delivery addresses
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated addresses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddressPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Addresses]
      summary: Create a delivery address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "422": { $ref: "#/components/responses/Validation" }
  /addresses/{id}:
    get:
      tags: [Addresses]
      summary: Get one address
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Addresses]
      summary: Update an address
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Addresses]
      summary: Delete an address
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- CATALOG ----------------
  /categories:
    get:
      tags: [Catalog]
      summary: List departments & categories (tree)
      security: []
      responses:
        "200":
          description: Category tree
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }

  /banners:
    get:
      tags: [Banners]
      summary: List active home hero banners ordered by sort order
      description: Active means is_active is true and the current time is within the optional starts_at and ends_at window.
      security: []
      responses:
        "200":
          description: Active banners ordered by sort_order ascending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Banner" }
  /products:
    get:
      tags: [Catalog]
      summary: List / filter / search products
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: search text }
        - { name: category_id, in: query, schema: { type: string, format: uuid }, description: "Category UUID; products remain filtered by category_id, not slug." }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: on_sale, in: query, schema: { type: boolean }, description: "When true, return products where compare_at_price is greater than sale_price." }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, rating] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
  /products/{id}:
    get:
      tags: [Catalog]
      summary: Product detail (variants, images, reviews summary, availability)
      security: []
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
  /products/{id}/availability:
    get:
      tags: [Catalog]
      summary: Per-variant available quantity for a product
      description: >
        Availability is computed at read time as on-hand (sum of batch_stock)
        minus active reservations (stock_reservations with status=reserved).
        Nothing is persisted; the number reflects current sellable quantity.
      security: []
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Availability breakdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductAvailability" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- CART ----------------
  /cart:
    get:
      tags: [Cart]
      summary: Get current cart
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: { type: string, format: uuid }
                variant_id: { type: [string, "null"], format: uuid }
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Update a cart item quantity
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    delete:
      tags: [Cart]
      summary: Remove a cart item
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Removed }

  # ---------------- WISHLIST ----------------
  /wishlist:
    get:
      tags: [Wishlist]
      summary: List wishlist items
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated wishlist items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistPage" }
    post:
      tags: [Wishlist]
      summary: Add a product to the wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: string, format: uuid }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistItem" }
  /wishlist/{productId}:
    delete:
      tags: [Wishlist]
      summary: Remove a product from the wishlist
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- COUPONS ----------------
  /coupons/validate:
    post:
      tags: [Coupons]
      summary: Validate a coupon code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- ORDERS ----------------
  /orders:
    get:
      tags: [Orders]
      summary: List the current user's orders
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
    post:
      tags: [Orders]
      summary: Place a Cash-on-Delivery order
      description: >
        Creates the order (status=pending) and a pending COD payment. Stock is
        validated but NOT deducted here; reservation happens on staff confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id]
              properties:
                address_id: { type: string, format: uuid }
                coupon_code: { type: [string, "null"] }
                payment_method: { type: string, enum: [cod], default: cod }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409":
          description: One or more items unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Order detail
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/{id}/track:
    get:
      tags: [Orders]
      summary: Order status timeline
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Ordered list of status-change events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderTracking" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order (releases any reservations)
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Cancelled order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/{id}/status:
    patch:
      tags: [Admin]
      summary: Update order status (staff) — confirm triggers FEFO reservation + pick list
      x-permission: orders.update
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- REVIEWS ----------------
  /products/{id}/reviews:
    get:
      tags: [Reviews]
      summary: List published reviews for a product
      security: []
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
    post:
      tags: [Reviews]
      summary: Submit a review (must reference a purchased order item)
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_item_id, rating]
              properties:
                order_item_id: { type: string, format: uuid }
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "422": { $ref: "#/components/responses/Validation" }
  /deliveries/{id}/rating:
    post:
      tags: [Reviews]
      summary: Rate the delivery/agent (separate from product review)
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        "201":
          description: Created delivery rating
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryRating" }

  # ---------------- LOYALTY ----------------
  /loyalty:
    get:
      tags: [Loyalty]
      summary: Current points balance and ledger
      responses:
        "200":
          description: Loyalty account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltyAccount" }

  # ---------------- PURCHASING (staff) ----------------
  /suppliers:
    get:
      tags: [Purchasing]
      summary: List suppliers
      x-permission: purchasing.view
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated suppliers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Purchasing]
      summary: Create a supplier
      x-permission: purchasing.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInput" }
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /purchase-invoices:
    post:
      tags: [Purchasing]
      summary: Create a purchase invoice (draft)
      x-permission: purchasing.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_id, items]
              properties:
                supplier_id: { type: string, format: uuid }
                invoice_number: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, quantity, unit_cost]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                      unit_cost: { type: number }
                      lot_number: { type: string }
                      expiry_date: { type: [string, "null"], format: date }
      responses:
        "201":
          description: Created purchase invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseInvoice" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /purchase-invoices/{id}/receive:
    post:
      tags: [Purchasing]
      summary: Receive goods — creates inventory batches and places them into locations
      x-permission: purchasing.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                placements:
                  type: array
                  items:
                    type: object
                    properties:
                      po_item_id: { type: string, format: uuid }
                      location_id: { type: string, format: uuid }
                      quantity: { type: integer }
      responses:
        "200":
          description: Received — batches + stock movements created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseInvoice" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- INVENTORY (staff) ----------------
  /inventory/batches:
    get:
      tags: [Inventory]
      summary: List inventory batches (filter by product, expiry)
      x-permission: inventory.view
      parameters:
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated batches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /inventory/movements:
    get:
      tags: [Inventory]
      summary: List stock movements
      x-permission: inventory.view
      parameters:
        - { name: batch_id, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/StockMovementType" } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated stock movements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMovementPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /inventory/adjust:
    post:
      tags: [Inventory]
      summary: Controlled stock adjustment (permissioned + audited)
      x-permission: inventory.adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch_id, location_id, quantity, reason]
              properties:
                batch_id: { type: string, format: uuid }
                location_id: { type: string, format: uuid }
                quantity: { type: integer, description: "signed delta" }
                reason: { type: string }
      responses:
        "200":
          description: Adjustment recorded as a stock movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMovement" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /inventory/transfer:
    post:
      tags: [Inventory]
      summary: Transfer stock between locations
      x-permission: inventory.transfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch_id, from_location, to_location, quantity]
              properties:
                batch_id: { type: string, format: uuid }
                from_location: { type: string, format: uuid }
                to_location: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Transfer recorded as a stock movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMovement" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------- WAREHOUSES (staff, read) ----------------
  /warehouses:
    get:
      tags: [Warehouses]
      summary: List warehouses
      x-permission: inventory.view
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated warehouses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehousePage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /warehouses/{id}/locations:
    get:
      tags: [Warehouses]
      summary: List the zones/aisles/shelves/bins of a warehouse
      x-permission: inventory.view
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated warehouse locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehouseLocationPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- FULFILMENT (staff/warehouse) ----------------
  /pick-lists/{id}:
    get:
      tags: [Fulfilment]
      summary: Get a pick list (item + qty + warehouse + shelf + batch)
      x-permission: inventory.pick
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Pick list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickList" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pick-lists/{id}/items/{itemId}/pick:
    post:
      tags: [Fulfilment]
      summary: Mark a pick-list item as picked
      x-permission: inventory.pick
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated pick-list item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickListItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- RETURNS ----------------
  /returns:
    post:
      tags: [Returns]
      summary: Request a return (partial allowed — choose items & quantities)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, items]
              properties:
                order_id: { type: string, format: uuid }
                reason: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [order_item_id, quantity]
                    properties:
                      order_item_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Created return request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "422": { $ref: "#/components/responses/Validation" }
  /returns/{id}/inspect:
    post:
      tags: [Returns]
      summary: Inspect returned items (staff) — set condition & restock
      x-permission: returns.process
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      return_item_id: { type: string, format: uuid }
                      condition: { type: string, enum: [sellable, opened, damaged] }
                      restock: { type: boolean }
                      batch_id: { type: [string, "null"], format: uuid }
      responses:
        "200":
          description: Inspected return
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- DELIVERIES (agent) ----------------
  /deliveries/assigned:
    get:
      tags: [Deliveries]
      summary: Deliveries assigned to the current agent
      x-permission: delivery.assigned
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated deliveries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /deliveries/{id}:
    patch:
      tags: [Deliveries]
      summary: Update delivery status (agent)
      x-permission: delivery.assigned
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [out_for_delivery, delivered, failed] }
      responses:
        "200":
          description: Updated delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- DEVICES (FCM push tokens) ----------------
  /devices/token:
    post:
      tags: [Devices]
      summary: Register an FCM device token for push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string }
                platform: { type: string, enum: [android, ios, web] }
      responses:
        "201":
          description: Registered device token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceToken" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Devices]
      summary: Unregister an FCM device token
      parameters:
        - { name: token, in: query, required: false, schema: { type: string }, description: "Token to remove; may be sent as a query param or in the request body." }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- ADMIN: REPORTS & SETTINGS ----------------
