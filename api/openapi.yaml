      allOf:
        - $ref: "#/components/schemas/FinancialDocumentInput"
        - type: object
          required: [method]
          properties:
            method: { type: string, enum: [cash_account, delivery_custody] }
            cash_account_id: { type: string, format: uuid }
            collection_id: { type: string, format: uuid }
            proof_reference: { type: string, minLength: 1, maxLength: 160 }

    ReturnPointsEffect:
      type: object
      additionalProperties: false
      required: [earned_reversed, redeemed_restored, net]
      properties:
        earned_reversed: { type: integer, minimum: 0 }
        redeemed_restored: { type: integer, minimum: 0 }
        net: { type: integer }

    ReturnItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          order_item_id,
          variant_id,
          product_name_ar,
          product_name_en,
          quantity,
          approved_quantity,
          base_unit,
          whole_units_only,
          customer_reason,
          reason_code,
          unit_price,
          discount_share,
          net_amount,
          approved_refund,
          earned_points_share,
          redeemed_points_share,
          currency,
          condition,
          restock,
          batch_id,
          inspection_location,
        ]
      properties:
        id: { type: string, format: uuid }
        order_item_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        product_name_ar: { type: string }
        product_name_en: { type: string }
        quantity: { type: number, multipleOf: 0.001 }
        approved_quantity: { type: number, multipleOf: 0.001 }
        base_unit:
          {
            type: string,
            minLength: 1,
            maxLength: 32,
            description: "Order-time SKU base-unit snapshot.",
          }
        whole_units_only:
          {
            type: boolean,
            description: "Order-time SKU fractional-quantity rule.",
          }
        customer_reason: { type: string }
        reason_code:
          {
            type: string,
            enum: [change_of_mind, defect, store_error, wrong_item, other],
          }
        unit_price:
          {
            $ref: "#/components/schemas/Money",
            description: Immutable order-line unit price.,
          }
        discount_share:
          {
            $ref: "#/components/schemas/Money",
            description: Discount share attributed to this requested return quantity.,
          }
        net_amount:
          {
            $ref: "#/components/schemas/Money",
            description: Exact net refund snapshot for the requested quantity.,
          }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        approved_refund: { $ref: "#/components/schemas/Money" }
        earned_points_share: { type: integer, minimum: 0 }
        redeemed_points_share: { type: integer, minimum: 0 }
        original_issue_cost:
          allOf:
            - { $ref: "#/components/schemas/Money" }
            - { description: Present only on staff responses when the caller has cost.view. }
        condition:
          {
            type: [string, "null"],
            enum: [sellable, opened, damaged, expired, null],
          }
        restock: { type: boolean }
        batch_id: { type: [string, "null"], format: uuid }
        inspection_location:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, code, is_sellable]
              properties:
                id: { type: string, format: uuid }
                code: { type: string }
                is_sellable: { type: boolean }
            - { type: "null" }

    Return:
      type: object
      additionalProperties: false
      required:
        [
          id,
          document_number,
          order_id,
          order_number,
          user_id,
          source,
          created_by,
          type,
          status,
          reason,
          expected_refund,
          refund_amount,
          delivery_fee_refund,
          uncollected_offset,
          cash_refund_amount,
          points_effect,
          currency,
          document_date,
          accounting_date,
          reviewed_by,
          reviewed_at,
          completed_at,
          created_at,
          items,
          refund,
          events,
          refund_payments,
          postings,
        ]
      properties:
        id: { type: string, format: uuid }
        document_number: { type: string }
        order_id: { type: string, format: uuid }
        order_number: { type: string }
        user_id: { type: string, format: uuid }
        customer_name:
          type: [string, "null"]
          description: Staff responses only; follows order-customer detail visibility.
        customer_phone:
          type: [string, "null"]
          description: Staff responses only; follows order-customer detail visibility.
        delivery_collection:
          description: Staff responses only; enough custody context to choose the refund source without order or delivery permissions.
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, status, currency, collected_amount, held_amount, delivery_party]
              properties:
                id: { type: string, format: uuid }
                status: { type: string }
                currency: { type: string, pattern: "^[A-Z]{3}$" }
                collected_amount: { type: [number, "null"], minimum: 0 }
                held_amount: { type: number, minimum: 0 }
                delivery_party:
                  type: object
                  additionalProperties: false
                  required: [id, kind, name]
                  properties:
                    id: { type: string, format: uuid }
                    kind: { type: string }
                    name: { type: string }
            - { type: "null" }
        source: { type: string, enum: [customer, staff] }
        created_by: { type: string, format: uuid }
        type: { type: string, enum: [return, exchange] }
        status:
          {
            type: string,
            enum:
              [
                requested,
                approved,
                partially_approved,
                rejected,
                received,
                inspected,
                refunded,
                completed,
              ],
          }
        reason: { type: [string, "null"] }
        expected_refund: { $ref: "#/components/schemas/Money" }
        refund_amount: { $ref: "#/components/schemas/Money" }
        delivery_fee_refund: { $ref: "#/components/schemas/Money" }
        uncollected_offset: { $ref: "#/components/schemas/Money" }
        cash_refund_amount: { $ref: "#/components/schemas/Money" }
        points_effect: { $ref: "#/components/schemas/ReturnPointsEffect" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        document_date: { type: string, format: date }
        accounting_date: { type: string, format: date }
        reviewed_by: { type: [string, "null"], format: uuid }
        reviewed_at: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        refund:
          oneOf:
            - { $ref: "#/components/schemas/RefundLedgerEntry" }
            - { type: "null" }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReturnItem" }
        events:
          type: array
          items: { $ref: "#/components/schemas/ReturnEvent" }
        refund_payments:
          type: array
          items: { $ref: "#/components/schemas/ReturnRefundPayment" }
        postings:
          type: array
          items: { $ref: "#/components/schemas/ReturnPosting" }

    ReturnEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          type,
          operation_id,
          document_date,
          accounting_date,
          actor_id,
          actor_display_name,
          actor_role,
          note,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        type:
          {
            type: string,
            enum:
              [
                requested,
                approved,
                partially_approved,
                rejected,
                received,
                inspected,
                refunded,
              ],
          }
        operation_id: { type: string }
        document_date: { type: string, format: date }
        accounting_date: { type: string, format: date }
        actor_id: { type: string, format: uuid }
        actor_display_name:
          type: string
          description: Staff see the actor display name; customers see only you or store.
        actor_role:
          type: [string, "null"]
          description: Staff-only role; always null on customer responses.
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    ReturnRefundPayment:
      type: object
      additionalProperties: false
      required:
        [
          id,
          method,
          amount_iqd,
          cash_account,
          collection,
          proof_reference,
          document_date,
          accounting_date,
          created_by,
          created_at,
        ]
      properties:
        id: { type: string, format: uuid }
        method: { type: string, enum: [cash_account, delivery_custody] }
        amount_iqd: { $ref: "#/components/schemas/Money" }
        cash_account:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
