        user_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    StockMovementPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/StockMovement" }

    Warehouse:
      type: object
      properties:
