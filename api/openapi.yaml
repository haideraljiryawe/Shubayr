      x-permission: catalog.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Banner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Banner" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Admin]
      summary: Update a home hero banner
      x-permission: catalog.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BannerInput" }
      responses:
        "200":
          description: Updated banner
          content:
            application/json:
