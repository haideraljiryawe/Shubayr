      tags: [Admin]
      summary: Approve or deny a customer cancellation request
      x-error-codes: [STALE_ORDER_STATE, CANCELLATION_REQUEST_NOT_PENDING, ORDERS_CANCEL_AFTER_DISPATCH_REQUIRED, ORDER_CANCELLATION_NOT_ALLOWED, PAID_COD_CANCELLATION_FORBIDDEN, ORDER_TRANSITION_NOT_ALLOWED, SEPARATION_OF_DUTIES_VIOLATION]
      x-permission: orders.cancel_request.resolve
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, decision, reason]
