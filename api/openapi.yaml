      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Caller-owned returns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnPage" }
    post:
      tags: [Returns]
      summary: Request a return (partial allowed — choose items & quantities)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, items]
              properties:
                order_id: { type: string, format: uuid }
                reason: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [order_item_id, quantity]
                    properties:
                      order_item_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Created return request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "422": { $ref: "#/components/responses/Validation" }
  /returns/{id}/inspect:
    post:
      tags: [Returns]
      summary: Inspect returned items (staff) — set condition & restock
      x-permission: returns.process
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      return_item_id: { type: string, format: uuid }
