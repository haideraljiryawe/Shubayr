      x-permission: inventory.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WarehousePatch" } } } }
      responses:
        "200": { description: Warehouse, content: { application/json: { schema: { $ref: "#/components/schemas/Warehouse" } } } }
