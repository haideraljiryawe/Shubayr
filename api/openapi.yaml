            party: { $ref: "#/components/schemas/DeliveryParty" }
            data:
              type: array
              items: { $ref: "#/components/schemas/DeliveryPartyStatementEntry" }
            trips:
              type: array
              items: { $ref: "#/components/schemas/ExternalDriverTripStatement" }

    DeliveryPartyCashStatementEntry:
      type: object
      additionalProperties: false
      required: [id, event, occurred_at, business_date, order_id, order_number, voucher_id, voucher_document_number, amount_iqd, allocated_amount_iqd, unsettled_amount_iqd, allocation_orders, running_cash_iqd]
      properties:
        id: { type: string, format: uuid }
        event: { type: string, enum: [collection_confirmed, cash_received, cash_receipt_reversed, custody_exception, custody_exception_party_liability, custody_exception_reversed, trip_fare_netted] }
        occurred_at: { type: string, format: date-time }
        business_date: { type: string, format: date }
        order_id: { type: [string, "null"], format: uuid }
        order_number: { type: [string, "null"] }
        voucher_id: { type: [string, "null"], format: uuid }
        voucher_document_number: { type: [string, "null"] }
        amount_iqd: { type: number, description: Signed custody movement; collections and party liabilities are positive, receipts negative, and reversals undo the original movement. }
        allocated_amount_iqd: { type: number, minimum: 0 }
        unsettled_amount_iqd: { type: number, minimum: 0 }
        allocation_orders:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [order_id, order_number, amount_iqd]
            properties:
              order_id: { type: string, format: uuid }
              order_number: { type: string }
              amount_iqd: { type: number, exclusiveMinimum: 0 }
        running_cash_iqd: { type: number }

    DeliveryPartyCashActivityPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [party, data]
          properties:
            party: { $ref: "#/components/schemas/DeliveryParty" }
            data:
              type: array
              items: { $ref: "#/components/schemas/DeliveryPartyCashStatementEntry" }

    DeliveryPartyHeldOrders:
      type: object
      additionalProperties: false
      required: [party, data]
      properties:
        party: { $ref: "#/components/schemas/DeliveryParty" }
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, order_number, status, delivery_id, quantity, held_since, age_days]
            properties:
              id: { type: string, format: uuid }
              order_number: { type: string }
              status: { $ref: "#/components/schemas/OrderStatus" }
              delivery_id: { type: string, format: uuid }
              quantity: { type: number, multipleOf: 0.001 }
              held_since: { type: string, format: date-time }
              age_days: { type: integer, minimum: 0 }

    DeliveryCollection:
      type: object
      additionalProperties: false
      required:
        [
          id,
          delivery_id,
          order_id,
          party_id,
          status,
          due_amount,
          collected_amount,
          shortfall_amount,
          currency,
          delivered_at,
          accounting_date,
          confirmed_at,
          delivery_journal_entry_id,
          confirmation_journal_entry_id,
        ]
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        party_id: { type: string, format: uuid }
        status:
          { type: string, enum: [confirmed_full, confirmed_short, unconfirmed] }
        due_amount: { type: number, minimum: 0 }
        collected_amount: { type: [number, "null"], minimum: 0 }
        shortfall_amount: { type: [number, "null"], minimum: 0 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        delivered_at: { type: string, format: date-time }
        accounting_date: { type: string, format: date }
        confirmed_at: { type: [string, "null"], format: date-time }
        delivery_journal_entry_id: { type: string, format: uuid }
        confirmation_journal_entry_id: { type: [string, "null"], format: uuid }
        settlement_status:
          {
            type: string,
            enum: [unconfirmed, unsettled, partially_settled, settled],
            description: Present on staff collection-list responses.,
          }
        allocated_amount_iqd:
          {
            type: number,
            minimum: 0,
            description: Active receipt allocations; present on staff collection-list responses.,
          }
        receipt_allocated_amount_iqd:
          {
            type: number,
            minimum: 0,
            description: Cash receipt allocations only; present on staff collection-list responses.,
          }
        fare_netted_amount_iqd:
          {
            type: number,
            minimum: 0,
            description: Approved trip fare netted against this collection; present on staff collection-list responses.,
          }
        return_refunded_amount_iqd:
          {
            type: number,
            minimum: 0,
            description: Return cash paid directly from this delivery collection; present on staff collection-list responses.,
          }
        unsettled_amount_iqd:
          {
            type: [number, "null"],
            minimum: 0,
            description: Confirmed collected amount not yet allocated; present on staff collection-list responses.,
          }
        exception_offset_iqd:
          {
            type: number,
            minimum: 0,
            description: Active return/refund amount netted against the collection shortfall; present on staff collection-list responses.,
          }
        uncollected_amount_iqd:
          {
            type: [number, "null"],
            minimum: 0,
            description: Remaining shortfall after active custody exceptions; present on staff collection-list responses.,
          }
        exceptions:
          type: array
          description: Active custody exceptions affecting this collection; present on staff collection-list responses.
          items:
            type: object
            additionalProperties: false
            required:
              [
                id,
                document_number,
                type,
                amount_iqd,
                exception_offset_iqd,
                settlement_method,
                document_date,
              ]
            properties:
              id: { type: string, format: uuid }
              document_number: { type: string }
              type:
                {
                  type: string,
                  enum: [return_against_uncollected, delivery_fee_refund],
                }
              amount_iqd: { type: number, minimum: 0 }
              exception_offset_iqd: { type: number, minimum: 0 }
              settlement_method:
                {
                  type: [string, "null"],
                  enum: [cash_account, uncollected, null],
                }
              document_date: { type: string, format: date }
        receipt_allocations:
          type: array
          description: Active receipt allocations settling this order; present on staff collection-list responses.
          items:
            type: object
            additionalProperties: false
            required:
              [
                id,
                batch_id,
                batch_document_number,
                voucher_id,
                voucher_document_number,
                voucher_document_date,
                amount_iqd,
                created_at,
              ]
            properties:
              id: { type: string, format: uuid }
              batch_id: { type: string, format: uuid }
              batch_document_number: { type: string }
              voucher_id: { type: string, format: uuid }
              voucher_document_number: { type: string }
              voucher_document_date: { type: string, format: date }
              amount_iqd: { type: number, exclusiveMinimum: 0 }
              created_at: { type: string, format: date-time }
        fare_nettings:
          type: array
          description: Approved store-paid trip fare amounts settling this collection; present on staff collection-list responses.
          items:
            type: object
            additionalProperties: false
            required:
              [id, trip_id, trip_document_number, amount_iqd, created_at]
            properties:
              id: { type: string, format: uuid }
              trip_id: { type: string, format: uuid }
              trip_document_number: { type: string }
              amount_iqd: { type: number, exclusiveMinimum: 0 }
              created_at: { type: string, format: date-time }
        order:
          type: object
          additionalProperties: false
          required: [id, order_number, user_id, total, delivery_fee]
          properties:
            id: { type: string, format: uuid }
            order_number: { type: string }
            user_id: { type: string, format: uuid }
            total: { type: number }
            delivery_fee: { type: number }
        party: { $ref: "#/components/schemas/DeliveryPartySummary" }

    DeliveryCollectionPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/DeliveryCollection" }

    OrderCollectionResult:
      type: object
      additionalProperties: false
