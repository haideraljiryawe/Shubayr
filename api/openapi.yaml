        status: { type: string, enum: [open, picking, picked, closed] }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/PickListItem" }

    ReturnRequest:
      type: object
      required: [order_id, operation_id, items]
