        allocated_amount_iqd: { type: number, minimum: 0, description: Active receipt allocations; present on staff collection-list responses. }
        receipt_allocated_amount_iqd: { type: number, minimum: 0, description: Cash receipt allocations only; present on staff collection-list responses. }
        fare_netted_amount_iqd: { type: number, minimum: 0, description: Approved trip fare netted against this collection; present on staff collection-list responses. }
        unsettled_amount_iqd: { type: [number, "null"], minimum: 0, description: Confirmed collected amount not yet allocated; present on staff collection-list responses. }
        exception_offset_iqd: { type: number, minimum: 0, description: Active return/refund amount netted against the collection shortfall; present on staff collection-list responses. }
        uncollected_amount_iqd: { type: [number, "null"], minimum: 0, description: Remaining shortfall after active custody exceptions; present on staff collection-list responses. }
        exceptions:
          type: array
          description: Active custody exceptions affecting this collection; present on staff collection-list responses.
          items:
            type: object
            additionalProperties: false
            required: [id, document_number, type, amount_iqd, exception_offset_iqd, settlement_method, document_date]
            properties:
              id: { type: string, format: uuid }
              document_number: { type: string }
              type: { type: string, enum: [return_against_uncollected, delivery_fee_refund] }
              amount_iqd: { type: number, minimum: 0 }
              exception_offset_iqd: { type: number, minimum: 0 }
              settlement_method: { type: [string, "null"], enum: [cash_account, uncollected, null] }
              document_date: { type: string, format: date }
        receipt_allocations:
          type: array
          description: Active receipt allocations settling this order; present on staff collection-list responses.
          items:
            type: object
            additionalProperties: false
            required: [id, batch_id, batch_document_number, voucher_id, voucher_document_number, voucher_document_date, amount_iqd, created_at]
            properties:
              id: { type: string, format: uuid }
              batch_id: { type: string, format: uuid }
              batch_document_number: { type: string }
              voucher_id: { type: string, format: uuid }
              voucher_document_number: { type: string }
              voucher_document_date: { type: string, format: date }
              amount_iqd: { type: number, exclusiveMinimum: 0 }
              created_at: { type: string, format: date-time }
        fare_nettings:
          type: array
          description: Approved store-paid trip fare amounts settling this collection; present on staff collection-list responses.
          items:
            type: object
            additionalProperties: false
            required: [id, trip_id, trip_document_number, amount_iqd, created_at]
            properties:
              id: { type: string, format: uuid }
              trip_id: { type: string, format: uuid }
              trip_document_number: { type: string }
              amount_iqd: { type: number, exclusiveMinimum: 0 }
              created_at: { type: string, format: date-time }
        order:
          type: object
          additionalProperties: false
          required: [id, order_number, user_id, total, delivery_fee]
          properties:
            id: { type: string, format: uuid }
            order_number: { type: string }
            user_id: { type: string, format: uuid }
            total: { type: number }
            delivery_fee: { type: number }
        party: { $ref: "#/components/schemas/DeliveryPartySummary" }

    DeliveryCollectionPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/DeliveryCollection" }

    OrderCollectionResult:
      type: object
      additionalProperties: false
      required: [result, amount_collected, shortfall, confirmation_state, currency]
      description: Customer-safe collection result for the caller's own order; it never contains a delivery party, courier, user id, phone, or journal reference.
      properties:
        result: { type: string, enum: [full, short, unconfirmed] }
        amount_collected: { type: [number, "null"], minimum: 0 }
        shortfall: { type: [number, "null"], minimum: 0 }
        confirmation_state: { type: string, enum: [confirmed, unconfirmed] }
        currency: { type: string, const: IQD }

    Delivery:
      type: object
      required: [order_version, amount_due]
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        order_version: { type: integer, minimum: 1 }
        amount_due: { type: number, minimum: 0, description: Goods plus delivery fee payable in IQD, available before confirmation. }
        agent_id: { type: [string, "null"], format: uuid }
        party_id: { type: [string, "null"], format: uuid }
        party:
          oneOf:
            - { $ref: "#/components/schemas/DeliveryPartySummary" }
            - { type: "null" }
        status: { type: string, enum: [assigned, out_for_delivery, delivered, failed, returned] }
        delivery_fee: { type: number }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        dispatched_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }
        failure_reason: { type: [string, "null"], maxLength: 500 }
        failed_at: { type: [string, "null"], format: date-time }
        retry_count: { type: integer, minimum: 0 }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/DeliveryAttempt" }
        collection:
          oneOf:
            - { $ref: "#/components/schemas/DeliveryCollection" }
            - { type: "null" }

    CustomerDeliveryAttempt:
      type: object
      additionalProperties: false
      required: [id, delivery_id, attempt_number, status, reason, started_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        attempt_number: { type: integer, minimum: 1 }
        status: { type: string, enum: [out_for_delivery, delivered, failed] }
        reason: { type: [string, "null"], maxLength: 500 }
        started_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    DeliveryAttempt:
      type: object
      additionalProperties: false
      required: [id, delivery_id, attempt_number, status, reason, started_at, completed_at, party]
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        attempt_number: { type: integer, minimum: 1 }
        party_id: { type: string, format: uuid }
        status: { type: string, enum: [out_for_delivery, delivered, failed] }
        reason: { type: [string, "null"], maxLength: 500 }
        started_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        party:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, "null"] }

    RetrievalLine:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        custody_holding_id: { type: string, format: uuid }
        order_item_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        expected_quantity: { type: number, multipleOf: 0.001 }
        received_quantity: { type: number, multipleOf: 0.001 }
        unit_cost_iqd: { type: number }
        location_id: { type: [string, "null"], format: uuid }
        received_at: { type: [string, "null"], format: date-time }
        order_item:
          type: object
          additionalProperties: false
          required: [product_name_en, product_name_ar]
          properties:
            product_name_en: { type: string }
            product_name_ar: { type: string }
        batch:
          type: object
          additionalProperties: false
          required: [lot_number]
          properties:
            lot_number: { type: string }
        location:
          oneOf:
            - { type: "null" }
            - type: object
              additionalProperties: false
              required: [code, warehouse_id]
              properties:
                code: { type: string }
                warehouse_id: { type: string, format: uuid }

    Retrieval:
      type: object
      properties:
        id: { type: string, format: uuid }
        document_number: { type: string }
        operation_id: { type: string }
        order_id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        custody_party_id: { type: string, format: uuid }
        status: { type: string, enum: [open, partially_received, received, closed] }
        outcome: { type: string, enum: [cancel, retry] }
        reason: { type: string }
        document_date: { type: string, format: date }
        accounting_date: { type: string, format: date }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        closed_by: { type: [string, "null"], format: uuid }
        closed_at: { type: [string, "null"], format: date-time }
        journal_entry_id: { type: [string, "null"], format: uuid }
        lines:
          type: array
          items: { $ref: "#/components/schemas/RetrievalLine" }

    RetrievalListItem:
      type: object
      additionalProperties: false
      required: [id, document_number, order_id, delivery_id, custody_party_id, status, outcome, reason, document_date, created_at, closed_at, order, custody_party, line_count]
      properties:
        id: { type: string, format: uuid }
        document_number: { type: string }
        order_id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        custody_party_id: { type: string, format: uuid }
        status: { type: string, enum: [open, partially_received, received, closed] }
        outcome: { type: string, enum: [cancel, retry] }
        reason: { type: string }
        document_date: { type: string, format: date }
        created_at: { type: string, format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        order:
          type: object
          additionalProperties: false
          required: [id, order_number]
          properties:
            id: { type: string, format: uuid }
            order_number: { type: string }
        custody_party:
          type: object
          additionalProperties: false
          required: [id, name, phone]
          properties:
            id: { type: string, format: uuid }
            name: { type: [string, "null"] }
            phone: { type: string }
        line_count: { type: integer, minimum: 0 }

    RetrievalPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/RetrievalListItem" }

    DeliveryPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Delivery" }

    DeviceToken:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        token: { type: string }
        platform: { type: string, enum: [android, ios, web] }
        locale: { type: [string, "null"], enum: [ar, en, ar-IQ, en-US, null] }
        is_active: { type: boolean }
        last_seen_at: { type: string, format: date-time }
        deactivated_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    NotificationPreferences:
      type: object
      additionalProperties: false
      required: [preferences]
      properties:
        preferences:
          type: array
          items: { $ref: "#/components/schemas/NotificationPreferenceEntry" }

    NotificationPreferencesPatch:
      type: object
      additionalProperties: false
      required: [preferences]
      properties:
        preferences:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/NotificationPreferenceEntry" }

    NotificationPreferenceEntry:
      type: object
      additionalProperties: false
      required: [type, channel, enabled]
      properties:
        type: { type: string, enum: [order_placed, order_confirmed, order_status_changed, out_for_delivery, delivered, delivery_failed, return_update, loyalty_points_earned, review_moderated, promo, new_order, order_cancelled, order_rejected, delivery_assigned, order_acceptance_late, retrieval_update, quantity_reduction_proposed, cancellation_request_approved, cancellation_request_denied, price_approval_requested, price_approval_approved, price_approval_rejected] }
        channel: { type: string, enum: [push, sms] }
        enabled: { type: boolean }

    NotificationPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Notification" }

    Notification:
      type: object
      required: [id, type, target_role, title_ar, body_ar, title_en, body_en, deep_link, entity_type, entity_id, created_at, read_at]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/NotificationPreferenceEntry/properties/type" }
        target_role: { type: string, enum: [customer, delivery_agent, order_monitor, staff] }
        title_ar: { type: string }
        body_ar: { type: string }
        title_en: { type: string }
        body_en: { type: string }
        deep_link: { type: string }
        entity_type: { type: string }
        entity_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, "null"], format: date-time }

    UnreadCount:
      type: object
      additionalProperties: false
      required: [unread_count]
      properties:
        unread_count: { type: integer, minimum: 0 }

    AuditReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 500 }

    StaffUser:
      type: object
      required: [id, username, name, email, is_active, must_change_password, permission_version, presets, extra_grants, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        is_active: { type: boolean }
        must_change_password: { type: boolean }
        permission_version: { type: integer, minimum: 1 }
        presets:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        extra_grants: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StaffUserList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/StaffUser" } }

    StaffUserListResponse:
      description: A bare array is retained for v6.1 clients when no query parameters are sent; queried calls use the standard list envelope.
      oneOf:
        - type: array
          items: { $ref: "#/components/schemas/StaffUser" }
        - $ref: "#/components/schemas/StaffUserList"

    StaffCreate:
      allOf:
        - $ref: "#/components/schemas/AuditReason"
        - type: object
          required: [username, name, password]
          properties:
            username: { type: string, pattern: '^[a-z][a-z0-9._-]{2,79}$' }
            name: { type: string, minLength: 1, maxLength: 120 }
            email: { type: [string, "null"], format: email }
            password: { $ref: "#/components/schemas/Password" }
            preset_ids: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
            permission_keys: { type: array, uniqueItems: true, items: { type: string } }

    StaffUpdate:
      allOf:
        - $ref: "#/components/schemas/AuditReason"
        - type: object
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            email: { type: [string, "null"], format: email }
            is_active: { type: boolean }

    StaffPasswordReset:
      allOf:
        - $ref: "#/components/schemas/AuditReason"
        - type: object
          required: [password]
          properties:
            password: { $ref: "#/components/schemas/Password" }

    StaffAccess:
      allOf:
        - $ref: "#/components/schemas/AuditReason"
        - type: object
          required: [preset_ids, permission_keys]
          properties:
            preset_ids: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
            permission_keys: { type: array, uniqueItems: true, items: { type: string } }

    PermissionPreset:
      type: object
      additionalProperties: false
      required: [id, name, description, is_system, created_at, updated_at, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        is_system: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        permissions:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [permission]
            properties:
              permission: { $ref: "#/components/schemas/Permission" }

    PermissionPresetInput:
      allOf:
        - $ref: "#/components/schemas/AuditReason"
        - type: object
          properties:
            name: { type: string, pattern: '^[a-z][a-z0-9._-]{2,79}$' }
            description: { type: [string, "null"], maxLength: 255 }
            permission_keys: { type: array, uniqueItems: true, items: { type: string } }

    PermissionPresetList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/PermissionPreset" } }

    PermissionPresetListResponse:
      description: A bare array is retained for v6.1 clients when no query parameters are sent; queried calls use the standard list envelope.
      oneOf:
        - type: array
          items: { $ref: "#/components/schemas/PermissionPreset" }
        - $ref: "#/components/schemas/PermissionPresetList"

    WorkPhone:
      type: object
      required: [id, user_id, phone, name, app_role, is_active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        phone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        name: { type: string }
        app_role: { type: string, enum: [delivery_agent, order_monitor] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    WorkPhoneList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/WorkPhone" } }

    WorkPhoneListResponse:
      description: A bare array is retained for v6.1 clients when no query parameters are sent; queried calls use the standard list envelope.
      oneOf:
        - type: array
          items: { $ref: "#/components/schemas/WorkPhone" }
        - $ref: "#/components/schemas/WorkPhoneList"

    AuditActor:
      type: object
      required: [id, username, name]
      properties:
        id: { type: string, format: uuid }
        username: { type: [string, "null"] }
        name: { type: [string, "null"] }

    AuditLog:
      type: object
      required: [id, actor_id, actor, action, entity_type, entity_id, before, after, ip, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: [string, "null"], format: uuid }
        actor:
          oneOf:
            - $ref: "#/components/schemas/AuditActor"
            - type: "null"
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: [string, "null"], format: uuid }
        before: { type: [object, array, string, number, boolean, "null"] }
        after: { type: [object, array, string, number, boolean, "null"] }
        ip: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    AuditLogList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/AuditLog" } }

    WorkPhoneInput:
      allOf:
        - $ref: "#/components/schemas/AuditReason"
        - type: object
          required: [phone, name, role]
          properties:
            phone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
            name: { type: string, minLength: 1, maxLength: 120 }
            role: { type: string, enum: [delivery_agent, order_monitor] }

    Permission:
      type: object
      properties:
        key: { type: string, example: "orders.confirm" }
        group: { type: string, example: orders }
        description: { type: [string, "null"] }

    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        is_system: { type: boolean }
        created_at: { type: string, format: date-time }
        permissions:
          type: array
          items: { type: string, example: "orders.confirm" }

    RoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        permissions:
          type: array
          description: Permission keys granted to this role.
          items: { type: string, example: "orders.confirm" }

    RolePage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Role" }

    UserPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/User" }

    SalesReport:
      type: object
      description: Aggregated sales & analytics for the selected date range.
      properties:
        from: { type: [string, "null"], format: date }
        to: { type: [string, "null"], format: date }
        orders_count: { type: integer }
        gross_sales: { type: number }
        discounts: { type: number }
        net_sales: { type: number }
        by_day:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              orders_count: { type: integer }
              net_sales: { type: number }
        top_products:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              name: { type: string }
              qty_sold: { type: integer }
              net_sales: { type: number }

    StoreSettings:
      type: object
      properties:
        store_name: { type: string }
        logo_url: { type: string }
        primary_color: { type: string }
        currency: { type: string, example: IQD }
        default_low_stock_threshold: { type: string, pattern: '^\d+(?:\.\d{1,3})?$' }
        sale_rounding_multiple: { type: string, pattern: '^\d+$', description: "Zero uses base-currency precision; otherwise linked prices round upward to this multiple." }

    ExactDecimal:
      oneOf:
        - { type: string, pattern: '^-?\d+(?:\.\d+)?$' }
        - { type: number }

    Currency:
      type: object
      required: [code, name_ar, name_en, symbol, display_precision, is_base, enabled, created_at, updated_at]
      properties:
        code: { type: string, pattern: '^[A-Z]{3}$' }
        name_ar: { type: string }
        name_en: { type: string }
        symbol: { type: string }
        display_precision: { type: integer, minimum: 0, maximum: 6 }
        is_base: { type: boolean }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExchangeRateInput:
      type: object
      additionalProperties: false
      required: [currency_code, rate, basis, effective_at, reason]
      properties:
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        rate: { type: string, pattern: '^\d+(?:\.\d{1,10})?$' }
        basis: { type: integer, enum: [1, 100] }
        effective_at: { type: string, format: date-time, description: Exact instant from which the rate applies. }
        reason: { type: string, minLength: 3, maxLength: 500 }

    ExchangeRate:
      type: object
      properties:
        id: { type: string, format: uuid }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        base_currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        rate: { $ref: "#/components/schemas/ExactDecimal" }
        effective_at: { type: [string, "null"], format: date-time }
        set_by: { type: string, format: uuid }
        reason: { type: string }
