            id: { type: string, format: uuid }
            product_name_ar: { type: string }
            product_name_en: { type: string }
        batch:
          type: object
          additionalProperties: false
          required: [id, lot_number, variant_id]
          properties:
            id: { type: string, format: uuid }
            lot_number: { type: [string, "null"] }
            variant_id: { type: string, format: uuid }
        location:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, code, warehouse_id]
              properties:
                id: { type: string, format: uuid }
                code: { type: string }
                warehouse_id: { type: string, format: uuid }
            - { type: "null" }

    CustodyExceptionPosting:
      type: object
      additionalProperties: false
      required: [role, journal_entry_id, event]
      properties:
        role: { type: string }
        journal_entry_id: { type: string, format: uuid }
        event: { type: string }

    CustodyExceptionReversalPosting:
      type: object
      additionalProperties: false
      required: [role, journal_entry_id, original_journal_entry_id, event]
      properties:
        role: { type: string }
        journal_entry_id: { type: string, format: uuid }
        original_journal_entry_id: { type: string, format: uuid }
        event: { type: string }

    CustodyExceptionReversal:
      type: object
      additionalProperties: false
      required: [id, document_number, operation_id, reason, document_date, accounting_date, created_by, created_by_name, created_at, postings]
      properties:
        id: { type: string, format: uuid }
        document_number: { type: string }
        operation_id: { type: string }
        reason: { type: string }
        document_date: { type: string, format: date }
        accounting_date: { type: string, format: date }
        created_by: { type: string, format: uuid }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
        postings:
          type: array
          items: { $ref: "#/components/schemas/CustodyExceptionReversalPosting" }

    CustodyException:
      type: object
      additionalProperties: false
      required: [id, document_number, operation_id, type, status, party_id, order_id, collection_id, liability_bearer, settlement_method, cash_account_id, amount_iqd, exception_offset_iqd, refund_payable_iqd, reason, document_date, accounting_date, backdate_reason, created_by, created_by_name, created_at, party, order, collection, cash_account, lines, postings, reversal]
      properties:
        id: { type: string, format: uuid }
        document_number: { type: string }
        operation_id: { type: string }
        type: { type: string, enum: [goods_loss, return_against_uncollected, delivery_fee_refund] }
        status: { type: string, enum: [active, reversed] }
        party_id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        collection_id: { type: [string, "null"], format: uuid }
        liability_bearer: { type: [string, "null"], enum: [store, party, null] }
        settlement_method: { type: [string, "null"], enum: [cash_account, uncollected, null] }
        cash_account_id: { type: [string, "null"], format: uuid }
        amount_iqd: { type: number, minimum: 0 }
        goods_cost_iqd: { type: number, minimum: 0, description: Present only with cost.view. }
        exception_offset_iqd: { type: number, minimum: 0 }
        refund_payable_iqd: { type: number, minimum: 0 }
        reason: { type: string }
        document_date: { type: string, format: date }
        accounting_date: { type: string, format: date }
        backdate_reason: { type: [string, "null"] }
        created_by: { type: string, format: uuid }
        created_by_name: { type: string }
        created_at: { type: string, format: date-time }
        party: { $ref: "#/components/schemas/DeliveryPartySummary" }
        order:
          type: object
          additionalProperties: false
          required: [id, order_number, status]
          properties:
            id: { type: string, format: uuid }
            order_number: { type: string }
            status: { $ref: "#/components/schemas/OrderStatus" }
        collection:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, status, due_amount, collected_amount, shortfall_amount]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [confirmed_full, confirmed_short, unconfirmed] }
                due_amount: { type: number, minimum: 0 }
                collected_amount: { type: [number, "null"], minimum: 0 }
                shortfall_amount: { type: [number, "null"], minimum: 0 }
            - { type: "null" }
        cash_account:
          oneOf:
            - type: object
              additionalProperties: false
              required: [id, name, kind, currency_code]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                kind: { type: string, enum: [cash, bank] }
                currency_code: { type: string, const: IQD }
            - { type: "null" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/CustodyExceptionLine" }
        postings:
          type: array
          items: { $ref: "#/components/schemas/CustodyExceptionPosting" }
        reversal:
          oneOf:
            - { $ref: "#/components/schemas/CustodyExceptionReversal" }
            - { type: "null" }

    CustodyExceptionPage:
      allOf:
        - { $ref: "#/components/schemas/Pagination" }
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/CustodyException" }

    FinancialDocumentBase:
      type: object
      required: [document_type, id, document_number, amount, currency_code, document_date, accounting_date, backdate_reason, created_by, journal_entry_id, created_at]
      properties:
        document_type: { type: string, enum: [cash_opening_balance, cash_transfer] }
        id: { type: string, format: uuid }
        document_number: { type: string }
        amount: { type: number, minimum: 0 }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        document_date: { type: string, format: date-time }
        accounting_date: { type: string, format: date-time }
        backdate_reason: { type: [string, "null"] }
        created_by: { type: string, format: uuid }
        journal_entry_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    FinancialDocument:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/FinancialDocumentBase"
            - type: object
              required: [cash_account]
              properties:
                document_type: { const: cash_opening_balance }
                cash_account: { $ref: "#/components/schemas/CashAccountLink" }
        - allOf:
            - $ref: "#/components/schemas/FinancialDocumentBase"
            - type: object
              required: [reason, from_account, to_account]
              properties:
                document_type: { const: cash_transfer }
                reason: { type: string }
                from_account: { $ref: "#/components/schemas/CashAccountLink" }
                to_account: { $ref: "#/components/schemas/CashAccountLink" }

    CashAccountLink:
      type: object
      additionalProperties: false
      required: [id, name, kind]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [cash, bank] }

    AccountingPeriod:
      type: object
      additionalProperties: false
      required: [month, status]
      properties:
        month: { type: string, format: date-time }
        status: { type: string, enum: [open, closed] }
        closed_at: { type: [string, "null"], format: date-time }
        closed_by: { type: [string, "null"], format: uuid }
        reopened_at: { type: [string, "null"], format: date-time }
        reopened_by: { type: [string, "null"], format: uuid }
        reopen_reason: { type: [string, "null"] }
        closes: { type: array, description: Sequenced close and re-close history, items: { $ref: "#/components/schemas/PeriodClose" } }

    PeriodClose:
      type: object
      additionalProperties: false
      required: [id, period_month, sequence, snapshot, differences, reason, closed_by, created_at]
      properties:
        id: { type: string, format: uuid }
        period_month: { type: string, format: date-time }
        sequence: { type: integer, minimum: 1 }
        snapshot: { type: array, items: { type: object, additionalProperties: true } }
        differences: { type: [array, "null"], items: { type: object, additionalProperties: true } }
        reason: { type: [string, "null"] }
        closed_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    PeriodChecklist:
      type: object
      required: [month, can_close, checks]
      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        can_close: { type: boolean }
        checks: { type: array, items: { type: object, additionalProperties: true } }

    AdminFinancialSettings:
      type: object
      additionalProperties: false
      required: [settings, business_hours, closed_days, protection_thresholds]
      properties:
        settings:
          type: object
          properties:
            separation_of_duties_level: { type: [string, "null"], enum: [standard, strict, null], default: standard }
          additionalProperties: { type: [string, "null"] }
        business_hours: { type: array, items: { $ref: "#/components/schemas/BusinessHours" } }
        closed_days: { type: array, items: { $ref: "#/components/schemas/ClosedDay" } }
        protection_thresholds: { $ref: "#/components/schemas/ProtectionThresholds" }

    AdminFinancialSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        settings:
          type: object
          properties:
            separation_of_duties_level: { type: [string, "null"], enum: [standard, strict, null] }
          additionalProperties: { type: [string, "null"] }
        business_hours: { type: array, items: { $ref: "#/components/schemas/BusinessHoursInput" } }
        closed_days: { type: array, items: { $ref: "#/components/schemas/ClosedDayInput" } }
        protection_thresholds: { $ref: "#/components/schemas/ProtectionThresholds" }

    BusinessHours:
      type: object
      additionalProperties: false
      description: Persisted weekday convention is 0=Sunday, 1=Monday, 2=Tuesday, 3=Wednesday, 4=Thursday, 5=Friday, 6=Saturday.
      required: [weekday, opens_at, closes_at, is_closed, updated_at]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: "0=Sunday; 1=Monday; 2=Tuesday; 3=Wednesday; 4=Thursday; 5=Friday; 6=Saturday." }
        opens_at: { type: [string, "null"], pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
        closes_at: { type: [string, "null"], pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
        is_closed: { type: boolean }
        updated_at: { type: string, format: date-time }

    BusinessHoursInput:
      type: object
      additionalProperties: false
      description: Uses the persisted 0=Sunday through 6=Saturday convention. Closed rows require null times; open rows require HH:MM and opens_at before closes_at.
      required: [weekday, opens_at, closes_at, is_closed]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: "0=Sunday; 1=Monday; 2=Tuesday; 3=Wednesday; 4=Thursday; 5=Friday; 6=Saturday." }
        opens_at: { type: [string, "null"], pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
        closes_at: { type: [string, "null"], pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
        is_closed: { type: boolean }

    ClosedDay:
      type: object
      additionalProperties: false
      required: [date, reason, created_at]
      properties:
        date: { type: string, format: date-time }
        reason: { type: [string, "null"], maxLength: 255 }
        created_at: { type: string, format: date-time }

    ClosedDayInput:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date: { type: string, format: date }
        reason: { type: string, maxLength: 255 }

    ProtectionThresholds:
      type: object
      additionalProperties: false
      properties:
        cost: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        price: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        quantity: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        exchange_rate: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
