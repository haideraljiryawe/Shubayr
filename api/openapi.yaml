      description: Files with more than 500 rows validate as a background job. Poll the returned import resource for progress. At most 5,000 data rows are accepted.
      x-permission: catalog.import
      x-error-codes: [CATALOG_IMPORT_FILE_REQUIRED, CATALOG_IMPORT_FILE_INVALID, CATALOG_IMPORT_HEADERS_INVALID, CATALOG_IMPORT_SHEET_REQUIRED, CATALOG_IMPORT_ROW_LIMIT, CATALOG_IMPORT_STOCK_PERMISSION_REQUIRED, ATTRIBUTES_INVALID, BARCODE_DUPLICATE, CATEGORY_MAX_DEPTH, CATEGORY_NOT_FOUND, CURRENCY_INVALID, CURRENCY_NOT_ENABLED, EXPIRY_INVALID, LOCATION_CODE_AMBIGUOUS, LOCATION_NOT_FOUND, LOW_STOCK_INVALID, PRICE_INVALID, PRICE_REQUIRED, PRODUCT_REQUIRES_SUBCATEGORY, QUANTITY_INVALID, REFERENCE_PRICE_INVALID, REQUIRED, SKU_DUPLICATE_IN_FILE, SKU_NOT_FOUND, SKU_REQUIRED, STATUS_DEFAULTED, STATUS_INVALID, UNIT_COST_INVALID]
      parameters:
        - { name: create_missing, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Ready preview, or queued background validation resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImport" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/catalog-imports:
    get:
      tags: [Admin, Catalog import]
      summary: List catalog import history
      x-permission: catalog.import
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Import history, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImportPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/catalog-imports/{id}:
    get:
      tags: [Admin, Catalog import]
      summary: Get preview rows and progress for one import
      description: Stock unit cost is omitted unless the caller has cost.view. While a commit is running, poll this resource for rows applied plus completed/total commit batches.
      x-permission: catalog.import
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Import resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImport" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/catalog-imports/{id}/progress:
    get:
      tags: [Admin, Catalog import]
      summary: Get lightweight progress for one catalog import
      description: Poll-friendly commit progress without preview rows or other workbook data.
      x-permission: catalog.import
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Lightweight import progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImportProgress" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/catalog-imports/{id}/error-report:
    get:
      tags: [Admin, Catalog import]
      summary: Download the complete validation report as CSV
      x-permission: catalog.import
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: UTF-8 CSV report with a BOM for correct Arabic display in Excel
          content:
            text/csv:
              schema: { type: string }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/catalog-imports/{id}/commit:
    post:
      tags: [Admin, Catalog import]
      summary: Queue a resumable commit of all valid preview rows
      description: Product rows are committed by the background worker in batches of at most 250 and progress is exposed on the detail resource. The operation id and durable per-row checkpoints make double submission and worker restart safe. A failed batch leaves earlier batches applied and reports the failed row. Valid Stock rows create exactly one posted inventory-opening document only after all product rows succeed.
      x-permission: catalog.import
      x-error-codes: [CATALOG_IMPORT_ALREADY_COMMITTED, CATALOG_IMPORT_OPERATION_ID_REUSED, CATALOG_IMPORT_NOT_READY, CATALOG_IMPORT_NO_VALID_ROWS, CATALOG_IMPORT_STOCK_PERMISSION_REQUIRED, CATALOG_IMPORT_QUEUE_UNAVAILABLE, CATALOG_IMPORT_ROW_FAILED, CATALOG_IMPORT_UNIQUE_CONFLICT, EXCHANGE_RATE_REQUIRED]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id]
              properties:
                operation_id: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "201":
          description: Queued/in-progress result, or the completed result on an idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImportCommitResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /admin/catalog-images/bulk:
    post:
      tags: [Admin, Catalog import]
      summary: Upload and attach a ZIP of SKU-named product images
      description: Accepts SKU.jpg, SKU-2.jpg and later numbered images. Every successfully stored image is center-cropped to a true square without stretching and compressed to WebP; square source framing is preserved. Files that cannot be processed are reported individually and the original non-square or invalid file is never attached as a fallback.
      x-permission: catalog.import
      x-error-codes: [CATALOG_IMAGE_ZIP_INVALID, CATALOG_IMAGE_PROCESSING_FAILED]
      parameters:
        - { name: operation_id, in: query, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Matched and unmatched image report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImageBulkResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/products:
    get:
      tags: [Admin]
      summary: List active and hidden products, with optional archived products
      description: Uses database-level filtering, stable sorting and pagination without loading the whole catalog into application memory. When status is omitted, archived products are excluded. Search matches normalized Arabic and English names, SKUs and barcodes without modifying stored catalog text.
      x-permission: catalog.products
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: brand_id, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: on_sale, in: query, schema: { type: boolean } }
        - { name: status, in: query, schema: { type: array, items: { type: string, enum: [active, hidden, archived] } }, style: form, explode: true }
        - { name: availability, in: query, schema: { type: array, items: { type: string, enum: [in_stock, low_stock, out_of_stock] } }, style: form, explode: true }
        - { name: has_image, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, rating, name_asc, name_desc, sku_asc, sku_desc] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated products including non-public states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Admin]
      summary: Create a product
      x-error-codes: [BELOW_COST_BLOCKED, VARIANT_SKUS_DUPLICATED, VARIANT_SKU_DUPLICATE, VARIANT_BARCODES_DUPLICATED, VARIANT_BARCODE_DUPLICATE, BASE_CURRENCY_NOT_CONFIGURED, PRODUCT_PURCHASE_LIMIT_REQUIRED]
      description: Both `name_ar` and `name_en` are required and must contain non-whitespace text; validation errors identify the missing or empty field.
      x-permissions: [catalog.products, prices.change]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/PricingRateValidation" }
  /admin/products/bulk:
    post:
      tags: [Admin]
      summary: Apply one catalog change to up to 500 products
      description: Runs in one transaction. Reusing the operation id with the same payload returns the first result; a different payload returns 409.
      x-permissions: [catalog.products, prices.change]
      x-error-codes: [PRODUCT_IDS_DUPLICATED, PRODUCT_NOT_READY]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductBulkInput" }
      responses:
        "200":
          description: Per-product result list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductBulkResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/products/{id}:
    get:
      tags: [Admin]
      summary: Get any product, including hidden or archived
      x-permission: catalog.products
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [Admin]
      summary: Update a product
      x-error-codes: [BELOW_COST_BLOCKED, VARIANT_SKUS_DUPLICATED, VARIANT_SKU_DUPLICATE, VARIANT_BARCODES_DUPLICATED, VARIANT_BARCODE_DUPLICATE, BASE_CURRENCY_NOT_CONFIGURED, PRODUCT_PURCHASE_LIMIT_REQUIRED]
      description: >
        Omitted fields are preserved. Explicit null clears only nullable fields;
        `discount_type: null` clears the complete stored discount definition.
        Updating unrelated fields never changes a scheduled discount. A fixed
        price below protected cost is not applied: the response retains the
        live price and identifies the pending request for another user.
      x-permissions: [catalog.products, prices.change]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductPatch" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/PricingRateValidation" }
    delete:
      tags: [Admin]
      summary: Delete (archive) a product
      x-permission: catalog.products
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/products/{id}/delete:
    post:
      tags: [Admin]
      summary: Delete an unreferenced product or archive a referenced product
      description: Hard-deletes only a product with no durable order, stock, purchase, review, price-approval, or banner-action references. Transient cart and wishlist rows are removed safely. Otherwise the product is archived and the response identifies every blocking reference kind.
      x-permission: catalog.products
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "201":
          description: Product deletion outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDeleteResult" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/products/reindex:
    post:
      tags: [Admin]
      summary: Reindex all products and clear durable search-sync markers after success
      x-permission: catalog.products
      responses:
        "201":
          description: Search catch-up result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [queued, synchronized]
                properties:
                  queued: { type: integer, minimum: 0 }
                  synchronized: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------- ADMIN: CATEGORIES CRUD ----------------
  /admin/categories:
    get:
      tags: [Admin]
      summary: List all categories, including hidden categories
      description: Same parent/subtree filtering as the public route, without visibility filtering. Unlike public reads, description_ar and description_en are returned exactly as stored with no language fallback.
      x-permission: catalog.categories
      parameters:
        - { name: parent_id, in: query, schema: { type: string, format: uuid } }
        - { name: include_subtree, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Category tree including hidden nodes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Category" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Create a category
      description: Both `name_ar` and `name_en` are required and must contain non-whitespace text; validation errors identify the missing or empty field.
      x-permission: catalog.categories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryCreate" }
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/categories/{id}:
    patch:
      tags: [Admin]
      summary: Update a category
      description: Omitted fields are unchanged. Reparenting must preserve the hierarchy depth and cycle rules.
      x-permission: catalog.categories
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryPatch" }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Admin]
      summary: Delete a category
      description: Deletion is allowed only for a leaf category with no products; otherwise returns 409. Use is_visible=false to hide populated categories.
      x-permission: catalog.categories
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/categories/{id}/convert-to-brand:
    post:
      tags: [Admin]
      summary: Convert a reviewed leaf category to a brand
      description: Atomically creates the brand, moves the category's products to the selected subcategory, assigns the brand, deletes the source category, and records an audit event.
      x-permissions: [catalog.categories, catalog.brands]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryBrandConversionInput" }
      responses:
        "201":
          description: Converted category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryBrandConversion" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/brands:
    get:
      tags: [Admin]
      summary: Search and list all brands
      x-permission: catalog.brands
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Paginated brands, content: { application/json: { schema: { $ref: "#/components/schemas/BrandPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Admin]
      summary: Create a brand
      x-permission: catalog.brands
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BrandInput" } } }
      responses:
        "201": { description: Created brand, content: { application/json: { schema: { $ref: "#/components/schemas/Brand" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/brands/{id}:
    patch:
      tags: [Admin]
      summary: Update a brand
      x-permission: catalog.brands
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/BrandPatch" } } }
      responses:
        "200": { description: Updated brand, content: { application/json: { schema: { $ref: "#/components/schemas/Brand" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Admin]
      summary: Delete an unused brand
      description: A brand assigned to products must be hidden instead of deleted.
      x-permission: catalog.brands
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------- ADMIN: BANNERS CRUD ----------------
  /admin/banners:
    get:
      tags: [Admin]
      summary: List all home hero banners (including inactive and scheduled banners)
      x-permission: catalog.products
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated banners
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBannerPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Create a home hero banner
      x-permission: catalog.products
      x-error-codes: [BANNER_ACTION_URL_REQUIRED, BANNER_ACTION_TARGET_REQUIRED, BANNER_ACTION_TARGET_NOT_ALLOWED, BANNER_ACTION_TARGET_NOT_FOUND]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BannerCreate" }
      responses:
        "201":
          description: Created banner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBanner" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/banners/order:
    put:
      tags: [Admin]
      summary: Atomically replace the complete banner order
      description: The ids array must contain every stored banner exactly once; array position becomes sort_order.
      x-permission: catalog.products
      x-error-codes: [BANNER_ORDER_IDS_INVALID]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: All banners in their new order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminBanner" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/banners/defaults/swap:
    post:
      tags: [Admin]
      summary: Atomically replace one usable default banner with another
      description: The outgoing default is removed only in the same transaction that makes the active, in-schedule replacement a default, so the two-default invariant never blocks replacement.
      x-permission: catalog.products
      x-error-codes: [BANNER_DEFAULT_SWAP_INVALID, BANNER_DEFAULT_REPLACEMENT_NOT_USABLE]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BannerDefaultSwap" }
      responses:
        "200":
          description: The outgoing and incoming banners after the swap
          content:
            application/json:
              schema:
                type: array
                minItems: 2
                maxItems: 2
                items: { $ref: "#/components/schemas/AdminBanner" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/banners/{id}:
    get:
      tags: [Admin]
      summary: Get one home hero banner
      x-permission: catalog.products
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Banner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBanner" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Admin]
      summary: Update a home hero banner
      x-permission: catalog.products
      x-error-codes: [BANNER_ACTION_URL_REQUIRED, BANNER_ACTION_TARGET_REQUIRED, BANNER_ACTION_TARGET_NOT_ALLOWED, BANNER_ACTION_TARGET_NOT_FOUND, BANNER_DEFAULT_MINIMUM_REQUIRED]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BannerPatch" }
      responses:
        "200":
          description: Updated banner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBanner" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Admin]
      summary: Delete a home hero banner
      x-permission: catalog.products
      x-error-codes: [BANNER_DEFAULT_MINIMUM_REQUIRED]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------- ADMIN: ACCESS MANAGEMENT ----------------
  /admin/staff:
    get:
      tags: [Admin]
      summary: List staff accounts and their preset/extra grants
      x-surface: admin
      x-permission: users.manage
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, must_change] }
        - name: preset
          in: query
          schema: { type: string, format: uuid }
        - name: permission_key
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [name, username, created_at], default: name }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: Staff accounts
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffUserListResponse" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Create a staff account with a temporary password
      x-surface: admin
      x-permission: users.manage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StaffCreate" } } } }
      responses:
        "201": { description: Staff account created, content: { application/json: { schema: { $ref: "#/components/schemas/StaffUser" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/staff/{id}:
    patch:
      tags: [Admin]
      summary: Update or deactivate a staff account
      description: Deactivation invalidates all existing sessions before the next request.
      x-surface: admin
      x-permission: users.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StaffUpdate" } } } }
      responses:
        "200": { description: Updated staff account, content: { application/json: { schema: { $ref: "#/components/schemas/StaffUser" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/staff/{id}/password:
    post:
      tags: [Admin]
      summary: Set or reset a temporary staff password
      description: Revokes sessions and forces a password change at the next login.
      x-surface: admin
      x-permission: users.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StaffPasswordReset" } } } }
      responses:
        "201": { description: Password reset }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/staff/{id}/access:
    put:
      tags: [Admin]
      summary: Replace a staff account's presets and extra grants
      description: The permission version changes atomically, so the next request sees the new grants without login.
      x-surface: admin
      x-permission: users.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StaffAccess" } } } }
      responses:
        "200": { description: Access replaced, content: { application/json: { schema: { $ref: "#/components/schemas/StaffUser" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/presets:
    get:
      tags: [Admin]
      summary: List permission presets
      x-surface: admin
      x-permission: roles.manage
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: kind
          in: query
          schema: { type: string, enum: [system, custom] }
        - name: permission_key
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [name, permissions], default: name }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200": { description: Presets, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPresetListResponse" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Create a permission preset
      x-surface: admin
      x-permission: roles.manage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPresetInput" } } } }
      responses:
        "201": { description: Preset created, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPreset" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/presets/{id}:
    patch:
      tags: [Admin]
      summary: Update a permission preset
      x-surface: admin
      x-permission: roles.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPresetInput" } } } }
      responses:
        "200": { description: Preset updated, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPreset" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin]
      summary: Delete a non-system permission preset
      x-surface: admin
      x-permission: roles.manage
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/Reason" }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/permissions:
    get:
      tags: [Admin]
      summary: List the code-defined permission registry
      x-surface: admin
      x-permission: roles.manage
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 160 }
          description: Case-insensitive search across the stable key and Arabic/English presentation metadata.
      responses:
        "200":
          description: All permissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PermissionMetadata" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/work-phones:
    get:
      tags: [Admin]
      summary: List pre-registered work phones
      x-surface: admin
      x-permission: users.manage
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: role
          in: query
          schema: { type: string, enum: [delivery_agent, order_monitor] }
        - name: status
          in: query
          schema: { type: string, enum: [active, revoked] }
        - name: sort
          in: query
          schema: { type: string, enum: [name, phone, role], default: name }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200": { description: Work phones, content: { application/json: { schema: { $ref: "#/components/schemas/WorkPhoneListResponse" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Register or change a work phone role
      description: A phone already belonging to a customer is rejected with `CUSTOMER_PHONE_ALREADY_REGISTERED` (409).
      x-surface: admin
      x-permission: users.manage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkPhoneInput" } } } }
      responses:
        "201": { description: Work phone registered, content: { application/json: { schema: { $ref: "#/components/schemas/WorkPhone" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/work-phones/{phone}:
    delete:
      tags: [Admin]
      summary: Revoke a work phone immediately
      description: Existing app access and refresh tokens stop working on the next request.
      x-surface: admin
      x-permission: users.manage
      parameters:
        - name: phone
          in: path
          required: true
          schema: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        - { $ref: "#/components/parameters/Reason" }
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: List audit records newest first
      description: Results use creation time descending with ID descending as a stable tiebreak.
      x-surface: admin
      x-permission: audit.view
      parameters:
        - name: actor
          in: query
          description: Actor UUID, username, or name search.
          schema: { type: string, maxLength: 160 }
        - name: action
          in: query
          schema: { type: string, maxLength: 80 }
        - name: entity_type
          in: query
          schema: { type: string, maxLength: 80 }
        - name: entity_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated audit records
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditLogList" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/currencies:
    get:
      tags: [Finance]
      summary: List configured currencies
      x-surface: admin
      x-permission: fx_rates.view
      responses:
        "200":
          description: Currencies
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Currency" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/currencies/{code}:
    patch:
      tags: [Finance]
      summary: Enable a currency or select the base before the first movement
      x-surface: admin
      x-permission: settings.manage
      x-field-error-codes:
        settings.*: [unknown, isString]
        settings.store_name: [not_empty, max_length]
        settings.store_address: [not_empty, max_length]
        settings.store_phone: [not_empty, max_length]
        settings.store_legal_name_ar: [not_empty, max_length]
        settings.store_legal_name_en: [not_empty, max_length]
        settings.store_address_ar: [not_empty, max_length]
        settings.store_address_en: [not_empty, max_length]
        settings.support_hours_ar: [not_empty, max_length]
        settings.support_hours_en: [not_empty, max_length]
        settings.support_phone: [e164]
        settings.support_whatsapp: [e164]
        settings.support_email: [email]
        settings.privacy_email: [email]
        settings.refund_days: [non_negative_integer]
        settings.policy_effective_date: [date]
        settings.logo_url: [url]
        settings.primary_color: [hex_color]
        settings.timezone: [required, iana_timezone]
        settings.delivery_fee: [base_currency_amount]
        settings.sale_rounding_multiple: [base_currency_amount]
        settings.default_low_stock_threshold: [quantity_threshold]
        settings.markup_alert_percent: [percentage]
        settings.acceptance_alert_timeout_minutes: [required, positive_integer]
        settings.backdating_window_days: [required, positive_integer]
        settings.return_window_days: [positive_integer]
        settings.auto_cancel_enabled: [boolean]
        settings.discount_tier_coupon_stacking_enabled: [boolean]
        settings.separation_of_duties_level: [enum]
        settings.auto_cancel_timeout_minutes: [required, positive_integer]
        settings.auto_cancel_warning_minutes: [required, positive_integer, less_than_timeout]
        business_hours.*: [isObject, closed_hours]
        business_hours.*.weekday: [weekday, unique]
        business_hours.*.is_closed: [isBoolean]
        business_hours.*.opens_at: [time]
        business_hours.*.closes_at: [time, after_open]
        closed_days.*: [isObject]
        closed_days.*.date: [date, unique]
        closed_days.*.reason: [max_length]
        protection_thresholds.*: [unknown, percentage]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z]{3}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                is_base: { type: boolean }
      responses:
        "200": { description: Updated currency, content: { application/json: { schema: { $ref: "#/components/schemas/Currency" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/exchange-rates:
    get:
      tags: [Finance]
      summary: List exchange-rate history newest first
      x-surface: admin
      x-permission: fx_rates.view
      parameters:
        - name: currency_code
          in: query
          schema: { type: string, pattern: '^[A-Z]{3}$' }
      responses:
        "200": { description: Rates, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ExchangeRate" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Finance]
      summary: Record an effective exchange rate
      description: Input is `1 foreign = X base`; basis 100 is normalized to basis 1 before storage. `effective_at` is an exact timestamp and a future-effective rate is never applied early.
      x-surface: admin
      x-permission: fx_rates.update
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeRateInput" } } }
      responses:
        "201": { description: Recorded rate, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeRate" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/exchange-rates/{code}/applicable:
    get:
      tags: [Finance]
      summary: Resolve the latest rate effective at an instant
      x-surface: admin
      x-permission: fx_rates.view
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z]{3}$' }
        - name: at
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200": { description: Applicable rate with stale-today warning, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeRate" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ExchangeRateValidation" }

  /admin/exchange-rates/linked-price-preview:
    post:
      tags: [Finance]
      summary: Preview a pricing rate across every linked SKU
      x-error-codes: [FOREIGN_CURRENCY_REQUIRED, BASE_CURRENCY_NOT_CONFIGURED]
      description: Returns old/new prices and signed percentage changes plus a short-lived, actor-bound token. No rate or product price is changed.
      x-surface: admin
      x-permission: fx_rates.update
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LinkedPricePreviewInput" } } }
      responses:
        "201": { description: Linked-price preview, content: { application/json: { schema: { $ref: "#/components/schemas/LinkedPricePreview" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/exchange-rates/save-rate-only:
    post:
      tags: [Finance]
      summary: Save the previewed rate without publishing linked prices
      x-error-codes: [STALE_PRICE_PREVIEW]
      description: Linked SKUs keep their published price and are marked as awaiting this new rate.
      x-surface: admin
      x-permission: fx_rates.update
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LinkedPriceApplyInput" } } }
      responses:
        "201": { description: Rate saved, content: { application/json: { schema: { $ref: "#/components/schemas/LinkedPriceApplyResult" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/exchange-rates/publish-linked-prices:
    post:
      tags: [Finance]
      summary: Atomically save a rate and publish one linked-price version
      x-error-codes: [STALE_PRICE_PREVIEW, BASE_CURRENCY_NOT_CONFIGURED]
      description: Refuses an expired or stale preview. Conversion and configured upward rounding occur before product discounts. If a resulting price is below protected cost, no rate or price is saved; a pending approval request is created for a different user to approve or reject.
      x-surface: admin
      x-permissions: [fx_rates.update, prices.publish_linked]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LinkedPriceApplyInput" } } }
      responses:
        "201": { description: Rate and linked prices published, content: { application/json: { schema: { $ref: "#/components/schemas/LinkedPriceApplyResult" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/price-publish-approvals:
    get:
      tags: [Finance]
      summary: List below-cost price-publish approval requests
      x-error-codes: [DATE_RANGE_INVALID]
      description: Approvers can discover all requests; price proposers can read only their own requests. Cost fields require cost.view.
      x-surface: admin
      x-any-permissions: [sell_below_cost.approve, prices.change, prices.publish_linked]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
        - { name: proposer_id, in: query, schema: { type: string, format: uuid } }
        - { name: sku, in: query, schema: { type: string, maxLength: 80 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Paginated approval requests, content: { application/json: { schema: { $ref: "#/components/schemas/PricePublishApprovalPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/price-publish-approvals/{id}:
    get:
      tags: [Finance]
      summary: Get one below-cost price-publish approval request
      description: Approvers can read any request; a proposer can read their own request. Cost fields require cost.view.
      x-surface: admin
      x-any-permissions: [sell_below_cost.approve, prices.change, prices.publish_linked]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: Approval request, content: { application/json: { schema: { $ref: "#/components/schemas/PricePublishApproval" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/price-publish-approvals/{id}/decision:
    post:
      tags: [Finance]
      summary: Approve or reject a pending below-cost fixed or linked-price publish
      description: The authenticated proposer is stored server-side and can never decide their own request.
      x-surface: admin
      x-permission: sell_below_cost.approve
      x-error-codes: [APPROVAL_ALREADY_DECIDED, SELF_APPROVAL_FORBIDDEN, FIXED_PRICE_APPROVALS_UNAVAILABLE, FIXED_PRICE_PROPOSAL_UNAVAILABLE, PRICE_PREVIEW_UNAVAILABLE, STALE_PRICE_APPROVAL, STALE_PRICE_PREVIEW, BASE_CURRENCY_NOT_CONFIGURED]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PricePublishDecisionInput" } } }
      responses:
        "201": { description: Decided approval request, content: { application/json: { schema: { $ref: "#/components/schemas/PricePublishApproval" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/operations/{operationId}:
    get:
      tags: [Finance]
      summary: Get the caller's idempotent operation outcome
      x-surface: admin
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: Operation outcome, content: { application/json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/drafts:
    get:
      tags: [Finance]
      summary: List the caller's financial document drafts
      x-surface: admin
      responses:
        "200": { description: Drafts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DocumentDraft" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/drafts/{documentType}:
    parameters:
      - name: documentType
        in: path
        required: true
        schema: { type: string, maxLength: 60 }
    get:
      tags: [Finance]
      summary: Get the caller's draft
      x-surface: admin
      responses:
        "200": { description: Draft, content: { application/json: { schema: { $ref: "#/components/schemas/DocumentDraft" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Finance]
      summary: Save the caller's draft without financial effect
      x-surface: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payload]
              properties:
                payload: { type: object, additionalProperties: true }
      responses:
        "200": { description: Saved draft, content: { application/json: { schema: { $ref: "#/components/schemas/DocumentDraft" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Finance]
      summary: Discard the caller's draft
      x-surface: admin
      responses:
        "204": { description: Draft discarded }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/ledger/entries:
    get:
      tags: [Finance]
      summary: List immutable journal entries
      x-surface: admin
      x-permission: ledger.view
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - { name: account_code, in: query, schema: { type: string } }
        - { name: source_type, in: query, schema: { type: string } }
        - { name: source_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Journal page, content: { application/json: { schema: { $ref: "#/components/schemas/JournalEntryPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/ledger/entries/{id}:
    get:
      tags: [Finance]
