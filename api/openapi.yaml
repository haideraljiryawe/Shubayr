                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Updated order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/orders/{id}/shortage-resolution:
    post:
      tags: [Admin]
      summary: Propose a reduction or cancel a short line/order
      x-error-codes: [STALE_ORDER_STATE, ORDER_SHORTAGE_NOT_FOUND, PAID_COD_CANCELLATION_FORBIDDEN, ORDER_TRANSITION_NOT_ALLOWED]
      x-permission: orders.shortage.resolve
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, action, reason]
              properties:
                version: { type: integer, minimum: 1 }
                action: { type: string, enum: [reduce, cancel_line, cancel_order] }
                order_item_id: { type: string, format: uuid }
                new_quantity: { type: number, minimum: 0.001, multipleOf: 0.001 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Updated order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
