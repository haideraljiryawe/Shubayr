      description: Creates either a root department or one direct child category. A subcategory cannot have children.
      required: [name_en, name_ar]
      properties:
        parent_id: { type: [string, "null"], format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace English name. }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace Arabic name. }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 140 }
        description_en: { type: [string, "null"] }
        description_ar: { type: [string, "null"] }
        image_url: { type: [string, "null"], format: uri, description: "Stable URL returned by POST /media/images." }
        icon_key: { type: [string, "null"], pattern: '^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$', maxLength: 80 }
        sort_order: { type: integer, default: 0 }
        is_visible: { type: boolean, default: true }

    CategoryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: All fields are optional. parent_id null moves to root; a subcategory cannot have children and a category with children cannot become a child.
      properties:
        parent_id: { type: [string, "null"], format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*' }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 140 }
        description_en: { type: [string, "null"] }
        description_ar: { type: [string, "null"] }
        image_url: { type: [string, "null"], format: uri, description: "Stable URL returned by POST /media/images." }
        icon_key: { type: [string, "null"], pattern: '^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$', maxLength: 80 }
        sort_order: { type: integer, minimum: 0 }
        is_visible: { type: boolean }

    Brand:
      type: object
      additionalProperties: false
      required: [id, name_en, name_ar, slug, logo_url, is_visible, sort_order, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name_en: { type: string }
        name_ar: { type: string }
        slug: { type: string }
        logo_url: { type: [string, "null"], format: uri }
        is_visible: { type: boolean }
        sort_order: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BrandInput:
      type: object
      additionalProperties: false
      required: [name_en, name_ar, slug]
      properties:
        name_en: { type: string, minLength: 1, pattern: '.*\S.*' }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 140 }
        logo_url: { type: [string, "null"], format: uri }
        is_visible: { type: boolean, default: true }
        sort_order: { type: integer, minimum: 0, default: 0 }

    BrandPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name_en: { type: string, minLength: 1, pattern: '.*\S.*' }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 140 }
        logo_url: { type: [string, "null"], format: uri }
        is_visible: { type: boolean }
        sort_order: { type: integer, minimum: 0 }

    BrandPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/Brand" } }

    CategoryBrandConversionInput:
      type: object
      additionalProperties: false
      required: [name_en, name_ar, slug, target_category_id]
      properties:
        name_en: { type: string, minLength: 1, pattern: '.*\S.*' }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 140 }
        logo_url: { type: [string, "null"], format: uri }
        is_visible: { type: boolean, default: true }
        sort_order: { type: integer, minimum: 0, default: 0 }
        target_category_id: { type: string, format: uuid }

    CategoryBrandConversion:
      type: object
      additionalProperties: false
      required: [brand, moved_products, target_category_id]
      properties:
        brand: { $ref: "#/components/schemas/Brand" }
        moved_products: { type: integer, minimum: 0 }
        target_category_id: { type: string, format: uuid }

    Product:
      type: object
      description: >
        A catalog product. `in_stock` and `available_qty` are computed at read
        time (sum of batch_stock minus active batch reservations and temporary
        COD order holds); they are not stored on the product.
        Pricing works the same way: the product stores a regular `price` plus a
        discount DEFINITION (`discount_type`, `discount_value` and the scheduled
        window `discount_starts_at`/`discount_ends_at`), and the server derives
        `on_sale`, `discounted_price`, `effective_price` and `discount_percent`
        on every read. Those four are never stored, because a scheduled window
        changes what they mean as the clock moves.
        Reads populate an empty or missing `name_ar`/`name_en` from the other
        language so locale-specific clients never receive a blank name.
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        brand_id: { type: [string, "null"], format: uuid }
        brand: { oneOf: [ { $ref: "#/components/schemas/Brand" }, { type: "null" } ] }
        name_en: { type: string }
        name_ar: { type: string }
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money", multipleOf: 1, description: "Regular selling price in whole IQD." }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        discount_type: { type: [string, "null"], enum: [percentage, amount, null], description: "Discount kind, or null when the product has no discount defined." }
        discount_value: { type: [number, "null"], multipleOf: 0.01, description: "For `percentage`, the percentage off (10 means 10%, at most two decimals). For `amount`, the currency amount subtracted from `price`. Null when `discount_type` is null." }
        discount_starts_at: { type: [string, "null"], format: date-time, description: "Start of the scheduled discount window; null means the discount is active immediately." }
        discount_ends_at: { type: [string, "null"], format: date-time, description: "End of the scheduled discount window; null means the discount never expires." }
        on_sale: { type: boolean, readOnly: true, description: "Computed: true when discount_type is set AND now() falls inside [discount_starts_at, discount_ends_at], treating null bounds as open." }
        discounted_price: { type: [number, "null"], multipleOf: 1, readOnly: true, description: "Computed in whole IQD when on_sale is true and rounded half away from zero; null when on_sale is false." }
        effective_price: { $ref: "#/components/schemas/Money", readOnly: true, description: "The price the customer pays. Cart and order pricing use this exact value." }
        discount_percent: { type: [integer, "null"], readOnly: true, description: "Computed when on_sale is true: round((price - discounted_price) / price * 100). Null when on_sale is false." }
        tracks_expiry: { type: boolean }
        rating_avg: { type: number, description: "Cached average of published product reviews only, reconciled transactionally from review rows and rounded to two decimals half away from zero." }
        rating_count: { type: integer, description: "Cached count of published product reviews only; review rows are authoritative." }
        status: { type: string, enum: [active, hidden, archived] }
        in_stock: { type: boolean, description: "computed: available_qty > 0" }
        availability: { type: string, enum: [out_of_stock, low_stock, in_stock], description: "Best availability state among the product's SKUs." }
        available_qty: { type: number, multipleOf: 0.001, description: "computed: on-hand minus active batch reservations and temporary COD holds" }
        published_at: { type: [string, "null"], format: date-time }
        price_approved_at: { type: [string, "null"], format: date-time }
        price_proposed_by: { type: [string, "null"], format: uuid }
        price_update_status: { type: string, enum: [pending_approval], description: Present when this save created a below-cost fixed-price approval request and left the live price unchanged. }
        price_approval_request_id: { type: string, format: uuid, description: Present with price_update_status. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        images:
          type: array
          description: Ordered by sort_order; the first image is primary.
          items: { $ref: "#/components/schemas/ProductImage" }
        variants: { type: array, items: { $ref: "#/components/schemas/ProductVariant" } }

    ProductInput:
      type: object
      additionalProperties: false
      description: >
        Admin create and update requests require both names after trimming;
        neither may be empty. Pricing is written as a regular `price` plus an
        optional discount definition; the computed `on_sale`,
        `discounted_price`, `effective_price` and `discount_percent` fields are
        read-only and are never accepted on a write.


        Discount validation, each breach returning 422 `validation_error`:


        * `discount_type` set requires a `discount_value` greater than 0.

        * `percentage`: 0 < `discount_value` <= 100.

        * `amount`: 0 < `discount_value` < `price`.

        * `discount_type` null clears the whole discount; `discount_value` must
        then be null or omitted.

        * When both `discount_starts_at` and `discount_ends_at` are set,
        `discount_ends_at` must be strictly after `discount_starts_at`.

        * Either timestamp may be sent alone: a null start means the discount is
        active immediately, a null end means it never expires.
      required: [category_id, name_en, name_ar, price, variants]
      properties:
        below_cost_override_reason: { type: [string, "null"], maxLength: 500 }
        category_id: { type: string, format: uuid }
        brand_id: { type: [string, "null"], format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace English name. }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace Arabic name. }
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money", multipleOf: 1, minimum: 0, description: "Regular selling price in whole IQD." }
        discount_type: { type: [string, "null"], enum: [percentage, amount, null], default: null, description: "Null (the default) means no discount and clears any discount already stored." }
        discount_value: { type: [number, "null"], multipleOf: 0.01, exclusiveMinimum: 0, description: "Required when discount_type is set, and must be null or omitted otherwise. percentage: at most 100. amount: strictly less than price." }
        discount_starts_at: { type: [string, "null"], format: date-time, description: "Optional window start; null means the discount is active immediately." }
        discount_ends_at: { type: [string, "null"], format: date-time, description: "Optional window end; null means the discount never expires. Must be after discount_starts_at when both are set." }
        tracks_expiry: { type: boolean, default: false }
        status: { type: string, enum: [active, hidden, archived], default: hidden }
        published: { type: boolean, default: false, description: "Publishing also requires at least one SKU with an approved effective selling price." }
        images:
          type: array
          description: Ordered creation list; array index becomes sort_order and index 0 is primary.
          items:
            type: object
            additionalProperties: false
            required: [url]
            properties:
              url: { type: string, format: uri, description: "Stable URL returned by POST /media/images." }
        variants:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ProductVariantInput" }

    ProductPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: All ProductInput fields are optional on PATCH. Omission preserves the stored value. Explicit null clears a nullable field; discount_type null clears discount_type, discount_value, discount_starts_at, and discount_ends_at together.
      properties:
        below_cost_override_reason: { type: [string, "null"], maxLength: 500 }
        category_id: { type: string, format: uuid }
        brand_id: { type: [string, "null"], format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*' }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*' }
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money", multipleOf: 1, minimum: 0 }
        discount_type: { type: [string, "null"], enum: [percentage, amount, null] }
        discount_value: { type: [number, "null"], multipleOf: 0.01, exclusiveMinimum: 0 }
        discount_starts_at: { type: [string, "null"], format: date-time }
        discount_ends_at: { type: [string, "null"], format: date-time }
        tracks_expiry: { type: boolean }
        status: { type: string, enum: [active, hidden, archived] }
        published: { type: boolean }
        media_operations:
          type: array
          description: Applied atomically in array order; the image at final position 0 is primary.
          items: { $ref: "#/components/schemas/ProductMediaOperation" }
        variants:
          type: array
          description: >
            Replaces the variant set in place. Each entry is matched to an
            existing variant by `id` when supplied and otherwise by `sku`, so
            an update never reissues variant ids. Omitting a variant removes
            it; removing one still referenced by inventory, cart, purchasing
            or order history is rejected with 422.
          items: { $ref: "#/components/schemas/ProductVariantInput" }

    ProductVariantInput:
      type: object
      additionalProperties: false
      required: [sku]
      properties:
        id: { type: string, format: uuid, description: "Existing SKU identity on update." }
        sku: { type: string, minLength: 1, maxLength: 80 }
        attributes: { type: object, additionalProperties: true }
        price_delta: { type: integer, deprecated: true, description: "Compatibility input; translated to a fixed selling_price override." }
        base_unit: { type: string, minLength: 1, maxLength: 32, default: piece }
        whole_units_only: { type: boolean, default: true }
        selling_price: { type: [integer, "null"], minimum: 0, description: "Fixed-price override; null inherits the product price." }
        low_stock_threshold: { type: [number, "null"], multipleOf: 0.001, minimum: 0, description: "Null inherits the store default." }
        pricing_mode: { type: string, enum: [fixed, linked], default: fixed }
        reference_currency_code: { type: [string, "null"], pattern: '^[A-Z]{3}$' }
        reference_price: { type: [number, "null"], exclusiveMinimum: 0, multipleOf: 0.000001 }

    ProductImage:
      type: object
      additionalProperties: false
      required: [id, url, sort_order, is_primary]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        sort_order: { type: integer, minimum: 0 }
        is_primary: { type: boolean, readOnly: true, description: True exactly when this is the first image. }

    ProductMediaOperation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [op, url, position]
          properties:
            op: { const: add }
            url: { type: string, format: uri, description: "Stable URL returned by POST /media/images." }
            position: { type: integer, minimum: 0 }
        - type: object
          additionalProperties: false
          required: [op, image_id]
          properties:
            op: { const: remove }
            image_id: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [op, image_id, url]
          properties:
            op: { const: replace }
            image_id: { type: string, format: uuid }
            url: { type: string, format: uri, description: "Stable URL returned by POST /media/images." }
        - type: object
          additionalProperties: false
          required: [op, image_id, position]
          properties:
            op: { const: move }
            image_id: { type: string, format: uuid }
            position: { type: integer, minimum: 0 }
      discriminator: { propertyName: op }

    Banner:
      type: object
      additionalProperties: false
      required: [id, title, subtitle, image_url, cta_text, link_url, sort_order, is_active, starts_at, ends_at, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        image_url: { type: string, format: uri }
        cta_text: { type: [string, "null"] }
        link_url: { type: [string, "null"], format: uri }
        sort_order: { type: integer }
        is_active: { type: boolean }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    BannerCreate:
      type: object
      additionalProperties: false
      required: [title, image_url]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        subtitle: { type: [string, "null"] }
        image_url: { type: string, format: uri, description: "Stable URL returned by POST /media/images." }
        cta_text: { type: [string, "null"], maxLength: 120 }
        link_url: { type: [string, "null"], format: uri }
        sort_order: { type: integer, minimum: 0, default: 0 }
        is_active: { type: boolean, default: true }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }

    BannerPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted properties retain their stored values; explicit null clears nullable text or schedule properties.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        subtitle: { type: [string, "null"] }
        image_url: { type: string, format: uri, description: "Stable URL returned by POST /media/images." }
        cta_text: { type: [string, "null"], maxLength: 120 }
        link_url: { type: [string, "null"], format: uri }
        sort_order: { type: integer, minimum: 0 }
        is_active: { type: boolean }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }

    BannerPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Banner" }

    ProductVariant:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        attributes: { type: [object, "null"], additionalProperties: true }
        price_delta: { type: integer }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        base_unit: { type: string }
        whole_units_only: { type: boolean }
        selling_price: { type: [number, "null"], multipleOf: 1, description: "Fixed override; null inherits the product price." }
        low_stock_threshold: { type: [number, "null"], multipleOf: 0.001 }
        pricing_mode: { type: string, enum: [fixed, linked] }
        reference_currency_code: { type: [string, "null"], pattern: '^[A-Z]{3}$' }
        reference_price: { type: [number, "null"], multipleOf: 0.000001 }
        published_price: { type: [number, "null"], multipleOf: 1 }
        price_approved_at: { type: [string, "null"], format: date-time }
        price_proposed_by: { type: [string, "null"], format: uuid }
        price_version_id: { type: [string, "null"], format: uuid }
        awaiting_rate_id: { type: [string, "null"], format: uuid }
        on_sale: { type: boolean }
        discounted_price: { type: [number, "null"], multipleOf: 1 }
        effective_price: { type: number, multipleOf: 1, description: "SKU price after linked conversion or fixed inheritance, then product discount." }
        discount_percent: { type: [integer, "null"] }
        available_qty: { type: number, multipleOf: 0.001 }
        availability: { type: string, enum: [out_of_stock, low_stock, in_stock] }
        in_stock: { type: boolean }
        updated_at: { type: string, format: date-time }

    ProductAvailability:
      type: object
      description: Computed availability (on-hand minus active batch reservations and temporary COD holds) per product & variant.
      properties:
        product_id: { type: string, format: uuid }
        in_stock: { type: boolean }
        availability: { type: string, enum: [out_of_stock, low_stock, in_stock] }
        available_qty: { type: number, multipleOf: 0.001, description: "total sellable across variants" }
        variants:
          type: array
          items:
            type: object
            properties:
              variant_id: { type: string, format: uuid }
              sku: { type: string }
              base_unit: { type: string }
              whole_units_only: { type: boolean }
              low_stock_threshold: { type: number, multipleOf: 0.001 }
              available_qty: { type: number, multipleOf: 0.001 }
              availability: { type: string, enum: [out_of_stock, low_stock, in_stock] }
              in_stock: { type: boolean }

    ProductPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Product" }
            facets:
              type: object
              required: [brands]
              properties:
                brands:
                  type: array
                  items:
                    type: object
                    required: [brand_id, count]
                    properties:
                      brand_id: { type: string, format: uuid }
                      count: { type: integer, minimum: 0 }

    Cart:
      type: object
      required: [id, items, subtotal, discount, delivery_fee, total, coupon_code, currency]
      properties:
        id: { type: string, format: uuid }
        coupon_code: { type: [string, "null"] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        items:
          type: array
          items:
            type: object
            required: [id, product_id, variant_id, quantity, unit_price, price_version, current_unit_price, current_price_version, price_changed, line_total, currency, available, available_qty]
            properties:
              id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              variant_id: { type: string, format: uuid }
              quantity: { type: number, multipleOf: 0.001, minimum: 0.001, maximum: 99 }
              unit_price: { $ref: "#/components/schemas/Money", description: "Price the customer last saw for this line." }
              price_version: { type: string, maxLength: 64 }
              current_unit_price: { $ref: "#/components/schemas/Money" }
              current_price_version: { type: string, maxLength: 64 }
              price_changed: { type: boolean }
              line_total: { $ref: "#/components/schemas/Money", description: "Line total at the price the customer saw." }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              available: { type: boolean, description: "False when the product is hidden/inactive or available_qty is below quantity. Checkout rejects unavailable lines." }
              available_qty: { type: number, multipleOf: 0.001, minimum: 0 }
        subtotal: { $ref: "#/components/schemas/Money" }
        discount: { $ref: "#/components/schemas/Money", description: "Valid coupon discount only; catalog markdown is already in unit_price." }
        delivery_fee: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }

    WishlistItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        added_at: { type: string, format: date-time }
        product: { $ref: "#/components/schemas/Product" }

    WishlistPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/WishlistItem" }

    Coupon:
      type: object
      required: [code, type, value, currency]
      properties:
        code: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        value: { type: number }
        currency: { type: string, pattern: '^[A-Z]{3}$' }

    OrderStatus:
      type: string
      description: Canonical order lifecycle status (matches orders.status in schema.sql).
      enum:
        - pending
        - confirmed
        - preparing
        - ready_for_dispatch
        - dispatched
        - delivered
        - failed
        - rejected
        - cancelled
        - return_requested
        - returned

    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid, description: "order_item_id — reference this from reviews & returns" }
        product_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        product_name_ar: { type: string, description: "Arabic product name captured when the order is created." }
        product_name_en: { type: string, description: "English product name captured when the order is created." }
        image_url: { type: [string, "null"], format: uri, description: "Primary product image URL captured when the order is created." }
        quantity: { type: number, multipleOf: 0.001 }
        unit_price: { $ref: "#/components/schemas/Money", description: "The product's effective_price captured when the order is created, so a later discount edit or window expiry never rewrites a placed order." }
        price_version: { type: string, maxLength: 64 }
        line_total: { $ref: "#/components/schemas/Money" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        reviewed: { type: boolean, readOnly: true, description: True when the caller already has a product review for this order item. }

    OrderPriceChangeInfo:
      type: object
      additionalProperties: false
      required: [accepted_at, lines]
      properties:
        accepted_at: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [variant_id, unit_price, price_version]
            properties:
              variant_id: { type: string, format: uuid }
              unit_price: { $ref: "#/components/schemas/Money" }
              price_version: { type: string, minLength: 1, maxLength: 64 }

    OrderAttentionDetails:
      type: object
      additionalProperties: false
      required: [short_lines]
      properties:
        short_lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [order_item_id, variant_id, requested, allocated, short]
            properties:
              order_item_id: { type: string, format: uuid }
              variant_id: { type: string, format: uuid }
              requested: { type: string }
              allocated: { type: string }
              short: { type: string }
        reduction_proposal:
          type: object
          additionalProperties: false
          required: [order_item_id, old_quantity, new_quantity, reason, status, requested_by, requested_at]
          properties:
            order_item_id: { type: string, format: uuid }
            old_quantity: { type: number, multipleOf: 0.001 }
            new_quantity: { type: number, multipleOf: 0.001 }
            reason: { type: string }
            status: { type: string, enum: [pending, accepted, denied] }
            requested_by: { type: string, format: uuid }
            requested_at: { type: string, format: date-time }
            resolved_at: { type: string, format: date-time }

    OrderBase:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        version: { type: integer, minimum: 1, description: Required on every state-changing order request. }
        payment_method: { type: string, enum: [cod] }
        address_id: { type: [string, "null"], format: uuid, description: "Original address reference; null if that address was later deleted. Delivery snapshots remain unchanged." }
        delivery_id: { type: [string, "null"], format: uuid, description: Current delivery reachable by this order's owner. }
        subtotal: { $ref: "#/components/schemas/Money" }
        delivery_fee: { $ref: "#/components/schemas/Money" }
        discount: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        delivery_contact_phone: { type: string, description: Immutable checkout snapshot. }
        delivery_address_label: { type: [string, "null"], description: Immutable checkout snapshot. }
        delivery_city: { type: string, description: Immutable checkout snapshot. }
        delivery_area: { type: [string, "null"], description: Immutable checkout snapshot. }
        delivery_street: { type: [string, "null"], description: Immutable checkout snapshot. }
        delivery_details: { type: [string, "null"], description: Immutable checkout snapshot. }
        delivery_lat: { type: [number, "null"], format: double, description: Immutable checkout snapshot. }
        delivery_lng: { type: [number, "null"], format: double, description: Immutable checkout snapshot. }
        placed_at: { type: string, format: date-time }
        acceptance_deadline: { type: [string, "null"], format: date-time }
        auto_cancel_deadline: { type: [string, "null"], format: date-time }
        late_for_acceptance: { type: boolean }
        cancellation_request:
          oneOf:
            - type: "null"
            - type: object
              properties:
                status: { type: string, enum: [pending, approved, denied] }
                reason: { type: [string, "null"] }
                requested_at: { type: [string, "null"], format: date-time }
                resolved_at: { type: [string, "null"], format: date-time }
                resolution_note: { type: [string, "null"] }
        price_change_info:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/OrderPriceChangeInfo" }
        inventory_attention_required: { type: boolean }
        attention_details:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/OrderAttentionDetails" }
        collection:
          oneOf:
            - { $ref: "#/components/schemas/OrderCollectionResult" }
            - { type: "null" }
        timeline:
          type: array
          items:
            type: object
            properties:
              status: { $ref: "#/components/schemas/OrderStatus" }
              note: { type: [string, "null"] }
              at: { type: string, format: date-time }
        retrievals:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              document_number: { type: string }
              status: { type: string, enum: [open, partially_received, received, closed] }
              outcome: { type: string, enum: [cancel, retry] }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }

    Order:
      allOf:
        - $ref: "#/components/schemas/OrderBase"
        - type: object
          required: [delivery_attempts]
          properties:
            delivery_attempts:
              type: array
              description: Immutable chronological history without courier or delivery-party identity.
              items: { $ref: "#/components/schemas/CustomerDeliveryAttempt" }

    OrderPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Order" }

    AdminOrder:
      allOf:
        - $ref: "#/components/schemas/OrderBase"
        - type: object
          required: [customer, shipping_snapshot, payments, delivery, delivery_attempts, status_events]
          properties:
            delivery_attempts:
              type: array
              description: Staff history retains the assigned internal agent or external driver's identity.
              items: { $ref: "#/components/schemas/DeliveryAttempt" }
            customer:
              type: object
              required: [id, name, phone, email]
              properties:
                id: { type: string, format: uuid }
                name: { type: [string, "null"] }
                phone: { type: string }
                email: { type: [string, "null"] }
            shipping_snapshot:
              type: object
              description: Immutable checkout shipping and contact values.
              properties:
                contact_phone: { type: string }
                address_label: { type: [string, "null"] }
                city: { type: string }
                area: { type: [string, "null"] }
                street: { type: [string, "null"] }
                details: { type: [string, "null"] }
                lat: { type: [number, "null"] }
                lng: { type: [number, "null"] }
            payments:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  method: { type: string, enum: [cod] }
                  status: { type: string, enum: [pending, paid, refunded, failed] }
                  amount: { $ref: "#/components/schemas/Money" }
                  currency: { type: string, pattern: '^[A-Z]{3}$' }
                  paid_at: { type: [string, "null"], format: date-time }
            delivery:
              type: [object, "null"]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [assigned, out_for_delivery, delivered, failed, returned] }
                delivery_fee: { $ref: "#/components/schemas/Money" }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                dispatched_at: { type: [string, "null"], format: date-time }
                delivered_at: { type: [string, "null"], format: date-time }
                failure_reason: { type: [string, "null"], maxLength: 500 }
                failed_at: { type: [string, "null"], format: date-time }
                retry_count: { type: integer, minimum: 0 }
                agent:
                  type: [object, "null"]
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: [string, "null"] }
                    phone: { type: string }
                    email: { type: [string, "null"] }
                party:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [id, kind, name, phone]
                      properties:
                        id: { type: string, format: uuid }
                        kind: { type: string, enum: [internal_agent, external_driver] }
                        name: { type: string }
                        phone: { type: string }
                    - { type: "null" }
            status_events:
              type: array
              items:
                type: object
                properties:
                  status: { $ref: "#/components/schemas/OrderStatus" }
                  note: { type: [string, "null"] }
                  at: { type: string, format: date-time }

    AdminOrderPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [badge_counts, data]
          properties:
            badge_counts:
              type: object
              additionalProperties: false
              required: [late, needs_attention, pending_cancellation]
              properties:
                late: { type: integer, minimum: 0 }
                needs_attention: { type: integer, minimum: 0 }
                pending_cancellation: { type: integer, minimum: 0 }
            data:
              type: array
              items: { $ref: "#/components/schemas/AdminOrder" }

    DeliveryAgent:
      type: object
      additionalProperties: false
      required: [id, name, phone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }

    DeliveryAgentPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/DeliveryAgent" }

    MonitorOrderListItem:
      type: object
      required: [id, order_number, status, customer_name, customer_phone, total, payment_method, placed_at]
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        customer_name: { type: [string, "null"] }
        customer_phone: { type: string }
        total: { $ref: "#/components/schemas/Money" }
        payment_method: { type: string, enum: [cod] }
        placed_at: { type: string, format: date-time }

    MonitorOrderPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [status_counts, data]
          properties:
            status_counts:
              type: object
              description: Counts with q and Baghdad date filters applied and status excluded.
              additionalProperties: { type: integer, minimum: 0 }
            data:
              type: array
              items: { $ref: "#/components/schemas/MonitorOrderListItem" }

    MonitorOrderDetail:
      type: object
      description: Intentionally excludes product image fields.
      required: [id, order_number, status, customer, shipping_snapshot, items, subtotal, delivery_fee, discount, total, currency, payment_method, placed_at]
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        customer:
          type: object
          required: [name, phone]
          properties:
            name: { type: [string, "null"] }
            phone: { type: string }
        shipping_snapshot:
          type: object
          properties:
            contact_phone: { type: string }
            address_label: { type: [string, "null"] }
            city: { type: string }
            area: { type: [string, "null"] }
            street: { type: [string, "null"] }
            details: { type: [string, "null"] }
            lat: { type: [number, "null"] }
            lng: { type: [number, "null"] }
        items:
          type: array
          items:
            type: object
            required: [id, product_id, variant_id, product_name_ar, product_name_en, quantity, unit_price, line_total, currency]
            properties:
              id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              variant_id: { type: [string, "null"], format: uuid }
              product_name_ar: { type: string }
              product_name_en: { type: string }
              quantity: { type: number, multipleOf: 0.001 }
              unit_price: { $ref: "#/components/schemas/Money" }
              line_total: { $ref: "#/components/schemas/Money" }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotal: { $ref: "#/components/schemas/Money" }
        delivery_fee: { $ref: "#/components/schemas/Money" }
        discount: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        payment_method: { type: string, enum: [cod] }
        placed_at: { type: string, format: date-time }

    OrderTracking:
      type: object
      properties:
        order_id: { type: string, format: uuid }
        events:
          type: array
          items:
            type: object
            properties:
              status: { $ref: "#/components/schemas/OrderStatus" }
              note: { type: [string, "null"] }
              at: { type: string, format: date-time }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        order_item_id: { type: [string, "null"], format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"] }
        verified_purchase: { type: boolean }
        status: { type: string, enum: [pending, published, rejected] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        moderation_reason: { type: [string, "null"], maxLength: 500 }
        moderated_by: { type: [string, "null"], format: uuid }
        moderated_at: { type: [string, "null"], format: date-time }

    ReviewPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Review" }

    CustomerReview:
      allOf:
        - $ref: "#/components/schemas/Review"
        - type: object
          required: [product]
          properties:
            product:
              type: object
              additionalProperties: false
              required: [id, name_en, name_ar]
              properties:
                id: { type: string, format: uuid }
                name_en: { type: string }
                name_ar: { type: string }

    CustomerReviewPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/CustomerReview" }

    DeliveryRating:
      type: object
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        agent_id: { type: [string, "null"], format: uuid }
        user_id: { type: string, format: uuid }
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    LoyaltyAccount:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        points_balance: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        ledger:
          type: array
          items: { $ref: "#/components/schemas/LoyaltyLedgerEntry" }

    LoyaltyLedgerEntry:
      type: object
      description: Immutable signed points entry; account ownership identifies the customer.
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        order_id: { type: [string, "null"], format: uuid }
        return_id: { type: [string, "null"], format: uuid }
        type: { type: string, enum: [earn, redeem, adjust, expire] }
        reason: { type: string }
        points: { type: integer, description: Positive for earn; negative for redeem; signed for adjust. }
        note: { type: [string, "null"] }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    LoyaltyRedemption:
      type: object
      properties:
        entry: { $ref: "#/components/schemas/LoyaltyLedgerEntry" }
        points_balance: { type: integer }
        redemption_value: { $ref: "#/components/schemas/Money", description: Server-derived indicative value at one point per minor currency unit. }

    LoyaltyAdjustment:
      type: object
      properties:
        entry: { $ref: "#/components/schemas/LoyaltyLedgerEntry" }
        points_balance: { type: integer }

    Supplier:
      type: object
      additionalProperties: false
      required: [id, name, default_currency, payment_terms_days, is_active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        address: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        default_currency: { type: string, enum: [IQD, USD] }
        payment_terms_days: { type: integer, minimum: 0 }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DeliveryPartyCustodySummary:
      type: object
      additionalProperties: false
      required: [cash_held, oldest_item_age_days, orders_held]
      properties:
        goods_value_iqd: { type: number, minimum: 0, description: Present only with cost.view; sums open goods-custody holdings at fixed issue cost. }
        cash_held: { type: number, minimum: 0, description: Confirmed COD cash currently held for the store. }
        oldest_item_age_days: { type: [integer, "null"], minimum: 0, description: Oldest open goods or cash custody item in Baghdad business days. }
        orders_held: { type: integer, minimum: 0, description: Distinct orders with goods currently in this party's custody. }

    SupplierInput:
      type: object
      additionalProperties: false
      required: [name, default_currency, payment_terms_days]
      properties:
        name: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        address: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        default_currency: { type: string, enum: [IQD, USD] }
        payment_terms_days: { type: integer, minimum: 0, maximum: 3650 }

    SupplierPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: [string, "null"], maxLength: 32 }
        email: { type: [string, "null"], maxLength: 160 }
        address: { type: [string, "null"], maxLength: 1000 }
        notes: { type: [string, "null"], maxLength: 2000 }
        default_currency: { type: string, enum: [IQD, USD] }
        payment_terms_days: { type: integer, minimum: 0, maximum: 3650 }
        is_active: { type: boolean }

    SupplierPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Supplier" }

    PurchaseInvoice:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        created_by_name: { type: string }
        supplier_id: { type: string, format: uuid }
        invoice_number: { type: [string, "null"] }
        total_cost: { type: number }
        status: { type: string, enum: [draft, received, posted, cancelled] }
        received_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              invoice_id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              variant_id: { type: [string, "null"], format: uuid }
              location_id: { type: string, format: uuid }
              purchase_quantity: { type: number, multipleOf: 0.001 }
              pack_size: { type: number, multipleOf: 0.001 }
              quantity: { type: number, multipleOf: 0.001 }
              unit_cost: { type: number }
              base_unit_cost_currency: { type: number }
              line_total_currency: { type: number }
              landed_cost_share_iqd: { type: number }
              landed_unit_cost_iqd: { type: number }
              currency_code: { type: string, enum: [IQD, USD] }
              lot_number: { type: [string, "null"] }
              expiry_date: { type: [string, "null"], format: date-time }
              lot_id: { type: [string, "null"], format: uuid }
              created_at: { type: string, format: date-time }
              variant: { $ref: "#/components/schemas/ProductVariant" }
              location: { $ref: "#/components/schemas/WarehouseLocation" }
              lot: { $ref: "#/components/schemas/InventoryBatch" }

    PurchaseInvoicePage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/PurchaseInvoice" } }

    PostingDocumentInput:
      type: object
      additionalProperties: true
      required: [operation_id, document_date]
      properties:
        operation_id: { type: string, minLength: 8, maxLength: 128 }
        document_date: { type: string, format: date }
        accounting_date: { type: string, format: date }
        backdate_reason: { type: string, minLength: 3, maxLength: 500 }

    SupplierOpeningInput:
      allOf:
        - $ref: "#/components/schemas/PostingDocumentInput"
        - type: object
          required: [currency_code, amount, exchange_rate]
          properties:
            currency_code: { type: string, enum: [IQD, USD] }
            amount: { type: string, pattern: '^\\d+(\\.\\d{1,6})?$' }
            exchange_rate: { type: string, pattern: '^\\d+(\\.\\d{1,10})?$' }
            due_date: { type: string, format: date }

    PurchaseInvoiceInput:
      allOf:
        - $ref: "#/components/schemas/PostingDocumentInput"
        - type: object
          required: [supplier_id, currency_code, default_location_id, allocation_method, lines]
          properties:
            supplier_id: { type: string, format: uuid }
            supplier_invoice_number: { type: string, maxLength: 80 }
            currency_code: { type: string, enum: [IQD, USD] }
            exchange_rate: { type: string }
            default_location_id: { type: string, format: uuid }
            allocation_method: { type: string, enum: [value, quantity, manual] }
            due_date: { type: string, format: date }
            notes: { type: string, maxLength: 2000 }
            lines:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [variant_id, quantity, unit_cost]
