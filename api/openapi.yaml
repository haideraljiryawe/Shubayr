        content:
          application/json:
            schema: { $ref: "#/components/schemas/BannerCreate" }
      responses:
        "201":
          description: Created banner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Banner" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/banners/{id}:
    get:
      tags: [Admin]
      summary: Get one home hero banner
