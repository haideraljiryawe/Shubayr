        cta_text: { type: [string, "null"], description: "Legacy single-language CTA label." }
        link_url: { type: [string, "null"], format: uri, description: "Legacy URL field and the URL for action_type=url." }
        internal_name: { type: string, description: "Admin identifier; falls back to legacy title when unset." }
        title_ar: { type: string, description: "Arabic title; falls back to English then legacy title." }
        title_en: { type: string, description: "English title; falls back to Arabic then legacy title." }
        subtitle_ar: { type: [string, "null"], description: "Arabic subtitle; falls back to English then legacy subtitle." }
        subtitle_en: { type: [string, "null"], description: "English subtitle; falls back to Arabic then legacy subtitle." }
        cta_label_ar: { type: [string, "null"], description: "Arabic CTA; falls back to English then legacy cta_text." }
        cta_label_en: { type: [string, "null"], description: "English CTA; falls back to Arabic then legacy cta_text." }
        show_text: { type: boolean, description: "False means clients render image-only artwork with no text overlay." }
        action_type: { type: string, enum: [none, url, product, category, offers] }
