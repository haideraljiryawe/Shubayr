          content:
            application/json:
              schema: { $ref: "#/components/schemas/Banner" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/banners/{id}:
    get:
      tags: [Admin]
