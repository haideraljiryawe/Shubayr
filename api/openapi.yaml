              product_name_en: { type: string }
              variant_id: { type: string, format: uuid }
              variant_sku: { type: string }
              variant_attributes: { type: [object, "null"], additionalProperties: true }
              quantity: { type: number, multipleOf: 0.001 }
              base_unit: { type: string, minLength: 1, maxLength: 32 }
              whole_units_only: { type: boolean }
              unit_price: { $ref: "#/components/schemas/Money" }
