  # ---------------- RETURNS ----------------
  /returns:
    get:
      tags: [Returns]
      summary: List the authenticated customer's returns
      description: Returns only rows whose user_id is the authenticated caller, newest first, with pagination applied after ownership scoping.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          schema:
            {
              type: string,
              enum:
                [
                  requested,
                  approved,
                  partially_approved,
                  rejected,
                  received,
                  inspected,
                  refunded,
                  completed,
                ],
            }
      responses:
        "200":
          description: Caller-owned returns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnPage" }
    post:
      tags: [Returns]
      summary: Request a partial or full return of a delivered order
      description: Only the order owner can request a return within the configured return window. Pending quantities reserve eligibility. Refund and points estimates use immutable per-line order allocations, never current catalog prices.
      x-error-codes:
        [
          RETURN_ORDER_NOT_DELIVERED,
          RETURN_DELIVERY_NOT_FOUND,
          RETURN_WINDOW_EXPIRED,
          RETURN_ITEMS_REQUIRED,
          RETURN_ITEM_DUPLICATE,
          RETURN_ITEM_NOT_ON_ORDER,
          RETURN_QUANTITY_EXCEEDS_ELIGIBLE,
          RETURN_QUANTITY_INVALID,
          RETURN_QUANTITY_PRECISION,
          SKU_WHOLE_UNITS_ONLY,
        ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, operation_id, items]
              properties:
                order_id: { type: string, format: uuid }
                operation_id: { type: string, minLength: 8, maxLength: 128 }
                reason: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [order_item_id, quantity, reason, reason_code]
                    properties:
                      order_item_id: { type: string, format: uuid }
                      quantity:
                        { type: number, multipleOf: 0.001, minimum: 0.001 }
                      reason: { type: string, minLength: 1, maxLength: 1000 }
                      reason_code:
                        {
                          type: string,
                          enum:
                            [
                              change_of_mind,
                              defect,
                              store_error,
                              wrong_item,
                              other,
                            ],
                        }
      responses:
        "201":
          description: Created return request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /returns/queue:
    get:
      tags: [Returns]
      summary: List all returns for staff review
      x-permission: returns.view
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          schema:
            {
              type: string,
              enum:
                [
                  requested,
                  approved,
                  partially_approved,
                  rejected,
                  received,
                  inspected,
                  refunded,
                  completed,
                ],
            }
        - {
            name: customer_id,
            in: query,
            schema: { type: string, format: uuid },
          }
        - { name: customer_phone, in: query, schema: { type: string, maxLength: 32 } }
        - { name: order_id, in: query, schema: { type: string, format: uuid } }
        - { name: order_number, in: query, schema: { type: string, maxLength: 40 } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - {
            name: sort_by,
            in: query,
            schema:
