      responses:
        "200":
          description: Approved or rejected return
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Return" } },
            }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /returns/{id}/delivery-fee-preview:
    post:
      tags: [Returns]
      summary: Preview the delivery-fee return policy for proposed approved quantities
      x-permission: returns.approve
      x-error-codes: [RETURN_INVALID_STATE, RETURN_APPROVAL_LINES_INVALID, RETURN_APPROVAL_EXCEEDS_REQUEST, SKU_WHOLE_UNITS_ONLY]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
