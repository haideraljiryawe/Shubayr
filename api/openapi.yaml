        batch_id: { type: string, format: uuid }
        lot_number: { type: [string, "null"] }
        sku: { type: string }
        quantity: { type: number, multipleOf: 0.001 }
        running_quantity: { type: number, multipleOf: 0.001 }
        value_iqd: { type: number, description: Present only with cost.view. }
        running_value_iqd: { type: number, description: Present only with cost.view. }

    DeliveryPartyStatementPage:
      allOf:
