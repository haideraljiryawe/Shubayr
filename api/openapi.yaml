  # ---------------- ADMIN: ORDERS ----------------
  /admin/orders:
    get:
      tags: [Admin]
      summary: List all orders (staff) with filters
      x-permission: orders.view
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string, maxLength: 40 }, description: "case-insensitive order_number search" }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
