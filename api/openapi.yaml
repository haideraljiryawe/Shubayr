        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
