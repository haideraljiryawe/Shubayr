        poster: { oneOf: [{ $ref: "#/components/schemas/ExpenseActor" }, { type: "null" }] }
        journal_entry: { oneOf: [{ $ref: "#/components/schemas/JournalEntry" }, { type: "null" }] }
        payments: { type: array, items: { $ref: "#/components/schemas/ExpensePayment" } }
        corrections: { type: array, items: { $ref: "#/components/schemas/ExpenseCorrection" } }
        prepaid_schedule:
          oneOf:
            - { $ref: "#/components/schemas/PrepaidExpenseSchedule" }
            - { type: "null" }

    PrepaidExpenseScheduleInstallment:
      type: object
      additionalProperties: false
      required: [id, sequence, scheduled_date, amount_iqd, status, posted_at, last_error, journal_entry]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer, minimum: 1 }
        scheduled_date: { type: string, format: date-time }
        amount_iqd: { type: number, exclusiveMinimum: 0 }
        status: { type: string, enum: [pending, posted, blocked, cancelled] }
        posted_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        journal_entry: { oneOf: [{ $ref: "#/components/schemas/JournalEntry" }, { type: "null" }] }

    PrepaidExpenseSchedule:
      type: object
      additionalProperties: false
      required: [id, status, start_date, periods, amount_iqd, recognized_iqd, cancelled_iqd, created_by, cancelled_by, cancelled_at, cancel_reason, created_at, updated_at, creator, canceller, cancellation_journal_entry, installments]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, blocked, completed, cancelled, reversed] }
        start_date: { type: string, format: date-time }
        periods: { type: integer, minimum: 2, maximum: 120 }
        amount_iqd: { type: number, exclusiveMinimum: 0 }
        recognized_iqd: { type: number, minimum: 0 }
        cancelled_iqd: { type: number, minimum: 0 }
        created_by: { type: string, format: uuid }
        cancelled_by: { type: [string, "null"], format: uuid }
        cancelled_at: { type: [string, "null"], format: date-time }
        cancel_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        creator: { $ref: "#/components/schemas/ExpenseActor" }
        canceller: { oneOf: [{ $ref: "#/components/schemas/ExpenseActor" }, { type: "null" }] }
        cancellation_journal_entry: { oneOf: [{ $ref: "#/components/schemas/JournalEntry" }, { type: "null" }] }
        installments: { type: array, items: { $ref: "#/components/schemas/PrepaidExpenseScheduleInstallment" } }

    ExpenseSummary:
      type: object
      additionalProperties: false
      required: [id, document_number, status, category, amount_currency, amount_iqd, paid_currency, balance_currency, currency_code, payment_mode, recognition_mode, payee, supplier, cash_account, description, document_date, created_at]
      properties:
        id: { type: string, format: uuid }
        document_number: { type: string }
        status: { type: string, enum: [draft, posted, reversed] }
        category: { $ref: "#/components/schemas/ExpenseCategoryLink" }
        amount_currency: { type: number }
        amount_iqd: { type: [number, "null"] }
        paid_currency: { type: number, minimum: 0 }
        balance_currency: { type: number, minimum: 0 }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        payment_mode: { type: string, enum: [paid_now, owed] }
        recognition_mode: { type: string, enum: [immediate, prepaid] }
        payee: { type: [string, "null"] }
        supplier: { oneOf: [{ $ref: "#/components/schemas/ExpensePartyLink" }, { type: "null" }] }
        cash_account:
          oneOf:
            - { $ref: "#/components/schemas/ExpenseCashAccountSummary" }
            - { type: "null" }
        description: { type: string }
        document_date: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    ExpensePage:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ExpenseSummary" } }
        pagination:
          type: object
          additionalProperties: false
          required: [page, per_page, total, pages]
          properties:
            page: { type: integer, minimum: 1 }
            per_page: { type: integer, minimum: 1, maximum: 100 }
            total: { type: integer, minimum: 0 }
            pages: { type: integer, minimum: 0 }

    ExpenseTotals:
      type: object
      additionalProperties: false
      required: [total_iqd, document_count, per_category]
      properties:
        total_iqd: { type: number, minimum: 0 }
        document_count: { type: integer, minimum: 0 }
        per_category:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [category, total_iqd, document_count]
            properties:
              category: { $ref: "#/components/schemas/ExpenseCategoryLink" }
              total_iqd: { type: number, minimum: 0 }
              document_count: { type: integer, minimum: 0 }

    AdminFinancialSettings:
      type: object
      additionalProperties: false
      required: [settings, business_hours, closed_days, protection_thresholds]
      properties:
        settings:
          type: object
          properties:
            separation_of_duties_level: { type: [string, "null"], enum: [standard, strict, null], default: standard }
            store_legal_name_ar: { type: [string, "null"], minLength: 1, maxLength: 160 }
            store_legal_name_en: { type: [string, "null"], minLength: 1, maxLength: 160 }
            store_address_ar: { type: [string, "null"], minLength: 1, maxLength: 500 }
            store_address_en: { type: [string, "null"], minLength: 1, maxLength: 500 }
            support_phone: { type: [string, "null"], pattern: '^\+[1-9]\d{7,14}$' }
            support_whatsapp: { type: [string, "null"], pattern: '^\+[1-9]\d{7,14}$' }
            support_email: { type: [string, "null"], format: email, maxLength: 254 }
            privacy_email: { type: [string, "null"], format: email, maxLength: 254 }
            support_hours_ar: { type: [string, "null"], minLength: 1, maxLength: 500 }
            support_hours_en: { type: [string, "null"], minLength: 1, maxLength: 500 }
            refund_days: { type: [string, "null"], pattern: '^\d+$' }
            policy_effective_date: { type: [string, "null"], format: date }
            return_window_days: { type: [string, "null"], pattern: '^[1-9]\d*$' }
            recently_added_enabled: { type: string, enum: ['true', 'false'], default: 'false' }
            recently_added_max_count: { type: string, pattern: '^(?:[1-9]|[1-4]\d|50)$', default: '10' }
            recently_added_window_days: { type: string, pattern: '^(?:[1-9]|[1-9]\d|[12]\d{2}|3[0-5]\d|36[0-5])$', default: '30' }
          additionalProperties: { type: [string, "null"] }
        business_hours: { type: array, items: { $ref: "#/components/schemas/BusinessHours" } }
        closed_days: { type: array, items: { $ref: "#/components/schemas/ClosedDay" } }
        protection_thresholds: { $ref: "#/components/schemas/ProtectionThresholds" }

    AdminFinancialSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        settings:
          type: object
          properties:
            separation_of_duties_level: { type: [string, "null"], enum: [standard, strict, null] }
            store_legal_name_ar: { type: [string, "null"], minLength: 1, maxLength: 160 }
            store_legal_name_en: { type: [string, "null"], minLength: 1, maxLength: 160 }
            store_address_ar: { type: [string, "null"], minLength: 1, maxLength: 500 }
            store_address_en: { type: [string, "null"], minLength: 1, maxLength: 500 }
            support_phone: { type: [string, "null"], pattern: '^\+[1-9]\d{7,14}$' }
            support_whatsapp: { type: [string, "null"], pattern: '^\+[1-9]\d{7,14}$' }
            support_email: { type: [string, "null"], format: email, maxLength: 254 }
            privacy_email: { type: [string, "null"], format: email, maxLength: 254 }
            support_hours_ar: { type: [string, "null"], minLength: 1, maxLength: 500 }
            support_hours_en: { type: [string, "null"], minLength: 1, maxLength: 500 }
            refund_days: { type: [string, "null"], pattern: '^\d+$' }
            policy_effective_date: { type: [string, "null"], format: date }
            return_window_days: { type: [string, "null"], pattern: '^[1-9]\d*$' }
            recently_added_enabled: { type: string, enum: ['true', 'false'] }
            recently_added_max_count: { type: string, pattern: '^(?:[1-9]|[1-4]\d|50)$' }
            recently_added_window_days: { type: string, pattern: '^(?:[1-9]|[1-9]\d|[12]\d{2}|3[0-5]\d|36[0-5])$' }
          additionalProperties: { type: [string, "null"] }
        business_hours: { type: array, items: { $ref: "#/components/schemas/BusinessHoursInput" } }
        closed_days: { type: array, items: { $ref: "#/components/schemas/ClosedDayInput" } }
        protection_thresholds: { $ref: "#/components/schemas/ProtectionThresholds" }

    BusinessHours:
      type: object
      additionalProperties: false
      description: Persisted weekday convention is 0=Sunday, 1=Monday, 2=Tuesday, 3=Wednesday, 4=Thursday, 5=Friday, 6=Saturday.
      required: [weekday, opens_at, closes_at, is_closed, updated_at]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: "0=Sunday; 1=Monday; 2=Tuesday; 3=Wednesday; 4=Thursday; 5=Friday; 6=Saturday." }
        opens_at: { type: [string, "null"], pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
        closes_at: { type: [string, "null"], pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
        is_closed: { type: boolean }
        updated_at: { type: string, format: date-time }

    BusinessHoursInput:
      type: object
      additionalProperties: false
      description: Uses the persisted 0=Sunday through 6=Saturday convention. Closed rows require null times; open rows require HH:MM and opens_at before closes_at.
      required: [weekday, opens_at, closes_at, is_closed]
      properties:
        weekday: { type: integer, minimum: 0, maximum: 6, description: "0=Sunday; 1=Monday; 2=Tuesday; 3=Wednesday; 4=Thursday; 5=Friday; 6=Saturday." }
        opens_at: { type: [string, "null"], pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
        closes_at: { type: [string, "null"], pattern: '^(?:[01]\d|2[0-3]):[0-5]\d$' }
        is_closed: { type: boolean }

    ClosedDay:
      type: object
      additionalProperties: false
      required: [date, reason, created_at]
      properties:
        date: { type: string, format: date-time }
        reason: { type: [string, "null"], maxLength: 255 }
        created_at: { type: string, format: date-time }

    ClosedDayInput:
      type: object
      additionalProperties: false
      required: [date]
      properties:
        date: { type: string, format: date }
        reason: { type: string, maxLength: 255 }

    ProtectionThresholds:
      type: object
      additionalProperties: false
      properties:
        cost: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        price: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        quantity: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
        exchange_rate: { type: number, minimum: 0, maximum: 100, multipleOf: 0.01 }
