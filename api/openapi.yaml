        variant_id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        quantity: { type: number, multipleOf: 0.001 }
        unit_cost_iqd: { type: number, minimum: 0 }

    InventoryWriteDown:
      type: object
      additionalProperties: false
      required: [id, document_number, operation_id, document_date, accounting_date, reason, status, created_by, journal_entry_id, created_at, posted_at, lines, journal_entry]
      properties:
        id: { type: string, format: uuid }
