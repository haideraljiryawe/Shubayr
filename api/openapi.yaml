  /admin/orders/{id}/status:
    patch:
      tags: [Admin]
      summary: Advance an order through its pre-dispatch lifecycle
      x-error-codes: [STALE_ORDER_STATE, BELOW_COST_BLOCKED, CUSTOMER_CONTACT_REQUIRED, DELIVERY_FEE_ADJUSTMENT_FORBIDDEN, DELIVERY_FEE_ADJUSTMENT_REASON_REQUIRED, DELIVERY_FEE_ADJUSTMENT_NOT_ALLOWED, ORDER_NEEDS_ATTENTION, ORDER_DELIVERY_MISSING, DELIVERY_AGENT_NOT_ASSIGNED, ORDER_TRANSITION_NOT_ALLOWED, ORDER_HAS_NO_STOCK_RESERVATIONS, SKU_COST_NOT_FOUND, INVENTORY_COST_NEGATIVE]
      x-surface: admin
      x-permission-by-status:
        confirmed: orders.accept
        preparing: orders.prepare
        ready_for_dispatch: orders.mark_ready
        dispatched: orders.handover
      description: >
        Legal path: pending to confirmed to preparing to ready_for_dispatch to
        dispatched. Dispatch requires the existing current delivery to have an
        agent assigned through PATCH /deliveries/{id}/assign; it moves that same
        delivery to out_for_delivery and transfers reserved stock into the agent's
        custody. Delivery agents and authorized staff can record delivery outcomes;
        staff own cancellation and shortage-resolution transitions.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, version]
              properties:
                status:
                  type: string
                  enum: [confirmed, preparing, ready_for_dispatch, dispatched]
                version: { type: integer, minimum: 1 }
                note: { type: [string, "null"], maxLength: 500 }
                below_cost_override_reason: { type: [string, "null"], maxLength: 500 }
                customer_contacted: { type: boolean, description: Must be true when status is confirmed. }
                customer_contact_note: { type: [string, "null"], minLength: 1, maxLength: 500, description: Required when status is confirmed. }
                adjusted_delivery_fee: { $ref: "#/components/schemas/Money", description: Optional replacement fee during confirmation; requires orders.adjust_delivery_fee. }
                delivery_fee_adjustment_reason: { type: [string, "null"], minLength: 1, maxLength: 500, description: Required with adjusted_delivery_fee. }
      responses:
        "200":
          description: Updated order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/orders/{id}/cancel:
    post:
      tags: [Admin]
      summary: Cancel a pre-dispatch order and release its stock holds
      x-error-codes: [STALE_ORDER_STATE, PAID_COD_CANCELLATION_FORBIDDEN, ORDER_TRANSITION_NOT_ALLOWED]
      x-permission: orders.cancel
      description: >
        Allowed only from pending, confirmed, preparing, or ready_for_dispatch.
        A non-empty reason is stored in the timeline and audit trail. Dispatched,
        delivered, failed, returned, and paid COD orders cannot be cancelled.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, reason]
              properties:
                version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Cancelled order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/orders/{id}/reject:
    post:
      tags: [Admin]
      summary: Reject a pending order and release its stock holds
      x-error-codes: [STALE_ORDER_STATE, ORDER_NOT_PENDING]
      x-permission: orders.reject
      description: >
        Rejection is distinct from cancellation and is allowed only while the
        order is pending. A non-empty reason is stored in the timeline and
        audit trail; the reservation is released and customer and order
        monitors receive a durable notification.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
