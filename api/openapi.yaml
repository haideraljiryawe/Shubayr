      responses:
        "200":
          description: Paginated retrievals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetrievalPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/retrievals/{id}:
    get:
      tags: [Fulfilment]
      summary: Get a retrieval document
      x-permission: retrieval.view
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Retrieval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retrieval" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/retrievals/{id}/receive:
    post:
      tags: [Fulfilment]
      summary: Receive a full or partial retrieval at original issue cost
      x-error-codes: [RETRIEVAL_ALREADY_CLOSED, RETRIEVAL_EXCEEDS_BALANCE, RETRIEVAL_LOCATION_INACTIVE, RETRIEVAL_EXCEEDS_CUSTODY, INVENTORY_COST_NEGATIVE]
      x-permission: retrieval.receive
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, lines]
              properties:
                operation_id: { type: string, minLength: 8, maxLength: 128 }
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [line_id, location_id, quantity]
                    properties:
                      line_id: { type: string, format: uuid }
                      location_id: { type: string, format: uuid }
                      quantity: { type: string, pattern: '^\\d+(?:\\.\\d{1,3})?$' }
      responses:
        "200":
          description: Updated retrieval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Retrieval" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/products:
    get:
      tags: [Admin]
      summary: List all products, including hidden and archived products
      description: Uses the public filters and server-time pricing without public visibility restrictions.
      x-permission: catalog.products
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: brand_id, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: on_sale, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, rating] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated products including non-public states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Admin]
      summary: Create a product
      x-error-codes: [BELOW_COST_BLOCKED, VARIANT_SKUS_DUPLICATED, VARIANT_SKU_DUPLICATE, BASE_CURRENCY_NOT_CONFIGURED]
      description: Both `name_ar` and `name_en` are required and must contain non-whitespace text; validation errors identify the missing or empty field.
      x-permissions: [catalog.products, prices.change]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/PricingRateValidation" }
  /admin/products/{id}:
    get:
      tags: [Admin]
      summary: Get any product, including hidden or archived
      x-permission: catalog.products
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [Admin]
      summary: Update a product
      x-error-codes: [BELOW_COST_BLOCKED, VARIANT_SKUS_DUPLICATED, VARIANT_SKU_DUPLICATE, BASE_CURRENCY_NOT_CONFIGURED]
      description: >
        Omitted fields are preserved. Explicit null clears only nullable fields;
        `discount_type: null` clears the complete stored discount definition.
        Updating unrelated fields never changes a scheduled discount. A fixed
        price below protected cost is not applied: the response retains the
        live price and identifies the pending request for another user.
      x-permissions: [catalog.products, prices.change]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductPatch" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/PricingRateValidation" }
    delete:
      tags: [Admin]
      summary: Delete (archive) a product
      x-permission: catalog.products
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/products/reindex:
    post:
      tags: [Admin]
      summary: Reindex all products and clear durable search-sync markers after success
      x-permission: catalog.products
      responses:
        "201":
          description: Search catch-up result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [queued, synchronized]
                properties:
                  queued: { type: integer, minimum: 0 }
                  synchronized: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }

