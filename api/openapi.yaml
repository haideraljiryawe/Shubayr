      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SupplierCreditAllocationInput" } } } }
      responses:
        "201": { description: Credit allocation, content: { application/json: { schema: { $ref: "#/components/schemas/PurchasingDocument" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/supplier-returns:
    post:
      tags: [Purchasing]
      summary: Return unreserved quantity from specific purchased lots
      x-error-codes: [RETURN_WRONG_INVOICE, RETURN_TERMS_MISMATCH, SUPPLIER_RETURN_EXCEEDS_STOCK, PURCHASE_RATE_OVERRIDE_REQUIRED, SUPPLIER_INACTIVE, INVENTORY_COST_NEGATIVE, SEPARATION_OF_DUTIES_VIOLATION, PERIOD_CLOSED]
      x-permission: supplier_returns.create
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SupplierReturnInput" } } } }
      responses:
        "201": { description: Posted return, content: { application/json: { schema: { $ref: "#/components/schemas/PurchasingDocument" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/purchase-cost-corrections:
    post:
      tags: [Purchasing]
      summary: Split a late cost or correction across stock, custody and COGS
      x-error-codes: [LOT_QUANTITY_INCONSISTENT, INVENTORY_COST_NEGATIVE, SEPARATION_OF_DUTIES_VIOLATION, PERIOD_CLOSED]
      x-permission: purchases.correct
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseCostCorrectionInput" } } } }
      responses:
        "201": { description: Posted cost correction, content: { application/json: { schema: { $ref: "#/components/schemas/PurchasingDocument" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- INVENTORY (staff) ----------------
  /inventory/batches:
    get:
      tags: [Inventory]
      summary: List inventory batches (filter by product, expiry)
      x-permission: inventory.count
      parameters:
        - { name: product_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated batches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /inventory/movements:
    get:
      tags: [Inventory]
      summary: List stock movements
      x-permission: inventory.count
      parameters:
        - { name: batch_id, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/StockMovementType" } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated stock movements
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMovementPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /inventory/adjust:
    post:
      tags: [Inventory]
      summary: Controlled stock adjustment (permissioned + audited)
      x-permission: inventory.adjust
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch_id, location_id, quantity, reason]
              properties:
                batch_id: { type: string, format: uuid }
                location_id: { type: string, format: uuid }
