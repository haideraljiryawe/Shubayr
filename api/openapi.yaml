      additionalProperties: false
      required: [id, title, subtitle, image_url, cta_text, link_url, internal_name, title_ar, title_en, subtitle_ar, subtitle_en, cta_label_ar, cta_label_en, show_text, action_type, action_target_id, action, is_default, default_priority, sort_order, is_active, effective_status, starts_at, ends_at, created_at]
      properties:
        id: { type: string, format: uuid }
