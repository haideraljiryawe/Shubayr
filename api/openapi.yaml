      properties:
        name_en: { type: string, minLength: 1, pattern: '.*\S.*' }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 140 }
        logo_url: { type: [string, "null"], format: uri }
        is_visible: { type: boolean, default: true }
        sort_order: { type: integer, minimum: 0, default: 0 }
        target_category_id: { type: string, format: uuid }

    CategoryBrandConversion:
      type: object
      additionalProperties: false
      required: [brand, moved_products, target_category_id]
      properties:
        brand: { $ref: "#/components/schemas/Brand" }
        moved_products: { type: integer, minimum: 0 }
        target_category_id: { type: string, format: uuid }

    Product:
      type: object
      description: >
        A catalog product. `in_stock` and `available_qty` are computed at read
        time (sum of batch_stock minus active batch reservations and temporary
        COD order holds); they are not stored on the product.
        Pricing works the same way: the product stores a regular `price` plus a
        discount DEFINITION (`discount_type`, `discount_value` and the scheduled
        window `discount_starts_at`/`discount_ends_at`), and the server derives
        `on_sale`, `discounted_price`, `effective_price` and `discount_percent`
        on every read. Those four are never stored, because a scheduled window
        changes what they mean as the clock moves.
        Reads populate an empty or missing `name_ar`/`name_en` from the other
        language so locale-specific clients never receive a blank name.
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        brand_id: { type: [string, "null"], format: uuid }
        brand: { oneOf: [ { $ref: "#/components/schemas/Brand" }, { type: "null" } ] }
        name_en: { type: string }
        name_ar: { type: string }
        description: { type: [string, "null"] }
        description_en: { type: [string, "null"] }
        description_ar: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money", multipleOf: 1, description: "Regular selling price in whole IQD." }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        discount_type: { type: [string, "null"], enum: [percentage, amount, null], description: "Discount kind, or null when the product has no discount defined." }
        discount_value: { type: [number, "null"], multipleOf: 0.01, description: "For `percentage`, the percentage off (10 means 10%, at most two decimals). For `amount`, the currency amount subtracted from `price`. Null when `discount_type` is null." }
        discount_starts_at: { type: [string, "null"], format: date-time, description: "Start of the scheduled discount window; null means the discount is active immediately." }
        discount_ends_at: { type: [string, "null"], format: date-time, description: "End of the scheduled discount window; null means the discount never expires." }
        on_sale: { type: boolean, readOnly: true, description: "Computed: true when discount_type is set AND now() falls inside [discount_starts_at, discount_ends_at], treating null bounds as open." }
        discounted_price: { type: [number, "null"], multipleOf: 1, readOnly: true, description: "Computed in whole IQD when on_sale is true and rounded half away from zero; null when on_sale is false." }
        effective_price: { $ref: "#/components/schemas/Money", readOnly: true, description: "The price the customer pays. Cart and order pricing use this exact value." }
        discount_percent: { type: [integer, "null"], readOnly: true, description: "Computed when on_sale is true: round((price - discounted_price) / price * 100). Null when on_sale is false." }
        tracks_expiry: { type: boolean }
        purchase_limit_enabled: { type: boolean, description: "When true, the sum of every variant/line of this product in one order may not exceed purchase_limit_max_quantity." }
        purchase_limit_max_quantity: { type: [number, "null"], multipleOf: 0.001, minimum: 0.001, description: "Per-order product quantity limit in the product's selling units. Null when no value is retained; clients must enforce only when enabled." }
        rating_avg: { type: number, description: "Cached average of published product reviews only, reconciled transactionally from review rows and rounded to two decimals half away from zero." }
        rating_count: { type: integer, description: "Cached count of published product reviews only; review rows are authoritative." }
        status: { type: string, enum: [active, hidden, archived] }
        in_stock: { type: boolean, description: "computed: available_qty > 0" }
        availability: { type: string, enum: [out_of_stock, low_stock, in_stock], description: "Best availability state among the product's SKUs." }
        available_qty: { type: number, multipleOf: 0.001, description: "computed: on-hand minus active batch reservations and temporary COD holds" }
        published_at: { type: [string, "null"], format: date-time }
        price_approved_at: { type: [string, "null"], format: date-time }
        price_proposed_by: { type: [string, "null"], format: uuid }
        price_update_status: { type: string, enum: [pending_approval], description: Present when this save created a below-cost fixed-price approval request and left the live price unchanged. }
        price_approval_request_id: { type: string, format: uuid, description: Present with price_update_status. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        images:
          type: array
          description: Ordered by sort_order; the first image is primary.
          items: { $ref: "#/components/schemas/ProductImage" }
        variants: { type: array, items: { $ref: "#/components/schemas/ProductVariant" } }

    ProductInput:
      type: object
      additionalProperties: false
      description: >
        Admin create and update requests require both names after trimming;
        neither may be empty. Pricing is written as a regular `price` plus an
        optional discount definition; the computed `on_sale`,
        `discounted_price`, `effective_price` and `discount_percent` fields are
        read-only and are never accepted on a write.


        Discount validation, each breach returning 422 `validation_error`:


        * `discount_type` set requires a `discount_value` greater than 0.

        * `percentage`: 0 < `discount_value` <= 100.

        * `amount`: 0 < `discount_value` < `price`.

        * `discount_type` null clears the whole discount; `discount_value` must
        then be null or omitted.

        * When both `discount_starts_at` and `discount_ends_at` are set,
        `discount_ends_at` must be strictly after `discount_starts_at`.

        * Either timestamp may be sent alone: a null start means the discount is
        active immediately, a null end means it never expires.
      required: [category_id, name_en, name_ar, price, variants]
      properties:
        below_cost_override_reason: { type: [string, "null"], maxLength: 500 }
        category_id: { type: string, format: uuid }
        brand_id: { type: [string, "null"], format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace English name. }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace Arabic name. }
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money", multipleOf: 1, minimum: 0, description: "Regular selling price in whole IQD." }
        discount_type: { type: [string, "null"], enum: [percentage, amount, null], default: null, description: "Null (the default) means no discount and clears any discount already stored." }
        discount_value: { type: [number, "null"], multipleOf: 0.01, exclusiveMinimum: 0, description: "Required when discount_type is set, and must be null or omitted otherwise. percentage: at most 100. amount: strictly less than price." }
        discount_starts_at: { type: [string, "null"], format: date-time, description: "Optional window start; null means the discount is active immediately." }
        discount_ends_at: { type: [string, "null"], format: date-time, description: "Optional window end; null means the discount never expires. Must be after discount_starts_at when both are set." }
        tracks_expiry: { type: boolean, default: false }
        purchase_limit_enabled: { type: boolean }
        purchase_limit_max_quantity: { type: [number, "null"], multipleOf: 0.001, minimum: 0.001, description: "Required when enabled. The suggested editor prefill of 10 is a client convenience, not a server default." }
        status: { type: string, enum: [active, hidden, archived], default: hidden }
        published: { type: boolean, default: false, description: "Publishing also requires at least one SKU with an approved effective selling price." }
        images:
          type: array
          description: Ordered creation list; array index becomes sort_order and index 0 is primary.
          items:
            type: object
            additionalProperties: false
            required: [url]
            properties:
              url: { type: string, format: uri, description: "Stable URL returned by POST /media/images." }
        variants:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ProductVariantInput" }

    ProductPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: All ProductInput fields are optional on PATCH. Omission preserves the stored value. Explicit null clears a nullable field; discount_type null clears discount_type, discount_value, discount_starts_at, and discount_ends_at together.
      properties:
        below_cost_override_reason: { type: [string, "null"], maxLength: 500 }
        category_id: { type: string, format: uuid }
        brand_id: { type: [string, "null"], format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*' }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*' }
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money", multipleOf: 1, minimum: 0 }
        discount_type: { type: [string, "null"], enum: [percentage, amount, null] }
        discount_value: { type: [number, "null"], multipleOf: 0.01, exclusiveMinimum: 0 }
        discount_starts_at: { type: [string, "null"], format: date-time }
        discount_ends_at: { type: [string, "null"], format: date-time }
        tracks_expiry: { type: boolean }
        purchase_limit_enabled: { type: boolean }
        purchase_limit_max_quantity: { type: [number, "null"], multipleOf: 0.001, minimum: 0.001 }
        status: { type: string, enum: [active, hidden, archived] }
        published: { type: boolean }
        media_operations:
          type: array
          description: Applied atomically in array order; the image at final position 0 is primary.
          items: { $ref: "#/components/schemas/ProductMediaOperation" }
        variants:
          type: array
          description: >
            Replaces the variant set in place. Each entry is matched to an
            existing variant by `id` when supplied and otherwise by `sku`, so
            an update never reissues variant ids. Omitting a variant removes
            it; removing one still referenced by inventory, cart, purchasing
            or order history is rejected with 422.
          items: { $ref: "#/components/schemas/ProductVariantInput" }

    ProductVariantInput:
      type: object
      additionalProperties: false
      required: [sku]
      properties:
        id: { type: string, format: uuid, description: "Existing SKU identity on update." }
        sku: { type: string, minLength: 1, maxLength: 80 }
        barcode: { type: [string, "null"], maxLength: 80 }
        attributes: { type: object, additionalProperties: true }
        price_delta: { type: integer, deprecated: true, description: "Compatibility input; translated to a fixed selling_price override." }
        base_unit: { type: string, minLength: 1, maxLength: 32, default: piece }
        whole_units_only: { type: boolean, default: true }
        selling_price: { type: [integer, "null"], minimum: 0, description: "Fixed-price override; null inherits the product price." }
        low_stock_threshold: { type: [number, "null"], multipleOf: 0.001, minimum: 0, description: "Null inherits the store default." }
        pricing_mode: { type: string, enum: [fixed, linked], default: fixed }
        reference_currency_code: { type: [string, "null"], pattern: '^[A-Z]{3}$' }
        reference_price: { type: [number, "null"], exclusiveMinimum: 0, multipleOf: 0.000001 }

    CatalogImportIssue:
      type: object
      additionalProperties: false
      required: [severity, code, cell, message]
      properties:
        severity: { type: string, enum: [error, warning] }
        code: { type: string }
        cell: { type: string, example: "Products+Variants!H4" }
        message: { type: string }

    CatalogImportProductRow:
      type: object
      additionalProperties: false
      required: [sheet, row, category_level_1, category_level_2, brand, product_name_ar, product_name_en, description_ar, description_en, sku, attributes, base_unit, whole_units_only, price_iqd, reference_currency_code, reference_price, low_stock_threshold, barcode, status, image_urls]
      properties:
        sheet: { type: string, const: "Products+Variants" }
        row: { type: integer, minimum: 2 }
        category_level_1: { type: string }
        category_level_2: { type: string }
        brand: { type: [string, "null"] }
        product_name_ar: { type: string }
        product_name_en: { type: string }
        description_ar: { type: [string, "null"] }
        description_en: { type: [string, "null"] }
        sku: { type: string }
        attributes: { type: object, additionalProperties: { type: string } }
        base_unit: { type: string }
        whole_units_only: { type: boolean }
        price_iqd: { type: [integer, "null"], minimum: 0 }
        reference_currency_code: { type: [string, "null"], pattern: '^[A-Z]{3}$' }
        reference_price: { type: [number, "null"], exclusiveMinimum: 0 }
        low_stock_threshold: { type: [number, "null"], minimum: 0, multipleOf: 0.001 }
        barcode: { type: [string, "null"] }
        status: { type: [string, "null"], enum: [active, hidden, archived, null] }
        image_urls: { type: array, items: { type: string, format: uri } }

    CatalogImportStockRow:
      type: object
      additionalProperties: false
      required: [sheet, row, sku, location_code, quantity, expiry]
      properties:
        sheet: { type: string, const: Stock }
        row: { type: integer, minimum: 2 }
        sku: { type: string }
        location_code: { type: string }
        quantity: { type: string, pattern: '^\d+(?:\.\d{1,3})?$' }
        unit_cost_iqd: { type: string, pattern: '^\d+(?:\.\d{1,12})?$', description: Omitted unless the caller has cost.view. }
        expiry: { type: [string, "null"], format: date }

    CatalogImportPreviewRow:
      type: object
      additionalProperties: false
      required: [sheet, row, sku, action, apply_action, issues, commit_status, commit_error]
      properties:
        sheet: { type: string, enum: ["Products+Variants", Stock] }
        row: { type: integer, minimum: 2 }
        sku: { type: [string, "null"] }
        action: { type: string, enum: [create, update, error, warning] }
        apply_action: { type: [string, "null"], enum: [create, update, null] }
        issues: { type: array, items: { $ref: "#/components/schemas/CatalogImportIssue" } }
        commit_status: { type: string, enum: [pending, applied, failed, skipped] }
        commit_error:
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [code, message]
              properties:
                code: { type: string }
                message: { type: string }
        product: { $ref: "#/components/schemas/CatalogImportProductRow" }
        stock: { $ref: "#/components/schemas/CatalogImportStockRow" }

    CatalogImportPreview:
      type: object
      additionalProperties: false
      required: [rows, counts]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/CatalogImportPreviewRow" } }
        counts:
          type: object
          additionalProperties: false
          required: [total, create, update, error, warning]
          properties:
            total: { type: integer, minimum: 0 }
            create: { type: integer, minimum: 0 }
            update: { type: integer, minimum: 0 }
            error: { type: integer, minimum: 0 }
            warning: { type: integer, minimum: 0 }

    CatalogImport:
      type: object
      additionalProperties: false
      required: [id, file_name, create_missing, status, progress, row_count, create_count, update_count, error_count, warning_count, applied_count, commit_batches_done, commit_batches_total, commit_attempt, preview, error_report_key, operation_id, opening_id, created_by, created_by_name, committed_by, created_at, updated_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        file_name: { type: string }
        create_missing: { type: boolean }
        status: { type: string, enum: [queued, validating, ready, committing, completed, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        row_count: { type: integer, minimum: 0 }
        create_count: { type: integer, minimum: 0 }
        update_count: { type: integer, minimum: 0 }
        error_count: { type: integer, minimum: 0 }
        warning_count: { type: integer, minimum: 0 }
        applied_count: { type: integer, minimum: 0 }
        commit_batches_done: { type: integer, minimum: 0, description: Fully committed product batches plus the final Stock batch when applicable. }
        commit_batches_total: { type: integer, minimum: 0, description: Product batches of at most 250 rows plus one final Stock batch when applicable. }
        commit_attempt: { type: integer, minimum: 0 }
        preview: { oneOf: [ { $ref: "#/components/schemas/CatalogImportPreview" }, { type: "null" } ] }
        error_report_key: { type: [string, "null"], description: Internal report availability marker; download through the error-report route. }
        operation_id: { type: [string, "null"] }
        opening_id: { type: [string, "null"], format: uuid }
        created_by: { type: string, format: uuid }
        created_by_name: { type: string }
        committed_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    CatalogImportPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/CatalogImportSummary" } }

    CatalogImportProgress:
      type: object
      additionalProperties: false
      required: [id, status, batches_done, batches_total, rows_applied, rows_failed, last_error]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [queued, validating, ready, committing, completed, failed] }
        batches_done: { type: integer, minimum: 0 }
        batches_total: { type: integer, minimum: 0 }
        rows_applied: { type: integer, minimum: 0 }
        rows_failed: { type: integer, minimum: 0 }
        last_error:
          oneOf:
            - type: object
              additionalProperties: false
              required: [code, message, sheet, row_number]
              properties:
                code: { type: string }
                message: { type: string }
                sheet: { type: string, enum: [Products+Variants, Stock] }
                row_number: { type: integer, minimum: 2 }
            - type: "null"

    CatalogImportSummary:
      type: object
      additionalProperties: false
      required: [id, file_name, create_missing, status, progress, row_count, create_count, update_count, error_count, warning_count, applied_count, commit_attempt, error_report_key, operation_id, opening_id, created_by, created_by_name, committed_by, created_at, updated_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        file_name: { type: string }
        create_missing: { type: boolean }
        status: { type: string, enum: [queued, validating, ready, committing, completed, failed] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        row_count: { type: integer, minimum: 0 }
        create_count: { type: integer, minimum: 0 }
        update_count: { type: integer, minimum: 0 }
        error_count: { type: integer, minimum: 0 }
        warning_count: { type: integer, minimum: 0 }
        applied_count: { type: integer, minimum: 0 }
        commit_attempt: { type: integer, minimum: 0 }
        error_report_key: { type: [string, "null"] }
        operation_id: { type: [string, "null"] }
        opening_id: { type: [string, "null"], format: uuid }
        created_by: { type: string, format: uuid }
        created_by_name: { type: string }
        committed_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    CatalogImportCommitResult:
      type: object
      additionalProperties: false
      required: [id, status, operation_id, created, updated, skipped_errors, applied_rows, total_rows, commit_batches_done, commit_batches_total, opening_id]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [committing, completed] }
        operation_id: { type: string }
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        skipped_errors: { type: integer, minimum: 0 }
        applied_rows: { type: integer, minimum: 0 }
        total_rows: { type: integer, minimum: 1 }
        commit_batches_done: { type: integer, minimum: 0 }
        commit_batches_total: { type: integer, minimum: 1 }
        opening_id: { type: [string, "null"], format: uuid }

    CatalogImageBulkResult:
      type: object
      additionalProperties: false
      required: [operation_id, matched, unmatched, failed]
      properties:
        operation_id: { type: string }
        matched:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [file, sku, product_id, product_name_ar, product_name_en, url]
            properties:
              file: { type: string }
              sku: { type: string }
              product_id: { type: string, format: uuid }
              product_name_ar: { type: string }
              product_name_en: { type: string }
              url: { type: string, format: uri }
        unmatched: { type: array, items: { type: string } }
        failed:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [file, code, message]
            properties:
              file: { type: string }
              code: { type: string, enum: [CATALOG_IMAGE_PROCESSING_FAILED] }
              message: { type: string }

    ProductBulkInput:
      oneOf:
