        quantity: { type: number, multipleOf: 0.001 }
        reference: { type: [string, "null"] }
        user_id: { type: [string, "null"], format: uuid }
        return_item_id: { type: [string, "null"], format: uuid }
        unit_cost_iqd: { type: number, minimum: 0, description: Present only with cost.view. }
        source_type: { type: string }
        source_id: { type: [string, "null"], format: uuid }
        custody_party_id: { type: [string, "null"], format: uuid }
