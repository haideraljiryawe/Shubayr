          application/json:
            schema:
              type: object
              required: [batch_id, from_location, to_location, quantity]
              properties:
                batch_id: { type: string, format: uuid }
                from_location: { type: string, format: uuid }
                to_location: { type: string, format: uuid }
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Transfer recorded as a stock movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockMovement" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------- WAREHOUSES (staff, read) ----------------
  /warehouses:
    get:
      tags: [Warehouses]
      summary: List warehouses
      x-permission: inventory.count
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated warehouses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehousePage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /warehouses/{id}/locations:
    get:
