          properties:
            username: { type: string, pattern: '^[a-z][a-z0-9._-]{2,79}$' }
            name: { type: string, minLength: 1, maxLength: 120 }
            email: { type: [string, "null"], format: email }
            password: { $ref: "#/components/schemas/Password" }
            preset_ids: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
            permission_keys: { type: array, uniqueItems: true, items: { type: string } }

    StaffUpdate:
      allOf:
        - $ref: "#/components/schemas/AuditReason"
        - type: object
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            email: { type: [string, "null"], format: email }
            is_active: { type: boolean }

    StaffPasswordReset:
      allOf:
        - $ref: "#/components/schemas/AuditReason"
        - type: object
          required: [password]
          properties:
            password: { $ref: "#/components/schemas/Password" }

    StaffAccess:
      allOf:
        - $ref: "#/components/schemas/AuditReason"
        - type: object
          required: [preset_ids, permission_keys]
          properties:
            preset_ids: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
            permission_keys: { type: array, uniqueItems: true, items: { type: string } }

    PermissionPreset:
      type: object
      required: [id, name, is_system]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        is_system: { type: boolean }
        permissions:
          type: array
          items:
            type: object
            properties:
              permission: { $ref: "#/components/schemas/Permission" }

    PermissionPresetInput:
      allOf:
        - $ref: "#/components/schemas/AuditReason"
        - type: object
          properties:
            name: { type: string, pattern: '^[a-z][a-z0-9._-]{2,79}$' }
            description: { type: [string, "null"], maxLength: 255 }
            permission_keys: { type: array, uniqueItems: true, items: { type: string } }

    PermissionPresetList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/PermissionPreset" } }

    PermissionPresetListResponse:
      description: A bare array is retained for v6.1 clients when no query parameters are sent; queried calls use the standard list envelope.
      oneOf:
        - type: array
          items: { $ref: "#/components/schemas/PermissionPreset" }
        - $ref: "#/components/schemas/PermissionPresetList"

    WorkPhone:
      type: object
      required: [id, user_id, phone, name, app_role, is_active]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        phone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        name: { type: string }
        app_role: { type: string, enum: [delivery_agent, order_monitor] }
        is_active: { type: boolean }

    WorkPhoneList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/WorkPhone" } }

    WorkPhoneListResponse:
      description: A bare array is retained for v6.1 clients when no query parameters are sent; queried calls use the standard list envelope.
      oneOf:
        - type: array
          items: { $ref: "#/components/schemas/WorkPhone" }
        - $ref: "#/components/schemas/WorkPhoneList"

    AuditActor:
      type: object
      required: [id, username, name]
      properties:
        id: { type: string, format: uuid }
        username: { type: [string, "null"] }
        name: { type: [string, "null"] }

    AuditLog:
      type: object
      required: [id, actor_id, actor, action, entity_type, entity_id, before, after, ip, reason, created_at]
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: [string, "null"], format: uuid }
        actor:
          oneOf:
            - $ref: "#/components/schemas/AuditActor"
            - type: "null"
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: [string, "null"], format: uuid }
        before: { type: [object, array, string, number, boolean, "null"] }
        after: { type: [object, array, string, number, boolean, "null"] }
        ip: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    AuditLogList:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/AuditLog" } }

    WorkPhoneInput:
      allOf:
        - $ref: "#/components/schemas/AuditReason"
        - type: object
          required: [phone, name, role]
          properties:
            phone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
            name: { type: string, minLength: 1, maxLength: 120 }
            role: { type: string, enum: [delivery_agent, order_monitor] }

    Permission:
      type: object
      properties:
        key: { type: string, example: "orders.confirm" }
        group: { type: string, example: orders }
        description: { type: [string, "null"] }

    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        is_system: { type: boolean }
        created_at: { type: string, format: date-time }
        permissions:
          type: array
          items: { type: string, example: "orders.confirm" }

    RoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        permissions:
          type: array
          description: Permission keys granted to this role.
          items: { type: string, example: "orders.confirm" }

    RolePage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Role" }

    UserPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/User" }

    SalesReport:
      type: object
      description: Aggregated sales & analytics for the selected date range.
      properties:
        from: { type: [string, "null"], format: date }
        to: { type: [string, "null"], format: date }
        orders_count: { type: integer }
        gross_sales: { type: number }
        discounts: { type: number }
        net_sales: { type: number }
        by_day:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              orders_count: { type: integer }
              net_sales: { type: number }
        top_products:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              name: { type: string }
              qty_sold: { type: integer }
              net_sales: { type: number }

    StoreSettings:
      type: object
      properties:
        store_name: { type: string }
        logo_url: { type: string }
        primary_color: { type: string }
        currency: { type: string, example: IQD }

    ExactDecimal:
      oneOf:
        - { type: string, pattern: '^-?\d+(?:\.\d+)?$' }
        - { type: number }

    Currency:
      type: object
      required: [code, name_ar, name_en, symbol, display_precision, is_base, enabled, created_at, updated_at]
      properties:
        code: { type: string, pattern: '^[A-Z]{3}$' }
        name_ar: { type: string }
        name_en: { type: string }
        symbol: { type: string }
        display_precision: { type: integer, minimum: 0, maximum: 6 }
        is_base: { type: boolean }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ExchangeRateInput:
      type: object
      additionalProperties: false
      required: [currency_code, rate, basis, effective_at, reason]
      properties:
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        rate: { type: string, pattern: '^\d+(?:\.\d{1,10})?$' }
        basis: { type: integer, enum: [1, 100] }
        effective_at: { type: string, format: date-time }
        reason: { type: string, minLength: 3, maxLength: 500 }

    ExchangeRate:
      type: object
      properties:
        id: { type: string, format: uuid }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        base_currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        rate: { $ref: "#/components/schemas/ExactDecimal" }
        effective_at: { type: [string, "null"], format: date-time }
        set_by: { type: string, format: uuid }
        reason: { type: string }
        created_at: { type: string, format: date-time }
        direction: { type: string }
        not_from_today: { type: boolean }

    OperationOutcome:
      type: object
      required: [id, user_id, operation_id, endpoint, payload_hash, status, response_status, response, created_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        operation_id: { type: string }
        endpoint: { type: string }
        payload_hash: { type: string }
        status: { type: string, enum: [processing, completed] }
        response_status: { type: [integer, "null"] }
        response: {}
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }

    DocumentDraft:
      type: object
      required: [id, user_id, document_type, payload, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        document_type: { type: string }
        payload: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    JournalEntry:
      type: object
      required: [id, document_number, source_type, source_id, event, document_date, accounting_date, created_by, posted_at, lines]
      properties:
        id: { type: string, format: uuid }
        document_number: { type: string }
        source_type: { type: string }
        source_id: { type: string, format: uuid }
        event: { type: string }
        document_date: { type: string, format: date-time }
        accounting_date: { type: string, format: date-time }
        description: { type: [string, "null"] }
        created_by: { type: string, format: uuid }
        posted_at: { type: string, format: date-time }
        reverses_id: { type: [string, "null"], format: uuid }
        lines:
          type: array
          minItems: 2
          items:
            type: object
            additionalProperties: true
            required: [debit_base, credit_base, currency_code, original_amount, exchange_rate]
            properties:
              debit_base: { $ref: "#/components/schemas/ExactDecimal" }
              credit_base: { $ref: "#/components/schemas/ExactDecimal" }
              currency_code: { type: string, pattern: '^[A-Z]{3}$' }
              original_amount: { $ref: "#/components/schemas/ExactDecimal" }
              exchange_rate: { $ref: "#/components/schemas/ExactDecimal" }

    JournalEntryPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/JournalEntry" } }

    TrialBalance:
      type: object
      required: [as_of, currency_code, debit_total, credit_total, balanced, data]
      properties:
        as_of: { type: [string, "null"], format: date }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        debit_total: { $ref: "#/components/schemas/ExactDecimal" }
        credit_total: { $ref: "#/components/schemas/ExactDecimal" }
        balanced: { type: boolean }
        data: { type: array, items: { type: object, additionalProperties: true } }

    CashAccountInput:
      type: object
      additionalProperties: false
      required: [name, kind, currency_code]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        kind: { type: string, enum: [cash, bank] }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }

    CashAccount:
      type: object
      required: [id, name, kind, currency_code, ledger_account_id, is_active, balance, base_balance, base_currency_code]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [cash, bank] }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        ledger_account_id: { type: string, format: uuid }
        is_active: { type: boolean }
        balance: { $ref: "#/components/schemas/ExactDecimal" }
        base_balance: { $ref: "#/components/schemas/ExactDecimal" }
        base_currency_code: { type: string, pattern: '^[A-Z]{3}$' }

    FinancialDocumentInput:
      type: object
      required: [operation_id, document_date]
      properties:
        operation_id: { type: string, minLength: 8, maxLength: 128 }
        document_date: { type: string, format: date }
        accounting_date: { type: string, format: date }
        backdate_reason: { type: string, minLength: 3, maxLength: 500 }

    OpeningBalanceInput:
      allOf:
        - $ref: "#/components/schemas/FinancialDocumentInput"
        - type: object
          required: [amount]
          properties:
            amount: { type: string, pattern: '^\d+(?:\.\d{1,6})?$' }

    CashTransferInput:
      allOf:
        - $ref: "#/components/schemas/FinancialDocumentInput"
        - type: object
          required: [from_account_id, to_account_id, amount, reason]
          properties:
            from_account_id: { type: string, format: uuid }
            to_account_id: { type: string, format: uuid }
            amount: { type: string, pattern: '^\d+(?:\.\d{1,6})?$' }
            reason: { type: string, minLength: 3, maxLength: 500 }

    FinancialDocument:
      type: object
      required: [id, document_number, currency_code, document_date, accounting_date, created_by, journal_entry_id, created_at]
      properties:
        id: { type: string, format: uuid }
        document_number: { type: string }
        amount: { $ref: "#/components/schemas/ExactDecimal" }
        currency_code: { type: string, pattern: '^[A-Z]{3}$' }
        document_date: { type: string, format: date-time }
        accounting_date: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        journal_entry_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    AccountingPeriod:
      type: object
      required: [month, status]
      properties:
        month: { type: string, format: date-time }
        status: { type: string, enum: [open, closed] }
        closed_at: { type: [string, "null"], format: date-time }
        closed_by: { type: [string, "null"], format: uuid }
        reopened_at: { type: [string, "null"], format: date-time }
        reopened_by: { type: [string, "null"], format: uuid }
        reopen_reason: { type: [string, "null"] }

    PeriodChecklist:
      type: object
      required: [month, can_close, checks]
      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$' }
        can_close: { type: boolean }
        checks: { type: array, items: { type: object, additionalProperties: true } }

    AdminFinancialSettings:
      type: object
      required: [settings, business_hours, closed_days, protection_thresholds]
      properties:
        settings: { type: object, additionalProperties: { type: [string, "null"] } }
        business_hours: { type: array, items: { type: object, additionalProperties: true } }
        closed_days: { type: array, items: { type: object, additionalProperties: true } }
        protection_thresholds: { type: object, additionalProperties: true }

    AdminFinancialSettingsPatch:
      type: object
      additionalProperties: false
      properties:
        settings: { type: object, additionalProperties: { type: [string, "null"] } }
        business_hours: { type: array, items: { type: object, additionalProperties: true } }
        closed_days: { type: array, items: { type: object, additionalProperties: true } }
        protection_thresholds: { type: object, additionalProperties: { type: integer, minimum: 0, maximum: 100 } }
