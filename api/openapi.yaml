      summary: List the zones/aisles/shelves/bins of a warehouse
      x-permission: inventory.count
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated warehouse locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehouseLocationPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- FULFILMENT (staff/warehouse) ----------------
  /pick-lists/{id}:
    get:
      tags: [Fulfilment]
      summary: Get a pick list (item + qty + warehouse + shelf + batch)
      x-permission: inventory.pick
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Pick list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickList" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pick-lists/{id}/items/{itemId}/pick:
    post:
      tags: [Fulfilment]
      summary: Mark a pick-list item as picked
      x-permission: inventory.pick
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated pick-list item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickListItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- RETURNS ----------------
  /returns:
    get:
      tags: [Returns]
      summary: List the authenticated customer's returns
      description: Returns only rows whose user_id is the authenticated caller, newest first, with pagination applied after ownership scoping.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          schema: { type: string, enum: [requested, approved, partially_approved, rejected, completed] }
      responses:
        "200":
          description: Caller-owned returns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnPage" }
    post:
      tags: [Returns]
      summary: Request a partial or full return of a delivered order
      description: Only the order owner can request a return. Pending quantities reserve eligibility. Expected refund uses immutable order-item unit prices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, items]
              properties:
                order_id: { type: string, format: uuid }
                reason: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [order_item_id, quantity, reason]
                    properties:
                      order_item_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                      reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Created return request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /returns/queue:
    get:
      tags: [Returns]
      summary: List all returns for staff review
      x-permission: returns.inspect
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          schema: { type: string, enum: [requested, approved, partially_approved, rejected, completed] }
      responses:
        "200":
          description: Paginated return queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /returns/{id}/inspect:
    post:
      tags: [Returns]
      summary: Review requested return quantities and conditions
      description: Review each requested line or reject the whole request. Sellable approved units restock; opened and damaged units do not. Approved refund is a COD obligation.
      x-permissions: [returns.inspect, returns.approve]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                items:
                  type: array
                  items:
                    type: object
                    required: [return_item_id, approved_quantity]
                    properties:
                      return_item_id: { type: string, format: uuid }
                      approved_quantity: { type: integer, minimum: 0 }
                      condition: { type: string, enum: [sellable, opened, damaged] }
      responses:
        "200":
          description: Inspected return
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /returns/{id}/complete:
    post:
      tags: [Returns]
      summary: Complete a reviewed return
      description: Completes an approved, partially approved, or rejected return. The order becomes returned only when all ordered units have approved returns.
      x-permission: returns.refund
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Completed return
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------- DELIVERIES (agent) ----------------
  /deliveries:
    get:
      tags: [Deliveries]
      summary: List all deliveries for operations staff
      x-permission: deliveries.manage
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          schema: { type: string, enum: [assigned, out_for_delivery, delivered, failed, returned] }
      responses:
        "200":
          description: Paginated deliveries across all agents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /deliveries/assigned:
    get:
      tags: [Deliveries]
      summary: Deliveries assigned to the current agent
      description: >
        Requires an app-surface `delivery_agent` session and returns deliveries
        scoped to the current authenticated agent only. When `status` is supplied, the
        server applies it server-side to that agent's deliveries before
        pagination. `total`
        is the number matching the selected status, rather than the agent's
        unfiltered total. Results have stable ordering by `dispatched_at` DESC,
        then `id` DESC as the unique tiebreaker, so equal timestamps do not make
        items shift between pages. Omitting `status` returns all statuses.
      x-app-role: delivery_agent
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          required: false
          description: Optional delivery status filter applied before pagination; omit to return all statuses.
          schema:
            type: string
            enum: [assigned, out_for_delivery, delivered, failed, returned]
      responses:
        "200":
          description: Paginated deliveries scoped to the current agent, with a filtered total when status is supplied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPage" }
              examples:
                normal:
                  summary: First page of assigned deliveries
                  value:
                    page: 1
                    per_page: 20
                    total: 45
                    data:
                      - id: "10000000-0000-4000-8000-000000000001"
                        order_id: "20000000-0000-4000-8000-000000000001"
                        agent_id: "30000000-0000-4000-8000-000000000001"
                        status: assigned
                        delivery_fee: 5
                        dispatched_at: "2026-09-09T09:00:00Z"
                        delivered_at: null
                empty:
                  summary: No deliveries match the selected status
                  value:
                    page: 1
                    per_page: 20
                    total: 0
                    data: []
        "403": { $ref: "#/components/responses/Forbidden" }
  /deliveries/{id}:
    patch:
      tags: [Deliveries]
      summary: Update delivery status (agent)
      description: >
        Only the assigned agent may act. An assigned delivery may start only
        when its order is ready_for_dispatch. Legal transitions are assigned to
        out_for_delivery; out_for_delivery to delivered or failed; and delivered
        to returned. Failed and returned are terminal. Dispatch and delivery
        timestamps are recorded, and the order advances atomically through its
        corresponding status events. Successful delivery reconciles a pending
        COD payment to paid in the same transaction.
      x-app-role: delivery_agent
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [out_for_delivery, delivered, failed, returned] }
      responses:
        "200":
          description: Updated delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /deliveries/{id}/assign:
    patch:
      tags: [Deliveries]
      summary: Assign or reassign an active delivery to a delivery agent
      description: Staff may assign only an active delivery to an active user with the delivery role.
      x-permission: orders.assign_agent
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string, format: uuid }
      responses:
        "200":
          description: Updated delivery assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- DEVICES (FCM push tokens) ----------------
  /devices/token:
    post:
      tags: [Devices]
      summary: Register or reactivate an account-owned push device token
      description: Re-registering refreshes last_seen_at; a token moving accounts is reassigned, never duplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string }
                platform: { type: string, enum: [android, ios, web] }
                locale: { type: string, enum: [ar, en, ar-IQ, en-US] }
      responses:
        "201":
          description: Registered device token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceToken" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Devices]
      summary: Deactivate an owned device token
      parameters:
        - { name: token, in: query, required: false, schema: { type: string }, description: "Token to remove; may be sent as a query param or in the request body." }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /me/notification-preferences:
    get:
      tags: [Devices]
      summary: Get effective per-type and per-channel notification preferences
      description: Returns all supported notification types across push and SMS. Transactional push defaults on; promo defaults off. Order confirmation SMS is mandatory. Legacy category toggles remain the fallback until a type/channel override is stored.
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
    patch:
      tags: [Devices]
      summary: Update own type/channel notification preferences
      description: Omitted pairs are unchanged; updates are shared by all devices. Order confirmation SMS cannot be disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferencesPatch" }
      responses:
        "200":
          description: Updated notification preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "422": { $ref: "#/components/responses/Validation" }

  /me/notifications:
    get:
      tags: [Notifications]
      summary: List the caller's durable notification inbox
      description: Shared across the recipient's devices and auth surfaces; newest first with id as the stable tiebreak.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: unread, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Own saved notifications, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }

  /me/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get the caller's unread notification count
      responses:
        "200":
          description: Current unread count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadCount" }

  /me/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one owned notification read
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Read state
          content:
            application/json:
              schema:
                type: object
                required: [id, read_at]
                properties:
                  id: { type: string, format: uuid }
                  read_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /me/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark every unread notification for the caller read
      responses:
        "200":
          description: Bulk read result
          content:
            application/json:
              schema:
                type: object
                required: [updated, read_at]
                properties:
                  updated: { type: integer, minimum: 0 }
                  read_at: { type: string, format: date-time }

  /notifications/stream-ticket:
    post:
      tags: [Notifications]
      summary: Issue a short-lived single-use SSE ticket
      description: The bearer token is used only for this POST and is never placed in the EventSource URL.
      responses:
        "201":
          description: Ticket valid for 60 seconds and one stream connection
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expires_at]
                properties:
                  ticket: { type: string }
                  expires_at: { type: string, format: date-time }

  /notifications/stream:
    get:
      tags: [Notifications]
      summary: Open the recipient-scoped notification SSE stream
      security: []
      description: Emits notification.created, notification.read and unread.count. Supports Last-Event-ID or since; sends heartbeat comments every 15 seconds.
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
        - { name: since, in: query, required: false, schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string, pattern: "^[0-9]+$" } }
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /monitor/orders:
    get:
      tags: [Monitoring]
      summary: Read-only order list for the order-monitor app role
      x-surface: app
      x-app-role: order_monitor
      parameters:
        - { name: status, in: query, schema: { oneOf: [ { $ref: "#/components/schemas/OrderStatus" }, { type: string, const: all } ] } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: "Partial case-insensitive customer-name or order-number search with Arabic normalization." }
        - { name: date_from, in: query, schema: { type: string, format: date }, description: Start of the Asia/Baghdad calendar day. }
        - { name: date_to, in: query, schema: { type: string, format: date }, description: "End of the Asia/Baghdad calendar day, inclusive." }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Pagination envelope plus status chip counts computed without the status filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorOrderPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /monitor/orders/{id}:
    get:
      tags: [Monitoring]
      summary: Read-only monitor order detail without product images
      x-surface: app
      x-app-role: order_monitor
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Monitor-safe order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorOrderDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- ADMIN: REPORTS & SETTINGS ----------------
  /admin/reports/sales:
    get:
      tags: [Admin]
      summary: Sales & analytics summary
      x-permission: reports.view
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Sales report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesReport" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /settings:
    get:
      tags: [Admin]
      summary: White-label store settings (name, logo, colors, currency)
      security: []
      responses:
        "200":
          description: Store settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSettings" }

  # ---------------- ADMIN: ORDERS ----------------
  /admin/orders:
    get:
      tags: [Admin]
      summary: List all orders (staff) with filters
      x-permission: orders.view
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string, maxLength: 40 }, description: "case-insensitive order_number search" }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/orders/{id}:
    get:
      tags: [Admin]
      summary: Get a full order-management detail
      x-permission: orders.view
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Order with immutable lines, customer, shipping snapshot, payment, delivery, agent, and timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/orders/{id}/status:
    patch:
      tags: [Admin]
      summary: Advance an order through its pre-dispatch lifecycle
      x-surface: admin
      x-permission-by-status:
        confirmed: orders.accept
        preparing: orders.prepare
        ready_for_dispatch: orders.mark_ready
        dispatched: orders.handover
      description: >
        Legal path: pending to confirmed to preparing to ready_for_dispatch to
        dispatched. Dispatch requires the existing current delivery to have an
        agent assigned through PATCH /deliveries/{id}/assign; it moves that same
        delivery to out_for_delivery and converts checkout stock holds from held
        to deducted. Delivery agent transitions own delivered, failed and returned.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  type: string
                  enum: [confirmed, preparing, ready_for_dispatch, dispatched]
                note: { type: [string, "null"], maxLength: 500 }
      responses:
        "200":
          description: Updated order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/orders/{id}/cancel:
    post:
      tags: [Admin]
      summary: Cancel a pre-dispatch order and release its stock holds
      x-permission: orders.cancel
      description: >
        Allowed only from pending, confirmed, preparing, or ready_for_dispatch.
        A non-empty reason is stored in the timeline and audit trail. Dispatched,
        delivered, failed, returned, and paid COD orders cannot be cancelled.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Cancelled order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- ADMIN: PRODUCTS CRUD ----------------
  /admin/products:
    get:
      tags: [Admin]
      summary: List all products, including hidden and archived products
      description: Uses the public filters and server-time pricing without public visibility restrictions.
      x-permission: catalog.products
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: on_sale, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, rating] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated products including non-public states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Admin]
      summary: Create a product
      description: Both `name_ar` and `name_en` are required and must contain non-whitespace text; validation errors identify the missing or empty field.
      x-permissions: [catalog.products, prices.change]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/products/{id}:
    get:
      tags: [Admin]
      summary: Get any product, including hidden or archived
      x-permission: catalog.products
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Admin]
      summary: Update a product
      description: >
        Omitted fields are preserved. Explicit null clears only nullable fields;
        `discount_type: null` clears the complete stored discount definition.
        Updating unrelated fields never changes a scheduled discount.
      x-permissions: [catalog.products, prices.change]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductPatch" }
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Admin]
      summary: Delete (archive) a product
      x-permission: catalog.products
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- ADMIN: CATEGORIES CRUD ----------------
  /admin/categories:
    get:
      tags: [Admin]
      summary: List all categories, including hidden categories
      description: Same parent/subtree filtering as the public route, without visibility filtering.
      x-permission: catalog.categories
      parameters:
        - { name: parent_id, in: query, schema: { type: string, format: uuid } }
        - { name: include_subtree, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Category tree including hidden nodes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Category" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Create a category
      description: Both `name_ar` and `name_en` are required and must contain non-whitespace text; validation errors identify the missing or empty field.
      x-permission: catalog.categories
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryCreate" }
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/categories/{id}:
    patch:
      tags: [Admin]
      summary: Update a category
      description: Omitted fields are unchanged. Reparenting must preserve the hierarchy depth and cycle rules.
      x-permission: catalog.categories
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryPatch" }
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Admin]
      summary: Delete a category
      description: Deletion is allowed only for a leaf category with no products; otherwise returns 409. Use is_visible=false to hide populated categories.
      x-permission: catalog.categories
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------- ADMIN: BANNERS CRUD ----------------
  /admin/banners:
    get:
      tags: [Admin]
      summary: List all home hero banners (including inactive and scheduled banners)
      x-permission: catalog.products
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated banners
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BannerPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Create a home hero banner
      x-permission: catalog.products
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BannerCreate" }
      responses:
        "201":
          description: Created banner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Banner" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/banners/{id}:
    get:
      tags: [Admin]
      summary: Get one home hero banner
      x-permission: catalog.products
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Banner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Banner" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Admin]
      summary: Update a home hero banner
      x-permission: catalog.products
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BannerPatch" }
      responses:
        "200":
          description: Updated banner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Banner" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Admin]
      summary: Delete a home hero banner
      x-permission: catalog.products
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- ADMIN: ACCESS MANAGEMENT ----------------
  /admin/staff:
    get:
      tags: [Admin]
      summary: List staff accounts and their preset/extra grants
      x-surface: admin
      x-permission: users.manage
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive, must_change] }
        - name: preset
          in: query
          schema: { type: string, format: uuid }
        - name: permission_key
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [name, username, created_at], default: name }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200":
          description: Staff accounts
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffUserListResponse" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Create a staff account with a temporary password
      x-surface: admin
      x-permission: users.manage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StaffCreate" } } } }
      responses:
        "201": { description: Staff account created, content: { application/json: { schema: { $ref: "#/components/schemas/StaffUser" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/staff/{id}:
    patch:
      tags: [Admin]
      summary: Update or deactivate a staff account
      description: Deactivation invalidates all existing sessions before the next request.
      x-surface: admin
      x-permission: users.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StaffUpdate" } } } }
      responses:
        "200": { description: Updated staff account, content: { application/json: { schema: { $ref: "#/components/schemas/StaffUser" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/staff/{id}/password:
    post:
      tags: [Admin]
      summary: Set or reset a temporary staff password
      description: Revokes sessions and forces a password change at the next login.
      x-surface: admin
      x-permission: users.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StaffPasswordReset" } } } }
      responses:
        "201": { description: Password reset }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/staff/{id}/access:
    put:
      tags: [Admin]
      summary: Replace a staff account's presets and extra grants
      description: The permission version changes atomically, so the next request sees the new grants without login.
      x-surface: admin
      x-permission: users.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StaffAccess" } } } }
      responses:
        "200": { description: Access replaced, content: { application/json: { schema: { $ref: "#/components/schemas/StaffUser" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/presets:
    get:
      tags: [Admin]
      summary: List permission presets
      x-surface: admin
      x-permission: roles.manage
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: kind
          in: query
          schema: { type: string, enum: [system, custom] }
        - name: permission_key
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, enum: [name, permissions], default: name }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200": { description: Presets, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPresetListResponse" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Create a permission preset
      x-surface: admin
      x-permission: roles.manage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPresetInput" } } } }
      responses:
        "201": { description: Preset created, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPreset" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/presets/{id}:
    patch:
      tags: [Admin]
      summary: Update a permission preset
      x-surface: admin
      x-permission: roles.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPresetInput" } } } }
      responses:
        "200": { description: Preset updated, content: { application/json: { schema: { $ref: "#/components/schemas/PermissionPreset" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin]
      summary: Delete a non-system permission preset
      x-surface: admin
      x-permission: roles.manage
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/Reason" }
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/permissions:
    get:
      tags: [Admin]
      summary: List the code-defined permission registry
      x-surface: admin
      x-permission: roles.manage
      responses:
        "200":
          description: All permissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Permission" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/work-phones:
    get:
      tags: [Admin]
      summary: List pre-registered work phones
      x-surface: admin
      x-permission: users.manage
      parameters:
        - { $ref: "#/components/parameters/Search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: role
          in: query
          schema: { type: string, enum: [delivery_agent, order_monitor] }
        - name: status
          in: query
          schema: { type: string, enum: [active, revoked] }
        - name: sort
          in: query
          schema: { type: string, enum: [name, phone, role], default: name }
        - name: dir
          in: query
          schema: { type: string, enum: [asc, desc], default: asc }
      responses:
        "200": { description: Work phones, content: { application/json: { schema: { $ref: "#/components/schemas/WorkPhoneListResponse" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Register or change a work phone role
      description: A phone already belonging to a customer is rejected with `CUSTOMER_PHONE_ALREADY_REGISTERED` (409).
      x-surface: admin
      x-permission: users.manage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkPhoneInput" } } } }
      responses:
        "201": { description: Work phone registered, content: { application/json: { schema: { $ref: "#/components/schemas/WorkPhone" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/work-phones/{phone}:
    delete:
      tags: [Admin]
      summary: Revoke a work phone immediately
      description: Existing app access and refresh tokens stop working on the next request.
      x-surface: admin
      x-permission: users.manage
      parameters:
        - name: phone
          in: path
          required: true
          schema: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
        - { $ref: "#/components/parameters/Reason" }
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: List audit records newest first
      description: Results use creation time descending with ID descending as a stable tiebreak.
      x-surface: admin
      x-permission: audit.view
      parameters:
        - name: actor
          in: query
          description: Actor UUID, username, or name search.
          schema: { type: string, maxLength: 160 }
        - name: action
          in: query
          schema: { type: string, maxLength: 80 }
        - name: entity_type
          in: query
          schema: { type: string, maxLength: 80 }
        - name: entity_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated audit records
          content: { application/json: { schema: { $ref: "#/components/schemas/AuditLogList" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/currencies:
    get:
      tags: [Finance]
      summary: List configured currencies
      x-surface: admin
      x-permission: ledger.view
      responses:
        "200":
          description: Currencies
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Currency" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/currencies/{code}:
    patch:
      tags: [Finance]
      summary: Enable a currency or select the base before the first movement
      x-surface: admin
      x-permission: settings.manage
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z]{3}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                is_base: { type: boolean }
      responses:
        "200": { description: Updated currency, content: { application/json: { schema: { $ref: "#/components/schemas/Currency" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/exchange-rates:
    get:
      tags: [Finance]
      summary: List exchange-rate history newest first
      x-surface: admin
      x-permission: ledger.view
      parameters:
        - name: currency_code
          in: query
          schema: { type: string, pattern: '^[A-Z]{3}$' }
      responses:
        "200": { description: Rates, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ExchangeRate" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Finance]
      summary: Record an effective exchange rate
      description: Input is `1 foreign = X base`; basis 100 is normalized to basis 1 before storage.
      x-surface: admin
      x-permission: fx_rates.update
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeRateInput" } } }
      responses:
        "201": { description: Recorded rate, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeRate" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/exchange-rates/{code}/applicable:
    get:
      tags: [Finance]
      summary: Resolve the latest rate effective at a date
      x-surface: admin
      x-permission: ledger.view
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Z]{3}$' }
        - name: at
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200": { description: Applicable rate with stale-today warning, content: { application/json: { schema: { $ref: "#/components/schemas/ExchangeRate" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/operations/{operationId}:
    get:
      tags: [Finance]
      summary: Get the caller's idempotent operation outcome
      x-surface: admin
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: Operation outcome, content: { application/json: { schema: { $ref: "#/components/schemas/OperationOutcome" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/drafts:
    get:
      tags: [Finance]
      summary: List the caller's financial document drafts
      x-surface: admin
      responses:
        "200": { description: Drafts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DocumentDraft" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/drafts/{documentType}:
    parameters:
      - name: documentType
        in: path
        required: true
        schema: { type: string, maxLength: 60 }
    get:
      tags: [Finance]
      summary: Get the caller's draft
      x-surface: admin
      responses:
        "200": { description: Draft, content: { application/json: { schema: { $ref: "#/components/schemas/DocumentDraft" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Finance]
      summary: Save the caller's draft without financial effect
      x-surface: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payload]
              properties:
                payload: { type: object, additionalProperties: true }
      responses:
        "200": { description: Saved draft, content: { application/json: { schema: { $ref: "#/components/schemas/DocumentDraft" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Finance]
      summary: Discard the caller's draft
      x-surface: admin
      responses:
        "204": { description: Draft discarded }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/ledger/entries:
    get:
      tags: [Finance]
      summary: List immutable journal entries
      x-surface: admin
      x-permission: ledger.view
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - { name: account_code, in: query, schema: { type: string } }
        - { name: source_type, in: query, schema: { type: string } }
        - { name: source_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Journal page, content: { application/json: { schema: { $ref: "#/components/schemas/JournalEntryPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/ledger/entries/{id}/reversal:
    post:
      tags: [Finance]
      summary: Post the one allowed reversal for an immutable entry
      x-surface: admin
      x-permission: ledger.reverse
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuditReason" } } } }
      responses:
        "201": { description: Reversal entry, content: { application/json: { schema: { $ref: "#/components/schemas/JournalEntry" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/ledger/trial-balance:
    get:
      tags: [Finance]
      summary: Get trial balance
      x-surface: admin
      x-permission: ledger.view
      parameters:
        - { name: as_of, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Trial balance, content: { application/json: { schema: { $ref: "#/components/schemas/TrialBalance" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/ledger/accounts/{code}/balance:
    get:
      tags: [Finance]
      summary: Get a ledger account balance
      x-surface: admin
      x-permission: ledger.view
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: as_of, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Account balance, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/cash-accounts:
    get:
      tags: [Finance]
      summary: List cash and bank accounts with ledger-derived balances
      x-surface: admin
      x-permission: cash_accounts.manage
      responses:
        "200": { description: Accounts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CashAccount" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Finance]
      summary: Create a cash or bank account
      x-surface: admin
      x-permission: cash_accounts.manage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CashAccountInput" } } } }
      responses:
        "201": { description: Created account, content: { application/json: { schema: { $ref: "#/components/schemas/CashAccount" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/cash-accounts/{id}:
    get:
      tags: [Finance]
      summary: Read a cash or bank account with its ledger-derived balance
      x-surface: admin
      x-permission: cash_accounts.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: Cash account, content: { application/json: { schema: { $ref: "#/components/schemas/CashAccount" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Finance]
      summary: Rename or activate a cash account
      x-surface: admin
      x-permission: cash_accounts.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 160 }
                is_active: { type: boolean }
      responses:
        "200": { description: Updated account, content: { application/json: { schema: { $ref: "#/components/schemas/CashAccount" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Finance]
      summary: Delete an unused cash account; accounts with movements must be disabled
      x-surface: admin
      x-permission: cash_accounts.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Unused account deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/cash-accounts/{id}/opening-balance:
    post:
      tags: [Finance]
      summary: Post a cash account opening-balance document
      x-surface: admin
      x-permission: cash_accounts.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OpeningBalanceInput" } } } }
      responses:
        "201": { description: Posted opening balance, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialDocument" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/cash-transfers:
    post:
      tags: [Finance]
      summary: Post a numbered same-currency transfer
      x-surface: admin
      x-permission: cash_accounts.manage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CashTransferInput" } } } }
      responses:
        "201": { description: Posted transfer, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialDocument" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/accounting-periods:
    get:
      tags: [Finance]
      summary: List accounting periods and close history
      x-surface: admin
      x-permission: ledger.view
      responses:
        "200": { description: Periods, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AccountingPeriod" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/accounting-periods/{month}/checklist:
    get:
      tags: [Finance]
      summary: Run the close checklist
      x-surface: admin
      x-permission: period.close
      parameters: [{ name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
      responses:
        "200": { description: Checklist, content: { application/json: { schema: { $ref: "#/components/schemas/PeriodChecklist" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/accounting-periods/{month}/close:
    post:
      tags: [Finance]
      summary: Close a period and save a sequenced trial-balance snapshot
      x-surface: admin
      x-permission: period.close
      parameters: [{ name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses:
        "201": { description: Period close, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/accounting-periods/{month}/reopen:
    post:
      tags: [Finance]
      summary: Reopen a closed period with a mandatory reason
      x-surface: admin
      x-permission: period.reopen
      parameters: [{ name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuditReason" } } } }
      responses:
        "201": { description: Reopened period, content: { application/json: { schema: { $ref: "#/components/schemas/AccountingPeriod" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /admin/settings:
    get:
      tags: [Finance]
      summary: Read all audited operational and financial settings
      x-surface: admin
      x-permission: settings.manage
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/AdminFinancialSettings" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Finance]
      summary: Update operational and financial settings atomically
      x-surface: admin
      x-permission: settings.manage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminFinancialSettingsPatch" } } } }
      responses:
        "200": { description: Updated settings, content: { application/json: { schema: { $ref: "#/components/schemas/AdminFinancialSettings" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: q
      in: query
      required: false
      schema: { type: string, maxLength: 160 }
    Reason:
      name: reason
      in: query
      required: true
      schema: { type: string, minLength: 3, maxLength: 500 }
  responses:
    Unauthorized: { description: Missing/invalid token (`UNAUTHORIZED`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Not found (`NOT_FOUND`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict: { description: State conflict (`CONFLICT`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Validation: { description: "Invalid request data (`VALIDATION_FAILED`, HTTP 422)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited: { description: Too many requests (`RATE_LIMITED`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Missing permission (`FORBIDDEN`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [status, code, message, errors]
      properties:
        status: { type: integer, example: 422 }
        code: { type: string, example: VALIDATION_FAILED }
        message: { type: string }
        errors:
          type: array
          description: Empty for non-validation errors.
          items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string, example: items.0.quantity }
        code: { type: string, example: min }
        message: { type: string, example: quantity must not be less than 1 }

    Money:
      type: number
      description: Decimal money amount displayed at the associated currency precision (IQD 0, USD 2).

    MediaObject:
      type: object
      additionalProperties: false
      required: [id, public_url, mime_type, size_bytes, checksum, created_at]
      properties:
        id: { type: string, format: uuid }
        public_url: { type: string, format: uri, description: Stable API URL used when associating the image with catalog data. }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, image/avif] }
        size_bytes: { type: integer, minimum: 1, maximum: 8388608 }
        checksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        created_at: { type: string, format: date-time }

    Pagination:
      type: object
      description: Reusable pagination envelope. List endpoints add a `data` array of the resource.
      required: [page, per_page, total]
      properties:
        page: { type: integer, example: 1 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 0 }

    AuthTokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    Password:
      type: string
      minLength: 12
      maxLength: 128
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{12,128}$'
      description: Must contain upper and lower case letters, a number, and a symbol.

    User:
      type: object
      additionalProperties: false
      required: [id, name, phone, username, email, is_active, role, permissions, surface, client, must_change_password, permission_version, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        username: { type: [string, "null"] }
        email: { type: [string, "null"] }
        is_active: { type: boolean }
        role: { type: [string, "null"], enum: [customer, delivery_agent, order_monitor, null], description: Present only on the app surface. }
        permissions:
          type: array
          description: Current preset and extra grants; always empty on the app surface.
          items: { type: string, example: "orders.accept" }
        surface: { type: string, enum: [admin, app] }
        client: { type: [string, "null"], enum: [mobile, web_store, null] }
        must_change_password: { type: boolean }
        permission_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }

    UserSelfUpdate:
      type: object
      description: >
        Fields the authenticated user may update without identity
        re-verification. Phone is intentionally excluded; changing it requires
        OTP re-verification.
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120, pattern: '.*\S.*' }
        email: { type: [string, "null"], format: email, maxLength: 160 }

    Address:
      type: object
      required: [id, user_id, city, contact_phone, is_default, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        label: { type: [string, "null"], example: Home }
        city: { type: string }
        area: { type: [string, "null"] }
        street: { type: [string, "null"] }
        details: { type: [string, "null"] }
        contact_phone: { type: string, minLength: 3, maxLength: 32, description: Recipient contact for this address; independent from the account phone. }
        lat: { type: [number, "null"], format: double }
        lng: { type: [number, "null"], format: double }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }

    AddressCreate:
      type: object
      additionalProperties: false
      required: [city, contact_phone]
      properties:
        label: { type: [string, "null"], example: Home }
        city: { type: string }
        area: { type: [string, "null"] }
        street: { type: [string, "null"] }
        details: { type: [string, "null"] }
        contact_phone: { type: string, minLength: 3, maxLength: 32, pattern: "^\\+[1-9]\\d{7,14}$", description: "Trimmed before storage; must be an E.164 number such as +9647701234567." }
        lat: { type: [number, "null"], format: double }
        lng: { type: [number, "null"], format: double }
        is_default: { type: boolean, default: false }

    AddressPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are unchanged; null clears only nullable fields. contact_phone and city cannot be null.
      properties:
        label: { type: [string, "null"], maxLength: 80 }
        city: { type: string, minLength: 1, maxLength: 80 }
        area: { type: [string, "null"], maxLength: 120 }
        street: { type: [string, "null"], maxLength: 160 }
        details: { type: [string, "null"] }
        contact_phone: { type: string, minLength: 3, maxLength: 32, pattern: "^\\+[1-9]\\d{7,14}$", description: "Trimmed before storage; must be an E.164 number such as +9647701234567." }
        lat: { type: [number, "null"], format: double }
        lng: { type: [number, "null"], format: double }
        is_default: { type: boolean }

    AddressPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Address" }

    Category:
      type: object
      description: Category reads populate an empty localized name or description from the other language.
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid }
        name_en: { type: string }
        name_ar: { type: string }
        slug: { type: string, description: "SEO URL slug. Products are still filtered by category_id." }
        description_en: { type: [string, "null"] }
        description_ar: { type: [string, "null"] }
        image_url: { type: [string, "null"], format: uri, description: "Stable URL returned by POST /media/images." }
        icon_key: { type: [string, "null"], description: "Semantic key such as consumer_electronics; never a framework codepoint or IconData value." }
        sort_order: { type: integer }
        is_visible: { type: boolean }
        children: { type: array, items: { $ref: "#/components/schemas/Category" } }

    CategoryCreate:
      type: object
      additionalProperties: false
      description: Creates a root or child category. Maximum depth is five levels, root depth 0 through depth 4.
      required: [name_en, name_ar]
      properties:
        parent_id: { type: [string, "null"], format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace English name. }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace Arabic name. }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 140 }
        description_en: { type: [string, "null"] }
        description_ar: { type: [string, "null"] }
        image_url: { type: [string, "null"], format: uri, description: "Stable URL returned by POST /media/images." }
        icon_key: { type: [string, "null"], pattern: '^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$', maxLength: 80 }
        sort_order: { type: integer, default: 0 }
        is_visible: { type: boolean, default: true }

    CategoryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: All fields are optional. parent_id null moves to root; a category cannot be its own parent or a descendant of itself, and reparenting cannot make any subtree node deeper than depth 4.
      properties:
        parent_id: { type: [string, "null"], format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*' }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 140 }
        description_en: { type: [string, "null"] }
        description_ar: { type: [string, "null"] }
        image_url: { type: [string, "null"], format: uri, description: "Stable URL returned by POST /media/images." }
        icon_key: { type: [string, "null"], pattern: '^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$', maxLength: 80 }
        sort_order: { type: integer, minimum: 0 }
        is_visible: { type: boolean }

    Product:
      type: object
      description: >
        A catalog product. `in_stock` and `available_qty` are computed at read
        time (sum of batch_stock minus active batch reservations and temporary
        COD order holds); they are not stored on the product.
        Pricing works the same way: the product stores a regular `price` plus a
        discount DEFINITION (`discount_type`, `discount_value` and the scheduled
        window `discount_starts_at`/`discount_ends_at`), and the server derives
        `on_sale`, `discounted_price`, `effective_price` and `discount_percent`
        on every read. Those four are never stored, because a scheduled window
        changes what they mean as the clock moves.
        Reads populate an empty or missing `name_ar`/`name_en` from the other
        language so locale-specific clients never receive a blank name.
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        name_en: { type: string }
        name_ar: { type: string }
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money", multipleOf: 1, description: "Regular selling price in whole IQD." }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        discount_type: { type: [string, "null"], enum: [percentage, amount, null], description: "Discount kind, or null when the product has no discount defined." }
        discount_value: { type: [number, "null"], multipleOf: 0.01, description: "For `percentage`, the percentage off (10 means 10%, at most two decimals). For `amount`, the currency amount subtracted from `price`. Null when `discount_type` is null." }
        discount_starts_at: { type: [string, "null"], format: date-time, description: "Start of the scheduled discount window; null means the discount is active immediately." }
        discount_ends_at: { type: [string, "null"], format: date-time, description: "End of the scheduled discount window; null means the discount never expires." }
        on_sale: { type: boolean, readOnly: true, description: "Computed: true when discount_type is set AND now() falls inside [discount_starts_at, discount_ends_at], treating null bounds as open." }
        discounted_price: { type: [number, "null"], multipleOf: 1, readOnly: true, description: "Computed in whole IQD when on_sale is true and rounded half away from zero; null when on_sale is false." }
        effective_price: { $ref: "#/components/schemas/Money", readOnly: true, description: "The price the customer pays. Cart and order pricing use this exact value." }
        discount_percent: { type: [integer, "null"], readOnly: true, description: "Computed when on_sale is true: round((price - discounted_price) / price * 100). Null when on_sale is false." }
        is_negotiable: { type: boolean }
        floor_price: { type: [number, "null"], multipleOf: 1, description: "Negotiation floor in whole IQD, at most the regular price." }
        points_price: { type: [integer, "null"], description: "Persisted points cost for future negotiation UI; no customer negotiation endpoint yet." }
        tracks_expiry: { type: boolean }
        rating_avg: { type: number, description: "Cached average of published product reviews only, reconciled transactionally from review rows and rounded to two decimals half away from zero." }
        rating_count: { type: integer, description: "Cached count of published product reviews only; review rows are authoritative." }
        status: { type: string, enum: [active, hidden, archived] }
        in_stock: { type: boolean, description: "computed: available_qty > 0" }
        available_qty: { type: integer, description: "computed: on-hand minus active batch reservations and temporary COD holds" }
        images:
          type: array
          description: Ordered by sort_order; the first image is primary.
          items: { $ref: "#/components/schemas/ProductImage" }
        variants: { type: array, items: { $ref: "#/components/schemas/ProductVariant" } }

    ProductInput:
      type: object
      additionalProperties: false
      description: >
        Admin create and update requests require both names after trimming;
        neither may be empty. Pricing is written as a regular `price` plus an
        optional discount definition; the computed `on_sale`,
        `discounted_price`, `effective_price` and `discount_percent` fields are
        read-only and are never accepted on a write.


        Discount validation, each breach returning 422 `validation_error`:


        * `discount_type` set requires a `discount_value` greater than 0.

        * `percentage`: 0 < `discount_value` <= 100.

        * `amount`: 0 < `discount_value` < `price`.

        * `discount_type` null clears the whole discount; `discount_value` must
        then be null or omitted.

        * When both `discount_starts_at` and `discount_ends_at` are set,
        `discount_ends_at` must be strictly after `discount_starts_at`.

        * Either timestamp may be sent alone: a null start means the discount is
        active immediately, a null end means it never expires.
      required: [category_id, name_en, name_ar, price]
      properties:
        category_id: { type: string, format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace English name. }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace Arabic name. }
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money", multipleOf: 1, minimum: 0, description: "Regular selling price in whole IQD." }
        discount_type: { type: [string, "null"], enum: [percentage, amount, null], default: null, description: "Null (the default) means no discount and clears any discount already stored." }
        discount_value: { type: [number, "null"], multipleOf: 0.01, exclusiveMinimum: 0, description: "Required when discount_type is set, and must be null or omitted otherwise. percentage: at most 100. amount: strictly less than price." }
        discount_starts_at: { type: [string, "null"], format: date-time, description: "Optional window start; null means the discount is active immediately." }
        discount_ends_at: { type: [string, "null"], format: date-time, description: "Optional window end; null means the discount never expires. Must be after discount_starts_at when both are set." }
        is_negotiable: { type: boolean, default: false, description: "Requires floor_price when true." }
        floor_price: { type: [number, "null"], multipleOf: 1, minimum: 0, description: "Whole-IQD value that must not exceed price." }
        points_price: { type: [integer, "null"], minimum: 0, description: "Data-only points cost; negotiation UI is deferred." }
        tracks_expiry: { type: boolean, default: false }
        status: { type: string, enum: [active, hidden, archived], default: active }
        images:
          type: array
          description: Ordered creation list; array index becomes sort_order and index 0 is primary.
          items:
            type: object
            additionalProperties: false
            required: [url]
            properties:
              url: { type: string, format: uri, description: "Stable URL returned by POST /media/images." }
        variants:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              attributes: { type: object, additionalProperties: true }
              price_delta: { type: integer }

    ProductPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: All ProductInput fields are optional on PATCH. Omission preserves the stored value. Explicit null clears a nullable field; discount_type null clears discount_type, discount_value, discount_starts_at, and discount_ends_at together.
      properties:
        category_id: { type: string, format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*' }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*' }
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money", multipleOf: 1, minimum: 0 }
        discount_type: { type: [string, "null"], enum: [percentage, amount, null] }
        discount_value: { type: [number, "null"], multipleOf: 0.01, exclusiveMinimum: 0 }
        discount_starts_at: { type: [string, "null"], format: date-time }
        discount_ends_at: { type: [string, "null"], format: date-time }
        is_negotiable: { type: boolean }
        floor_price: { type: [number, "null"], multipleOf: 1, minimum: 0, description: "Whole-IQD value that must not exceed the merged regular price." }
        points_price: { type: [integer, "null"], minimum: 0 }
        tracks_expiry: { type: boolean }
        status: { type: string, enum: [active, hidden, archived] }
        media_operations:
          type: array
          description: Applied atomically in array order; the image at final position 0 is primary.
          items: { $ref: "#/components/schemas/ProductMediaOperation" }
        variants:
          type: array
          description: >
            Replaces the variant set in place. Each entry is matched to an
            existing variant by `id` when supplied and otherwise by `sku`, so
            an update never reissues variant ids. Omitting a variant removes
            it; removing one still referenced by inventory, cart, purchasing
            or order history is rejected with 422.
          items:
            type: object
            additionalProperties: false
            properties:
              id: { type: string, format: uuid, description: "Existing variant to update; omit to match on sku or to add a new variant." }
              sku: { type: string }
              attributes: { type: object, additionalProperties: true }
              price_delta: { type: integer }

    ProductImage:
      type: object
      additionalProperties: false
      required: [id, url, sort_order, is_primary]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        sort_order: { type: integer, minimum: 0 }
        is_primary: { type: boolean, readOnly: true, description: True exactly when this is the first image. }

    ProductMediaOperation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [op, url, position]
          properties:
            op: { const: add }
            url: { type: string, format: uri, description: "Stable URL returned by POST /media/images." }
            position: { type: integer, minimum: 0 }
        - type: object
          additionalProperties: false
          required: [op, image_id]
          properties:
            op: { const: remove }
            image_id: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [op, image_id, url]
          properties:
            op: { const: replace }
            image_id: { type: string, format: uuid }
            url: { type: string, format: uri, description: "Stable URL returned by POST /media/images." }
        - type: object
          additionalProperties: false
          required: [op, image_id, position]
          properties:
            op: { const: move }
            image_id: { type: string, format: uuid }
            position: { type: integer, minimum: 0 }
      discriminator: { propertyName: op }

    Banner:
      type: object
      additionalProperties: false
      required: [id, title, subtitle, image_url, cta_text, link_url, sort_order, is_active, starts_at, ends_at, created_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        image_url: { type: string, format: uri }
        cta_text: { type: [string, "null"] }
        link_url: { type: [string, "null"], format: uri }
        sort_order: { type: integer }
        is_active: { type: boolean }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    BannerCreate:
      type: object
      additionalProperties: false
      required: [title, image_url]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        subtitle: { type: [string, "null"] }
        image_url: { type: string, format: uri, description: "Stable URL returned by POST /media/images." }
        cta_text: { type: [string, "null"], maxLength: 120 }
        link_url: { type: [string, "null"], format: uri }
        sort_order: { type: integer, minimum: 0, default: 0 }
        is_active: { type: boolean, default: true }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }

    BannerPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted properties retain their stored values; explicit null clears nullable text or schedule properties.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        subtitle: { type: [string, "null"] }
        image_url: { type: string, format: uri, description: "Stable URL returned by POST /media/images." }
        cta_text: { type: [string, "null"], maxLength: 120 }
        link_url: { type: [string, "null"], format: uri }
        sort_order: { type: integer, minimum: 0 }
        is_active: { type: boolean }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }

    BannerPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Banner" }

    ProductVariant:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        attributes: { type: [object, "null"], additionalProperties: true }
        price_delta: { type: integer }
        currency: { type: string, pattern: '^[A-Z]{3}$' }

    ProductAvailability:
      type: object
      description: Computed availability (on-hand minus active batch reservations and temporary COD holds) per product & variant.
      properties:
        product_id: { type: string, format: uuid }
        in_stock: { type: boolean }
        available_qty: { type: integer, description: "total sellable across variants" }
        variants:
          type: array
          items:
            type: object
            properties:
              variant_id: { type: [string, "null"], format: uuid }
              sku: { type: string }
              available_qty: { type: integer }
              in_stock: { type: boolean }

    ProductPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Product" }

    Cart:
      type: object
      required: [id, items, subtotal, discount, delivery_fee, total, coupon_code, currency]
      properties:
        id: { type: string, format: uuid }
        coupon_code: { type: [string, "null"] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        items:
          type: array
          items:
            type: object
            required: [id, product_id, variant_id, quantity, unit_price, line_total, currency, available, available_qty]
            properties:
              id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              variant_id: { type: [string, "null"], format: uuid }
              quantity: { type: integer, minimum: 1, maximum: 99 }
              unit_price: { $ref: "#/components/schemas/Money", description: "Current server-time effective_price plus the selected variant's price_delta, floored at zero." }
              line_total: { $ref: "#/components/schemas/Money" }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              available: { type: boolean, description: "False when the product is hidden/inactive or available_qty is below quantity. Checkout rejects unavailable lines." }
              available_qty: { type: integer, minimum: 0 }
        subtotal: { $ref: "#/components/schemas/Money" }
        discount: { $ref: "#/components/schemas/Money", description: "Valid coupon discount only; catalog markdown is already in unit_price." }
        delivery_fee: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }

    WishlistItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        added_at: { type: string, format: date-time }
        product: { $ref: "#/components/schemas/Product" }

    WishlistPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/WishlistItem" }

    Coupon:
      type: object
      required: [code, type, value, currency]
      properties:
        code: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        value: { type: number }
        currency: { type: string, pattern: '^[A-Z]{3}$' }

    OrderStatus:
      type: string
      description: Canonical order lifecycle status (matches orders.status in schema.sql).
      enum:
        - pending
        - confirmed
        - preparing
        - ready_for_dispatch
        - dispatched
        - delivered
        - failed
        - cancelled
        - return_requested
        - returned

    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid, description: "order_item_id — reference this from reviews & returns" }
