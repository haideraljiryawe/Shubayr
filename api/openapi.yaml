      responses:
        "201": { description: Reversal entry, content: { application/json: { schema: { $ref: "#/components/schemas/JournalEntry" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/ledger/trial-balance:
    get:
      tags: [Finance]
      summary: Get trial balance
      x-surface: admin
      x-permission: ledger.view
      parameters:
        - { name: as_of, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Trial balance, content: { application/json: { schema: { $ref: "#/components/schemas/TrialBalance" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/ledger/accounts/{code}/balance:
    get:
      tags: [Finance]
      summary: Get a ledger account balance
      x-surface: admin
      x-permission: ledger.view
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: as_of, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Account balance, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/cash-accounts:
    get:
      tags: [Finance]
      summary: List cash and bank accounts with ledger-derived balances
      x-surface: admin
      x-permission: cash_accounts.view
      responses:
        "200": { description: Accounts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CashAccount" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Finance]
      summary: Create a cash or bank account
      x-surface: admin
      x-permission: cash_accounts.manage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CashAccountInput" } } } }
      responses:
        "201": { description: Created account, content: { application/json: { schema: { $ref: "#/components/schemas/CashAccount" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/cash-accounts/{id}:
    get:
      tags: [Finance]
      summary: Read a cash or bank account with its ledger-derived balance
      x-surface: admin
      x-permission: cash_accounts.view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: Cash account, content: { application/json: { schema: { $ref: "#/components/schemas/CashAccount" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Finance]
      summary: Rename or activate a cash account
      x-surface: admin
      x-permission: cash_accounts.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 160 }
                is_active: { type: boolean }
      responses:
        "200": { description: Updated account, content: { application/json: { schema: { $ref: "#/components/schemas/CashAccount" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Finance]
      summary: Delete an unused cash account; accounts with movements must be disabled
      x-surface: admin
      x-permission: cash_accounts.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Unused account deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/cash-accounts/{id}/opening-balance:
    post:
      tags: [Finance]
      summary: Post a cash account opening-balance document
      x-surface: admin
      x-permission: cash_accounts.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OpeningBalanceInput" } } } }
      responses:
        "201": { description: Posted opening balance, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialDocument" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/ExchangeRateValidation" }
  /admin/cash-transfers:
    post:
      tags: [Finance]
      summary: Post a numbered same-currency transfer
      x-surface: admin
      x-permission: cash_accounts.manage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CashTransferInput" } } } }
      responses:
        "201": { description: Posted transfer, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialDocument" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/ExchangeRateValidation" }

  /admin/cash-receipts:
    get:
      tags: [Finance, Deliveries]
      summary: List delivery-party cash receipt vouchers
      x-error-codes: [DATE_RANGE_INVALID]
      x-surface: admin
      x-permission: deliveries.manage
      parameters:
        - { name: party_id, in: query, schema: { type: string, format: uuid } }
        - { name: cash_account_id, in: query, schema: { type: string, format: uuid } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string, enum: [active, reversed] } }
        - { name: sort_by, in: query, schema: { type: string, enum: [date, amount], default: date } }
        - { name: sort_direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Paginated receipt vouchers, content: { application/json: { schema: { $ref: "#/components/schemas/CashReceiptPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Finance, Deliveries]
      summary: Receive IQD cash from a delivery party into a cash account
      description: Posts the phase-3 cash_received map (cash account debit, party cash-custody credit). Optional allocations settle confirmed collections; any remainder remains explicitly unallocated.
      x-surface: admin
      x-permission: cash_receipts.receive
      x-conditional-permission: { when: allocations are present, permission: cash_receipts.allocate }
      x-error-codes: [RECEIPT_ALLOCATION_PERMISSION_REQUIRED, DELIVERY_PARTY_INACTIVE, CASH_ACCOUNT_INACTIVE, CASH_RECEIPT_REQUIRES_IQD_ACCOUNT, RECEIPT_EXCEEDS_CASH_CUSTODY, ALLOCATION_ORDER_DUPLICATED, ALLOCATION_COLLECTION_NOT_FOUND, ALLOCATION_WRONG_PARTY, ALLOCATION_COLLECTION_UNCONFIRMED, ORDER_ALREADY_RECEIPTED, ALLOCATION_EXCEEDS_COLLECTED, ALLOCATION_EXCEEDS_RECEIPT, AMOUNT_NOT_NUMERIC, AMOUNT_NOT_POSITIVE, SELF_CUSTODY_CASH_ACTION_FORBIDDEN, SEPARATION_OF_DUTIES_VIOLATION, PERIOD_CLOSED]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CashReceiptCreateInput" } } } }
      responses:
        "201": { description: Posted cash receipt, content: { application/json: { schema: { $ref: "#/components/schemas/CashReceiptVoucher" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/cash-receipts/unallocated:
    get:
      tags: [Finance, Deliveries]
      summary: List active receipts with an unallocated remainder
      x-error-codes: [DATE_RANGE_INVALID]
      x-surface: admin
      x-permission: deliveries.manage
      parameters:
        - { name: party_id, in: query, schema: { type: string, format: uuid } }
        - { name: cash_account_id, in: query, schema: { type: string, format: uuid } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: sort_by, in: query, schema: { type: string, enum: [date, amount], default: date } }
        - { name: sort_direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Paginated receipts with remaining allocation capacity, content: { application/json: { schema: { $ref: "#/components/schemas/CashReceiptPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/cash-receipts/allocation-suggestions:
    get:
      tags: [Finance, Deliveries]
      summary: Suggest a party's oldest unsettled confirmed collections
      x-surface: admin
      x-permission: cash_receipts.allocate
      parameters:
        - { name: party_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: amount_iqd, in: query, schema: { type: string, pattern: '^\d+(?:\.\d{1,6})?$' } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200": { description: Oldest-first allocation suggestions, content: { application/json: { schema: { $ref: "#/components/schemas/CashReceiptSuggestions" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/cash-receipts/reconciliation:
    get:
      tags: [Finance, Deliveries]
      summary: Reconcile the unallocated-receipt subledger
      description: Proves total receipts minus active allocations minus full reversed receipts equals total unallocated, overall and per delivery party. No separate GL account is introduced.
      x-surface: admin
      x-permission: deliveries.manage
      parameters:
        - { name: party_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Overall and per-party receipt subledger reconciliation, content: { application/json: { schema: { $ref: "#/components/schemas/CashReceiptReconciliation" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/cash-receipts/{id}:
    get:
      tags: [Finance, Deliveries]
      summary: Read one cash receipt with allocations and reversal
      x-surface: admin
      x-permission: deliveries.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: Cash receipt detail, content: { application/json: { schema: { $ref: "#/components/schemas/CashReceiptVoucher" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/cash-receipts/{id}/allocations:
    post:
      tags: [Finance, Deliveries]
      summary: Allocate an active receipt's remainder to delivered orders
      description: Partial allocation is allowed. Orders must belong to the receipt party and allocations cannot exceed either the receipt remainder or an order's confirmed collected amount.
      x-surface: admin
      x-permission: cash_receipts.allocate
      x-error-codes: [RECEIPT_ALLOCATION_REVERSED, SELF_CUSTODY_CASH_ACTION_FORBIDDEN, ALLOCATION_ORDER_DUPLICATED, ALLOCATION_COLLECTION_NOT_FOUND, ALLOCATION_WRONG_PARTY, ALLOCATION_COLLECTION_UNCONFIRMED, ORDER_ALREADY_RECEIPTED, ALLOCATION_EXCEEDS_COLLECTED, ALLOCATION_EXCEEDS_RECEIPT, AMOUNT_NOT_NUMERIC, AMOUNT_NOT_POSITIVE, SEPARATION_OF_DUTIES_VIOLATION, PERIOD_CLOSED]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CashReceiptAllocateInput" } } } }
      responses:
        "201": { description: Receipt with the immutable allocation batch, content: { application/json: { schema: { $ref: "#/components/schemas/CashReceiptVoucher" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/cash-receipts/{id}/reversal:
    post:
      tags: [Finance, Deliveries]
      summary: Reverse an immutable cash receipt voucher
      description: The reversal restores party cash custody and makes every allocation on the original receipt ineffective; the original rows remain unchanged.
      x-surface: admin
      x-permission: cash_receipts.reverse
      x-error-codes: [RECEIPT_REVERSAL_ALREADY_REVERSED, SELF_CUSTODY_CASH_ACTION_FORBIDDEN, SELF_REVERSAL_FORBIDDEN, SEPARATION_OF_DUTIES_VIOLATION, PERIOD_CLOSED]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CashReceiptReversalInput" } } } }
      responses:
        "201": { description: Reversed receipt with reversal document, content: { application/json: { schema: { $ref: "#/components/schemas/CashReceiptVoucher" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/custody-exceptions:
    get:
      tags: [Finance, Deliveries]
      summary: List custody exception documents
      x-error-codes: [DATE_RANGE_INVALID]
      x-surface: admin
      x-permission: custody_exceptions.view
      parameters:
        - { name: type, in: query, schema: { type: string, enum: [goods_loss, return_against_uncollected, delivery_fee_refund] } }
        - { name: party_id, in: query, schema: { type: string, format: uuid } }
        - { name: order_id, in: query, schema: { type: string, format: uuid } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string, enum: [active, reversed] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Paginated custody exceptions, content: { application/json: { schema: { $ref: "#/components/schemas/CustodyExceptionPage" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/custody-exceptions/goods-loss:
    post:
      tags: [Finance, Deliveries]
      summary: Record goods lost or damaged in a delivery party's custody
      description: Records selected custody holdings at original issue cost, reduces goods custody once, and applies the phase-3 exception_handover or exception_loss map according to liability bearer.
      x-surface: admin
      x-permission: custody_exceptions.loss
      x-error-codes: [ORDER_HAS_NO_CUSTODY_PARTY, GOODS_LOSS_STATUS_INVALID, CUSTODY_COST_UNAVAILABLE, CUSTODY_HOLDING_WRONG_ORDER_OR_PARTY, GOODS_NOT_IN_CUSTODY, CUSTODY_EXCEPTION_EXCEEDS_GOODS, CUSTODY_HOLDING_DUPLICATED, AMOUNT_NOT_POSITIVE, SEPARATION_OF_DUTIES_VIOLATION, PERIOD_CLOSED]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/GoodsCustodyExceptionInput" } } } }
      responses:
        "201": { description: Immutable goods custody exception, content: { application/json: { schema: { $ref: "#/components/schemas/CustodyException" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/custody-exceptions/return-against-uncollected:
    post:
      tags: [Finance, Deliveries]
      summary: Return goods at the door against an uncollected order
      description: Restocks goods at original issue cost and applies return value to the open uncollected amount before creating any refund payable. Existing receipt allocations are unchanged because only the uncollected shortfall is reduced.
      x-surface: admin
      x-permission: custody_exceptions.return_uncollected
      x-error-codes: [RETURN_REQUIRES_CONFIRMED_SHORTFALL, RETURN_SHORTFALL_RESOLVED, ORDER_ITEM_UNAVAILABLE, RETURN_HAS_NO_REFUNDABLE_VALUE, CUSTODY_HOLDING_WRONG_ORDER_OR_PARTY, RETURN_REQUIRES_SOLD_CUSTODY, RETURN_EXCEEDS_ISSUED_QUANTITY, RETURN_LOCATION_INACTIVE, CUSTODY_HOLDING_DUPLICATED, INVENTORY_COST_NEGATIVE, SEPARATION_OF_DUTIES_VIOLATION, PERIOD_CLOSED]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ReturnAgainstUncollectedInput" } } } }
      responses:
        "201": { description: Immutable return-against-uncollected exception, content: { application/json: { schema: { $ref: "#/components/schemas/CustodyException" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/custody-exceptions/delivery-fee-refund:
    post:
      tags: [Finance, Deliveries]
      summary: Refund an order's delivery fee
      description: Creates the phase-3 delivery_fee_refund liability and settles it from an IQD cash account or against the order's still-uncollected amount. The cumulative active refund cannot exceed the charged delivery fee.
      x-surface: admin
      x-permission: custody_exceptions.refund_delivery_fee
      x-error-codes: [REFUND_CASH_ACCOUNT_REQUIRED, REFUND_CASH_ACCOUNT_NOT_ALLOWED, DELIVERY_REVENUE_NOT_POSTED, DELIVERY_FEE_REFUND_EXCEEDS_CHARGE, REFUND_REQUIRES_ACTIVE_IQD_ACCOUNT, DELIVERY_FEE_REFUND_EXCEEDS_UNCOLLECTED, AMOUNT_NOT_POSITIVE, SEPARATION_OF_DUTIES_VIOLATION, PERIOD_CLOSED]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DeliveryFeeRefundInput" } } } }
      responses:
        "201": { description: Immutable delivery-fee refund, content: { application/json: { schema: { $ref: "#/components/schemas/CustodyException" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/custody-exceptions/{id}:
    get:
      tags: [Finance, Deliveries]
      summary: Read one custody exception document
      description: Original issue-cost fields are present only for callers holding cost.view.
      x-surface: admin
      x-permission: custody_exceptions.view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: Custody exception detail, content: { application/json: { schema: { $ref: "#/components/schemas/CustodyException" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/custody-exceptions/{id}/reversal:
    post:
      tags: [Finance, Deliveries]
      summary: Reverse an immutable custody exception
      description: Reverses every posting and stock effect. A party-liability loss cannot be reversed after a cash receipt has consumed that liability; reverse that receipt first.
      x-surface: admin
      x-permission: custody_exceptions.reverse
      x-error-codes: [CUSTODY_EXCEPTION_ALREADY_REVERSED, SELF_REVERSAL_FORBIDDEN, RECEIPT_REVERSAL_REQUIRED, CUSTODY_EXCEPTION_REVERSAL_UNSAFE, RETURN_EXCEPTION_LOCATION_MISSING, RETURNED_STOCK_UNAVAILABLE, INVENTORY_COST_NEGATIVE, SEPARATION_OF_DUTIES_VIOLATION, PERIOD_CLOSED]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustodyExceptionReversalInput" } } } }
      responses:
        "201": { description: Custody exception with its immutable reversal, content: { application/json: { schema: { $ref: "#/components/schemas/CustodyException" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /admin/financial-documents/{id}:
    get:
      tags: [Finance]
      summary: Read one posted financial document by id
      description: Cash transfers and opening balances require either ledger.view or cash_accounts.view.
      x-surface: admin
      x-permissions-any: [ledger.view, cash_accounts.view]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: Posted financial document, content: { application/json: { schema: { $ref: "#/components/schemas/FinancialDocument" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/accounting-periods:
    get:
      tags: [Finance]
      summary: List accounting periods and close history
      x-surface: admin
      x-permission: ledger.view
      responses:
        "200": { description: Periods, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AccountingPeriod" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/accounting-periods/{month}/checklist:
    get:
      tags: [Finance]
      summary: Run the close checklist
      x-surface: admin
      x-permission: period.close
      parameters: [{ name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
      responses:
        "200": { description: Checklist, content: { application/json: { schema: { $ref: "#/components/schemas/PeriodChecklist" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/accounting-periods/{month}/close:
    post:
      tags: [Finance]
      summary: Close a period and save a sequenced trial-balance snapshot
      x-surface: admin
      x-permission: period.close
      parameters: [{ name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, additionalProperties: false, properties: { reason: { type: string, maxLength: 500 } } } } } }
      responses:
        "201": { description: Period close, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/accounting-periods/{month}/reopen:
    post:
      tags: [Finance]
      summary: Reopen a closed period with a mandatory reason
      x-surface: admin
      x-permission: period.reopen
      parameters: [{ name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AuditReason" } } } }
      responses:
        "201": { description: Reopened period, content: { application/json: { schema: { $ref: "#/components/schemas/AccountingPeriod" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------- ADMIN: INVENTORY & COSTING ----------------
