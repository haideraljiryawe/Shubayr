            - type: object
              additionalProperties: false
              required: [id, party_id]
              properties:
                id: { type: string, format: uuid }
                party_id: { type: string, format: uuid }
            - { type: "null" }
        proof_reference: { type: [string, "null"] }
        document_date: { type: string, format: date }
        accounting_date: { type: string, format: date }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    ReturnPosting:
      type: object
      additionalProperties: false
      required: [role, journal_entry_id, journal_document_number]
      properties:
        role:
          type: string
          enum:
            [
              restock_issue_cost,
              write_down,
              return_against_uncollected,
              delivery_fee_refund,
              refund_payment,
            ]
        journal_entry_id: { type: string, format: uuid }
        journal_document_number: { type: string }

    RefundLedgerEntry:
      type: object
      description: Return refund obligation and its payment state.
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        return_id: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        status: { type: string, enum: [obligation] }
        reason: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    ReturnPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Return" }

    DeliveryParty:
