                file: { type: string, format: binary }
      responses:
        "201": { description: Uploaded private receipt, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseReceiptUpload" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/expense-receipts/{id}:
    get:
      tags: [Expenses]
      summary: Download a receipt linked to an expense
      x-surface: admin
      x-permission: expenses.read
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: Receipt bytes, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } }, image/avif: { schema: { type: string, format: binary } }, application/pdf: { schema: { type: string, format: binary } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/expenses:
    get:
      tags: [Expenses]
      summary: List expense documents with database pagination and filters
      x-surface: admin
      x-permission: expenses.read
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [draft, posted, reversed] } }
        - { name: cash_account_id, in: query, schema: { type: string, format: uuid } }
        - { name: payee, in: query, schema: { type: string, maxLength: 200 } }
        - { name: unpaid_only, in: query, schema: { type: boolean } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [document_date, amount, created_at, payee, document_number], default: document_date } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        "200": { description: Expense page, content: { application/json: { schema: { $ref: "#/components/schemas/ExpensePage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Expenses]
      summary: Create a draft expense using the central rate effective at its document timestamp
      x-surface: admin
      x-permission: expenses.create
      x-error-codes: [EXPENSE_IDEMPOTENCY_KEY_REQUIRED, EXPENSE_IDEMPOTENCY_KEY_INVALID, EXPENSE_CATEGORY_NOT_FOUND, EXPENSE_CATEGORY_INACTIVE, EXPENSE_CURRENCY_DISABLED, EXCHANGE_RATE_NOT_FOUND, EXPENSE_AMOUNT_INVALID, EXPENSE_AMOUNT_PRECISION, EXPENSE_PAYEE_REQUIRED, EXPENSE_SUPPLIER_NOT_FOUND, EXPENSE_CASH_ACCOUNT_REQUIRED, EXPENSE_CASH_ACCOUNT_NOT_ALLOWED, EXPENSE_CASH_ACCOUNT_NOT_FOUND, EXPENSE_CASH_ACCOUNT_INACTIVE, EXPENSE_CASH_ACCOUNT_CURRENCY_MISMATCH, EXPENSE_PERIOD_CLOSED, EXPENSE_BACKDATE_WINDOW, EXPENSE_RECEIPT_INVALID, EXPENSE_PREPAID_PAYMENT_REQUIRED, EXPENSE_PREPAID_SCHEDULE_REQUIRED, EXPENSE_PREPAID_PERIODS_INVALID, EXPENSE_PREPAID_START_DATE_INVALID, EXPENSE_PREPAID_SCHEDULE_NOT_ALLOWED, EXPENSE_PREPAID_AMOUNT_TOO_SMALL]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseCreateInput" } } } }
      responses:
        "201": { description: Draft expense, content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ExchangeRateValidation" }
  /admin/expenses/totals:
    get:
      tags: [Expenses]
      summary: Totals for the filtered posted expense range, overall and per category
      x-surface: admin
      x-permission: expenses.read
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: category_id, in: query, schema: { type: string, format: uuid } }
        - { name: cash_account_id, in: query, schema: { type: string, format: uuid } }
        - { name: payee, in: query, schema: { type: string, maxLength: 200 } }
        - { name: unpaid_only, in: query, schema: { type: boolean } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200": { description: Filtered totals, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseTotals" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/expenses/form-options:
    get:
      tags: [Expenses]
      summary: Read scoped expense-create pickers without broad read permissions
      description: Returns only active categories, enabled currencies, active cash-account names for the selected currency, active supplier names, the applicable central-rate preview and the back-dating window. Cash balances are never included.
      x-surface: admin
      x-permission: expenses.create
      x-error-codes: [EXCHANGE_RATE_NOT_FOUND]
      parameters:
        - { name: currency_code, in: query, schema: { type: string, pattern: '^[A-Z]{3}$' } }
        - { name: document_date, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Expense form options, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseFormOptions" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ExchangeRateValidation" }
  /admin/expenses/{id}:
    get:
      tags: [Expenses]
      summary: Read an expense with journal, payments and corrections
      x-surface: admin
      x-permission: expenses.read
      x-error-codes: [EXPENSE_NOT_FOUND]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: Expense detail, content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    patch:
      tags: [Expenses]
      summary: Edit a draft expense; posted expenses remain immutable
      x-surface: admin
      x-permission: expenses.create
      x-error-codes: [EXPENSE_UPDATE_EMPTY, EXPENSE_NOT_FOUND, EXPENSE_ALREADY_POSTED, EXPENSE_CATEGORY_NOT_FOUND, EXPENSE_CATEGORY_INACTIVE, EXPENSE_CURRENCY_DISABLED, EXCHANGE_RATE_NOT_FOUND, EXPENSE_AMOUNT_INVALID, EXPENSE_AMOUNT_PRECISION, EXPENSE_PAYEE_REQUIRED, EXPENSE_SUPPLIER_NOT_FOUND, EXPENSE_CASH_ACCOUNT_REQUIRED, EXPENSE_CASH_ACCOUNT_NOT_ALLOWED, EXPENSE_CASH_ACCOUNT_NOT_FOUND, EXPENSE_CASH_ACCOUNT_INACTIVE, EXPENSE_CASH_ACCOUNT_CURRENCY_MISMATCH, EXPENSE_PERIOD_CLOSED, EXPENSE_BACKDATE_WINDOW, EXPENSE_RECEIPT_INVALID, EXPENSE_PREPAID_PAYMENT_REQUIRED, EXPENSE_PREPAID_SCHEDULE_REQUIRED, EXPENSE_PREPAID_PERIODS_INVALID, EXPENSE_PREPAID_START_DATE_INVALID, EXPENSE_PREPAID_SCHEDULE_NOT_ALLOWED, EXPENSE_PREPAID_AMOUNT_TOO_SMALL]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExpensePatchInput" } } } }
      responses:
        "200": { description: Updated draft expense, content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ExchangeRateValidation" }
    delete:
      tags: [Expenses]
      summary: Delete a draft expense; posted expenses remain immutable
      x-surface: admin
      x-permission: expenses.create
      x-error-codes: [EXPENSE_NOT_FOUND, EXPENSE_ALREADY_POSTED]
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Draft expense deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/expenses/{id}/post:
    post:
      tags: [Expenses]
      summary: Post a draft expense to the immutable ledger
      x-surface: admin
      x-permission: expenses.post
      x-error-codes: [EXPENSE_IDEMPOTENCY_KEY_REQUIRED, EXPENSE_IDEMPOTENCY_KEY_INVALID, EXPENSE_NOT_FOUND, EXPENSE_ALREADY_POSTED, EXPENSE_INVALID_STATE, EXPENSE_CATEGORY_INACTIVE, EXPENSE_CASH_ACCOUNT_REQUIRED, EXPENSE_CASH_ACCOUNT_INACTIVE, EXPENSE_PERIOD_CLOSED, EXPENSE_BACKDATE_WINDOW, EXPENSE_SELF_APPROVAL_FORBIDDEN, EXPENSE_PREPAID_SCHEDULE_REQUIRED]
      parameters: [{ $ref: "#/components/parameters/PathId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExpensePostInput" } } } }
      responses:
        "200": { description: Posted expense, content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/expenses/{id}/payments:
    post:
      tags: [Expenses]
      summary: Make a partial or final payment against an accrued expense
      x-surface: admin
      x-permission: expenses.pay
      x-error-codes: [EXPENSE_IDEMPOTENCY_KEY_REQUIRED, EXPENSE_IDEMPOTENCY_KEY_INVALID, EXPENSE_NOT_FOUND, EXPENSE_INVALID_STATE, EXPENSE_OVERPAYMENT, EXPENSE_AMOUNT_INVALID, EXPENSE_AMOUNT_PRECISION, EXPENSE_CASH_ACCOUNT_NOT_FOUND, EXPENSE_CASH_ACCOUNT_INACTIVE, EXPENSE_CASH_ACCOUNT_CURRENCY_MISMATCH, EXPENSE_PERIOD_CLOSED, EXPENSE_BACKDATE_WINDOW, EXPENSE_SELF_APPROVAL_FORBIDDEN]
      parameters: [{ $ref: "#/components/parameters/PathId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExpensePaymentInput" } } } }
      responses:
        "201": { description: Expense with the new payment, content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/expenses/{id}/reverse:
    post:
      tags: [Expenses]
      summary: Correct an expense by reversing every one of its immutable postings
      x-surface: admin
      x-permission: expenses.reverse
      x-error-codes: [EXPENSE_IDEMPOTENCY_KEY_REQUIRED, EXPENSE_IDEMPOTENCY_KEY_INVALID, EXPENSE_NOT_FOUND, EXPENSE_INVALID_STATE, EXPENSE_PERIOD_CLOSED, EXPENSE_BACKDATE_WINDOW, EXPENSE_SELF_APPROVAL_FORBIDDEN]
      parameters: [{ $ref: "#/components/parameters/PathId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseReverseInput" } } } }
      responses:
        "201": { description: Reversed expense, content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/expenses/{id}/prepaid-schedule/cancel:
    post:
      tags: [Expenses]
      summary: Cancel the remaining prepaid schedule with a correction posting
      x-surface: admin
      x-permission: expenses.reverse
      x-error-codes: [EXPENSE_IDEMPOTENCY_KEY_REQUIRED, EXPENSE_IDEMPOTENCY_KEY_INVALID, EXPENSE_NOT_FOUND, EXPENSE_PREPAID_INVALID_STATE, EXPENSE_PREPAID_PAYMENT_REQUIRED, EXPENSE_PERIOD_CLOSED, EXPENSE_BACKDATE_WINDOW, EXPENSE_SELF_APPROVAL_FORBIDDEN]
      parameters: [{ $ref: "#/components/parameters/PathId" }, { $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseReverseInput" } } } }
      responses:
        "201": { description: Expense with canceled remaining schedule and new correction, content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: q
      in: query
      required: false
      schema: { type: string, maxLength: 160 }
    Reason:
      name: reason
      in: query
      required: true
      schema: { type: string, minLength: 3, maxLength: 500 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[\x20-\x7E]+$' }
  responses:
    BadRequest: { description: Invalid filter range (`BAD_REQUEST`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Missing/invalid token (`UNAUTHORIZED`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Not found (`NOT_FOUND`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict: { description: State conflict (`CONFLICT`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    ProductOrderLimitConflict:
      description: State conflict, including a per-product order limit refusal with structured quantities
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/Error" }
              - { $ref: "#/components/schemas/ProductOrderLimitError" }
    PostingConflict:
      description: State conflict (`CONFLICT`) or a closed accounting period (`PERIOD_CLOSED`)
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/Error" }
              - { $ref: "#/components/schemas/PeriodClosedError" }
    Validation: { description: "Invalid request data (`VALIDATION_FAILED`, HTTP 422)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    ExchangeRateValidation: { description: "Invalid request data (`VALIDATION_FAILED`) or no applicable currency rate (`EXCHANGE_RATE_NOT_FOUND`), HTTP 422", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    PricingRateValidation: { description: "Invalid request data (`VALIDATION_FAILED`) or no applicable linked-pricing rate (`PRICING_RATE_REQUIRED`), HTTP 422", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited: { description: Too many requests (`RATE_LIMITED`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    PayloadTooLarge: { description: "Uploaded workbook, archive, image, or row count exceeds the declared limit", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    UnsupportedMediaType: { description: Uploaded image bytes are not a supported image format, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Missing permission (`FORBIDDEN`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    ServiceUnavailable: { description: Background worker queue is unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [status, code, message, errors]
      properties:
        status: { type: integer, example: 422 }
        code: { type: string, example: VALIDATION_FAILED }
        message: { type: string }
        errors:
          type: array
          description: Empty for non-validation errors.
          items: { $ref: "#/components/schemas/FieldError" }

    PeriodClosedError:
      type: object
      additionalProperties: false
      required: [status, code, message, errors, period]
      properties:
        status: { type: integer, enum: [409] }
        code: { type: string, enum: [PERIOD_CLOSED] }
        message: { type: string }
        errors: { type: array, maxItems: 0, items: { $ref: "#/components/schemas/FieldError" } }
        period: { type: string, pattern: '^\d{4}-\d{2}$', example: "2026-11" }

    AccountDeletionBlockedError:
      type: object
      additionalProperties: false
      required: [status, code, message, errors, details]
      properties:
        status: { type: integer, enum: [409] }
        code: { type: string, enum: [ACCOUNT_DELETION_BLOCKED] }
        message: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
        details:
          type: object
          additionalProperties: false
          required: [open_orders, pending_returns, unsettled_amounts]
          properties:
            open_orders: { type: integer, minimum: 0 }
            pending_returns: { type: integer, minimum: 0 }
            unsettled_amounts: { type: integer, minimum: 0 }

    ProductOrderLimitError:
      type: object
      additionalProperties: false
      required: [status, code, message, errors, details]
      properties:
        status: { type: integer, enum: [409] }
        code: { type: string, enum: [PRODUCT_ORDER_LIMIT_EXCEEDED] }
        message: { type: string }
        errors: { type: array, maxItems: 0, items: { $ref: "#/components/schemas/FieldError" } }
        details:
          type: object
          additionalProperties: false
          required: [product_id, allowed_quantity, requested_quantity]
          properties:
            product_id: { type: string, format: uuid }
            allowed_quantity: { type: number, multipleOf: 0.001, minimum: 0.001 }
            requested_quantity: { type: number, multipleOf: 0.001, minimum: 0.001 }

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string, example: items.0.quantity }
        code: { type: string, example: min }
        message: { type: string, example: quantity must not be less than 1 }
        requested: { type: string, description: Exact requested quantity for an inventory conflict. }
        available: { type: string, description: Exact currently allocatable quantity for an inventory conflict. }
        variant_id: { type: string, format: uuid, description: SKU involved in an inventory conflict. }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        old_price: { type: number }
        new_price: { type: number }
        old_price_version: { type: string }
        new_price_version: { type: string }
        current_status: { $ref: "#/components/schemas/OrderStatus" }
        current_version: { type: integer, minimum: 1 }
        price: { type: number }
        min: { type: [string, number], description: Minimum accepted value or boundary for this field. }
        max: { type: [string, number], description: Maximum accepted value or boundary for this field. }
        threshold_percent: { type: number }
        cost: { type: number }
        minimum_price: { type: number }
        governorate_id: { type: string, format: uuid, description: Governorate involved in a delivery-zone assignment conflict. }
        governorate_code: { type: string, description: Stable governorate code involved in a delivery-zone assignment conflict. }
        governorate_name_ar: { type: string }
        governorate_name_en: { type: string }
        delivery_zone_id: { type: string, format: uuid, description: Existing delivery zone holding the governorate. }
        delivery_zone_name_ar: { type: string }
        delivery_zone_name_en: { type: string }

    Money:
      type: number
      description: Decimal money amount displayed at the associated currency precision (IQD 0, USD 2).

    MediaObject:
      type: object
      additionalProperties: false
      required: [id, public_url, mime_type, size_bytes, checksum, created_at]
      properties:
        id: { type: string, format: uuid }
        public_url: { type: string, format: uri, description: Stable API URL used when associating the image with catalog data. }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, image/avif] }
        size_bytes: { type: integer, minimum: 1, maximum: 8388608 }
        checksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        created_at: { type: string, format: date-time }

    Pagination:
      type: object
      description: Reusable pagination envelope. List endpoints add a `data` array of the resource.
      required: [page, per_page, total]
      properties:
        page: { type: integer, example: 1 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 0 }

    AuthTokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    ReleaseVersion:
      type: object
      additionalProperties: false
      required: [release, commit]
      properties:
        release: { type: string, description: Release tag embedded in the production image; `development` outside a tagged build. }
        commit: { type: string, description: Full source commit embedded in the production image; `unknown` outside a tagged build. }

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    Password:
      type: string
      minLength: 12
      maxLength: 128
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{12,128}$'
      description: Must contain upper and lower case letters, a number, and a symbol.

    User:
      type: object
      additionalProperties: false
      required: [id, name, phone, username, email, is_active, role, permissions, surface, client, must_change_password, permission_version, preferred_ui_language, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        username: { type: [string, "null"] }
        email: { type: [string, "null"] }
        is_active: { type: boolean }
        role: { type: [string, "null"], enum: [customer, delivery_agent, order_monitor, null], description: Present only on the app surface. }
        permissions:
          type: array
          description: Current preset and extra grants; always empty on the app surface.
          items: { type: string, example: "orders.accept" }
        surface: { type: string, enum: [admin, app] }
        client: { type: [string, "null"], enum: [mobile, web_store, null] }
        must_change_password: { type: boolean }
        permission_version: { type: integer, minimum: 1 }
        preferred_ui_language: { type: string, enum: [ar, en], description: Staff member's preferred Web Admin language; defaults to Arabic. }
        created_at: { type: string, format: date-time }

    UserSelfUpdate:
      type: object
      description: >
        Fields the authenticated user may update without identity
        re-verification. Phone is intentionally excluded; changing it requires
        OTP re-verification.
      minProperties: 1
      additionalProperties: false
      properties:
