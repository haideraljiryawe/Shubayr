        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        locations: { type: array, items: { $ref: "#/components/schemas/WarehouseLocation" } }

    WarehousePage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
