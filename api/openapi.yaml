    ProductAvailability:
      type: object
      description: Computed availability (on-hand minus active batch reservations and temporary COD holds) per product & variant.
      properties:
        product_id: { type: string, format: uuid }
        in_stock: { type: boolean }
        availability: { type: string, enum: [out_of_stock, low_stock, in_stock] }
        available_qty: { type: number, multipleOf: 0.001, description: "total sellable across variants" }
        variants:
          type: array
          items:
            type: object
            properties:
              variant_id: { type: string, format: uuid }
              sku: { type: string }
              base_unit: { type: string }
              whole_units_only: { type: boolean }
              low_stock_threshold: { type: number, multipleOf: 0.001 }
              available_qty: { type: number, multipleOf: 0.001 }
              availability: { type: string, enum: [out_of_stock, low_stock, in_stock] }
              in_stock: { type: boolean }

    ProductPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Product" }
            facets:
              type: object
              required: [brands]
              properties:
                brands:
                  type: array
                  items:
                    type: object
                    required: [brand_id, count]
                    properties:
                      brand_id: { type: string, format: uuid }
                      count: { type: integer, minimum: 0 }

    Cart:
      type: object
      required: [id, items, subtotal, discount, coupon_discount, tier_discount, discount_source, applied_tier, next_tier, delivery_fee, total, coupon_code, currency]
      properties:
        id: { type: string, format: uuid }
        coupon_code: { type: [string, "null"] }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        items:
          type: array
          items:
            type: object
            required: [id, product_id, variant_id, quantity, unit_price, price_version, current_unit_price, current_price_version, price_changed, line_total, currency, available, available_qty]
            properties:
              id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              variant_id: { type: string, format: uuid }
              quantity: { type: number, multipleOf: 0.001, minimum: 0.001, maximum: 99 }
              unit_price: { $ref: "#/components/schemas/Money", description: "Price the customer last saw for this line." }
              price_version: { type: string, maxLength: 64 }
              current_unit_price: { $ref: "#/components/schemas/Money" }
              current_price_version: { type: string, maxLength: 64 }
              price_changed: { type: boolean }
              line_total: { $ref: "#/components/schemas/Money", description: "Line total at the price the customer saw." }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
              available: { type: boolean, description: "False when the product is hidden/inactive or available_qty is below quantity. Checkout rejects unavailable lines." }
              available_qty: { type: number, multipleOf: 0.001, minimum: 0 }
        subtotal: { $ref: "#/components/schemas/Money" }
        discount: { $ref: "#/components/schemas/Money", description: "Applied coupon and/or automatic tier discount; catalog markdown is already in unit_price." }
        coupon_discount: { $ref: "#/components/schemas/Money" }
        tier_discount: { $ref: "#/components/schemas/Money" }
        discount_source: { type: string, enum: [none, coupon, tier, stacked] }
        applied_tier:
          oneOf:
            - { $ref: "#/components/schemas/AppliedDiscountTier" }
            - { type: "null" }
        next_tier:
          oneOf:
            - { $ref: "#/components/schemas/NextDiscountTier" }
            - { type: "null" }
        delivery_fee: { $ref: "#/components/schemas/Money", description: Current zone fee when governorate_id or address_id was supplied; otherwise zero. }
        total: { $ref: "#/components/schemas/Money" }

    WishlistItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        added_at: { type: string, format: date-time }
        product: { $ref: "#/components/schemas/Product" }

    WishlistPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/WishlistItem" }

    Coupon:
      type: object
      required: [code, type, value, currency]
      properties:
        code: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        value: { type: number }
        currency: { type: string, pattern: '^[A-Z]{3}$' }

    OrderStatus:
      type: string
      description: Canonical order lifecycle status (matches orders.status in schema.sql).
      enum:
        - pending
        - confirmed
        - preparing
        - ready_for_dispatch
        - dispatched
        - delivered
        - failed
        - rejected
        - cancelled
        - return_requested
        - returned

    OrderItem:
      type: object
      required:
        [
          base_unit,
          whole_units_only,
          discount_share,
          coupon_discount_share,
          tier_discount_share,
          loyalty_discount_share,
          other_adjustment_share,
          net_line_total,
          net_paid_total,
        ]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: "order_item_id — reference this from reviews & returns",
          }
        product_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        product_name_ar:
          {
            type: string,
            description: "Arabic product name captured when the order is created.",
          }
        product_name_en:
          {
            type: string,
            description: "English product name captured when the order is created.",
          }
        image_url:
          {
            type: [string, "null"],
            format: uri,
            description: "Primary product image URL captured when the order is created.",
          }
        quantity: { type: number, multipleOf: 0.001 }
        base_unit:
          {
            type: string,
            minLength: 1,
            maxLength: 32,
            description: "SKU base unit captured when the order is created.",
          }
        whole_units_only:
          {
            type: boolean,
            description: "SKU fractional-quantity rule captured when the order is created.",
          }
        unit_price:
          {
            $ref: "#/components/schemas/Money",
            description: "The product's effective_price captured when the order is created, so a later discount edit or window expiry never rewrites a placed order.",
          }
        price_version: { type: string, maxLength: 64 }
        line_total: { $ref: "#/components/schemas/Money" }
        discount_share:
          {
            $ref: "#/components/schemas/Money",
            description: Whole-IQD largest-remainder share of the order discount.,
          }
        coupon_discount_share: { $ref: "#/components/schemas/Money" }
        tier_discount_share: { $ref: "#/components/schemas/Money" }
        loyalty_discount_share: { $ref: "#/components/schemas/Money" }
        other_adjustment_share: { $ref: "#/components/schemas/Money" }
        net_line_total:
          {
            $ref: "#/components/schemas/Money",
            description: line_total minus automatic tier/coupon discount shares.,
          }
        net_paid_total:
          $ref: "#/components/schemas/Money"
          description: >-
            Immutable amount paid for this line after every stored allocation, including redeemed points.
            Return entitlements are sliced from this value.
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        reviewed:
          {
            type: boolean,
            readOnly: true,
            description: True when the caller already has a product review for this order item.,
          }

    OrderPriceChangeInfo:
      type: object
      additionalProperties: false
      required: [accepted_at, lines]
      properties:
        accepted_at: { type: string, format: date-time }
        lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [variant_id, unit_price, price_version]
            properties:
              variant_id: { type: string, format: uuid }
              unit_price: { $ref: "#/components/schemas/Money" }
              price_version: { type: string, minLength: 1, maxLength: 64 }

    OrderAttentionDetails:
      type: object
      additionalProperties: false
      required: [short_lines]
      properties:
        short_lines:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [order_item_id, variant_id, requested, allocated, short]
            properties:
              order_item_id: { type: string, format: uuid }
              variant_id: { type: string, format: uuid }
              requested: { type: string }
              allocated: { type: string }
              short: { type: string }
        reduction_proposal:
          type: object
          additionalProperties: false
          required: [order_item_id, old_quantity, new_quantity, reason, status, requested_by, requested_at]
          properties:
            order_item_id: { type: string, format: uuid }
            old_quantity: { type: number, multipleOf: 0.001 }
            new_quantity: { type: number, multipleOf: 0.001 }
            reason: { type: string }
            status: { type: string, enum: [pending, accepted, denied] }
            requested_by: { type: string, format: uuid }
            requested_at: { type: string, format: date-time }
            resolved_at: { type: string, format: date-time }

    OrderBase:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        version:
          {
            type: integer,
            minimum: 1,
            description: Required on every state-changing order request.,
          }
        payment_method: { type: string, enum: [cod] }
        address_id:
          {
            type: [string, "null"],
            format: uuid,
            description: "Original address reference; null if that address was later deleted. Delivery snapshots remain unchanged.",
          }
        delivery_id:
          {
            type: [string, "null"],
            format: uuid,
            description: Current delivery reachable by this order's owner.,
          }
        subtotal: { $ref: "#/components/schemas/Money" }
        delivery_fee: { $ref: "#/components/schemas/Money" }
        original_delivery_fee: { $ref: "#/components/schemas/Money" }
        adjusted_delivery_fee: { type: [number, "null"], minimum: 0 }
        discount: { $ref: "#/components/schemas/Money" }
        coupon_discount: { $ref: "#/components/schemas/Money" }
        tier_discount: { $ref: "#/components/schemas/Money" }
        loyalty_points_redeemed: { type: integer, minimum: 0 }
        loyalty_redemption_amount: { $ref: "#/components/schemas/Money" }
        discount_source: { type: string, enum: [none, coupon, tier, stacked] }
        applied_tier:
          oneOf:
            - { $ref: "#/components/schemas/AppliedDiscountTier" }
            - { type: "null" }
        next_tier:
          oneOf:
            - { $ref: "#/components/schemas/NextDiscountTier" }
            - { type: "null" }
        total: { $ref: "#/components/schemas/Money" }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        delivery_contact_phone:
          { type: string, description: Immutable checkout snapshot. }
        delivery_governorate:
          oneOf:
            - type: object
              additionalProperties: false
              required: [code, name_ar, name_en]
              properties:
                code: { type: string }
                name_ar: { type: [string, "null"] }
                name_en: { type: [string, "null"] }
            - { type: "null" }
        delivery_address_label:
          { type: [string, "null"], description: Immutable checkout snapshot. }
        delivery_city:
          { type: string, description: Immutable checkout snapshot. }
        delivery_area:
          { type: [string, "null"], description: Immutable checkout snapshot. }
        delivery_street:
          { type: [string, "null"], description: Immutable checkout snapshot. }
        delivery_details:
          { type: [string, "null"], description: Immutable checkout snapshot. }
        delivery_lat:
          {
            type: [number, "null"],
            format: double,
            description: Immutable checkout snapshot.,
          }
        delivery_lng:
          {
            type: [number, "null"],
            format: double,
            description: Immutable checkout snapshot.,
          }
        placed_at: { type: string, format: date-time }
        acceptance_deadline: { type: [string, "null"], format: date-time }
        auto_cancel_deadline: { type: [string, "null"], format: date-time }
        late_for_acceptance: { type: boolean }
        cancellation_request:
          oneOf:
            - type: "null"
            - type: object
              properties:
                status: { type: string, enum: [pending, approved, denied] }
                reason: { type: [string, "null"] }
                requested_at: { type: [string, "null"], format: date-time }
                resolved_at: { type: [string, "null"], format: date-time }
                resolution_note: { type: [string, "null"] }
        price_change_info:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/OrderPriceChangeInfo" }
        inventory_attention_required: { type: boolean }
        attention_details:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/OrderAttentionDetails" }
        collection:
          oneOf:
            - { $ref: "#/components/schemas/OrderCollectionResult" }
            - { type: "null" }
        timeline:
          type: array
          items:
            type: object
            properties:
              status: { $ref: "#/components/schemas/OrderStatus" }
              note: { type: [string, "null"] }
              at: { type: string, format: date-time }
        retrievals:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              document_number: { type: string }
              status:
                {
                  type: string,
                  enum: [open, partially_received, received, closed],
                }
              outcome: { type: string, enum: [cancel, retry] }
        returns:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                id,
                document_number,
                status,
                refund_amount,
                points_effect,
                created_at,
              ]
            properties:
              id: { type: string, format: uuid }
              document_number: { type: string }
              status:
                {
                  type: string,
                  enum:
                    [
                      requested,
                      approved,
                      partially_approved,
                      rejected,
                      received,
                      inspected,
                      refunded,
                      completed,
                    ],
                }
              refund_amount: { $ref: "#/components/schemas/Money" }
              points_effect: { $ref: "#/components/schemas/ReturnPointsEffect" }
              created_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }

    Order:
      allOf:
        - $ref: "#/components/schemas/OrderBase"
        - type: object
          required: [delivery_attempts]
          properties:
            delivery_attempts:
              type: array
              description: Immutable chronological history without courier or delivery-party identity.
              items: { $ref: "#/components/schemas/CustomerDeliveryAttempt" }

    OrderPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Order" }

    AdminOrder:
      allOf:
        - $ref: "#/components/schemas/OrderBase"
        - type: object
          required: [customer, shipping_snapshot, payments, delivery, delivery_attempts, status_events]
          properties:
            delivery_attempts:
              type: array
              description: Staff history retains the assigned internal agent or external driver's identity.
              items: { $ref: "#/components/schemas/DeliveryAttempt" }
            customer:
              type: object
              required: [id, name, phone, email]
              properties:
                id: { type: string, format: uuid }
                name: { type: [string, "null"] }
                phone: { type: string }
                email: { type: [string, "null"] }
            shipping_snapshot:
              type: object
              description: Immutable checkout shipping and contact values.
              properties:
                contact_phone: { type: string }
                address_label: { type: [string, "null"] }
                city: { type: string }
                area: { type: [string, "null"] }
                street: { type: [string, "null"] }
                details: { type: [string, "null"] }
                lat: { type: [number, "null"] }
                lng: { type: [number, "null"] }
                governorate:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [code, name_ar, name_en]
                      properties:
                        code: { type: string }
                        name_ar: { type: [string, "null"] }
                        name_en: { type: [string, "null"] }
                    - { type: "null" }
            confirmation_contact:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [customer_contacted, note]
                  properties:
                    customer_contacted: { type: boolean, const: true }
                    note: { type: [string, "null"], maxLength: 500 }
                - { type: "null" }
            delivery_fee_adjustment:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [original_fee, adjusted_fee, reason, adjusted_by, adjusted_at]
                  properties:
                    original_fee: { $ref: "#/components/schemas/Money" }
                    adjusted_fee: { $ref: "#/components/schemas/Money" }
                    reason: { type: [string, "null"] }
                    adjusted_by: { type: [string, "null"], format: uuid }
                    adjusted_at: { type: [string, "null"], format: date-time }
                - { type: "null" }
            payments:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  method: { type: string, enum: [cod] }
                  status: { type: string, enum: [pending, paid, refunded, failed] }
                  amount: { $ref: "#/components/schemas/Money" }
                  currency: { type: string, pattern: '^[A-Z]{3}$' }
                  paid_at: { type: [string, "null"], format: date-time }
            delivery:
              type: [object, "null"]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [assigned, out_for_delivery, delivered, failed, returned] }
                delivery_fee: { $ref: "#/components/schemas/Money" }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                dispatched_at: { type: [string, "null"], format: date-time }
                delivered_at: { type: [string, "null"], format: date-time }
                failure_reason: { type: [string, "null"], maxLength: 500 }
                failed_at: { type: [string, "null"], format: date-time }
                retry_count: { type: integer, minimum: 0 }
                agent:
                  type: [object, "null"]
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: [string, "null"] }
                    phone: { type: string }
                    email: { type: [string, "null"] }
                party:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [id, kind, name, phone]
                      properties:
                        id: { type: string, format: uuid }
                        kind: { type: string, enum: [internal_agent, external_driver, courier_company] }
                        name: { type: string }
                        phone: { type: string }
                    - { type: "null" }
            status_events:
              type: array
              items:
                type: object
                properties:
                  status: { $ref: "#/components/schemas/OrderStatus" }
                  note: { type: [string, "null"] }
                  at: { type: string, format: date-time }

    AdminOrderPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [badge_counts, data]
          properties:
            badge_counts:
              type: object
              additionalProperties: false
              required: [late, needs_attention, pending_cancellation]
              properties:
                late: { type: integer, minimum: 0 }
                needs_attention: { type: integer, minimum: 0 }
                pending_cancellation: { type: integer, minimum: 0 }
            data:
              type: array
              items: { $ref: "#/components/schemas/AdminOrder" }

    DeliveryAgent:
      type: object
      additionalProperties: false
      required: [id, name, phone]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }

    DeliveryAgentPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/DeliveryAgent" }

    MonitorOrderListItem:
      type: object
      required: [id, order_number, status, customer_name, customer_phone, total, currency, payment_method, placed_at]
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        customer_name: { type: [string, "null"] }
        customer_phone: { type: string }
        total: { $ref: "#/components/schemas/Money" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        payment_method: { type: string, enum: [cod] }
        placed_at: { type: string, format: date-time }

    MonitorOrderPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [status_counts, data]
          properties:
            status_counts:
              type: object
              description: Counts with q and Baghdad date filters applied and status excluded.
              additionalProperties: { type: integer, minimum: 0 }
            data:
              type: array
              items: { $ref: "#/components/schemas/MonitorOrderListItem" }

    MonitorOrderDetail:
      type: object
      description: Intentionally excludes product image fields.
      required: [id, order_number, status, customer, shipping_snapshot, items, subtotal, delivery_fee, discount, total, currency, payment_method, placed_at]
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        customer:
          type: object
          required: [name, phone]
          properties:
            name: { type: [string, "null"] }
            phone: { type: string }
        shipping_snapshot:
          type: object
          properties:
            contact_phone: { type: string }
            address_label: { type: [string, "null"] }
            city: { type: string }
            area: { type: [string, "null"] }
            street: { type: [string, "null"] }
            details: { type: [string, "null"] }
            lat: { type: [number, "null"] }
            lng: { type: [number, "null"] }
        items:
          type: array
          items:
            type: object
            required: [id, product_id, variant_id, product_name_ar, product_name_en, quantity, base_unit, whole_units_only, unit_price, line_total, currency]
            properties:
              id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              variant_id: { type: [string, "null"], format: uuid }
              product_name_ar: { type: string }
              product_name_en: { type: string }
              quantity: { type: number, multipleOf: 0.001 }
              base_unit: { type: string, minLength: 1, maxLength: 32 }
              whole_units_only: { type: boolean }
              unit_price: { $ref: "#/components/schemas/Money" }
              line_total: { $ref: "#/components/schemas/Money" }
              currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotal: { $ref: "#/components/schemas/Money" }
        delivery_fee: { $ref: "#/components/schemas/Money" }
        discount: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        payment_method: { type: string, enum: [cod] }
        placed_at: { type: string, format: date-time }

    OrderTracking:
      type: object
      properties:
        order_id: { type: string, format: uuid }
        events:
          type: array
          items:
            type: object
            properties:
              status: { $ref: "#/components/schemas/OrderStatus" }
              note: { type: [string, "null"] }
              at: { type: string, format: date-time }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        order_item_id: { type: [string, "null"], format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"] }
        verified_purchase: { type: boolean }
        status: { type: string, enum: [pending, published, rejected] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        moderation_reason: { type: [string, "null"], maxLength: 500 }
        moderated_by: { type: [string, "null"], format: uuid }
        moderated_at: { type: [string, "null"], format: date-time }

    ReviewPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Review" }

    CustomerReview:
      allOf:
        - $ref: "#/components/schemas/Review"
        - type: object
          required: [product]
          properties:
            product:
              type: object
              additionalProperties: false
              required: [id, name_en, name_ar]
              properties:
                id: { type: string, format: uuid }
                name_en: { type: string }
                name_ar: { type: string }

    CustomerReviewPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/CustomerReview" }

    DeliveryRating:
      type: object
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        agent_id: { type: [string, "null"], format: uuid }
        user_id: { type: string, format: uuid }
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    LoyaltyAccount:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        points_balance: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        ledger:
          type: array
          items: { $ref: "#/components/schemas/LoyaltyLedgerEntry" }

    LoyaltyLedgerEntry:
      type: object
      description: Immutable signed points entry; account ownership identifies the customer.
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        order_id: { type: [string, "null"], format: uuid }
        return_id: { type: [string, "null"], format: uuid }
        type:
          {
            type: string,
            enum:
              [earn, redeem, adjust, expire, return_reversal, return_restore],
          }
        reason: { type: string }
        points:
          {
            type: integer,
            description: Positive for earn; negative for redeem; signed for adjust.,
          }
        note: { type: [string, "null"] }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    LoyaltyRedemption:
      type: object
      properties:
        entry: { $ref: "#/components/schemas/LoyaltyLedgerEntry" }
        points_balance: { type: integer }
        redemption_value: { $ref: "#/components/schemas/Money", description: Server-derived indicative value at one point per minor currency unit. }

    LoyaltyAdjustment:
      type: object
      properties:
        entry: { $ref: "#/components/schemas/LoyaltyLedgerEntry" }
        points_balance: { type: integer }

    Supplier:
      type: object
      additionalProperties: false
      required: [id, name, default_currency, payment_terms_days, is_active, last_purchase_at, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        address: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        default_currency: { type: string, enum: [IQD, USD] }
        payment_terms_days: { type: integer, minimum: 0 }
        is_active: { type: boolean }
        last_purchase_at: { type: [string, "null"], format: date-time, description: Time of the supplier's most recently posted purchase; null before the first purchase. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DeliveryPartyCustodySummary:
      type: object
      additionalProperties: false
      required: [cash_held, oldest_item_age_days, orders_held]
      properties:
        goods_value_iqd: { type: number, minimum: 0, description: Present only with cost.view; sums open goods-custody holdings at fixed issue cost. }
        cash_held: { type: number, minimum: 0, description: Confirmed COD cash currently held for the store. }
        oldest_item_age_days: { type: [integer, "null"], minimum: 0, description: Oldest open goods or cash custody item in Baghdad business days. }
        orders_held: { type: integer, minimum: 0, description: Distinct orders with goods currently in this party's custody. }

    SupplierInput:
      type: object
      additionalProperties: false
      required: [name, default_currency, payment_terms_days]
      properties:
        name: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        address: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        default_currency: { type: string, enum: [IQD, USD] }
        payment_terms_days: { type: integer, minimum: 0, maximum: 3650 }

    SupplierPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        phone: { type: [string, "null"], maxLength: 32 }
        email: { type: [string, "null"], maxLength: 160 }
        address: { type: [string, "null"], maxLength: 1000 }
        notes: { type: [string, "null"], maxLength: 2000 }
        default_currency: { type: string, enum: [IQD, USD] }
        payment_terms_days: { type: integer, minimum: 0, maximum: 3650 }
        is_active: { type: boolean }

    SupplierPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Supplier" }

    PurchaseInvoice:
      type: object
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        created_by_name: { type: string }
        supplier_id: { type: string, format: uuid }
        invoice_number: { type: [string, "null"] }
        currency_code: { type: string, enum: [IQD, USD] }
        total_cost: { type: number }
        remaining_currency: { type: number, minimum: 0, description: Operational settlement amount, visible with cost.view, purchases.create or supplier_payments.record. }
        settlement_status: { type: string, enum: [open, partial, paid], description: Operational settlement state, visible with cost.view, purchases.create or supplier_payments.record. }
        status: { type: string, enum: [draft, received, posted, cancelled] }
        received_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: { type: string, format: uuid }
              invoice_id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              variant_id: { type: [string, "null"], format: uuid }
              location_id: { type: string, format: uuid }
              purchase_quantity: { type: number, multipleOf: 0.001 }
              pack_size: { type: number, multipleOf: 0.001 }
              quantity: { type: number, multipleOf: 0.001 }
              unit_cost: { type: number }
              base_unit_cost_currency: { type: number }
              line_total_currency: { type: number }
              landed_cost_share_iqd: { type: number }
              landed_unit_cost_iqd: { type: number }
              currency_code: { type: string, enum: [IQD, USD] }
              lot_number: { type: [string, "null"] }
              expiry_date: { type: [string, "null"], format: date-time }
              lot_id: { type: [string, "null"], format: uuid }
              created_at: { type: string, format: date-time }
              variant: { $ref: "#/components/schemas/ProductVariant" }
              location: { $ref: "#/components/schemas/WarehouseLocation" }
              lot: { $ref: "#/components/schemas/InventoryBatch" }

    PurchaseInvoicePage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data: { type: array, items: { $ref: "#/components/schemas/PurchaseInvoice" } }

    PostingDocumentInput:
      type: object
      additionalProperties: true
      required: [operation_id, document_date]
      properties:
        operation_id: { type: string, minLength: 8, maxLength: 128 }
        document_date: { type: string, format: date }
        accounting_date: { type: string, format: date }
        backdate_reason: { type: string, minLength: 3, maxLength: 500 }

    SupplierOpeningInput:
      allOf:
        - $ref: "#/components/schemas/PostingDocumentInput"
        - type: object
          required: [currency_code, amount, exchange_rate]
          properties:
            currency_code: { type: string, enum: [IQD, USD] }
            amount: { type: string, pattern: '^\\d+(\\.\\d{1,6})?$' }
            exchange_rate: { type: string, pattern: '^\\d+(\\.\\d{1,10})?$' }
            due_date: { type: string, format: date }

    PurchaseInvoiceInput:
      allOf:
        - $ref: "#/components/schemas/PostingDocumentInput"
        - type: object
          required: [supplier_id, currency_code, default_location_id, allocation_method, lines]
          properties:
            draft_id: { type: string, format: uuid, description: Optional caller-owned purchase-invoice draft to remove after this invoice posts. Other drafts are never removed. }
            supplier_id: { type: string, format: uuid }
            supplier_invoice_number: { type: string, maxLength: 80 }
            currency_code: { type: string, enum: [IQD, USD] }
            exchange_rate: { type: string }
            default_location_id: { type: string, format: uuid }
            allocation_method: { type: string, enum: [value, quantity, manual] }
            due_date: { type: string, format: date }
            notes: { type: string, maxLength: 2000 }
            lines:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [variant_id, quantity, unit_cost]
                properties:
                  variant_id: { type: string, format: uuid }
                  location_id: { type: string, format: uuid }
                  quantity: { type: string }
                  pack_size: { type: string }
                  unit_cost: { type: string }
                  lot_number: { type: string, maxLength: 80 }
                  expiry_date: { type: string, format: date }
                  manual_landed_cost_iqd: { type: string }
            landed_costs:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [kind, currency_code, amount]
                properties:
                  kind: { type: string }
                  description: { type: string }
                  currency_code: { type: string, enum: [IQD, USD] }
                  amount: { type: string }

    PaidNowPurchaseInput:
      type: object
      additionalProperties: false
      required: [invoice, payment]
      properties:
        invoice:
          type: object
          additionalProperties: false
          required: [document_date, supplier_id, currency_code, default_location_id, allocation_method, lines]
          properties:
            document_date: { type: string, format: date }
            accounting_date: { type: string, format: date }
            backdate_reason: { type: string, minLength: 3, maxLength: 500 }
            draft_id: { type: string, format: uuid, description: Optional caller-owned purchase-invoice draft to remove after the atomic posting succeeds. }
            supplier_id: { type: string, format: uuid }
            supplier_invoice_number: { type: string, maxLength: 80 }
            currency_code: { type: string, enum: [IQD, USD] }
            exchange_rate: { type: string }
            default_location_id: { type: string, format: uuid }
            allocation_method: { type: string, enum: [value, quantity, manual] }
            due_date: { type: string, format: date }
            notes: { type: string, maxLength: 2000 }
            lines:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [variant_id, quantity, unit_cost]
                properties:
                  variant_id: { type: string, format: uuid }
                  location_id: { type: string, format: uuid }
                  quantity: { type: string }
                  pack_size: { type: string }
                  unit_cost: { type: string }
                  lot_number: { type: string, maxLength: 80 }
                  expiry_date: { type: string, format: date }
                  manual_landed_cost_iqd: { type: string }
            landed_costs:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [kind, currency_code, amount]
                properties:
                  kind: { type: string }
                  description: { type: string }
                  currency_code: { type: string, enum: [IQD, USD] }
                  amount: { type: string }
        payment:
          type: object
          additionalProperties: false
          required: [cash_account_id, currency_code]
          description: Supply amount for the legacy exact-payment flow, or set pay_full_invoice_total=true and omit amount so the server settles the computed invoice total including landed costs and FX conversion.
          properties:
            cash_account_id: { type: string, format: uuid }
            currency_code: { type: string, enum: [IQD, USD] }
            amount: { type: string, pattern: '^\d+(\.\d{1,6})?$' }
            pay_full_invoice_total: { type: boolean, description: When true, amount must be omitted and the server computes the exact full settlement amount in the cash-account currency. }
            exchange_rate: { type: string, pattern: '^\d+(\.\d{1,10})?$' }
            reference: { type: string, maxLength: 160 }
            notes: { type: string, maxLength: 2000 }

    PaidNowPurchaseResult:
      type: object
      additionalProperties: false
      required: [invoice, payment]
      properties:
        invoice: { $ref: "#/components/schemas/PurchaseInvoice" }
        payment: { $ref: "#/components/schemas/PurchasingDocument" }

    LastVariantPurchaseCost:
      type: object
      additionalProperties: false
      required: [variant_id, unit_cost, currency_code, document_date, received_at, supplier, invoice_id]
      properties:
        variant_id: { type: string, format: uuid }
        unit_cost: { type: number, minimum: 0, description: Latest posted base-unit cost in the purchase invoice currency. }
        currency_code: { type: string, enum: [IQD, USD] }
        document_date: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        supplier:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        invoice_id: { type: string, format: uuid }

    SupplierPaymentInput:
      allOf:
        - $ref: "#/components/schemas/PostingDocumentInput"
        - type: object
          required: [supplier_id, cash_account_id, currency_code, amount, allocations]
          properties:
            supplier_id: { type: string, format: uuid }
            cash_account_id: { type: string, format: uuid }
            currency_code: { type: string, enum: [IQD, USD] }
            amount: { type: string, description: Total payment in the cash account currency. }
            exchange_rate: { type: string, description: Explicit rate for the non-base currency; requires purchases.override_rate when it differs from the applicable rate or no applicable rate exists. }
            reference: { type: string }
            notes: { type: string }
            allocations:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [invoice_id, amount]
                properties:
                  invoice_id: { type: string, format: uuid }
                  amount: { type: string, description: Amount allocated in the payment/cash account currency. }

    SupplierCreditAllocationInput:
      type: object
      additionalProperties: false
      required: [operation_id, invoice_id, amount]
      properties:
        operation_id: { type: string, minLength: 8, maxLength: 128 }
        invoice_id: { type: string, format: uuid }
        amount: { type: string }

    SupplierReturnInput:
      allOf:
        - $ref: "#/components/schemas/PostingDocumentInput"
        - type: object
          required: [supplier_id, reason, lines]
          properties:
            supplier_id: { type: string, format: uuid }
            invoice_id: { type: string, format: uuid }
            reason: { type: string, minLength: 3, maxLength: 500 }
            lines:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [purchase_item_id, batch_id, location_id, quantity]
                properties:
                  purchase_item_id: { type: string, format: uuid }
                  batch_id: { type: string, format: uuid }
                  location_id: { type: string, format: uuid }
                  quantity: { type: string }

    PurchaseCostCorrectionInput:
      allOf:
        - $ref: "#/components/schemas/PostingDocumentInput"
        - type: object
          required: [invoice_id, kind, allocation_method, reason, lines]
          properties:
            invoice_id: { type: string, format: uuid }
            supplier_id: { type: string, format: uuid }
            kind: { type: string, enum: [cost_correction, late_landed_cost] }
            allocation_method: { type: string, enum: [value, quantity, manual] }
            reason: { type: string, minLength: 3, maxLength: 500 }
            lines:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [purchase_item_id, unit_difference_iqd]
                properties:
                  purchase_item_id: { type: string, format: uuid }
                  unit_difference_iqd: { type: string }

    PurchasingDocument:
      type: object
      additionalProperties: true
      properties:
        created_by: { type: string, format: uuid }
        created_by_name: { type: string }

    SupplierBalance:
      type: object
      additionalProperties: false
      required: [supplier, currency_code, balance_currency, balance_iqd]
      properties:
        supplier: { $ref: "#/components/schemas/Supplier" }
        currency_code: { type: string, enum: [IQD, USD] }
        balance_currency: { type: number }
        balance_iqd: { type: number }

    SupplierStatementLine:
      type: object
      additionalProperties: true
      required: [id, supplier_id, source_type, document_number, document_date, currency_code, running_balance_currency, running_balance_iqd]
      properties:
        id: { type: string, format: uuid }
        supplier_id: { type: string, format: uuid }
        source_type: { type: string }
        document_number: { type: string }
        document_date: { type: string, format: date-time }
        currency_code: { type: string, enum: [IQD, USD] }
        running_balance_currency: { type: number }
        running_balance_iqd: { type: number }

    SupplierAgingLine:
      type: object
      additionalProperties: true
      required: [supplier, invoice_id, document_number, currency_code, remaining, remaining_iqd, bucket]
      properties:
        supplier: { $ref: "#/components/schemas/Supplier" }
        invoice_id: { type: string, format: uuid }
        document_number: { type: string }
        due_date: { type: [string, "null"], format: date-time }
        currency_code: { type: string, enum: [IQD, USD] }
        remaining: { type: number }
        remaining_iqd: { type: number }
        bucket: { type: string, enum: [current, 1_30, 31_60, 61_90, 90_plus, no_due_date] }

    InventoryBatch:
      type: object
      additionalProperties: false
      properties:
