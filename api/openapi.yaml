      description: Customer-safe collection result for the caller's own order; it never contains a delivery party, courier, user id, phone, or journal reference.
      properties:
        result: { type: string, enum: [full, short, unconfirmed] }
        amount_collected: { type: [number, "null"], minimum: 0 }
        shortfall: { type: [number, "null"], minimum: 0 }
        confirmation_state: { type: string, enum: [confirmed, unconfirmed] }
        currency: { type: string, const: IQD }

    Delivery:
      type: object
