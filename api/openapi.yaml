        "200": { description: Balances, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryBalancePage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/inventory/lots:
    get:
      tags: [Inventory]
      summary: List lots; cost fields require cost.view
      x-permission: inventory.view
      parameters:
        - { name: variant_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Lots, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryLotPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/inventory/lots/{id}:
    get:
      tags: [Inventory]
      summary: Read one lot; cost fields require cost.view
      x-permission: inventory.view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: Lot, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryLot" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/inventory/movements:
    get:
      tags: [Inventory]
      summary: Read the append-only stock movement ledger; costs require cost.view
      x-permission: inventory.view
      parameters:
        - { name: variant_id, in: query, schema: { type: string, format: uuid } }
        - { name: batch_id, in: query, schema: { type: string, format: uuid } }
        - { name: location_id, in: query, schema: { type: string, format: uuid } }
        - { name: custody_party_id, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, enum: [receive, reserve, release, issue_to_custody, custody_to_sold, return_in, transfer, adjust, write_down] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200": { description: Movements, content: { application/json: { schema: { $ref: "#/components/schemas/StockMovementPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/inventory/openings:
    get:
      tags: [Inventory]
      summary: List opening inventory documents; cost fields require cost.view
      x-permission: inventory.view
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200": { description: Opening documents, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryDocumentPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Inventory]
      summary: Post opening inventory and its balanced ledger entry
      x-error-codes: [OPENING_LOCATION_INACTIVE, INVENTORY_COST_NEGATIVE, PERIOD_CLOSED]
      x-permission: inventory.manage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryOpeningInput" } } } }
      responses:
        "201": { description: Posted opening, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryOpening" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/inventory/transfers:
    get:
      tags: [Inventory]
      summary: List stock transfer documents
      x-permission: inventory.view
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200": { description: Transfer documents, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryDocumentPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Inventory]
      summary: Transfer unreserved stock between locations without changing SKU value
      x-error-codes: [TRANSFER_DESTINATION_INACTIVE, TRANSFER_EXCEEDS_AVAILABLE_STOCK]
      x-permission: inventory.transfer
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StockTransferInput" } } } }
      responses:
        "201": { description: Posted transfer, content: { application/json: { schema: { $ref: "#/components/schemas/StockTransfer" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/inventory/counts:
    get:
      tags: [Inventory]
      summary: List physical count documents
      x-permission: inventory.view
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200": { description: Count documents, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryDocumentPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Inventory]
      summary: Snapshot a scoped physical count draft
      x-permission: inventory.count
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StockCountInput" } } } }
      responses:
        "201": { description: Count draft, content: { application/json: { schema: { $ref: "#/components/schemas/StockCount" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/inventory/counts/{id}/approve:
    post:
      tags: [Inventory]
      summary: Approve a count only if its scope has not moved since snapshot
      x-error-codes: [STOCK_COUNT_ALREADY_APPROVED, STOCK_COUNT_SNAPSHOT_STALE, INVENTORY_COST_NEGATIVE, SEPARATION_OF_DUTIES_VIOLATION, PERIOD_CLOSED]
      x-permission: inventory.adjust
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/StockCountApproval" } } } }
      responses:
        "201": { description: Approved count, content: { application/json: { schema: { $ref: "#/components/schemas/StockCount" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/inventory/write-downs:
    get:
      tags: [Inventory]
      summary: List inventory write-down documents; cost fields require cost.view
      x-permission: inventory.view
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }]
      responses:
        "200": { description: Write-down documents, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryDocumentPage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Inventory]
      summary: Write down non-sellable stock to inventory loss
      x-error-codes: [WRITE_DOWN_LOCATION_SELLABLE, WRITE_DOWN_EXCEEDS_STOCK, WRITE_DOWN_HAS_NO_BOOK_VALUE, INVENTORY_COST_NEGATIVE, PERIOD_CLOSED]
      x-permission: inventory.write_down
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryWriteDownInput" } } } }
      responses:
        "201": { description: Posted write-down, content: { application/json: { schema: { $ref: "#/components/schemas/InventoryWriteDown" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/inventory/documents/{type}/{id}:
    get:
      tags: [Inventory]
      summary: Read one inventory document; cost fields require cost.view
      x-permission: inventory.view
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [opening, transfer, count, write_down] } }
        - { $ref: "#/components/parameters/PathId" }
      responses:
        "200":
          description: Inventory document
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/InventoryOpening" }
                  - { $ref: "#/components/schemas/StockTransfer" }
                  - { $ref: "#/components/schemas/StockCount" }
                  - { $ref: "#/components/schemas/InventoryWriteDown" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/settings:
    get:
      tags: [Finance]
      summary: Read all audited operational and financial settings
      x-surface: admin
      x-permission: settings.manage
      responses:
        "200": { description: Settings, content: { application/json: { schema: { $ref: "#/components/schemas/AdminFinancialSettings" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Finance]
      summary: Update operational and financial settings atomically
      x-surface: admin
      x-permission: settings.manage
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AdminFinancialSettingsPatch" } } } }
      responses:
        "200": { description: Updated settings, content: { application/json: { schema: { $ref: "#/components/schemas/AdminFinancialSettings" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: q
      in: query
      required: false
      schema: { type: string, maxLength: 160 }
    Reason:
      name: reason
      in: query
      required: true
      schema: { type: string, minLength: 3, maxLength: 500 }
  responses:
    BadRequest: { description: Invalid filter range (`BAD_REQUEST`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Unauthorized: { description: Missing/invalid token (`UNAUTHORIZED`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Not found (`NOT_FOUND`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict: { description: State conflict (`CONFLICT`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    PostingConflict:
      description: State conflict (`CONFLICT`) or a closed accounting period (`PERIOD_CLOSED`)
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/Error" }
              - { $ref: "#/components/schemas/PeriodClosedError" }
    Validation: { description: "Invalid request data (`VALIDATION_FAILED`, HTTP 422)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    ExchangeRateValidation: { description: "Invalid request data (`VALIDATION_FAILED`) or no applicable currency rate (`EXCHANGE_RATE_NOT_FOUND`), HTTP 422", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    PricingRateValidation: { description: "Invalid request data (`VALIDATION_FAILED`) or no applicable linked-pricing rate (`PRICING_RATE_REQUIRED`), HTTP 422", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited: { description: Too many requests (`RATE_LIMITED`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Missing permission (`FORBIDDEN`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [status, code, message, errors]
      properties:
        status: { type: integer, example: 422 }
        code: { type: string, example: VALIDATION_FAILED }
        message: { type: string }
        errors:
          type: array
          description: Empty for non-validation errors.
          items: { $ref: "#/components/schemas/FieldError" }

    PeriodClosedError:
      type: object
      additionalProperties: false
      required: [status, code, message, errors, period]
      properties:
        status: { type: integer, enum: [409] }
        code: { type: string, enum: [PERIOD_CLOSED] }
        message: { type: string }
        errors: { type: array, maxItems: 0, items: { $ref: "#/components/schemas/FieldError" } }
        period: { type: string, pattern: '^\d{4}-\d{2}$', example: "2026-11" }

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string, example: items.0.quantity }
        code: { type: string, example: min }
        message: { type: string, example: quantity must not be less than 1 }
        requested: { type: string, description: Exact requested quantity for an inventory conflict. }
        available: { type: string, description: Exact currently allocatable quantity for an inventory conflict. }
        variant_id: { type: string, format: uuid, description: SKU involved in an inventory conflict. }
        product_id: { type: string, format: uuid }
        sku: { type: string }
        old_price: { type: number }
        new_price: { type: number }
        old_price_version: { type: string }
        new_price_version: { type: string }
        current_status: { $ref: "#/components/schemas/OrderStatus" }
        current_version: { type: integer, minimum: 1 }
        price: { type: number }
        threshold_percent: { type: number }
        cost: { type: number }
        minimum_price: { type: number }

    Money:
      type: number
      description: Decimal money amount displayed at the associated currency precision (IQD 0, USD 2).

    MediaObject:
      type: object
      additionalProperties: false
      required: [id, public_url, mime_type, size_bytes, checksum, created_at]
      properties:
        id: { type: string, format: uuid }
        public_url: { type: string, format: uri, description: Stable API URL used when associating the image with catalog data. }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, image/avif] }
        size_bytes: { type: integer, minimum: 1, maximum: 8388608 }
        checksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        created_at: { type: string, format: date-time }

    Pagination:
      type: object
      description: Reusable pagination envelope. List endpoints add a `data` array of the resource.
      required: [page, per_page, total]
      properties:
        page: { type: integer, example: 1 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 0 }

    AuthTokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    Password:
      type: string
      minLength: 12
      maxLength: 128
      pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{12,128}$'
      description: Must contain upper and lower case letters, a number, and a symbol.

    User:
      type: object
      additionalProperties: false
      required: [id, name, phone, username, email, is_active, role, permissions, surface, client, must_change_password, permission_version, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        username: { type: [string, "null"] }
        email: { type: [string, "null"] }
        is_active: { type: boolean }
        role: { type: [string, "null"], enum: [customer, delivery_agent, order_monitor, null], description: Present only on the app surface. }
        permissions:
          type: array
          description: Current preset and extra grants; always empty on the app surface.
          items: { type: string, example: "orders.accept" }
        surface: { type: string, enum: [admin, app] }
        client: { type: [string, "null"], enum: [mobile, web_store, null] }
        must_change_password: { type: boolean }
        permission_version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }

    UserSelfUpdate:
      type: object
      description: >
        Fields the authenticated user may update without identity
        re-verification. Phone is intentionally excluded; changing it requires
        OTP re-verification.
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120, pattern: '.*\S.*' }
        email: { type: [string, "null"], format: email, maxLength: 160 }

    Address:
      type: object
      required: [id, user_id, city, contact_phone, is_default, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        label: { type: [string, "null"], example: Home }
        city: { type: string }
        area: { type: [string, "null"] }
        street: { type: [string, "null"] }
        details: { type: [string, "null"] }
        contact_phone: { type: string, minLength: 3, maxLength: 32, description: Recipient contact for this address; independent from the account phone. }
        lat: { type: [number, "null"], format: double }
        lng: { type: [number, "null"], format: double }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }

    AddressCreate:
      type: object
      additionalProperties: false
      required: [city, contact_phone]
      properties:
        label: { type: [string, "null"], example: Home }
        city: { type: string }
        area: { type: [string, "null"] }
        street: { type: [string, "null"] }
        details: { type: [string, "null"] }
        contact_phone: { type: string, minLength: 3, maxLength: 32, pattern: "^\\+[1-9]\\d{7,14}$", description: "Trimmed before storage; must be an E.164 number such as +9647701234567." }
        lat: { type: [number, "null"], format: double }
        lng: { type: [number, "null"], format: double }
        is_default: { type: boolean, default: false }

    AddressPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are unchanged; null clears only nullable fields. contact_phone and city cannot be null.
      properties:
        label: { type: [string, "null"], maxLength: 80 }
        city: { type: string, minLength: 1, maxLength: 80 }
        area: { type: [string, "null"], maxLength: 120 }
        street: { type: [string, "null"], maxLength: 160 }
        details: { type: [string, "null"] }
