        delivery_updates: { type: boolean, default: true }
        return_updates: { type: boolean, default: true }
        loyalty_updates: { type: boolean, default: true }
        promotions: { type: boolean, default: false }
        updated_at: { type: string, format: date-time, readOnly: true }

    NotificationPreferencesPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        order_updates: { type: boolean }
        delivery_updates: { type: boolean }
        return_updates: { type: boolean }
        loyalty_updates: { type: boolean }
        promotions: { type: boolean }

