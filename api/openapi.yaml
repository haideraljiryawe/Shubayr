        image_url: { type: string, format: uri }
        cta_text: { type: [string, "null"] }
        link_url: { type: [string, "null"], format: uri }
        internal_name: { type: string }
        title_ar: { type: [string, "null"], description: Stored Arabic title; null means no Arabic value was supplied. }
        title_en: { type: [string, "null"], description: Stored English title; null means no English value was supplied. }
        subtitle_ar: { type: [string, "null"] }
        subtitle_en: { type: [string, "null"] }
        cta_label_ar: { type: [string, "null"] }
        cta_label_en: { type: [string, "null"] }
        show_text: { type: boolean }
        action_type: { type: string, enum: [none, url, product, category, offers] }
        action_target_id: { type: [string, "null"], format: uuid }
