  /admin/inventory/warehouses/{id}/locations:
    post:
      tags: [Inventory]
      summary: Create a warehouse location without requiring a fixed hierarchy
      x-error-codes: [WAREHOUSE_INACTIVE]
      x-permission: inventory.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WarehouseLocationInput" } } } }
      responses:
        "201": { description: Location, content: { application/json: { schema: { $ref: "#/components/schemas/WarehouseLocation" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/inventory/locations/{id}:
    patch:
      tags: [Inventory]
      summary: Update or deactivate an unused location
      x-error-codes: [LOCATION_HAS_STOCK]
      x-permission: inventory.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WarehouseLocationPatch" } } } }
      responses:
        "200": { description: Location, content: { application/json: { schema: { $ref: "#/components/schemas/WarehouseLocation" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Inventory]
      summary: Delete a location that has never been used
      x-error-codes: [LOCATION_IN_USE]
      x-permission: inventory.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /admin/inventory/balances:
    get:
      tags: [Inventory]
      summary: Read lot/location balances and allocatable availability
