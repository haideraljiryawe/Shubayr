      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/permissions:
    get:
      tags: [Admin]
      summary: List all permission keys (for building roles)
      x-permission: users.manage
      responses:
        "200":
          description: All permissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Permission" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Unauthorized: { description: Missing/invalid token (`UNAUTHORIZED`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Not found (`NOT_FOUND`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Conflict: { description: State conflict (`CONFLICT`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Validation: { description: "Invalid request data (`VALIDATION_FAILED`, HTTP 422)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited: { description: Too many requests (`RATE_LIMITED`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Missing permission (`FORBIDDEN`), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [status, code, message, errors]
      properties:
        status: { type: integer, example: 422 }
        code: { type: string, example: VALIDATION_FAILED }
        message: { type: string }
        errors:
          type: array
          description: Empty for non-validation errors.
          items: { $ref: "#/components/schemas/FieldError" }

    FieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field: { type: string, example: items.0.quantity }
        code: { type: string, example: min }
        message: { type: string, example: quantity must not be less than 1 }

    Money:
      type: number
      multipleOf: 0.01
      description: Decimal money amount with at most two fractional digits; rounded half away from zero at money boundaries.

    MediaObject:
      type: object
      additionalProperties: false
      required: [id, public_url, mime_type, size_bytes, checksum, created_at]
      properties:
        id: { type: string, format: uuid }
        public_url: { type: string, format: uri, description: Stable API URL used when associating the image with catalog data. }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp, image/avif] }
        size_bytes: { type: integer, minimum: 1, maximum: 8388608 }
        checksum: { type: string, pattern: '^[a-f0-9]{64}$' }
        created_at: { type: string, format: date-time }

    Pagination:
      type: object
      description: Reusable pagination envelope. List endpoints add a `data` array of the resource.
      required: [page, per_page, total]
      properties:
        page: { type: integer, example: 1 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 0 }

    AuthTokens:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      additionalProperties: false
      required: [id, name, phone, email, is_active, role, permissions, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        phone: { type: string }
        email: { type: [string, "null"] }
        is_active: { type: boolean }
        role: { type: string, example: customer, description: "role name" }
        permissions:
          type: array
          description: Flattened permission keys granted to the user's role.
          items: { type: string, example: "orders.confirm" }
        created_at: { type: string, format: date-time }

    UserSelfUpdate:
      type: object
      description: >
        Fields the authenticated user may update without identity
        re-verification. Phone is intentionally excluded; changing it requires
        OTP re-verification.
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120, pattern: '.*\S.*' }
        email: { type: [string, "null"], format: email, maxLength: 160 }

    UserInput:
      type: object
      required: [phone]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: [string, "null"] }
        role: { type: string, description: "role name to assign", example: warehouse }
        is_active: { type: boolean, default: true }
        password: { type: [string, "null"], description: "optional; staff accounts may use password login" }

    Address:
      type: object
      required: [id, user_id, city, contact_phone, is_default, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        label: { type: [string, "null"], example: Home }
        city: { type: string }
        area: { type: [string, "null"] }
        street: { type: [string, "null"] }
        details: { type: [string, "null"] }
        contact_phone: { type: string, minLength: 3, maxLength: 32, description: Recipient contact for this address; independent from the account phone. }
        lat: { type: [number, "null"], format: double }
        lng: { type: [number, "null"], format: double }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }

    AddressCreate:
      type: object
      additionalProperties: false
      required: [city, contact_phone]
      properties:
        label: { type: [string, "null"], example: Home }
        city: { type: string }
        area: { type: [string, "null"] }
        street: { type: [string, "null"] }
        details: { type: [string, "null"] }
        contact_phone: { type: string, minLength: 3, maxLength: 32 }
        lat: { type: [number, "null"], format: double }
        lng: { type: [number, "null"], format: double }
        is_default: { type: boolean, default: false }

    AddressPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Omitted fields are unchanged; null clears only nullable fields. contact_phone and city cannot be null.
      properties:
        label: { type: [string, "null"], maxLength: 80 }
        city: { type: string, minLength: 1, maxLength: 80 }
        area: { type: [string, "null"], maxLength: 120 }
        street: { type: [string, "null"], maxLength: 160 }
        details: { type: [string, "null"] }
        contact_phone: { type: string, minLength: 3, maxLength: 32 }
        lat: { type: [number, "null"], format: double }
        lng: { type: [number, "null"], format: double }
        is_default: { type: boolean }

    AddressPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Address" }

    Category:
      type: object
      description: Category reads populate an empty localized name or description from the other language.
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid }
        name_en: { type: string }
        name_ar: { type: string }
        slug: { type: string, description: "SEO URL slug. Products are still filtered by category_id." }
        description_en: { type: [string, "null"] }
        description_ar: { type: [string, "null"] }
        image_url: { type: [string, "null"], format: uri }
        icon_key: { type: [string, "null"], description: "Semantic key such as consumer_electronics; never a framework codepoint or IconData value." }
        sort_order: { type: integer }
        is_visible: { type: boolean }
        children: { type: array, items: { $ref: "#/components/schemas/Category" } }

    CategoryCreate:
      type: object
      additionalProperties: false
      description: Creates a root or child category. Maximum depth is five levels, root depth 0 through depth 4.
      required: [name_en, name_ar]
      properties:
        parent_id: { type: [string, "null"], format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace English name. }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace Arabic name. }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 140 }
        description_en: { type: [string, "null"] }
        description_ar: { type: [string, "null"] }
        image_url: { type: [string, "null"], format: uri }
        icon_key: { type: [string, "null"], pattern: '^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$', maxLength: 80 }
        sort_order: { type: integer, default: 0 }
        is_visible: { type: boolean, default: true }

    CategoryPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: All fields are optional. parent_id null moves to root; a category cannot be its own parent or a descendant of itself, and reparenting cannot make any subtree node deeper than depth 4.
      properties:
        parent_id: { type: [string, "null"], format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*' }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*' }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', maxLength: 140 }
        description_en: { type: [string, "null"] }
        description_ar: { type: [string, "null"] }
        image_url: { type: [string, "null"], format: uri }
        icon_key: { type: [string, "null"], pattern: '^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$', maxLength: 80 }
        sort_order: { type: integer, minimum: 0 }
        is_visible: { type: boolean }

    Product:
      type: object
      description: >
        A catalog product. `in_stock` and `available_qty` are computed at read
        time (sum of batch_stock minus active reservations); they are not stored.
        Pricing works the same way: the product stores a regular `price` plus a
        discount DEFINITION (`discount_type`, `discount_value` and the scheduled
        window `discount_starts_at`/`discount_ends_at`), and the server derives
        `on_sale`, `discounted_price`, `effective_price` and `discount_percent`
        on every read. Those four are never stored, because a scheduled window
        changes what they mean as the clock moves.
        Reads populate an empty or missing `name_ar`/`name_en` from the other
        language so locale-specific clients never receive a blank name.
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        name_en: { type: string }
        name_ar: { type: string }
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money", description: "Regular selling price." }
        discount_type: { type: [string, "null"], enum: [percentage, amount, null], description: "Discount kind, or null when the product has no discount defined." }
        discount_value: { type: [number, "null"], multipleOf: 0.01, description: "For `percentage`, the percentage off (10 means 10%, at most two decimals). For `amount`, the currency amount subtracted from `price`. Null when `discount_type` is null." }
        discount_starts_at: { type: [string, "null"], format: date-time, description: "Start of the scheduled discount window; null means the discount is active immediately." }
        discount_ends_at: { type: [string, "null"], format: date-time, description: "End of the scheduled discount window; null means the discount never expires." }
        on_sale: { type: boolean, readOnly: true, description: "Computed: true when discount_type is set AND now() falls inside [discount_starts_at, discount_ends_at], treating null bounds as open." }
        discounted_price: { type: [number, "null"], multipleOf: 0.01, readOnly: true, description: "Computed in integer minor units when on_sale is true and rounded half away from zero; null when on_sale is false." }
        effective_price: { $ref: "#/components/schemas/Money", readOnly: true, description: "The price the customer pays. Cart and order pricing use this exact value." }
        discount_percent: { type: [integer, "null"], readOnly: true, description: "Computed when on_sale is true: round((price - discounted_price) / price * 100). Null when on_sale is false." }
        is_negotiable: { type: boolean }
        floor_price: { type: [number, "null"] }
        points_price: { type: [integer, "null"] }
        tracks_expiry: { type: boolean }
        rating_avg: { type: number }
        status: { type: string, enum: [active, hidden, archived] }
        in_stock: { type: boolean, description: "computed: available_qty > 0" }
        available_qty: { type: integer, description: "computed: on-hand minus active reservations" }
        images:
          type: array
          description: Ordered by sort_order; the first image is primary.
          items: { $ref: "#/components/schemas/ProductImage" }
        variants: { type: array, items: { $ref: "#/components/schemas/ProductVariant" } }

    ProductInput:
      type: object
      additionalProperties: false
      description: >
        Admin create and update requests require both names after trimming;
        neither may be empty. Pricing is written as a regular `price` plus an
        optional discount definition; the computed `on_sale`,
        `discounted_price`, `effective_price` and `discount_percent` fields are
        read-only and are never accepted on a write.


        Discount validation, each breach returning 422 `validation_error`:


        * `discount_type` set requires a `discount_value` greater than 0.

        * `percentage`: 0 < `discount_value` <= 100.

        * `amount`: 0 < `discount_value` < `price`.

        * `discount_type` null clears the whole discount; `discount_value` must
        then be null or omitted.

        * When both `discount_starts_at` and `discount_ends_at` are set,
        `discount_ends_at` must be strictly after `discount_starts_at`.

        * Either timestamp may be sent alone: a null start means the discount is
        active immediately, a null end means it never expires.
      required: [category_id, name_en, name_ar, price]
      properties:
        category_id: { type: string, format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace English name. }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*', description: Required non-whitespace Arabic name. }
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money", minimum: 0, description: "Regular selling price." }
        discount_type: { type: [string, "null"], enum: [percentage, amount, null], default: null, description: "Null (the default) means no discount and clears any discount already stored." }
        discount_value: { type: [number, "null"], multipleOf: 0.01, exclusiveMinimum: 0, description: "Required when discount_type is set, and must be null or omitted otherwise. percentage: at most 100. amount: strictly less than price." }
        discount_starts_at: { type: [string, "null"], format: date-time, description: "Optional window start; null means the discount is active immediately." }
        discount_ends_at: { type: [string, "null"], format: date-time, description: "Optional window end; null means the discount never expires. Must be after discount_starts_at when both are set." }
        is_negotiable: { type: boolean, default: false }
        floor_price: { type: [number, "null"] }
        points_price: { type: [integer, "null"] }
        tracks_expiry: { type: boolean, default: false }
        status: { type: string, enum: [active, hidden, archived], default: active }
        images:
          type: array
          description: Ordered creation list; array index becomes sort_order and index 0 is primary.
          items:
            type: object
            additionalProperties: false
            required: [url]
            properties:
              url: { type: string, format: uri }
        variants:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              attributes: { type: object, additionalProperties: true }
              price_delta: { type: number }

    ProductPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: All ProductInput fields are optional on PATCH. Omission preserves the stored value. Explicit null clears a nullable field; discount_type null clears discount_type, discount_value, discount_starts_at, and discount_ends_at together.
      properties:
        category_id: { type: string, format: uuid }
        name_en: { type: string, minLength: 1, pattern: '.*\S.*' }
        name_ar: { type: string, minLength: 1, pattern: '.*\S.*' }
        description: { type: [string, "null"] }
        price: { $ref: "#/components/schemas/Money", minimum: 0 }
        discount_type: { type: [string, "null"], enum: [percentage, amount, null] }
        discount_value: { type: [number, "null"], multipleOf: 0.01, exclusiveMinimum: 0 }
        discount_starts_at: { type: [string, "null"], format: date-time }
        discount_ends_at: { type: [string, "null"], format: date-time }
        is_negotiable: { type: boolean }
        floor_price: { type: [number, "null"], multipleOf: 0.01 }
        points_price: { type: [integer, "null"] }
        tracks_expiry: { type: boolean }
        status: { type: string, enum: [active, hidden, archived] }
        media_operations:
          type: array
          description: Applied atomically in array order; the image at final position 0 is primary.
          items: { $ref: "#/components/schemas/ProductMediaOperation" }
        variants:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              sku: { type: string }
              attributes: { type: object, additionalProperties: true }
              price_delta: { type: number, multipleOf: 0.01 }

    ProductImage:
      type: object
      additionalProperties: false
      required: [id, url, sort_order, is_primary]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        sort_order: { type: integer, minimum: 0 }
        is_primary: { type: boolean, readOnly: true, description: True exactly when this is the first image. }

    ProductMediaOperation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [op, url, position]
          properties:
            op: { const: add }
            url: { type: string, format: uri }
            position: { type: integer, minimum: 0 }
        - type: object
          additionalProperties: false
          required: [op, image_id]
          properties:
            op: { const: remove }
            image_id: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [op, image_id, url]
          properties:
            op: { const: replace }
            image_id: { type: string, format: uuid }
            url: { type: string, format: uri }
        - type: object
          additionalProperties: false
          required: [op, image_id, position]
          properties:
            op: { const: move }
            image_id: { type: string, format: uuid }
            position: { type: integer, minimum: 0 }
      discriminator: { propertyName: op }

    Banner:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        image_url: { type: string, format: uri }
        cta_text: { type: [string, "null"] }
        link_url: { type: [string, "null"], format: uri }
        sort_order: { type: integer }
        is_active: { type: boolean }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    BannerInput:
      type: object
      required: [title, image_url]
      properties:
        title: { type: string }
        subtitle: { type: [string, "null"] }
        image_url: { type: string, format: uri }
        cta_text: { type: [string, "null"] }
        link_url: { type: [string, "null"], format: uri }
        sort_order: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }

    BannerPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Banner" }

    ProductVariant:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        attributes: { type: object, additionalProperties: true }
        price_delta: { type: number }

    ProductAvailability:
      type: object
      description: Computed availability (on-hand minus active reservations) per product & variant.
      properties:
        product_id: { type: string, format: uuid }
        in_stock: { type: boolean }
        available_qty: { type: integer, description: "total sellable across variants" }
        variants:
          type: array
          items:
            type: object
            properties:
              variant_id: { type: [string, "null"], format: uuid }
              sku: { type: string }
              available_qty: { type: integer }
              in_stock: { type: boolean }

    ProductPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Product" }

    Cart:
      type: object
      properties:
        id: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              variant_id: { type: [string, "null"], format: uuid }
              quantity: { type: integer }
              unit_price: { $ref: "#/components/schemas/Money", description: "The product's effective_price captured using the shared money policy." }
        subtotal: { $ref: "#/components/schemas/Money" }

    WishlistItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        added_at: { type: string, format: date-time }
        product: { $ref: "#/components/schemas/Product" }

    WishlistPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/WishlistItem" }

    Coupon:
      type: object
      properties:
        code: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        value: { type: number }

    OrderStatus:
      type: string
      description: Canonical order lifecycle status (matches orders.status in schema.sql).
      enum:
        - pending
        - confirmed
        - processing
        - out_for_delivery
        - delivered
        - failed_delivery
        - cancelled
        - return_requested
        - returned

    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid, description: "order_item_id — reference this from reviews & returns" }
        product_id: { type: string, format: uuid }
        variant_id: { type: [string, "null"], format: uuid }
        product_name_ar: { type: string, description: "Arabic product name captured when the order is created." }
        product_name_en: { type: string, description: "English product name captured when the order is created." }
        image_url: { type: [string, "null"], format: uri, description: "Primary product image URL captured when the order is created." }
        quantity: { type: integer }
        unit_price: { $ref: "#/components/schemas/Money", description: "The product's effective_price captured when the order is created, so a later discount edit or window expiry never rewrites a placed order." }
        line_total: { $ref: "#/components/schemas/Money" }
        reviewed: { type: boolean, readOnly: true, description: True when the caller already has a product review for this order item. }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        payment_method: { type: string, enum: [cod] }
        address_id: { type: [string, "null"], format: uuid }
        delivery_id: { type: [string, "null"], format: uuid, description: Current delivery reachable by this order's owner. }
        subtotal: { $ref: "#/components/schemas/Money" }
        delivery_fee: { $ref: "#/components/schemas/Money" }
        discount: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        delivery_contact_phone: { type: string, description: Immutable checkout snapshot. }
        delivery_address_label: { type: [string, "null"], description: Immutable checkout snapshot. }
        delivery_city: { type: string, description: Immutable checkout snapshot. }
        delivery_area: { type: [string, "null"], description: Immutable checkout snapshot. }
        delivery_street: { type: [string, "null"], description: Immutable checkout snapshot. }
        delivery_details: { type: [string, "null"], description: Immutable checkout snapshot. }
        delivery_lat: { type: [number, "null"], format: double, description: Immutable checkout snapshot. }
        delivery_lng: { type: [number, "null"], format: double, description: Immutable checkout snapshot. }
