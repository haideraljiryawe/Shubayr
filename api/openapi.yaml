          properties:
            operation_id: { type: string, minLength: 8, maxLength: 128 }
            ids: { type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: { type: string, format: uuid } }
            action: { type: string, enum: [publish, hide] }
        - type: object
          additionalProperties: false
          required: [operation_id, ids, action, category_id]
          properties:
            operation_id: { type: string, minLength: 8, maxLength: 128 }
