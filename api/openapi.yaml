        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/brands/{id}:
    patch:
      tags: [Admin]
      summary: Update a brand
