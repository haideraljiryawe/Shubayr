            category_id: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [operation_id, ids, action, brand_id]
          properties:
            operation_id: { type: string, minLength: 8, maxLength: 128 }
            ids: { type: array, minItems: 1, maxItems: 500, uniqueItems: true, items: { type: string, format: uuid } }
            action: { type: string, const: set_brand }
            brand_id: { type: [string, "null"], format: uuid }

    ProductBulkResult:
      type: object
      additionalProperties: false
      required: [operation_id, results]
      properties:
        operation_id: { type: string }
        results:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, status]
            properties:
              id: { type: string, format: uuid }
              status: { type: string, enum: [updated, error] }
              code: { type: string }
              message: { type: string }

    ProductDeleteResult:
      type: object
      additionalProperties: false
      required: [outcome, reasons]
