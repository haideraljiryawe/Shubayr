        operation_id: { type: string, minLength: 8, maxLength: 128 }
        reason: { type: string, maxLength: 2000 }
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [order_item_id, quantity, reason, reason_code]
            properties:
              order_item_id: { type: string, format: uuid }
              quantity: { type: number, multipleOf: 0.001, minimum: 0.001 }
              reason: { type: string, minLength: 1, maxLength: 1000 }
              reason_code:
                {
                  type: string,
                  enum:
                    [change_of_mind, defect, store_error, wrong_item, other],
                }

    ReturnTransition:
      allOf:
        - $ref: "#/components/schemas/FinancialDocumentInput"
        - type: object
          properties:
            note: { type: string, maxLength: 500 }

