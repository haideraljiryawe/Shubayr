      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/users/{id}:
    patch:
      tags: [Admin]
      summary: Update a user (profile, role, active state)
      x-permission: users.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserInput" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin]
      summary: Deactivate / delete a user
      x-permission: users.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- ADMIN: ROLES & PERMISSIONS ----------------
  /admin/roles:
    get:
      tags: [Admin]
      summary: List roles (with their permission keys)
      x-permission: users.manage
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolePage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Admin]
      summary: Create a role
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/roles/{id}:
    patch:
      tags: [Admin]
      summary: Update a role (name, description, permissions)
      x-permission: users.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Admin]
      summary: Delete a role
      x-permission: users.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/permissions:
    get:
      tags: [Admin]
      summary: List all permission keys (for building roles)
      x-permission: users.manage
      responses:
        "200":
          description: All permissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Permission" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PerPage:
      name: per_page
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Unauthorized: { description: Missing/invalid token, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Validation: { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    RateLimited: { description: Too many requests, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    Forbidden: { description: Missing permission (RBAC), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
        errors: { type: object, additionalProperties: true }

    Pagination:
      type: object
      description: Reusable pagination envelope. List endpoints add a `data` array of the resource.
      required: [page, per_page, total]
      properties:
        page: { type: integer, example: 1 }
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 0 }

    AuthTokens:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: string }
        email: { type: [string, "null"] }
        is_active: { type: boolean }
        role: { type: string, example: customer, description: "role name" }
        permissions:
          type: array
          description: Flattened permission keys granted to the user's role.
          items: { type: string, example: "orders.confirm" }
        created_at: { type: string, format: date-time }

    UserInput:
      type: object
      required: [phone]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: [string, "null"] }
        role: { type: string, description: "role name to assign", example: warehouse }
        is_active: { type: boolean, default: true }
        password: { type: [string, "null"], description: "optional; staff accounts may use password login" }

    Address:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        label: { type: string, example: Home }
        city: { type: string }
        area: { type: string }
        street: { type: string }
        details: { type: [string, "null"] }
        lat: { type: [number, "null"], format: double }
        lng: { type: [number, "null"], format: double }
        is_default: { type: boolean }

    AddressInput:
      type: object
      required: [city]
      properties:
        label: { type: string, example: Home }
        city: { type: string }
        area: { type: string }
        street: { type: string }
        details: { type: [string, "null"] }
        lat: { type: [number, "null"], format: double }
        lng: { type: [number, "null"], format: double }
        is_default: { type: boolean, default: false }

    AddressPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Address" }

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: [string, "null"], format: uuid }
        name_en: { type: string }
        name_ar: { type: string }
        slug: { type: string, description: "SEO URL slug. Products are still filtered by category_id." }
        icon: { type: [string, "null"] }
        sort_order: { type: integer }
        is_active: { type: boolean }
        children: { type: array, items: { $ref: "#/components/schemas/Category" } }

    CategoryInput:
      type: object
      required: [name_en, name_ar]
      properties:
        parent_id: { type: [string, "null"], format: uuid }
        name_en: { type: string }
        name_ar: { type: string }
        icon: { type: [string, "null"] }
        sort_order: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }

    Product:
      type: object
      description: >
        A catalog product. `in_stock` and `available_qty` are computed at read
        time (sum of batch_stock minus active reservations); they are not stored.
      properties:
        id: { type: string, format: uuid }
        category_id: { type: string, format: uuid }
        name_en: { type: string }
        name_ar: { type: string }
        description: { type: string }
        sale_price: { type: number }
        compare_at_price: { type: [number, "null"], description: "Original/was price. Null or less than or equal to sale_price means no discount." }
        discount_percent: { type: [integer, "null"], readOnly: true, description: "Computed as round((compare_at_price - sale_price) / compare_at_price * 100) when compare_at_price is greater than sale_price; otherwise null." }
        is_negotiable: { type: boolean }
        floor_price: { type: [number, "null"] }
        points_price: { type: [integer, "null"] }
        tracks_expiry: { type: boolean }
        rating_avg: { type: number }
        status: { type: string, enum: [active, hidden, archived] }
        in_stock: { type: boolean, description: "computed: available_qty > 0" }
        available_qty: { type: integer, description: "computed: on-hand minus active reservations" }
        images: { type: array, items: { type: string, format: uri } }
        variants: { type: array, items: { $ref: "#/components/schemas/ProductVariant" } }

    ProductInput:
      type: object
      required: [category_id, name_en, name_ar, sale_price]
      properties:
        category_id: { type: string, format: uuid }
        name_en: { type: string }
        name_ar: { type: string }
        description: { type: string }
        sale_price: { type: number }
        compare_at_price: { type: [number, "null"], description: "Original/was price; set to null or no more than sale_price to remove the discount." }
        is_negotiable: { type: boolean, default: false }
        floor_price: { type: [number, "null"] }
        points_price: { type: [integer, "null"] }
        tracks_expiry: { type: boolean, default: false }
        status: { type: string, enum: [active, hidden, archived], default: active }
        images: { type: array, items: { type: string, format: uri } }
        variants:
          type: array
          items:
            type: object
            properties:
              sku: { type: string }
              attributes: { type: object, additionalProperties: true }
              price_delta: { type: number }

    Banner:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: [string, "null"] }
        image_url: { type: string, format: uri }
        cta_text: { type: [string, "null"] }
        link_url: { type: [string, "null"], format: uri }
        sort_order: { type: integer }
        is_active: { type: boolean }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    BannerInput:
      type: object
      required: [title, image_url]
      properties:
        title: { type: string }
        subtitle: { type: [string, "null"] }
        image_url: { type: string, format: uri }
        cta_text: { type: [string, "null"] }
        link_url: { type: [string, "null"], format: uri }
        sort_order: { type: integer, default: 0 }
        is_active: { type: boolean, default: true }
        starts_at: { type: [string, "null"], format: date-time }
        ends_at: { type: [string, "null"], format: date-time }

    BannerPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Banner" }

    ProductVariant:
      type: object
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        attributes: { type: object, additionalProperties: true }
        price_delta: { type: number }

    ProductAvailability:
      type: object
      description: Computed availability (on-hand minus active reservations) per product & variant.
      properties:
        product_id: { type: string, format: uuid }
        in_stock: { type: boolean }
        available_qty: { type: integer, description: "total sellable across variants" }
        variants:
          type: array
          items:
            type: object
            properties:
              variant_id: { type: [string, "null"], format: uuid }
              sku: { type: string }
              available_qty: { type: integer }
              in_stock: { type: boolean }

    ProductPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Product" }

    Cart:
      type: object
      properties:
        id: { type: string, format: uuid }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              variant_id: { type: [string, "null"], format: uuid }
              quantity: { type: integer }
              unit_price: { type: number }
        subtotal: { type: number }

    WishlistItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        added_at: { type: string, format: date-time }
        product: { $ref: "#/components/schemas/Product" }

    WishlistPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/WishlistItem" }

    Coupon:
      type: object
      properties:
        code: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        value: { type: number }

    OrderStatus:
      type: string
      description: Canonical order lifecycle status (matches orders.status in schema.sql).
      enum:
        - pending
        - confirmed
        - processing
        - out_for_delivery
        - delivered
        - failed_delivery
        - cancelled
        - return_requested
        - returned

    OrderItem:
      type: object
      properties:
        id: { type: string, format: uuid, description: "order_item_id — reference this from reviews & returns" }
        product_id: { type: string, format: uuid }
        variant_id: { type: [string, "null"], format: uuid }
        quantity: { type: integer }
        unit_price: { type: number }
        line_total: { type: number }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        payment_method: { type: string, enum: [cod] }
        address_id: { type: [string, "null"], format: uuid }
        subtotal: { type: number }
        delivery_fee: { type: number }
        discount: { type: number }
        total: { type: number }
        placed_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }

    OrderPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Order" }

    OrderTracking:
      type: object
      properties:
        order_id: { type: string, format: uuid }
        events:
          type: array
          items:
            type: object
            properties:
              status: { $ref: "#/components/schemas/OrderStatus" }
              note: { type: [string, "null"] }
              at: { type: string, format: date-time }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        order_item_id: { type: [string, "null"], format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"] }
        verified_purchase: { type: boolean }
        status: { type: string, enum: [pending, published, rejected] }
        created_at: { type: string, format: date-time }

    ReviewPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Review" }

    DeliveryRating:
      type: object
      properties:
        id: { type: string, format: uuid }
        delivery_id: { type: string, format: uuid }
        agent_id: { type: [string, "null"], format: uuid }
        user_id: { type: string, format: uuid }
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: [string, "null"] }
        created_at: { type: string, format: date-time }

    LoyaltyAccount:
      type: object
      properties:
        points_balance: { type: integer }
        ledger:
          type: array
          items:
            type: object
            properties:
              type: { type: string, enum: [earn, redeem, adjust, expire] }
              points: { type: integer }
              created_at: { type: string, format: date-time }

    Supplier:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        address: { type: [string, "null"] }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }

    SupplierInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        address: { type: [string, "null"] }
        is_active: { type: boolean, default: true }

    SupplierPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Supplier" }

    PurchaseInvoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        supplier_id: { type: string, format: uuid }
        invoice_number: { type: [string, "null"] }
        total_cost: { type: number }
        status: { type: string, enum: [draft, received, posted, cancelled] }
        received_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              product_id: { type: string, format: uuid }
              variant_id: { type: [string, "null"], format: uuid }
              quantity: { type: integer }
              unit_cost: { type: number }
              lot_number: { type: [string, "null"] }
              expiry_date: { type: [string, "null"], format: date }

    InventoryBatch:
      type: object
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        variant_id: { type: [string, "null"], format: uuid }
        supplier_id: { type: [string, "null"], format: uuid }
        po_item_id: { type: [string, "null"], format: uuid }
        lot_number: { type: [string, "null"] }
        expiry_date: { type: [string, "null"], format: date }
        purchase_cost: { type: number }
        qty_received: { type: integer }
        entry_date: { type: string, format: date-time }

    BatchPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/InventoryBatch" }

    StockMovementType:
      type: string
      enum: [purchase, sale, transfer, return_in, reserve, release, adjustment]

    StockMovement:
      type: object
      properties:
        id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/StockMovementType" }
        from_location: { type: [string, "null"], format: uuid }
        to_location: { type: [string, "null"], format: uuid }
        quantity: { type: integer }
        reference: { type: [string, "null"] }
        user_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    StockMovementPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/StockMovement" }

    Warehouse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        is_active: { type: boolean }

    WarehousePage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Warehouse" }

    WarehouseLocation:
      type: object
      properties:
        id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        zone: { type: [string, "null"] }
        aisle: { type: [string, "null"] }
        shelf: { type: [string, "null"] }
        bin: { type: [string, "null"] }

    WarehouseLocationPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/WarehouseLocation" }

    PickListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_item_id: { type: [string, "null"], format: uuid }
        batch_id: { type: string, format: uuid }
        location_id: { type: string, format: uuid }
        quantity: { type: integer }
        picked: { type: boolean }

    PickList:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        assigned_to: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [open, picking, picked, closed] }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/PickListItem" }

    ReturnItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_item_id: { type: string, format: uuid }
        quantity: { type: integer }
        condition: { type: [string, "null"], enum: [sellable, opened, damaged] }
        restock: { type: boolean }
        batch_id: { type: [string, "null"], format: uuid }

    Return:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        type: { type: string, enum: [return, exchange] }
        status: { type: string, enum: [requested, approved, collected, settled, rejected] }
        reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReturnItem" }

    Delivery:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        agent_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [assigned, out_for_delivery, delivered, failed, returned] }
        delivery_fee: { type: number }
        dispatched_at: { type: [string, "null"], format: date-time }
        delivered_at: { type: [string, "null"], format: date-time }

    DeliveryPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Delivery" }

    DeviceToken:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        token: { type: string }
        platform: { type: string, enum: [android, ios, web] }
        created_at: { type: string, format: date-time }

    Permission:
      type: object
      properties:
        key: { type: string, example: "orders.confirm" }
        group: { type: string, example: orders }
        description: { type: [string, "null"] }

    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        is_system: { type: boolean }
        created_at: { type: string, format: date-time }
        permissions:
          type: array
          items: { type: string, example: "orders.confirm" }

    RoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: [string, "null"] }
        permissions:
          type: array
          description: Permission keys granted to this role.
          items: { type: string, example: "orders.confirm" }

    RolePage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Role" }

    UserPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/User" }

    SalesReport:
      type: object
      description: Aggregated sales & analytics for the selected date range.
      properties:
        from: { type: [string, "null"], format: date }
        to: { type: [string, "null"], format: date }
        orders_count: { type: integer }
        gross_sales: { type: number }
        discounts: { type: number }
        net_sales: { type: number }
        by_day:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              orders_count: { type: integer }
              net_sales: { type: number }
        top_products:
          type: array
          items:
            type: object
            properties:
              product_id: { type: string, format: uuid }
              name: { type: string }
              qty_sold: { type: integer }
              net_sales: { type: number }

    StoreSettings:
      type: object
      properties:
        store_name: { type: string }
        logo_url: { type: string }
        primary_color: { type: string }
        currency: { type: string, example: IQD }
