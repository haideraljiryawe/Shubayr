        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        sort_order: { type: integer, minimum: 0 }
        is_primary: { type: boolean, readOnly: true, description: True exactly when this is the first image. }

    ProductMediaOperation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [op, url, position]
          properties:
            op: { const: add }
            url: { type: string, format: uri, description: "Stable URL returned by POST /media/images." }
            position: { type: integer, minimum: 0 }
        - type: object
          additionalProperties: false
          required: [op, image_id]
          properties:
            op: { const: remove }
            image_id: { type: string, format: uuid }
        - type: object
          additionalProperties: false
          required: [op, image_id, url]
          properties:
            op: { const: replace }
            image_id: { type: string, format: uuid }
            url: { type: string, format: uri, description: "Stable URL returned by POST /media/images." }
        - type: object
          additionalProperties: false
          required: [op, image_id, position]
          properties:
            op: { const: move }
            image_id: { type: string, format: uuid }
            position: { type: integer, minimum: 0 }
      discriminator: { propertyName: op }

    Banner:
