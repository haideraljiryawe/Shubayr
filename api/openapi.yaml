        name: { type: string }
        code: { type: string }
        is_active: { type: boolean }

    WarehousePage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/Warehouse" }

    WarehouseLocation:
      type: object
      properties:
        id: { type: string, format: uuid }
        warehouse_id: { type: string, format: uuid }
        zone: { type: [string, "null"] }
        aisle: { type: [string, "null"] }
        shelf: { type: [string, "null"] }
        bin: { type: [string, "null"] }

    WarehouseLocationPage:
      allOf:
        - $ref: "#/components/schemas/Pagination"
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { $ref: "#/components/schemas/WarehouseLocation" }

    PickListItem:
      type: object
      properties:
