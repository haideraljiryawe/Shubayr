openapi: 3.1.0
info:
  title: Shubayr API
  version: 14.0.0
  description: >
    REST/JSON API contract for Shubayr — an online multi-section store
    (single-owner, white-label). This document is the SHARED CONTRACT between
    the backend (NestJS) and the clients (Next.js web, Flutter mobile/admin).
    It must stay in sync with infra/db/schema.sql. Changing an endpoint's shape
    is a reviewed PR that updates this file first.

    Access model v2 (breaking): every bearer token has `surface=admin|app`.
    Admin tokens come only from username/password login and staff operations
    require both `surface=admin` and the route's `x-permission`. App tokens come
    only from phone OTP, contain the server-resolved single app role, and never
    authorize admin operations. App clients must not send a role during OTP.
    Work roles (`delivery_agent`, `order_monitor`) cannot use purchase functions.

    Validation and errors: malformed or invalid request data returns HTTP 422
    with code `VALIDATION_FAILED` and field-level errors. All non-2xx JSON
    responses use the Error schema. PATCH distinguishes omission from null:
    omitted fields are unchanged, while null is accepted only for explicitly
    nullable fields and clears that field.

    Money policy: every money-bearing resource identifies its ISO currency.
    Amounts are stored exactly and displayed at that currency's configured
    precision (IQD 0, USD 2). The ledger preserves original-currency amount and
    exchange rate while balancing exactly in the configured base currency.
    Database Decimal values cross the JSON boundary as plain numbers, never as
    decimal-library internals. Deliberately fixed-scale ledger totals and lines
    are strings where their schema uses ExactDecimal.
  license:
    name: Proprietary — Shubayr project
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
tags:
  - name: Auth
  - name: Catalog
  - name: Banners
  - name: Media
  - name: Addresses
  - name: Cart
  - name: Wishlist
  - name: Coupons
  - name: Orders
  - name: Reviews
  - name: Loyalty
  - name: Purchasing
  - name: Inventory
  - name: Warehouses
  - name: Fulfilment
  - name: Returns
  - name: Deliveries
  - name: Devices
  - name: Notifications
  - name: Monitoring
  - name: Admin
  - name: Finance

security:
  - bearerAuth: []

paths:
  # ---------------- AUTH ----------------
  /auth/request-otp:
    post:
      tags: [Auth]
      summary: Send an OTP to a phone number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, pattern: '^\+[1-9]\d{7,14}$', example: "+9647701234567" }
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [otp_sent]
                properties:
                  otp_sent: { type: boolean }
                  dev_otp:
                    type: string
                    pattern: '^\d{6}$'
                    description: Present only when APP_ENV=development; never returned in production.
        "429": { $ref: "#/components/responses/RateLimited" }
        "422": { $ref: "#/components/responses/Validation" }
  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify an OTP and issue tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, code]
              properties:
                phone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
                code: { type: string, pattern: '^\d{6}$', example: "000000" }
                client: { type: string, enum: [mobile, web_store], default: mobile }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token]
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke one refresh token on its original surface
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "201": { description: Refresh token revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/auth/login:
    post:
      tags: [Auth, Admin]
      summary: Authenticate staff with username and password
      description: Every attempt is audited. Five consecutive failures lock the account for 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, pattern: '^[a-z][a-z0-9._-]{2,79}$' }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "201":
          description: Admin-surface token pair. `must_change_password` may require the change-password route before any other protected admin route.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/auth/change-password:
    post:
      tags: [Auth, Admin]
      summary: Replace the current or temporary staff password
      x-surface: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { $ref: "#/components/schemas/Password" }
      responses:
        "201":
          description: New token pair; all older sessions are revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /me:
    get:
      tags: [Auth]
      summary: Current user profile (includes role & permissions)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Auth]
      summary: Update the current user's profile
      description: >
        Updates only the authenticated user's name and, when supplied, email.
        Phone numbers cannot be changed here because a phone change requires
        re-verification through the OTP flow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserSelfUpdate" }
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- MEDIA ----------------
  /media/images:
    post:
      tags: [Media]
      summary: Upload a durable catalog image
      description: Accepts JPEG, PNG, WebP, or AVIF up to 8 MiB and returns a stable API URL backed by the S3-compatible object store.
      x-permission: catalog.products
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored image metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaObject" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: Image exceeds 8 MiB, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: Unsupported image MIME type, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Validation" }
  /media/{id}:
    get:
      tags: [Media]
      summary: Read durable image bytes using a stable public URL
      security: []
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Original image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/avif: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Media]
      summary: Delete an unassociated media object
      description: Returns 409 while a category, product image, or banner still references the URL.
      x-permission: catalog.products
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------- ADDRESSES ----------------
  /addresses:
    get:
      tags: [Addresses]
      summary: List the current user's delivery addresses
      description: Returns only addresses owned by the authenticated user. The first address is always made default.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated addresses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddressPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Addresses]
      summary: Create a delivery address
      description: contact_phone is the recipient contact for this address and may equal or differ from the account phone. Creating the first address makes it default regardless of the supplied flag.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /addresses/{id}:
    get:
      tags: [Addresses]
      summary: Get one address
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Addresses]
      summary: Update an address
      x-error-codes: [ONLY_DEFAULT_ADDRESS_REQUIRED]
      description: Only the owner may update it. Setting is_default=true atomically clears the prior default. Clearing the only default while addresses remain returns 409.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Addresses]
      summary: Delete an address
      description: Only the owner may delete it. Deleting the default promotes the oldest remaining address, ordered by created_at then id.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- CATALOG ----------------
  /categories:
    get:
      tags: [Catalog]
      summary: List departments & categories (tree)
      description: >
        Public results contain only visible categories whose complete ancestor
        chain is visible. With parent_id omitted, returns roots; with parent_id,
        returns direct children unless include_subtree=true. Siblings are
        ordered by sort_order then id.
      security: []
      parameters:
        - { name: parent_id, in: query, schema: { type: string, format: uuid }, description: Parent whose children or subtree should be returned. }
        - { name: include_subtree, in: query, schema: { type: boolean, default: false }, description: Include every descendant of parent_id. }
      responses:
        "200":
          description: Category tree
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
        "422": { $ref: "#/components/responses/Validation" }

  /brands:
    get:
      tags: [Catalog]
      summary: List visible brands
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Visible brands in display order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrandPage" }
        "422": { $ref: "#/components/responses/Validation" }

  /banners:
    get:
      tags: [Banners]
      summary: List active home hero banners ordered by sort order
      description: Active means is_active is true and the current time is within the optional starts_at and ends_at window.
      security: []
      responses:
        "200":
          description: Active banners ordered by sort_order ascending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Banner" }
  /products:
    get:
      tags: [Catalog]
      summary: List / filter / search products
      description: >
        Product names are returned as `name_ar` and `name_en`. If either stored
        value is missing, empty, or whitespace-only, that response field falls
        back to the other language so locale-specific clients never render a
        blank name.
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: search text }
        - { name: category_id, in: query, schema: { type: string, format: uuid }, description: "Category UUID; products remain filtered by category_id, not slug." }
        - { name: brand_id, in: query, schema: { type: array, items: { type: string, format: uuid } }, style: form, explode: true, description: "One or more brand UUIDs; a comma-separated value is also accepted." }
        - { name: min_price, in: query, schema: { type: number }, description: "Lower bound on effective_price, so an active discount moves a product into range." }
        - { name: max_price, in: query, schema: { type: number }, description: "Upper bound on effective_price, so an active discount moves a product into range." }
        - { name: on_sale, in: query, schema: { type: boolean }, description: "When true, return only products with an ACTIVE discount right now: discount_type is set and the server clock falls inside [discount_starts_at, discount_ends_at] (null bounds are open). Scheduled discounts that have not started, and expired ones, are excluded." }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, rating] }, description: "price_asc and price_desc order by effective_price, the amount the customer would pay right now." }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
        "422": { $ref: "#/components/responses/Validation" }
  /products/{id}:
    get:
      tags: [Catalog]
      summary: Product detail (variants, images, reviews summary, availability)
      description: >
        If the requested language's stored product name is missing, empty, or
        whitespace-only, its response field falls back to the other language.
      security: []
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
  /products/{id}/availability:
    get:
      tags: [Catalog]
      summary: Per-variant available quantity for a product
      description: >
        Availability is computed at read time as on-hand (sum of batch_stock)
        minus active batch reservations (stock_reservations with status=reserved)
        and temporary product/variant-level simple_stock_holds from COD orders.
        The computed number reflects current sellable quantity.
      security: []
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Availability breakdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductAvailability" }
        "404": { $ref: "#/components/responses/NotFound" }

  /products/{id}/negotiations:
    post:
      tags: [Catalog]
      summary: Removed negotiation endpoint
      description: Price negotiation was removed in contract v8 and creation is always refused.
      security: []
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "410":
          description: Negotiation has been removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------- CART ----------------
  /cart:
    get:
      tags: [Cart]
      summary: Get the authenticated caller's repriced cart
      description: >
        Guest carts remain client-side. After login, clients atomically attach
        them through POST /cart/merge. Every response reprices from current server-time
        effective_price. Subtotal is the sum of effective-price line totals;
        discount is the coupon amount only, and delivery_fee is zero until a
        delivery-fee policy is configured at checkout.
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the cart
      x-error-codes: [IDEMPOTENCY_KEY_REUSED, REQUESTED_QUANTITY_UNAVAILABLE, SKU_WHOLE_UNITS_ONLY]
      description: An optional Idempotency-Key makes retries repeat-safe. Reusing the key with the same body returns the cart without adding again; a different body returns 409.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: { type: string, format: uuid }
                variant_id: { type: [string, "null"], format: uuid }
                quantity: { type: number, multipleOf: 0.001, minimum: 0.001, maximum: 99 }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /cart/merge:
    post:
      tags: [Cart]
      summary: Atomically merge a guest basket into the authenticated cart
      x-error-codes: [IDEMPOTENCY_KEY_REUSED, REQUESTED_QUANTITY_UNAVAILABLE, SKU_WHOLE_UNITS_ONLY]
      description: The entire guest basket is merged under the cart lock. Replaying the same key and body is a no-op; a simultaneous add is serialized and retained exactly once.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, format: uuid }
                      variant_id: { type: [string, "null"], format: uuid }
                      quantity: { type: number, multipleOf: 0.001, minimum: 0.001, maximum: 99 }
      responses:
        "200":
          description: Merged cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /cart/coupon:
    delete:
      tags: [Cart]
      summary: Remove the applied coupon from the authenticated caller's cart
      description: Clears the coupon and returns the cart repriced at current server prices. Safe to repeat when no coupon is applied.
      responses:
        "200":
          description: Repriced cart without a coupon
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Update a cart item quantity
      x-error-codes: [REQUESTED_QUANTITY_UNAVAILABLE, SKU_WHOLE_UNITS_ONLY]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: number, multipleOf: 0.001, minimum: 0.001, maximum: 99 }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    delete:
      tags: [Cart]
      summary: Remove a cart item
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Removed }

  # ---------------- WISHLIST ----------------
  /wishlist:
    get:
      tags: [Wishlist]
      summary: List wishlist items
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated wishlist items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Wishlist]
      summary: Add a product to the wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: string, format: uuid }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /wishlist/{productId}:
    delete:
      tags: [Wishlist]
      summary: Remove a product from the wishlist
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- COUPONS ----------------
  /coupons/validate:
    post:
      tags: [Coupons]
      summary: Validate a coupon code and apply it to the caller's cart
      description: Invalid, expired, or exhausted codes return 404. Validity is rechecked on every cart read and at checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 60 }
      responses:
        "200":
          description: Valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- ORDERS ----------------
  /orders:
    get:
      tags: [Orders]
      summary: List the current user's orders
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
    post:
      tags: [Orders]
      summary: Place a Cash-on-Delivery order
      x-error-codes: [PRICE_CHANGED, IDEMPOTENCY_KEY_REUSED, CART_EMPTY, CART_QUANTITY_INVALID, CART_PRODUCT_UNAVAILABLE, CART_VARIANT_UNAVAILABLE, CART_SKU_UNAVAILABLE, SKU_WHOLE_UNITS_ONLY, COUPON_INVALID]
      description: >
        Atomically reprices and consumes the caller's server cart using server-time
        effective prices, creates status=pending, a pending COD payment and a
        minimal delivery record. Sellable stock is reserved against concrete
        batches and locations using FEFO allocation in the same transaction. A
        repeated Idempotency-Key with the same checkout request returns
        the original order, even after the cart is cleared; a different request
        with that key returns 409. Without a key, retries can create a new order.
        The selected owned address and contact_phone are copied into immutable
        order snapshot fields in the same transaction. Later address edits do
        not alter snapshots; deletion clears address_id but retains snapshots.
      parameters:
        - name: Idempotency-Key
          in: header
          description: Optional printable ASCII key, 1-128 characters, unique per customer.
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id]
              properties:
                address_id: { type: string, format: uuid }
                coupon_code: { type: [string, "null"] }
                payment_method: { type: string, enum: [cod], default: cod }
                accepted_price_versions:
                  type: array
                  description: Explicit acceptance tokens returned by a prior PRICE_CHANGED conflict.
                  items:
                    type: object
                    additionalProperties: false
                    required: [variant_id, price_version]
                    properties:
                      variant_id: { type: string, format: uuid }
                      price_version: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Cart empty, item unavailable, coupon invalid, or idempotency conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Order detail
      x-error-codes: [ORDER_ACCESS_FORBIDDEN]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orders/{id}/track:
    get:
      tags: [Orders]
      summary: Order status timeline
      x-error-codes: [ORDER_ACCESS_FORBIDDEN]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Ordered list of status-change events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderTracking" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel a pending order and release its inventory reservations
      x-error-codes: [ORDER_ACCESS_FORBIDDEN, STALE_ORDER_STATE, PAID_COD_CANCELLATION_FORBIDDEN, ORDER_TRANSITION_NOT_ALLOWED]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Cancelled order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /orders/{id}/status:
    patch:
      tags: [Admin]
      summary: Deprecated alias for the staff pre-dispatch transition endpoint
      deprecated: true
      x-surface: admin
      x-permission-by-status:
        confirmed: orders.accept
        preparing: orders.prepare
        ready_for_dispatch: orders.mark_ready
        dispatched: orders.handover
      x-error-codes: [STALE_ORDER_STATE, BELOW_COST_BLOCKED, ORDER_NEEDS_ATTENTION, ORDER_DELIVERY_MISSING, DELIVERY_AGENT_NOT_ASSIGNED, ORDER_TRANSITION_NOT_ALLOWED, ORDER_HAS_NO_STOCK_RESERVATIONS, SKU_COST_NOT_FOUND, INVENTORY_COST_NEGATIVE]
      description: >
        Supports the same pre-dispatch transitions as
        PATCH /admin/orders/{id}/status. Use the dedicated admin endpoint for
        new clients.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, version]
              properties:
                status: { type: string, enum: [confirmed, preparing, ready_for_dispatch, dispatched] }
                version: { type: integer, minimum: 1 }
                note: { type: [string, "null"], maxLength: 500 }
                below_cost_override_reason: { type: [string, "null"], maxLength: 500 }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /orders/{id}/cancellation-request:
    post:
      tags: [Orders]
      summary: Request cancellation after the pending state
      x-error-codes: [ORDER_ACCESS_FORBIDDEN, STALE_ORDER_STATE, CANCELLATION_REQUEST_NOT_ALLOWED, CANCELLATION_REQUEST_ALREADY_PENDING]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, reason]
              properties:
                version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Order with pending cancellation request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  /orders/{id}/shortage-response:
    post:
      tags: [Orders]
      summary: Accept or deny a proposed preparation quantity reduction
      x-error-codes: [ORDER_ACCESS_FORBIDDEN, STALE_ORDER_STATE, QUANTITY_REDUCTION_NOT_PENDING]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, decision]
              properties:
                version: { type: integer, minimum: 1 }
                decision: { type: string, enum: [accepted, denied] }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- REVIEWS ----------------
  /me/reviews:
    get:
      tags: [Reviews]
      summary: List the current customer's own product reviews
      description: Returns all moderation states, newest first. Pending and rejected reviews are visible only to their owner; public product review reads remain published-only.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated caller-owned reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerReviewPage" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /products/{id}/reviews:
    get:
      tags: [Reviews]
      summary: List published reviews for a product
      security: []
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
    post:
      tags: [Reviews]
      summary: Submit a verified-purchase product review
      description: Only the owner of a delivered order item for this product may review it, once per purchased line. Reviews start pending moderation. Delivery ratings use a separate endpoint.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_item_id, rating]
              properties:
                order_item_id: { type: string, format: uuid }
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: [string, "null"], maxLength: 2000 }
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /reviews/{id}:
    patch:
      tags: [Reviews]
      summary: Edit the current customer's own product review
      description: A content change resets a published or rejected review to pending and removes its moderation metadata. A no-op edit preserves status.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: [string, "null"], maxLength: 2000 }
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Reviews]
      summary: Delete the current customer's own product review
      description: Clears the purchased order item's reviewed flag and reconciles the product rating cache.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/reviews:
    get:
      tags: [Reviews]
      summary: Staff product-review moderation queue
      description: Defaults to pending reviews; status can select published or rejected reviews.
      x-permission: reviews.moderate
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          schema: { type: string, enum: [pending, published, rejected] }
      responses:
        "200":
          description: Paginated moderation queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/reviews/{id}/moderate:
    post:
      tags: [Reviews]
      summary: Publish or reject a product review with a reason
      x-permission: reviews.moderate
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [publish, reject] }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Moderated review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /deliveries/{id}/rating:
    post:
      tags: [Reviews]
      summary: Rate the delivery/agent (separate from product review)
      description: Customer-scoped. The authenticated caller must own the delivery's order, both delivery and order must be delivered, and there is exactly one rating per delivery. Another customer's delivery returns 404.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        "201":
          description: Created delivery rating
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryRating" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- LOYALTY ----------------
  /loyalty:
    get:
      tags: [Loyalty]
      summary: Current customer's points balance and paginated ledger
      description: Balance is computed from the append-only ledger. The default earn rate is one point per full currency unit of delivered order subtotal less discount, excluding delivery fee. COD refund entries are obligations rather than settled payments, so returns do not claw back delivery-earned points in this slice. One point redeemed has an indicative value of one minor currency unit; redemption does not change an order or initiate a payment.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Loyalty account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltyAccount" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /loyalty/redeem:
    post:
      tags: [Loyalty]
      summary: Spend points from the current customer's balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points]
              properties:
                points: { type: integer, minimum: 1 }
                note: { type: string, maxLength: 255 }
      responses:
        "201":
          description: Points redemption recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltyRedemption" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/loyalty/{userId}:
    get:
      tags: [Loyalty]
      summary: Read a customer's balance and paginated ledger
      x-permission: loyalty.adjust
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Customer's ledger-derived balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltyAccount" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/loyalty/{userId}/adjust:
    post:
      tags: [Loyalty]
      summary: Record an audited positive or negative staff adjustment
      x-permission: loyalty.adjust
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points, reason]
              properties:
                points: { type: integer, description: Signed nonzero delta. }
                reason: { type: string, minLength: 1, maxLength: 120 }
                note: { type: string, maxLength: 255 }
      responses:
        "201":
          description: Adjustment ledger entry and resulting balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltyAdjustment" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- PURCHASING (staff) ----------------
  /admin/suppliers:
    get:
      tags: [Purchasing]
      summary: List suppliers
      x-permission: suppliers.view
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated suppliers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Purchasing]
      summary: Create a supplier
      x-permission: suppliers.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInput" }
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/purchase-invoices:
    get:
      tags: [Purchasing]
      summary: List posted purchase invoices
      x-permission: suppliers.view
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - { name: supplier_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: string } }
        - { name: currency, in: query, schema: { type: string, enum: [IQD, USD] } }
      responses:
        "200": { description: Purchase invoice page, content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseInvoicePage" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Purchasing]
      summary: Create a purchase invoice (draft)
      x-error-codes: [RECEIVING_LOCATION_INACTIVE, SUPPLIER_INVOICE_NUMBER_DUPLICATE, PURCHASE_RATE_OVERRIDE_REQUIRED, SUPPLIER_INACTIVE, INVENTORY_COST_NEGATIVE, PERIOD_CLOSED]
      x-permission: purchases.create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurchaseInvoiceInput" }
      responses:
        "201":
          description: Created purchase invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseInvoice" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/ExchangeRateValidation" }
  /admin/suppliers/balances:
    get:
      tags: [Purchasing]
      summary: Supplier balances by original currency and IQD value
      x-permission: suppliers.view
      responses:
        "200": { description: Supplier balances, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SupplierBalance" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/suppliers/aging:
    get:
      tags: [Purchasing]
      summary: Accounts-payable aging by due date
      x-permission: suppliers.view
      parameters: [{ name: as_of, in: query, schema: { type: string, format: date } }]
      responses:
        "200": { description: Aging lines, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SupplierAgingLine" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/suppliers/{id}:
    get:
      tags: [Purchasing]
      summary: Get a supplier
      x-permission: suppliers.view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: Supplier, content: { application/json: { schema: { $ref: "#/components/schemas/Supplier" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Purchasing]
      summary: Update or reactivate a supplier
      x-permission: suppliers.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SupplierPatch" } } } }
      responses:
        "200": { description: Updated supplier, content: { application/json: { schema: { $ref: "#/components/schemas/Supplier" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Purchasing]
      summary: Deactivate a supplier while preserving its history
      x-permission: suppliers.manage
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: Deactivated supplier, content: { application/json: { schema: { $ref: "#/components/schemas/Supplier" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/suppliers/{id}/opening-balance:
    post:
      tags: [Purchasing]
      summary: Post a supplier opening balance against owner equity
      x-error-codes: [PURCHASE_RATE_OVERRIDE_REQUIRED, SUPPLIER_INACTIVE, PERIOD_CLOSED]
      x-permission: supplier_openings.record
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SupplierOpeningInput" } } } }
      responses:
        "201": { description: Posted opening balance, content: { application/json: { schema: { $ref: "#/components/schemas/PurchasingDocument" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/suppliers/{id}/statement:
    get:
      tags: [Purchasing]
      summary: Supplier statement with running currency and IQD balances
      x-permission: suppliers.view
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { name: currency, in: query, schema: { type: string, enum: [IQD, USD] } }
        - { name: as_of, in: query, schema: { type: string, format: date } }
      responses:
        "200": { description: Statement lines, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SupplierStatementLine" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/purchase-invoices/{id}:
    get:
      tags: [Purchasing]
      summary: Get a posted purchase invoice
      x-permission: suppliers.view
      parameters: [{ $ref: "#/components/parameters/PathId" }]
      responses:
        "200": { description: Purchase invoice, content: { application/json: { schema: { $ref: "#/components/schemas/PurchaseInvoice" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/supplier-payments:
    get:
      tags: [Purchasing]
      summary: List supplier payments and allocations
      x-permission: suppliers.view
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }, { name: supplier_id, in: query, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Supplier payments, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PurchasingDocument" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Purchasing]
      summary: Pay and explicitly allocate supplier invoices
      x-error-codes: [CASH_ACCOUNT_INACTIVE, PAYMENT_ALLOCATION_EXCEEDS_AMOUNT, PAYMENT_ALLOCATION_EXCEEDS_INVOICE, PURCHASE_RATE_OVERRIDE_REQUIRED, SUPPLIER_INACTIVE, PERIOD_CLOSED]
      description: >
        The payment and every allocation amount use the cash account currency.
        Each allocation is converted to its invoice currency at the applicable
        payment-date rate. An explicit non-base rate requires
        `purchases.override_rate`; FX differences from the invoice's booked
        rate post to supplier FX gain or loss.
      x-permission: supplier_payments.record
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SupplierPaymentInput" } } } }
      responses:
        "201": { description: Posted payment, content: { application/json: { schema: { $ref: "#/components/schemas/PurchasingDocument" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/ExchangeRateValidation" }
  /admin/supplier-credits:
    get:
      tags: [Purchasing]
      summary: List supplier credits
      x-permission: suppliers.view
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/PerPage" }, { name: supplier_id, in: query, schema: { type: string, format: uuid } }]
      responses:
        "200": { description: Supplier credits, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PurchasingDocument" } } } } }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/supplier-credits/{id}/allocations:
    post:
      tags: [Purchasing]
