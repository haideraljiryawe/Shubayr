      x-error-codes: [RETRIEVAL_RETRY_REQUIRES_FAILED_ORDER, RETRIEVAL_CANCEL_REQUIRES_CANCELLED_ORDER, ORDER_HAS_NO_CUSTODY_PARTY, RETRIEVAL_ALREADY_OPEN, ORDER_HAS_NO_CUSTODY_GOODS]
