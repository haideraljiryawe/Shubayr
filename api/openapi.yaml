openapi: 3.1.0
info:
  title: Shubayr API
  version: 4.2.0
  description: >
    REST/JSON API contract for Shubayr — an online multi-section store
    (single-owner, white-label). This document is the SHARED CONTRACT between
    the backend (NestJS) and the clients (Next.js web, Flutter mobile/admin).
    It must stay in sync with infra/db/schema.sql. Changing an endpoint's shape
    is a reviewed PR that updates this file first.

    RBAC: staff/admin operations are annotated with `x-permission`, whose value
    is a permission key from infra/db/seed_rbac.sql. The backend enforces the
    permission; a missing permission returns 403.

    Validation and errors: malformed or invalid request data returns HTTP 422
    with code `VALIDATION_FAILED` and field-level errors. All non-2xx JSON
    responses use the Error schema. PATCH distinguishes omission from null:
    omitted fields are unchanged, while null is accepted only for explicitly
    nullable fields and clears that field.

    Money policy: API money values are decimal JSON numbers with at most two
    fractional digits and are stored as NUMERIC(*,2). Calculations use integer
    minor units and round once at the resulting money boundary, half away from
    zero. Percentage values have at most two fractional digits. Cart line
    totals, checkout totals, persisted order amounts, filters, and response
    pricing all use this policy.
  license:
    name: Proprietary — Shubayr project
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
tags:
  - name: Auth
  - name: Catalog
  - name: Banners
  - name: Media
  - name: Addresses
  - name: Cart
  - name: Wishlist
  - name: Coupons
  - name: Orders
  - name: Reviews
  - name: Loyalty
  - name: Purchasing
  - name: Inventory
  - name: Warehouses
  - name: Fulfilment
  - name: Returns
  - name: Deliveries
  - name: Devices
  - name: Admin

security:
  - bearerAuth: []

paths:
  # ---------------- AUTH ----------------
  /auth/request-otp:
    post:
      tags: [Auth]
      summary: Send an OTP to a phone number
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, pattern: '^\+[1-9]\d{7,14}$', example: "+9647701234567" }
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [otp_sent]
                properties:
                  otp_sent: { type: boolean }
                  dev_otp:
                    type: string
                    pattern: '^\d{6}$'
                    description: Present only when APP_ENV=development; never returned in production.
        "429": { $ref: "#/components/responses/RateLimited" }
        "422": { $ref: "#/components/responses/Validation" }
  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify an OTP and issue tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, code]
              properties:
                phone: { type: string, pattern: '^\+[1-9]\d{7,14}$' }
                code: { type: string, pattern: '^\d{6}$', example: "000000" }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token]
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }
  /me:
    get:
      tags: [Auth]
      summary: Current user profile (includes role & permissions)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [Auth]
      summary: Update the current user's profile
      description: >
        Updates only the authenticated user's name and, when supplied, email.
        Phone numbers cannot be changed here because a phone change requires
        re-verification through the OTP flow.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserSelfUpdate" }
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- MEDIA ----------------
  /media/images:
    post:
      tags: [Media]
      summary: Upload a durable catalog image
      description: Accepts JPEG, PNG, WebP, or AVIF up to 8 MiB and returns a stable API URL backed by the S3-compatible object store.
      x-permission: catalog.manage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Stored image metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaObject" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: Image exceeds 8 MiB, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "415": { description: Unsupported image MIME type, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Validation" }
  /media/{id}:
    get:
      tags: [Media]
      summary: Read durable image bytes using a stable public URL
      security: []
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Original image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/avif: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Media]
      summary: Delete an unassociated media object
      description: Returns 409 while a category, product image, or banner still references the URL.
      x-permission: catalog.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------- ADDRESSES ----------------
  /addresses:
    get:
      tags: [Addresses]
      summary: List the current user's delivery addresses
      description: Returns only addresses owned by the authenticated user. The first address is always made default.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated addresses
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddressPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Addresses]
      summary: Create a delivery address
      description: contact_phone is the recipient contact for this address and may equal or differ from the account phone. Creating the first address makes it default regardless of the supplied flag.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "422": { $ref: "#/components/responses/Validation" }
  /addresses/{id}:
    get:
      tags: [Addresses]
      summary: Get one address
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Address
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Addresses]
      summary: Update an address
      description: Only the owner may update it. Setting is_default=true atomically clears the prior default. Clearing the only default while addresses remain returns 409.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddressPatch" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Address" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Addresses]
      summary: Delete an address
      description: Only the owner may delete it. Deleting the default promotes the oldest remaining address, ordered by created_at then id.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- CATALOG ----------------
  /categories:
    get:
      tags: [Catalog]
      summary: List departments & categories (tree)
      description: >
        Public results contain only visible categories whose complete ancestor
        chain is visible. With parent_id omitted, returns roots; with parent_id,
        returns direct children unless include_subtree=true. Siblings are
        ordered by sort_order then id.
      security: []
      parameters:
        - { name: parent_id, in: query, schema: { type: string, format: uuid }, description: Parent whose children or subtree should be returned. }
        - { name: include_subtree, in: query, schema: { type: boolean, default: false }, description: Include every descendant of parent_id. }
      responses:
        "200":
          description: Category tree
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }

  /banners:
    get:
      tags: [Banners]
      summary: List active home hero banners ordered by sort order
      description: Active means is_active is true and the current time is within the optional starts_at and ends_at window.
      security: []
      responses:
        "200":
          description: Active banners ordered by sort_order ascending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Banner" }
  /products:
    get:
      tags: [Catalog]
      summary: List / filter / search products
      description: >
        Product names are returned as `name_ar` and `name_en`. If either stored
        value is missing, empty, or whitespace-only, that response field falls
        back to the other language so locale-specific clients never render a
        blank name.
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: search text }
        - { name: category_id, in: query, schema: { type: string, format: uuid }, description: "Category UUID; products remain filtered by category_id, not slug." }
        - { name: min_price, in: query, schema: { type: number }, description: "Lower bound on effective_price, so an active discount moves a product into range." }
        - { name: max_price, in: query, schema: { type: number }, description: "Upper bound on effective_price, so an active discount moves a product into range." }
        - { name: on_sale, in: query, schema: { type: boolean }, description: "When true, return only products with an ACTIVE discount right now: discount_type is set and the server clock falls inside [discount_starts_at, discount_ends_at] (null bounds are open). Scheduled discounts that have not started, and expired ones, are excluded." }
        - { name: sort, in: query, schema: { type: string, enum: [newest, price_asc, price_desc, rating] }, description: "price_asc and price_desc order by effective_price, the amount the customer would pay right now." }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductPage" }
  /products/{id}:
    get:
      tags: [Catalog]
      summary: Product detail (variants, images, reviews summary, availability)
      description: >
        If the requested language's stored product name is missing, empty, or
        whitespace-only, its response field falls back to the other language.
      security: []
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
  /products/{id}/availability:
    get:
      tags: [Catalog]
      summary: Per-variant available quantity for a product
      description: >
        Availability is computed at read time as on-hand (sum of batch_stock)
        minus active reservations (stock_reservations with status=reserved).
        Nothing is persisted; the number reflects current sellable quantity.
      security: []
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Availability breakdown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductAvailability" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- CART ----------------
  /cart:
    get:
      tags: [Cart]
      summary: Get current cart
      responses:
        "200":
          description: Cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity]
              properties:
                product_id: { type: string, format: uuid }
                variant_id: { type: [string, "null"], format: uuid }
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
  /cart/items/{id}:
    patch:
      tags: [Cart]
      summary: Update a cart item quantity
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
    delete:
      tags: [Cart]
      summary: Remove a cart item
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "204": { description: Removed }

  # ---------------- WISHLIST ----------------
  /wishlist:
    get:
      tags: [Wishlist]
      summary: List wishlist items
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated wishlist items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistPage" }
    post:
      tags: [Wishlist]
      summary: Add a product to the wishlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: string, format: uuid }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WishlistItem" }
  /wishlist/{productId}:
    delete:
      tags: [Wishlist]
      summary: Remove a product from the wishlist
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- COUPONS ----------------
  /coupons/validate:
    post:
      tags: [Coupons]
      summary: Validate a coupon code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: Valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coupon" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- ORDERS ----------------
  /orders:
    get:
      tags: [Orders]
      summary: List the current user's orders
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPage" }
    post:
      tags: [Orders]
      summary: Place a Cash-on-Delivery order
      description: >
        Creates the order (status=pending) and a pending COD payment. Stock is
        validated but NOT deducted here; reservation happens on staff confirm.
        The selected owned address and contact_phone are copied into immutable
        order snapshot fields in the same transaction. Later address edits or
        deletion never alter a placed order.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address_id]
              properties:
                address_id: { type: string, format: uuid }
                coupon_code: { type: [string, "null"] }
                payment_method: { type: string, enum: [cod], default: cod }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409":
          description: One or more items unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Order detail
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/{id}/track:
    get:
      tags: [Orders]
      summary: Order status timeline
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Ordered list of status-change events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderTracking" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel an order (releases any reservations)
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Cancelled order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
  /orders/{id}/status:
    patch:
      tags: [Admin]
      summary: Update order status (staff) — confirm triggers FEFO reservation + pick list
      x-permission: orders.update
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/OrderStatus" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- REVIEWS ----------------
  /products/{id}/reviews:
    get:
      tags: [Reviews]
      summary: List published reviews for a product
      security: []
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewPage" }
    post:
      tags: [Reviews]
      summary: Submit a review (must reference a purchased order item)
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_item_id, rating]
              properties:
                order_item_id: { type: string, format: uuid }
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        "201":
          description: Created review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "422": { $ref: "#/components/responses/Validation" }
  /deliveries/{id}/rating:
    post:
      tags: [Reviews]
      summary: Rate the delivery/agent (separate from product review)
      description: Customer-scoped. The authenticated caller must own the delivery's order, the delivery must be delivered, and each caller may rate it once. Return 404 or 409 without exposing another customer's delivery.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stars]
              properties:
                stars: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }
      responses:
        "201":
          description: Created delivery rating
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryRating" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- LOYALTY ----------------
  /loyalty:
    get:
      tags: [Loyalty]
      summary: Current points balance and ledger
      responses:
        "200":
          description: Loyalty account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoyaltyAccount" }

  # ---------------- PURCHASING (staff) ----------------
  /suppliers:
    get:
      tags: [Purchasing]
      summary: List suppliers
      x-permission: purchasing.view
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated suppliers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Purchasing]
      summary: Create a supplier
      x-permission: purchasing.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInput" }
      responses:
        "201":
          description: Created supplier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /purchase-invoices:
    post:
      tags: [Purchasing]
      summary: Create a purchase invoice (draft)
      x-permission: purchasing.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [supplier_id, items]
              properties:
                supplier_id: { type: string, format: uuid }
                invoice_number: { type: string }
                items:
                  type: array
                  items:
                    type: object
                    required: [product_id, quantity, unit_cost]
                    properties:
                      product_id: { type: string, format: uuid }
                      quantity: { type: integer, minimum: 1 }
                      unit_cost: { type: number }
                      lot_number: { type: string }
                      expiry_date: { type: [string, "null"], format: date }
      responses:
        "201":
          description: Created purchase invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseInvoice" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /purchase-invoices/{id}/receive:
    post:
      tags: [Purchasing]
      summary: Receive goods — creates inventory batches and places them into locations
      x-permission: purchasing.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                placements:
                  type: array
                  items:
                    type: object
