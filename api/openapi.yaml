      x-permission: inventory.count
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated warehouse locations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WarehouseLocationPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- FULFILMENT (staff/warehouse) ----------------
  /pick-lists/{id}:
    get:
      tags: [Fulfilment]
      summary: Get a pick list (item + qty + warehouse + shelf + batch)
      x-permission: inventory.pick
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Pick list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickList" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pick-lists/{id}/items/{itemId}/pick:
    post:
      tags: [Fulfilment]
      summary: Mark a pick-list item as picked
      x-permission: inventory.pick
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated pick-list item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PickListItem" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- RETURNS ----------------
  /returns:
    get:
      tags: [Returns]
      summary: List the authenticated customer's returns
      description: Returns only rows whose user_id is the authenticated caller, newest first, with pagination applied after ownership scoping.
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          schema: { type: string, enum: [requested, approved, partially_approved, rejected, completed] }
      responses:
        "200":
          description: Caller-owned returns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnPage" }
    post:
      tags: [Returns]
      summary: Request a partial or full return of a delivered order
      description: Only the order owner can request a return. Pending quantities reserve eligibility. Expected refund uses immutable order-item unit prices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, items]
              properties:
                order_id: { type: string, format: uuid }
                reason: { type: string }
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [order_item_id, quantity, reason]
                    properties:
                      order_item_id: { type: string, format: uuid }
                      quantity: { type: number, multipleOf: 0.001, minimum: 0.001 }
                      reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "201":
          description: Created return request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /returns/queue:
    get:
      tags: [Returns]
      summary: List all returns for staff review
      x-permission: returns.inspect
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          schema: { type: string, enum: [requested, approved, partially_approved, rejected, completed] }
      responses:
        "200":
          description: Paginated return queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /returns/{id}/inspect:
    post:
      tags: [Returns]
      summary: Review requested return quantities and conditions
      description: Review each requested line or reject the whole request. Sellable approved units restock; opened and damaged units do not. Approved refund is a COD obligation.
      x-permissions: [returns.inspect, returns.approve]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                items:
                  type: array
                  items:
                    type: object
                    required: [return_item_id, approved_quantity]
                    properties:
                      return_item_id: { type: string, format: uuid }
                      approved_quantity: { type: number, multipleOf: 0.001, minimum: 0 }
                      condition: { type: string, enum: [sellable, opened, damaged] }
      responses:
        "200":
          description: Inspected return
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /returns/{id}/complete:
    post:
      tags: [Returns]
      summary: Complete a reviewed return
      description: Completes an approved, partially approved, or rejected return. The order becomes returned only when all ordered units have approved returns.
      x-permission: returns.refund
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Completed return
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Return" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ---------------- DELIVERIES (agent) ----------------
  /deliveries:
    get:
      tags: [Deliveries]
      summary: List all deliveries for operations staff
      x-permission: deliveries.manage
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          schema: { type: string, enum: [assigned, out_for_delivery, delivered, failed, returned] }
      responses:
        "200":
          description: Paginated deliveries across all agents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /deliveries/assigned:
    get:
      tags: [Deliveries]
      summary: Deliveries assigned to the current agent
      description: >
        Requires an app-surface `delivery_agent` session and returns deliveries
        scoped to the current authenticated agent only. When `status` is supplied, the
        server applies it server-side to that agent's deliveries before
        pagination. `total`
        is the number matching the selected status, rather than the agent's
        unfiltered total. Results have stable ordering by `dispatched_at` DESC,
        then `id` DESC as the unique tiebreaker, so equal timestamps do not make
        items shift between pages. Omitting `status` returns all statuses.
      x-app-role: delivery_agent
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
        - name: status
          in: query
          required: false
          description: Optional delivery status filter applied before pagination; omit to return all statuses.
          schema:
            type: string
            enum: [assigned, out_for_delivery, delivered, failed, returned]
      responses:
        "200":
          description: Paginated deliveries scoped to the current agent, with a filtered total when status is supplied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPage" }
              examples:
                normal:
                  summary: First page of assigned deliveries
                  value:
                    page: 1
                    per_page: 20
                    total: 45
                    data:
                      - id: "10000000-0000-4000-8000-000000000001"
                        order_id: "20000000-0000-4000-8000-000000000001"
                        agent_id: "30000000-0000-4000-8000-000000000001"
                        status: assigned
                        delivery_fee: 5
                        dispatched_at: "2026-09-09T09:00:00Z"
                        delivered_at: null
                empty:
                  summary: No deliveries match the selected status
                  value:
                    page: 1
                    per_page: 20
                    total: 0
                    data: []
        "403": { $ref: "#/components/responses/Forbidden" }
  /deliveries/custody:
    get:
      tags: [Deliveries]
      summary: Current agent's own goods and cash custody
      description: The party is resolved from the authenticated delivery-agent session; no party id is accepted. Cost fields are never returned to an agent. Cash equals confirmed COD held in the party's account 1020 custody balance.
      x-app-role: delivery_agent
      responses:
        "200":
          description: Own custody summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPartyCustody" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /deliveries/{id}:
    patch:
      tags: [Deliveries]
      summary: Update delivery status (agent)
      x-error-codes: [STALE_ORDER_STATE]
      description: >
        Only the assigned agent may act. An assigned delivery may start only
        when its order is ready_for_dispatch. Legal transitions are assigned to
        out_for_delivery; out_for_delivery to delivered or failed; failed back
        to out_for_delivery for a custody-preserving retry; and delivered to
        returned. Returned is terminal. Dispatch and delivery
        timestamps are recorded, and the order advances atomically through its
        corresponding status events. For status=delivered, operation_id and
        collection_confirmation are required. A confirmed collection also
        requires collected_amount. Revenue, cost of goods sold, and cash
        custody or collection exception are posted atomically. An unconfirmed
        collection recognizes revenue without inventing cash received.
      x-app-role: delivery_agent
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, order_version]
              properties:
                status: { type: string, enum: [out_for_delivery, delivered, failed, returned] }
                order_version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500, description: Required when status=failed. }
                operation_id: { type: string, minLength: 8, maxLength: 128, description: Required when status=delivered. }
                collection_confirmation: { type: string, enum: [confirmed, unconfirmed], description: Required when status=delivered. }
                collected_amount: { type: string, pattern: '^\\d+(\\.\\d{1,6})?$', description: Required only for a confirmed collection; must be at most the amount due. }
      responses:
        "200":
          description: Updated delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/deliveries/{id}/status:
    patch:
      tags: [Deliveries]
      summary: Complete, fail, or retry a delivery as authorized staff
      x-error-codes: [STALE_ORDER_STATE]
      description: >
        Uses the same concurrency-safe order/delivery transition as the assigned
        agent route. Staff may mark dispatched deliveries delivered or failed,
        and may retry only a failed delivery. A retry preserves the existing
        custody and never posts a second stock issue.
      x-permission-by-status:
        delivered: orders.deliver
        failed: orders.fail
        out_for_delivery: orders.retry
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, order_version]
              properties:
                status: { type: string, enum: [out_for_delivery, delivered, failed] }
                order_version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500, description: Required when status=failed. }
                operation_id: { type: string, minLength: 8, maxLength: 128, description: Required when status=delivered. }
                collection_confirmation: { type: string, enum: [confirmed, unconfirmed], description: Required when status=delivered. }
                collected_amount: { type: string, pattern: '^\\d+(\\.\\d{1,6})?$', description: Required only for a confirmed collection; must be at most the amount due. }
                event_at: { type: string, format: date-time, description: Optional delivery event time reported by staff; posting uses its Baghdad business date. }
                source: { type: string, minLength: 1, maxLength: 120, description: Required when staff records a delivery on behalf of a party. }
      responses:
        "200":
          description: Updated delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/deliveries/unconfirmed:
    get:
      tags: [Deliveries]
      summary: List delivered orders whose collection awaits confirmation
      x-permission: deliveries.manage
      parameters:
        - { name: party_id, in: query, schema: { type: string, format: uuid } }
        - { name: date_from, in: query, description: Baghdad business date, schema: { type: string, format: date } }
        - { name: date_to, in: query, description: Baghdad business date, schema: { type: string, format: date } }
        - { name: amount_min, in: query, description: Minimum amount due, schema: { type: number, minimum: 0 } }
        - { name: amount_max, in: query, description: Maximum amount due, schema: { type: number, minimum: 0 } }
        - { name: sort_by, in: query, schema: { type: string, enum: [date, amount], default: date } }
        - { name: sort_direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated unconfirmed collections, newest first by default
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryCollectionPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /admin/deliveries/{id}/collection-confirmation:
    post:
      tags: [Deliveries]
      summary: Confirm the amount collected for an unconfirmed delivery
      description: Posts only the later full or later short confirmation map; sale revenue and COGS are never repeated.
      x-permission: orders.deliver
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, collected_amount]
              properties:
                operation_id: { type: string, minLength: 8, maxLength: 128 }
                collected_amount: { type: string, pattern: '^\\d+(\\.\\d{1,6})?$' }
      responses:
        "200":
          description: Confirmed collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryCollection" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /deliveries/{id}/assign:
    patch:
      tags: [Deliveries]
      summary: Assign or reassign an active delivery to a delivery party
      description: Staff may assign an active internal agent or external driver. agent_id remains accepted for backward compatibility and identifies an internal party; new clients use party_id.
      x-permission: orders.assign_agent
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              oneOf:
                - required: [agent_id]
                - required: [party_id]
              properties:
                agent_id: { type: string, format: uuid }
                party_id: { type: string, format: uuid }
      responses:
        "200":
          description: Updated delivery assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delivery" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- DEVICES (FCM push tokens) ----------------
  /devices/token:
    post:
      tags: [Devices]
      summary: Register or reactivate an account-owned push device token
      description: Re-registering refreshes last_seen_at; a token moving accounts is reassigned, never duplicated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string }
                platform: { type: string, enum: [android, ios, web] }
                locale: { type: string, enum: [ar, en, ar-IQ, en-US] }
      responses:
        "201":
          description: Registered device token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceToken" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Devices]
      summary: Deactivate an owned device token
      parameters:
        - { name: token, in: query, required: false, schema: { type: string }, description: "Token to remove; may be sent as a query param or in the request body." }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /me/notification-preferences:
    get:
      tags: [Devices]
      summary: Get effective per-type and per-channel notification preferences
      description: Returns all supported notification types across push and SMS. Transactional push defaults on; promo defaults off. Order confirmation SMS is mandatory. Legacy category toggles remain the fallback until a type/channel override is stored.
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
    patch:
      tags: [Devices]
      summary: Update own type/channel notification preferences
      description: Omitted pairs are unchanged; updates are shared by all devices. Order confirmation SMS cannot be disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferencesPatch" }
      responses:
        "200":
          description: Updated notification preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "422": { $ref: "#/components/responses/Validation" }

  /me/notifications:
    get:
      tags: [Notifications]
      summary: List the caller's durable notification inbox
      description: Shared across the recipient's devices and auth surfaces; newest first with id as the stable tiebreak.
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: unread, in: query, schema: { type: boolean, default: false } }
        - name: type
          in: query
          description: Return only notifications of this exact type.
          schema: { $ref: "#/components/schemas/NotificationPreferenceEntry/properties/type" }
      responses:
        "200":
          description: Own saved notifications, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }

  /me/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get the caller's unread notification count
      responses:
        "200":
          description: Current unread count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadCount" }

  /me/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one owned notification read
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Read state
          content:
            application/json:
              schema:
                type: object
                required: [id, read_at]
                properties:
                  id: { type: string, format: uuid }
                  read_at: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  /me/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark every unread notification for the caller read
      responses:
        "200":
          description: Bulk read result
          content:
            application/json:
              schema:
                type: object
                required: [updated, read_at]
                properties:
                  updated: { type: integer, minimum: 0 }
                  read_at: { type: string, format: date-time }

  /notifications/stream-ticket:
    post:
      tags: [Notifications]
      summary: Issue a short-lived single-use SSE ticket
      description: The bearer token is used only for this POST and is never placed in the EventSource URL.
      responses:
        "201":
          description: Ticket valid for 60 seconds and one stream connection
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expires_at]
                properties:
                  ticket: { type: string }
                  expires_at: { type: string, format: date-time }

  /notifications/stream:
    get:
      tags: [Notifications]
      summary: Open the recipient-scoped notification SSE stream
      security: []
      description: Emits notification.created, notification.read and unread.count. Supports Last-Event-ID or since; sends heartbeat comments every 15 seconds.
      parameters:
        - { name: ticket, in: query, required: true, schema: { type: string } }
        - { name: since, in: query, required: false, schema: { type: string, pattern: "^[0-9]+$" } }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string, pattern: "^[0-9]+$" } }
      responses:
        "200":
          description: Server-sent event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /monitor/orders:
    get:
      tags: [Monitoring]
      summary: Read-only order list for the order-monitor app role
      x-surface: app
      x-app-role: order_monitor
      parameters:
        - { name: status, in: query, schema: { oneOf: [ { $ref: "#/components/schemas/OrderStatus" }, { type: string, const: all } ] } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: "Partial case-insensitive customer-name or order-number search with Arabic normalization." }
        - { name: date_from, in: query, schema: { type: string, format: date }, description: Start of the Asia/Baghdad calendar day. }
        - { name: date_to, in: query, schema: { type: string, format: date }, description: "End of the Asia/Baghdad calendar day, inclusive." }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Pagination envelope plus status chip counts computed without the status filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorOrderPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }

  /monitor/orders/{id}:
    get:
      tags: [Monitoring]
      summary: Read-only monitor order detail without product images
      x-surface: app
      x-app-role: order_monitor
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Monitor-safe order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorOrderDetail" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- ADMIN: REPORTS & SETTINGS ----------------
  /admin/reports/sales:
    get:
      tags: [Admin]
      summary: Sales & analytics summary
      x-permission: reports.view
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Sales report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesReport" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /settings:
    get:
      tags: [Admin]
      summary: White-label store settings (name, logo, colors, currency)
      security: []
      responses:
        "200":
          description: Store settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreSettings" }

  # ---------------- ADMIN: ORDERS ----------------
  /admin/orders:
    get:
      tags: [Admin]
      summary: List all orders (staff) with filters
      x-permission: orders.view
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string, maxLength: 40 }, description: "case-insensitive order_number search" }
        - { name: customer_id, in: query, schema: { type: string, format: uuid } }
        - { name: late, in: query, schema: { type: boolean }, description: Filter by the server-computed acceptance-late flag. }
        - { name: needs_attention, in: query, schema: { type: boolean }, description: Filter by inventory attention requirement. }
        - { name: cancellation_request, in: query, schema: { type: string, enum: [pending] }, description: Filter orders with a pending customer cancellation request. }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/delivery-agents:
    get:
      tags: [Admin]
      summary: List active delivery agents available for assignment
      description: Server-side search and pagination for staff assigning deliveries; users.manage is not required.
      x-permission: orders.assign_agent
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: "case-insensitive name or phone search" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated active delivery agents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryAgentPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/delivery-parties:
    get:
      tags: [Admin, Deliveries]
      summary: List internal agents and external drivers
      x-any-permissions: [deliveries.manage, orders.assign_agent, drivers.manage]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [internal_agent, external_driver] } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated delivery parties
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPartyPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/delivery-parties/custody-overview:
    get:
      tags: [Admin, Deliveries]
      summary: Paginated custody totals across all delivery parties
      description: Goods value is omitted unless the caller has cost.view; sorting by goods value also requires cost.view.
      x-permission: deliveries.manage
      x-error-codes: [COST_VIEW_REQUIRED]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [internal_agent, external_driver] } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: sort_by, in: query, schema: { type: string, enum: [name, goods_value_iqd, cash_held, oldest_item_age_days, orders_held], default: name } }
        - { name: sort_direction, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Delivery parties with ledger-reconciling custody totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPartyPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/delivery-parties/{id}:
    get:
      tags: [Admin, Deliveries]
      summary: Get a delivery party
      x-permission: deliveries.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Delivery party
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryParty" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/delivery-parties/{id}/custody:
    get:
      tags: [Admin, Deliveries]
      summary: Read a party's current goods and cash custody
      description: Lot cost and IQD value are included only when the caller also has cost.view. Cash equals confirmed collections less active cash receipt vouchers.
      x-permission: deliveries.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Current custody with Baghdad business-day ages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPartyCustody" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/delivery-parties/{id}/statement:
    get:
      tags: [Admin, Deliveries]
      summary: Read a party's goods-custody statement with running balances
      x-error-codes: [DATE_RANGE_INVALID]
      x-permission: deliveries.manage
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: order_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Party statement; value fields require cost.view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPartyStatementPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/delivery-parties/{id}/cash-activity:
    get:
      tags: [Admin, Deliveries]
      summary: Read a party's separately paginated cash-custody activity
      description: Cash collections, receipts, receipt reversals, party liabilities, liability reversals, and trip-fare netting are paginated independently from the goods statement.
      x-permission: deliveries.manage
      x-error-codes: [DATE_RANGE_INVALID]
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: order_id, in: query, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated cash-custody activity with a running balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPartyCashActivityPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/delivery-parties/{id}/orders:
    get:
      tags: [Admin, Deliveries]
      summary: List orders with goods currently held by a party
      x-permission: deliveries.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Orders currently represented by open custody holdings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPartyHeldOrders" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/delivery-parties/{id}/collections:
    get:
      tags: [Admin, Deliveries]
      summary: List delivered-order collections for one delivery party
      description: Date filters use complete Asia/Baghdad business days; amount filters apply to amount due.
      x-permission: deliveries.manage
      parameters:
        - { $ref: "#/components/parameters/PathId" }
        - { name: status, in: query, schema: { type: string, enum: [confirmed_full, confirmed_short, unconfirmed] } }
        - { name: order_id, in: query, schema: { type: string, format: uuid } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { name: amount_min, in: query, description: Minimum amount due, schema: { type: number, minimum: 0 } }
        - { name: amount_max, in: query, description: Maximum amount due, schema: { type: number, minimum: 0 } }
        - { name: sort_by, in: query, schema: { type: string, enum: [date, amount], default: date } }
        - { name: sort_direction, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated collection history for the party
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryCollectionPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/external-drivers:
    get:
      tags: [Admin, Deliveries]
      summary: List external drivers without accounts
      x-permission: drivers.manage
      parameters:
        - { name: active, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated external drivers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryPartyPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Admin, Deliveries]
      summary: Create an external driver without an account
      x-permission: drivers.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalDriverCreate" }
      responses:
        "201":
          description: Created external driver, including a non-blocking repeated-phone warning
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalDriverMutation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/external-drivers/{id}:
    patch:
      tags: [Admin, Deliveries]
      summary: Update or activate/deactivate an external driver
      x-permission: drivers.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalDriverUpdate" }
      responses:
        "200":
          description: Updated external driver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalDriverMutation" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
    delete:
      tags: [Admin, Deliveries]
      summary: Delete an unused external driver or deactivate one with history
      description: Once any assignment, custody, attempt, movement, retrieval, or trip exists, the record is retained and made inactive.
      x-permission: drivers.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Whether the driver was deleted or retained as inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalDriverRemoval" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/external-driver-trips:
    get:
      tags: [Admin, Deliveries]
      summary: List external-driver trips
      x-error-codes: [DATE_RANGE_INVALID]
      x-permission: trips.view
      parameters:
        - { name: driver_party_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, closed] } }
        - { name: date_from, in: query, schema: { type: string, format: date } }
        - { name: date_to, in: query, schema: { type: string, format: date } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PerPage" }
      responses:
        "200":
          description: Paginated external-driver trips with orders and settlement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalDriverTripPage" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Validation" }
    post:
      tags: [Admin, Deliveries]
      summary: Create a numbered external-driver trip and fare agreement
      x-error-codes: [CUSTOMER_DIRECT_SETTLEMENT_REQUIRED, STORE_FARE_CUSTOMER_DIRECT_FORBIDDEN, TRIP_CASH_ACCOUNT_NOT_ALLOWED, TRIP_FARE_ACCOUNT_INVALID, AMOUNT_NEGATIVE, PERIOD_CLOSED]
      description: Records exactly one store-paid or customer-direct fare before handover. A customer-direct fare never enters store revenue, expense, payable, collection, or netting.
      x-permission: trips.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalDriverTripCreate" }
      responses:
        "201":
          description: Open trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalDriverTrip" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/external-driver-trips/{id}:
    get:
      tags: [Admin, Deliveries]
      summary: Get an external-driver trip with orders, events, fare and settlement
      x-permission: trips.view
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: External-driver trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalDriverTrip" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/external-driver-trips/{id}/orders:
    post:
      tags: [Admin, Deliveries]
      summary: Add and hand over one ready order to the trip driver
      description: Atomically reuses the delivery handover and goods-custody posting. For customer-direct fares the store delivery fee must be zero and documented customer acceptance is required.
      x-permission: trips.manage
      x-error-codes: [TRIP_NOT_OPEN_FOR_ORDER, TRIP_ORDER_NOT_ASSIGNED, DOUBLE_DELIVERY_CHARGE, CUSTOMER_ACCEPTANCE_NOTE_REQUIRED, STALE_ORDER_STATE]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalDriverTripOrderAdd" }
      responses:
        "201":
          description: Trip after handover
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalDriverTrip" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/external-driver-trips/{id}/start:
    post:
      tags: [Admin, Deliveries]
      summary: Start a prepared external-driver trip
      x-error-codes: [TRIP_NOT_OPEN_FOR_START, TRIP_HAS_NO_ORDERS, TRIP_FARE_SHARES_MISMATCH]
      description: Fare shares must sum to the trip's one fare before it starts.
      x-permission: trips.manage
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalDriverTripEventInput" }
      responses:
        "200":
          description: In-progress trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalDriverTrip" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/external-driver-trips/{id}/close:
    post:
      tags: [Admin, Deliveries]
      summary: Operationally close and settle an external-driver trip
      description: Accrues one store-paid fare and optionally pays or nets it. Short cash remains open custody and excess receipts remain unallocated; neither becomes income, pay or loss automatically.
      x-permission: trips.settle
      x-error-codes: [TRIP_NOT_IN_PROGRESS, SELF_TRIP_CLOSE_FORBIDDEN, TRIP_ORDERS_UNRESOLVED, TRIP_FARE_EXCEEDS_UNSETTLED_CASH, TRIP_FARE_NETTING_INCOMPLETE, TRIP_FARE_ACCOUNT_INVALID, SEPARATION_OF_DUTIES_VIOLATION, PERIOD_CLOSED]
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalDriverTripClose" }
      responses:
        "200":
          description: Closed trip; settlement may remain open as allowed by the spec
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalDriverTrip" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/orders/{id}:
    get:
      tags: [Admin]
      summary: Get a full order-management detail
      x-permission: orders.view
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      responses:
        "200":
          description: Order with immutable lines, customer, shipping snapshot, payment, delivery, agent, and timeline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/orders/{id}/status:
    patch:
      tags: [Admin]
      summary: Advance an order through its pre-dispatch lifecycle
      x-error-codes: [STALE_ORDER_STATE, BELOW_COST_BLOCKED, ORDER_NEEDS_ATTENTION, ORDER_DELIVERY_MISSING, DELIVERY_AGENT_NOT_ASSIGNED, ORDER_TRANSITION_NOT_ALLOWED, ORDER_HAS_NO_STOCK_RESERVATIONS, SKU_COST_NOT_FOUND, INVENTORY_COST_NEGATIVE]
      x-surface: admin
      x-permission-by-status:
        confirmed: orders.accept
        preparing: orders.prepare
        ready_for_dispatch: orders.mark_ready
        dispatched: orders.handover
      description: >
        Legal path: pending to confirmed to preparing to ready_for_dispatch to
        dispatched. Dispatch requires the existing current delivery to have an
        agent assigned through PATCH /deliveries/{id}/assign; it moves that same
        delivery to out_for_delivery and transfers reserved stock into the agent's
        custody. Delivery agents and authorized staff can record delivery outcomes;
        staff own cancellation and shortage-resolution transitions.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, version]
              properties:
                status:
                  type: string
                  enum: [confirmed, preparing, ready_for_dispatch, dispatched]
                version: { type: integer, minimum: 1 }
                note: { type: [string, "null"], maxLength: 500 }
                below_cost_override_reason: { type: [string, "null"], maxLength: 500 }
      responses:
        "200":
          description: Updated order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/PostingConflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/orders/{id}/cancel:
    post:
      tags: [Admin]
      summary: Cancel a pre-dispatch order and release its stock holds
      x-error-codes: [STALE_ORDER_STATE, PAID_COD_CANCELLATION_FORBIDDEN, ORDER_TRANSITION_NOT_ALLOWED]
      x-permission: orders.cancel
      description: >
        Allowed only from pending, confirmed, preparing, or ready_for_dispatch.
        A non-empty reason is stored in the timeline and audit trail. Dispatched,
        delivered, failed, returned, and paid COD orders cannot be cancelled.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, reason]
              properties:
                version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Cancelled order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }
  /admin/orders/{id}/reject:
    post:
      tags: [Admin]
      summary: Reject a pending order and release its stock holds
      x-error-codes: [STALE_ORDER_STATE, ORDER_NOT_PENDING]
      x-permission: orders.reject
      description: >
        Rejection is distinct from cancellation and is allowed only while the
        order is pending. A non-empty reason is stored in the timeline and
        audit trail; the reservation is released and customer and order
        monitors receive a durable notification.
      parameters: [ { $ref: "#/components/parameters/PathId" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, reason]
              properties:
                version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Rejected order detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Validation" }

  # ---------------- ADMIN: PRODUCTS CRUD ----------------
  /admin/orders/{id}/cancellation-request/resolve:
